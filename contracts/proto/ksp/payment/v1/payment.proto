syntax = "proto3";

package ksp.payment.v1;

import "ksp/common/v1/money.proto";

// Contrats du service payment : paiement en ligne par Mobile Money (MTN, Moov) via FedaPay
// (ADR-031). Il sert :
// - au particulier, pour l'acompte ou le solde d'une mission du Nettoyage (montant dû lu dans
//   cleaning) ;
// - à l'entreprise (ou au particulier), pour le reste dû d'une facture mensuelle (lu dans billing) ;
// - à un payeur sans compte KSP (débiteur du Recouvrement), par un lien de paiement (ADR-040) ;
// - aux reversements par Mobile Money (créanciers payés depuis leur solde wallet, ADR-041).
//
// - PaymentService : espace client (créer un paiement, le suivre, mes paiements) et, en
//   développement seulement, la confirmation simulée.
// - PaymentWebhookService : notifications du prestataire, relayées par la gateway (route publique,
//   signature vérifiée par payment).
// - PaymentAdminService : back-office (liste et filtres, traitement d'un écart de montant par la
//   finance).
// - PaymentLinkService : liens de paiement, réservés aux services émetteurs (recovery).
// - PaymentLinkPublicService : page publique d'un lien (résumé, paiement), réservée à la gateway.
// - PayoutService : reversements demandés par un service (wallet) ; PayoutAdminService : leur suivi
//   et, en mode manuel, leur confirmation par la finance.
//
// Règles :
// - le montant dû vient toujours de cleaning ou de billing, jamais du client ;
// - un paiement n'est confirmé que par le prestataire (notification signée puis relecture de la
//   transaction chez lui), jamais par le navigateur ;
// - la création est idempotente par (payeur, clé d'idempotence).
//
// L'utilisateur connecté n'est jamais dans les messages : la gateway le transmet dans les
// métadonnées gRPC (x-user-id, x-active-context, x-user-roles, x-user-mfa…). Le service
// revérifie toujours ses droits.
//
// Conventions : dates ISO 8601 en UTC (chaîne vide = absente) ; montants ksp.common.v1.Money,
// entiers en XOF ; valeurs énumérées en snake_case, identiques à l'API REST.
//
// Erreurs (code AppError → statut gRPC) :
//   PAYMENT_NOT_FOUND                   NOT_FOUND           paiement inconnu ou hors du périmètre de l'appelant
//   PAYMENT_SUBJECT_NOT_FOUND           NOT_FOUND           mission ou facture inconnue, ou hors du périmètre
//   PAYMENT_SIMULATION_DISABLED         NOT_FOUND           simulation indisponible (production, ou prestataire réel)
//   PAYMENT_VALIDATION_FAILED           INVALID_ARGUMENT    details.field
//   PAYMENT_WEBHOOK_SIGNATURE_INVALID   INVALID_ARGUMENT    signature absente, fausse ou trop ancienne
//   PAYMENT_NOTHING_DUE                 FAILED_PRECONDITION rien à payer pour cet objet (déjà réglé)
//   PAYMENT_SUBJECT_NOT_PAYABLE         FAILED_PRECONDITION mission annulée, facture annulée
//   PAYMENT_VIA_INVOICE                 FAILED_PRECONDITION mission d'entreprise : réglée par sa facture
//   PAYMENT_IDEMPOTENCY_KEY_REUSED      ALREADY_EXISTS      clé déjà utilisée pour un autre objet
//   PAYMENT_ALREADY_RECEIVED            ALREADY_EXISTS      paiement réussi pas encore enregistré par cleaning
//                                                           ou billing : réessayer plus tard (ADR-032)
//   PAYMENT_RECONCILIATION_PENDING      ALREADY_EXISTS      le même, toujours pas enregistré 15 min (réglable)
//                                                           après sa réussite : contacter le support (ADR-032)
//   PAYMENT_UNDER_REVIEW                ALREADY_EXISTS      paiement de l'objet en écart de montant (amount_mismatch)
//                                                           pas encore traité par la finance : contacter le
//                                                           support (ADR-032)
//   PAYMENT_NOT_AMOUNT_MISMATCH         FAILED_PRECONDITION traitement d'un écart demandé pour un paiement qui n'est
//                                                           pas amount_mismatch
//   PAYMENT_MISMATCH_ALREADY_RESOLVED   ALREADY_EXISTS      écart déjà traité (autre note, autre auteur ou autre clé)
//   PAYMENT_CONCURRENT_UPDATE           ALREADY_EXISTS      paiement modifié en même temps par un autre appel
//   PAYMENT_PROVIDER_UNAVAILABLE        UNAVAILABLE         prestataire injoignable : réessayer avec la même clé
//   PAYMENT_CALLER_FORBIDDEN            PERMISSION_DENIED   méthode réservée à un autre service
//   PAYMENT_LINK_NOT_FOUND              NOT_FOUND           lien inconnu (jeton faux ou mal formé), ou d'un autre émetteur
//   PAYMENT_LINK_ALREADY_PAID           ALREADY_EXISTS      lien (ou objet du lien) déjà payé
//   PAYMENT_LINK_ALREADY_ACTIVE         ALREADY_EXISTS      un lien encore payable existe pour le même objet : le révoquer
//   PAYMENT_LINK_REVOKED                FAILED_PRECONDITION lien révoqué par son émetteur
//   PAYMENT_LINK_EXPIRED                FAILED_PRECONDITION lien expiré
//   PAYMENT_LINK_TOO_MANY_ATTEMPTS      RESOURCE_EXHAUSTED  trop de tentatives de paiement sur ce lien (par heure)
//   PAYMENT_PAYOUT_NOT_FOUND            NOT_FOUND           reversement inconnu, ou d'un autre émetteur
//   PAYMENT_PAYOUT_NOT_MANUAL           FAILED_PRECONDITION confirmation à la main d'un reversement exécuté par le prestataire
//   PAYMENT_PAYOUT_ALREADY_SETTLED      ALREADY_EXISTS      reversement déjà terminé (autre issue, autre référence)
//   AUTH_REQUIRED                       UNAUTHENTICATED
//   AUTH_FORBIDDEN                      PERMISSION_DENIED   rôle du back-office manquant
//   AUTH_MFA_REQUIRED                   PERMISSION_DENIED   double authentification absente

// Espace client : paiements du client connecté (contexte personnel) ou de son organisation active.
service PaymentService {
  // Crée l'intention de paiement (ou renvoie celle de la même clé) et le lien de paiement.
  rpc CreatePayment(CreatePaymentRequest) returns (CreatePaymentResponse);
  // Statut d'un paiement ; s'il est en attente, payment interroge le prestataire au passage.
  rpc GetMyPayment(GetMyPaymentRequest) returns (GetMyPaymentResponse);
  rpc ListMyPayments(ListMyPaymentsRequest) returns (ListMyPaymentsResponse);
  // Développement seulement (prestataire simulé, hors production) : règle ou fait échouer la
  // transaction chez le prestataire simulé, puis la confirme comme une notification.
  rpc SimulatePayment(SimulatePaymentRequest) returns (SimulatePaymentResponse);
}

// Notifications du prestataire, réservées à la gateway (jeton de service).
service PaymentWebhookService {
  rpc ReceiveProviderNotification(ReceiveProviderNotificationRequest) returns (ReceiveProviderNotificationResponse);
}

// Back-office : finance_officer, cleaning_admin, super_admin, avec double authentification.
service PaymentAdminService {
  rpc ListPayments(ListPaymentsRequest) returns (ListPaymentsResponse);
  // Écart de montant traité par la finance (remboursement, encaissement manuel enregistré…) : lève le
  // blocage des nouveaux paiements de l'objet ; le statut reste "amount_mismatch" (ADR-032).
  rpc ResolveAmountMismatch(ResolveAmountMismatchRequest) returns (ResolveAmountMismatchResponse);
}

message Page {
  // 20 par défaut, 100 au plus.
  int32 limit = 1;
  string cursor = 2;
}

// Objet payé.
message PaymentSubject {
  // "cleaning_mission" ou "billing_invoice" ; paiement par lien : type choisi par l'émetteur (par
  // exemple "recovery_installment", ADR-040).
  string type = 1;
  // Mission (cleaning) ou facture (billing).
  string id = 2;
  // Mission seulement : "deposit" (acompte) ou "balance" (reste dû) ; vide pour une facture.
  string part = 3;
  // Référence lisible : numéro de la facture ; référence de l'émetteur pour un lien ; vide pour une
  // mission.
  string reference = 4;
}

message Payment {
  string id = 1;
  // "pending", "succeeded", "failed", "expired", "cancelled" ou "amount_mismatch" (montant ou devise
  // approuvés différents : rien n'est enregistré chez cleaning ni billing, la finance tranche).
  string status = 2;
  PaymentSubject subject = 3;
  // Montant dû au moment de la création, lu dans cleaning ou billing.
  ksp.common.v1.Money amount = 4;
  // Payeur : le compte connecté qui a créé le paiement ; vide pour un paiement par lien (payeur sans
  // compte, ADR-040).
  string customer_id = 5;
  // Organisation payeuse (facture d'entreprise), vide sinon.
  string organization_id = 6;
  // "mobile_money_online".
  string method = 7;
  // "fedapay" ou "simulated" (développement).
  string provider = 8;
  // Référence de la transaction chez le prestataire, vide tant qu'elle n'existe pas.
  string provider_reference = 9;
  // Page de paiement du prestataire, vide si elle n'a pas encore pu être obtenue.
  string checkout_url = 10;
  // Échec : "declined", "cancelled", "expired" ; vide sinon.
  string failure_reason = 11;
  string created_at = 12;
  string updated_at = 13;
  // Au-delà, un paiement encore en attente est déclaré expiré.
  string expires_at = 14;
  // Date de la réussite ou de l'échec, vide en attente.
  string completed_at = 15;
  // Back-office seulement : nom affiché du payeur et raison sociale de son organisation, lus dans
  // identity à l'affichage (ADR-029) ; vides s'ils sont inconnus ou si identity ne répond pas.
  string customer_name = 16;
  string organization_name = 17;
  // Écart de montant ("amount_mismatch") pas encore traité par la finance : tout nouveau paiement de
  // l'objet est refusé (PAYMENT_UNDER_REVIEW, ADR-032). false pour tout autre paiement.
  bool under_review = 18;
  // Back-office seulement : traitement de l'écart par la finance (date, compte du back-office, note) ;
  // vides tant qu'il n'est pas traité, et toujours vides sur les routes client.
  string mismatch_resolved_at = 19;
  string mismatch_resolved_by = 20;
  string mismatch_resolution_note = 21;
  // Paiement par lien (ADR-040) : lien payé, payeur sans compte (customer_id vide). Vide sinon.
  string payment_link_id = 22;
}

message CreatePaymentRequest {
  // "cleaning_mission" ou "billing_invoice".
  string subject_type = 1;
  string subject_id = 2;
  // Mission : "deposit" ou "balance" (obligatoire) ; facture : vide.
  string part = 3;
  // En-tête Idempotency-Key (8 à 100 caractères : lettres, chiffres, "_" et "-"), obligatoire.
  string idempotency_key = 4;
}

message CreatePaymentResponse {
  Payment payment = 1;
  // false : paiement déjà créé avec cette clé, ou paiement en attente réutilisé pour le même objet.
  bool created = 2;
}

message GetMyPaymentRequest {
  string payment_id = 1;
}

message GetMyPaymentResponse {
  Payment payment = 1;
}

message ListMyPaymentsRequest {
  Page page = 1;
  // Filtre facultatif : "pending", "succeeded", "failed", "expired", "cancelled" ou "amount_mismatch".
  string status = 2;
}

message ListMyPaymentsResponse {
  repeated Payment payments = 1;
  string next_cursor = 2;
}

message SimulatePaymentRequest {
  string payment_id = 1;
  // "succeeded" ou "failed".
  string outcome = 2;
}

message SimulatePaymentResponse {
  Payment payment = 1;
}

message ReceiveProviderNotificationRequest {
  // "fedapay".
  string provider = 1;
  // Corps reçu, octet pour octet : la signature porte sur lui.
  bytes payload = 2;
  // En-tête de signature du prestataire (X-FEDAPAY-SIGNATURE).
  string signature = 3;
}

message ReceiveProviderNotificationResponse {
  // "applied", "no_change", "unknown_transaction", "amount_mismatch", "transaction_mismatch" (transaction
  // relue qui n'est pas celle du paiement) ou "ignored".
  string outcome = 1;
}

message ListPaymentsRequest {
  Page page = 1;
  // Filtres facultatifs.
  string status = 2;
  string subject_type = 3;
  string subject_id = 4;
  string customer_id = 5;
  string organization_id = 6;
  // true : écarts de montant pas encore traités par la finance ; false : tous les autres paiements ;
  // absent : pas de filtre.
  optional bool under_review = 7;
}

message ListPaymentsResponse {
  repeated Payment payments = 1;
  string next_cursor = 2;
}

message ResolveAmountMismatchRequest {
  string payment_id = 1;
  // Ce que la finance a fait (remboursement, encaissement manuel enregistré…) : obligatoire, 500
  // caractères au plus.
  string note = 2;
  // En-tête Idempotency-Key, facultatif (8 à 100 caractères : lettres, chiffres, "_" et "-") : un
  // second envoi avec la même clé renvoie le paiement tel quel. Sans clé, un second envoi du même
  // compte avec la même note est aussi rejoué sans effet.
  string idempotency_key = 3;
}

message ResolveAmountMismatchResponse {
  Payment payment = 1;
}

// Liens de paiement (ADR-040), réservés aux services émetteurs autorisés (PAYMENT_LINK_ISSUERS :
// recovery au lancement ; jeton de service obligatoire). Un lien porte un objet de l'émetteur (type
// extensible, par exemple "recovery_installment"), un montant fixe en XOF, le bénéficiaire affiché et
// une date d'expiration ; le payeur n'a pas de compte. L'émetteur ne voit que ses propres liens.
service PaymentLinkService {
  // Crée le lien (ou renvoie celui de la même clé d'idempotence) et son adresse publique.
  rpc CreatePaymentLink(CreatePaymentLinkRequest) returns (CreatePaymentLinkResponse);
  rpc GetPaymentLink(GetPaymentLinkRequest) returns (GetPaymentLinkResponse);
  // Le lien ne peut plus être payé ; une tentative en attente est annulée. Rejouable sans effet.
  rpc RevokePaymentLink(RevokePaymentLinkRequest) returns (RevokePaymentLinkResponse);
}

// Page publique d'un lien de paiement, réservée à la gateway (routes publiques, sans compte). Aucune
// donnée personnelle du payeur n'y figure.
service PaymentLinkPublicService {
  // Résumé du lien ; une tentative en attente est vérifiée auprès du prestataire au passage.
  rpc GetPublicPaymentLink(GetPublicPaymentLinkRequest) returns (GetPublicPaymentLinkResponse);
  // Lance le paiement chez le prestataire (idempotent par clé) et renvoie sa page de paiement.
  rpc PayPaymentLink(PayPaymentLinkRequest) returns (PayPaymentLinkResponse);
  // Développement seulement (prestataire simulé, hors production), comme SimulatePayment.
  rpc SimulatePaymentLinkPayment(SimulatePaymentLinkPaymentRequest) returns (SimulatePaymentLinkPaymentResponse);
}

// Reversements par Mobile Money (ADR-041), réservés aux services autorisés (PAYMENT_PAYOUT_ISSUERS :
// wallet au lancement ; jeton de service obligatoire). Exécution par le prestataire (FedaPay) ou, en
// mode manuel, par la finance qui confirme le virement au back-office. Événements
// payment.payout.completed et payment.payout.failed.
service PayoutService {
  // Enregistre le reversement (ou renvoie celui de la même clé) et le lance chez le prestataire.
  rpc RequestPayout(RequestPayoutRequest) returns (RequestPayoutResponse);
  rpc GetPayout(GetPayoutRequest) returns (GetPayoutResponse);
}

// Back-office des reversements : finance_officer, super_admin, avec double authentification.
service PayoutAdminService {
  rpc ListPayouts(ListPayoutsRequest) returns (ListPayoutsResponse);
  // Mode manuel : la finance a fait le virement (référence obligatoire).
  rpc ConfirmPayout(ConfirmPayoutRequest) returns (ConfirmPayoutResponse);
  // Mode manuel : le virement n'a pas pu être fait (raison obligatoire) ; le solde est rendu.
  rpc FailPayout(FailPayoutRequest) returns (FailPayoutResponse);
}

// Lien de paiement, vu par son émetteur.
message PaymentLink {
  string id = 1;
  // "active" (payable), "paid", "under_review" (paiement en écart de montant à traiter par la
  // finance), "revoked" ou "expired".
  string status = 2;
  // Objet de l'émetteur : type ("recovery_installment"…) et identifiant.
  string subject_type = 3;
  string subject_id = 4;
  // Référence lisible de l'émetteur (affichée au payeur, transmise au prestataire).
  string reference = 5;
  // Bénéficiaire affiché au payeur (créancier).
  string beneficiary_name = 6;
  // Libellé affiché au payeur, par exemple "Échéance 2 sur 6".
  string description = 7;
  ksp.common.v1.Money amount = 8;
  // Échéance affichée (AAAA-MM-JJ), vide si aucune.
  string due_date = 9;
  // Au-delà, le lien ne peut plus être payé.
  string expires_at = 10;
  // Adresse publique à envoyer au payeur (<PAYMENT_LINK_BASE_URL>/<jeton>) et le jeton seul.
  string url = 11;
  string token = 12;
  // Payeur, facultatifs ; jamais journalisés, jamais montrés sur la page publique.
  string payer_name = 13;
  string payer_phone = 14;
  // Paiement réussi et sa date, vides sinon.
  string paid_payment_id = 15;
  string paid_at = 16;
  string revoked_at = 17;
  string revoked_reason = 18;
  string created_at = 19;
  string updated_at = 20;
  // Dernière tentative de paiement et son statut ("pending", "succeeded"…), vides si aucune.
  string last_payment_id = 21;
  string last_payment_status = 22;
}

message CreatePaymentLinkRequest {
  // Obligatoire (8 à 100 caractères : lettres, chiffres, "_" et "-"), propre à l'émetteur.
  string idempotency_key = 1;
  // Minuscules, chiffres et "_", 3 à 50 caractères ; "cleaning_mission" et "billing_invoice" sont
  // réservés au paiement par compte.
  string subject_type = 2;
  // UUID.
  string subject_id = 3;
  // 1 à 60 caractères.
  string reference = 4;
  // 1 à 120 caractères.
  string beneficiary_name = 5;
  // 1 à 140 caractères.
  string description = 6;
  // Entier en XOF, 1 à 1 000 000 000.
  ksp.common.v1.Money amount = 7;
  // Facultative (AAAA-MM-JJ).
  string due_date = 8;
  // Obligatoire : entre 1 heure et 180 jours après la création.
  string expires_at = 9;
  // Facultatifs : nom (120 caractères au plus) et téléphone E.164 du payeur.
  string payer_name = 10;
  string payer_phone = 11;
}

message CreatePaymentLinkResponse {
  PaymentLink link = 1;
  // false : lien déjà créé avec cette clé.
  bool created = 2;
}

message GetPaymentLinkRequest {
  string link_id = 1;
}

message GetPaymentLinkResponse {
  PaymentLink link = 1;
}

message RevokePaymentLinkRequest {
  string link_id = 1;
  // Facultative, 200 caractères au plus.
  string reason = 2;
}

message RevokePaymentLinkResponse {
  PaymentLink link = 1;
}

// Lien vu par le payeur (page publique) : aucune donnée personnelle du payeur, aucun identifiant
// de l'objet.
message PublicPaymentLink {
  // "active", "paid", "under_review", "revoked" ou "expired".
  string status = 1;
  string beneficiary_name = 2;
  string description = 3;
  string reference = 4;
  ksp.common.v1.Money amount = 5;
  string due_date = 6;
  string expires_at = 7;
  string paid_at = 8;
  // Dernière tentative de paiement, absente si aucune.
  PublicLinkPayment payment = 9;
}

// Tentative de paiement d'un lien.
message PublicLinkPayment {
  string id = 1;
  // "pending", "succeeded", "failed", "expired", "cancelled" ou "amount_mismatch".
  string status = 2;
  // Page de paiement du prestataire, en attente seulement.
  string checkout_url = 3;
  string expires_at = 4;
  // "declined", "cancelled", "expired" ; vide sinon.
  string failure_reason = 5;
}

message GetPublicPaymentLinkRequest {
  // Jeton du lien (43 caractères : lettres, chiffres, "_" et "-").
  string token = 1;
}

message GetPublicPaymentLinkResponse {
  PublicPaymentLink link = 1;
}

message PayPaymentLinkRequest {
  string token = 1;
  // En-tête Idempotency-Key, obligatoire.
  string idempotency_key = 2;
}

message PayPaymentLinkResponse {
  PublicLinkPayment payment = 1;
  // false : tentative déjà créée avec cette clé, ou tentative en attente réutilisée.
  bool created = 2;
}

message SimulatePaymentLinkPaymentRequest {
  string token = 1;
  // "succeeded" ou "failed".
  string outcome = 2;
}

message SimulatePaymentLinkPaymentResponse {
  PublicLinkPayment payment = 1;
}

// Bénéficiaire d'un reversement par Mobile Money.
message PayoutBeneficiary {
  // Numéro E.164 (+229…).
  string phone = 1;
  // "mtn", "moov" ou "celtiis".
  string operator = 2;
  // Nom du titulaire du compte Mobile Money, 1 à 120 caractères.
  string name = 3;
}

message Payout {
  string id = 1;
  // "requested" (enregistré), "processing" (lancé chez le prestataire), "completed" ou "failed".
  string status = 2;
  // Service qui l'a demandé ("wallet").
  string issuer = 3;
  // Référence de l'émetteur (100 caractères au plus).
  string reference = 4;
  ksp.common.v1.Money amount = 5;
  PayoutBeneficiary beneficiary = 6;
  // "fedapay" ou "manual" (virement fait par la finance).
  string provider = 7;
  // Référence du virement : chez le prestataire, ou saisie par la finance ; vide sinon.
  string provider_reference = 8;
  // Échec : raison (prestataire, ou note de la finance) ; vide sinon.
  string failure_reason = 9;
  string created_at = 10;
  string updated_at = 11;
  string completed_at = 12;
  string failed_at = 13;
  // Mode manuel : compte du back-office qui l'a confirmé ou mis en échec.
  string settled_by = 14;
}

message RequestPayoutRequest {
  // Obligatoire (8 à 100 caractères : lettres, chiffres, "_" et "-"), propre à l'émetteur.
  string idempotency_key = 1;
  // Référence de l'émetteur, reprise dans les événements (1 à 100 caractères).
  string reference = 2;
  // Entier en XOF, 1 à 1 000 000 000.
  ksp.common.v1.Money amount = 3;
  PayoutBeneficiary beneficiary = 4;
}

message RequestPayoutResponse {
  Payout payout = 1;
  // false : reversement déjà demandé avec cette clé.
  bool created = 2;
}

message GetPayoutRequest {
  string payout_id = 1;
}

message GetPayoutResponse {
  Payout payout = 1;
}

message ListPayoutsRequest {
  Page page = 1;
  // Filtres facultatifs : statut, émetteur.
  string status = 2;
  string issuer = 3;
}

message ListPayoutsResponse {
  repeated Payout payouts = 1;
  string next_cursor = 2;
}

message ConfirmPayoutRequest {
  string payout_id = 1;
  // Référence du virement Mobile Money fait par la finance, 1 à 100 caractères.
  string transfer_reference = 2;
  // En-tête Idempotency-Key, facultatif.
  string idempotency_key = 3;
}

message ConfirmPayoutResponse {
  Payout payout = 1;
}

message FailPayoutRequest {
  string payout_id = 1;
  // Raison, 1 à 500 caractères (jamais transmise dans les événements).
  string reason = 2;
  // En-tête Idempotency-Key, facultatif.
  string idempotency_key = 3;
}

message FailPayoutResponse {
  Payout payout = 1;
}
