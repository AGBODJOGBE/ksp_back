}

message CompleteGroupVisitRequest {
  string group_id = 1;
  string report = 2;
  string idempotency_key = 3;
}

message CompleteGroupVisitResponse {
  RequestGroupOutcome outcome = 1;
  repeated QuoteRequest requests = 2;
}

message RejectRequestGroupRequest {
  string group_id = 1;
  string reason = 2;
  string idempotency_key = 3;
}

message RejectRequestGroupResponse {
  RequestGroupOutcome outcome = 1;
  repeated QuoteRequest requests = 2;
}

// Devis d'une demande du groupe : mêmes règles que SendQuoteRequest (lignes préremplies si vides).
message GroupQuoteItem {
  string request_id = 1;
  repeated PriceLine lines = 2;
  Recurrence recurrence = 3;
  int32 team_size = 4;
  int32 duration_minutes = 5;
}

message SendGroupQuotesRequest {
  string group_id = 1;
  // Créneaux communs proposés pour tous les devis (1 à 3).
  repeated TimeSlot proposed_slots = 2;
  // 0 : validité par défaut (réglages).
  int32 validity_days = 3;
  // Une entrée par demande à chiffrer, chacune une seule fois.
  repeated GroupQuoteItem quotes = 4;
  string idempotency_key = 5;
}

message SendGroupQuotesResponse {
  RequestGroupOutcome outcome = 1;
  repeated QuoteRequest requests = 2;
}

message CorrectRequestLocationRequest {
  string request_id = 1;
  GeoLocation location = 2;
  // Facultatif : vide, le repère en vigueur est gardé.
  string landmark = 3;
  // Repli si le géocodage ne trouve pas la commune ; ignorée sinon.
  string commune = 4;
}

message CorrectRequestLocationResponse {
  QuoteRequest request = 1;
  // Demandes (le groupe entier) et missions non terminées mises à jour.
  repeated string updated_request_ids = 2;
  repeated string updated_mission_ids = 3;
}

message ListVisitsRequest {
  Page page = 1;
  // Filtres facultatifs, cumulables. agent_id : ignoré pour cleaning_agent (ses visites seulement).
  string agent_id = 2;
  // Bornes de scheduled_at (ISO 8601), incluse et exclue.
  string from = 3;
  string to = 4;
  // "scheduled", "completed" ou "cancelled".
  string status = 5;
  string group_id = 6;
}

// Demande concernée par une visite.
message VisitedRequest {
  string request_id = 1;
  // Identifiant de la visite de cette demande (compte rendu par demande : CompleteVisit).
  string visit_id = 2;
  string service_code = 3;
  string service_name = 4;
  // Même valeurs que QuoteRequest.status.
  string status = 5;
}

// Visite technique telle qu'un agent la voit : une ligne par visite commune ou par visite seule.
message VisitSummary {
  // group_visit_id pour une visite commune, identifiant de la visite sinon.
  string id = 1;
  string group_visit_id = 2;
  string group_id = 3;
  // "scheduled", "completed" ou "cancelled".
  string status = 4;
  string scheduled_at = 5;
  string completed_at = 6;
  string report = 7;
  string agent_id = 8;
  string agent_name = 9;
  string customer_id = 10;
  string customer_name = 11;
  string organization_name = 12;
  string commune = 13;
  // Position, repère, adresse : vides pour cleaning_agent quand la visite est terminée ou annulée.
  string address = 14;
  GeoLocation location = 15;
  string landmark = 16;
  string geocoded_address = 17;
  string place_type = 18;
  string place_type_label = 19;
  repeated VisitedRequest requests = 20;
}

message ListVisitsResponse {
  repeated VisitSummary visits = 1;
  string next_cursor = 2;
}

