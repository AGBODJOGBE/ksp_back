syntax = "proto3";

package ksp.cleaning.v1;

import "ksp/common/v1/money.proto";

// Contrats du service cleaning (cahier des charges Nettoyage, parties 3, 5 et 6).
//
// - CatalogService : catalogue et simulateur publics (UC-CL-01).
// - QuoteService et MissionService : espace client (UC-CL-02 à 05).
// - CleaningAdminService : back-office (UC-CL-06 à 12).
// - ksp.common.v1.ObligationService (obligation.proto) : également implémenté par cleaning ;
//   une mission non terminée bloque la suppression du compte.
//
// L'utilisateur connecté n'est jamais dans les messages : la gateway le transmet dans les
// métadonnées gRPC (x-user-id, x-active-context, x-user-roles, x-user-mfa…). Le service
// revérifie toujours ses droits : client propriétaire, agent affecté, rôles du back-office.
//
// Conventions :
// - dates : chaînes ISO 8601 en UTC ; chaîne vide = absente ;
// - montants : ksp.common.v1.Money, entiers en XOF ; message absent = montant non fixé ;
// - valeurs énumérées : chaînes en snake_case, identiques à celles de l'API REST
//   (valeurs listées sur chaque champ) ;
// - coefficients : en points de base (10000 = coefficient 1).
//
// Erreurs (code AppError → statut gRPC) :
//   CLEANING_SERVICE_NOT_FOUND          NOT_FOUND           prestation inconnue ou inactive
//   CLEANING_REQUEST_NOT_FOUND          NOT_FOUND           demande inconnue ou hors du périmètre de l'appelant
//   CLEANING_MISSION_NOT_FOUND          NOT_FOUND           mission inconnue ou hors du périmètre de l'appelant
//   CLEANING_VISIT_NOT_FOUND            NOT_FOUND
//   CLEANING_INTERVENTION_NOT_FOUND     NOT_FOUND
//   CLEANING_AGENT_NOT_FOUND            NOT_FOUND
//   CLEANING_TEAM_NOT_FOUND             NOT_FOUND
//   CLEANING_VALIDATION_FAILED          INVALID_ARGUMENT    details.field ; details.reason (facultatif, réponses au
//                                                           formulaire d'une prestation, ADR-033) : "unknown_field",
//                                                           "required", "invalid_type", "out_of_range",
//                                                           "unknown_choice", "unknown_option", "duplicate_option",
//                                                           "unknown_frequency"
//   CLEANING_SLOT_INVALID               INVALID_ARGUMENT    créneau mal formé, ou hors des créneaux proposés
//   CLEANING_INVALID_TRANSITION         FAILED_PRECONDITION details.from, details.to
//   CLEANING_QUOTE_EXPIRED              FAILED_PRECONDITION devis au-delà de sa date de validité
//   CLEANING_PRICE_NOT_SET              FAILED_PRECONDITION prestation sans prix dans la grille (devis)
//   CLEANING_VISIT_REQUIRED             FAILED_PRECONDITION visite des lieux réalisée obligatoire avant tout devis
//                                                           (toutes les demandes, décision du 2026-10-23)
//   CLEANING_LEAD_TIME_TOO_SHORT        FAILED_PRECONDITION details.minimumHours
//   CLEANING_CANCELLATION_TOO_LATE      FAILED_PRECONDITION details.freeCancellationHours
//   CLEANING_TOO_MANY_OPEN_REQUESTS     FAILED_PRECONDITION details.maximum
//   CLEANING_CHECKLIST_INCOMPLETE       FAILED_PRECONDITION liste de contrôle non cochée à la clôture
//   CLEANING_NO_INTERVENTION_LEFT       FAILED_PRECONDITION tous les passages prévus sont déjà planifiés
//   CLEANING_CONTRACT_SUSPENDED         FAILED_PRECONDITION mission suspendue : impayés (partie 10) ou organisation
//                                                           suspendue par KSP (ADR-030)
//   CLEANING_ORGANIZATION_SUSPENDED     FAILED_PRECONDITION organisation suspendue par KSP : ni demande ni
//                                                           acceptation de devis en son nom (ADR-030)
//   CLEANING_ZONE_NOT_COVERED           FAILED_PRECONDITION commune hors des zones desservies (details.commune)
//   CLEANING_ZONE_NOT_FOUND             NOT_FOUND           zone inconnue
//   CLEANING_PAYMENT_VIA_INVOICE        FAILED_PRECONDITION mission d'entreprise : paiement par sa facture (billing)
//   CLEANING_TEAM_UNAVAILABLE           ALREADY_EXISTS      details.agentIds : agents déjà pris sur le créneau
//   CLEANING_CONCURRENT_UPDATE          ALREADY_EXISTS      dossier modifié en même temps par un autre appel
//   CLEANING_AGENT_ALREADY_REGISTERED   ALREADY_EXISTS
//   CLEANING_PAYMENT_INVALID            INVALID_ARGUMENT    montant ou moyen de paiement refusé (details.reason) ;
//                                                           au-delà du reste dû : details.remainingDue (Money)
//   CLEANING_INTERVENTION_TOO_EARLY     FAILED_PRECONDITION passage démarré avant le jour prévu (details.scheduledDate,
//                                                           details.timeZone) ; règle réglable par configuration
//   CLEANING_VISIT_TOO_EARLY            FAILED_PRECONDITION compte rendu de visite avant l'heure prévue
//                                                           (details.scheduledAt) ; règle réglable par configuration
//   CLEANING_CALLER_FORBIDDEN           PERMISSION_DENIED   HasPendingObligations appelé par un autre service qu'identity
//   AUTH_REQUIRED                       UNAUTHENTICATED
//   AUTH_FORBIDDEN                      PERMISSION_DENIED   rôle du back-office manquant
//   AUTH_MFA_REQUIRED                   PERMISSION_DENIED   double authentification absente

// ---------------------------------------------------------------------------
// Catalogue et simulateur — public (UC-CL-01).
// ---------------------------------------------------------------------------
service CatalogService {
  // Prestations actives et leur formulaire (champs, options, fréquences), sans aucun prix
  // (ServiceOffer.form, ADR-033) ; anciens champs (options avec prix, minimum) dépréciés.
  rpc ListServices(ListServicesRequest) returns (ListServicesResponse);
  // Estimation non contractuelle, sans donnée personnelle ; rien n'est enregistré.
  // Une prestation sans prix répond priced = false, sans erreur.
  rpc Simulate(SimulateRequest) returns (SimulateResponse);
  // Zones desservies actives, par nom de commune : seules les communes où une demande de devis
  // est acceptée, sans les champs d'administration.
  rpc ListServedZones(ListServedZonesRequest) returns (ListServedZonesResponse);
}

// ---------------------------------------------------------------------------
// Demandes de devis — client connecté (UC-CL-02 à 05).
// ---------------------------------------------------------------------------
service QuoteService {
  // Profil complet exigé : contrôlé par la gateway avant l'appel (IDENTITY_PROFILE_INCOMPLETE).
  // Idempotent par idempotency_key et par client.
  rpc RequestQuote(RequestQuoteRequest) returns (RequestQuoteResponse);
  rpc ListMyRequests(ListMyRequestsRequest) returns (ListMyRequestsResponse);
  rpc GetRequest(GetRequestRequest) returns (GetRequestResponse);
  // Le client choisit un créneau proposé et, s'il est particulier, son option de paiement ;
  // la mission est créée.
  // Idempotent par idempotency_key.
  rpc AcceptQuote(AcceptQuoteRequest) returns (AcceptQuoteResponse);
  rpc DeclineQuote(DeclineQuoteRequest) returns (DeclineQuoteResponse);
  rpc CancelRequest(CancelRequestRequest) returns (CancelRequestResponse);
}

// ---------------------------------------------------------------------------
// Missions — client connecté (UC-CL-03, 05).
// ---------------------------------------------------------------------------
service MissionService {
  rpc ListMyMissions(ListMyMissionsRequest) returns (ListMyMissionsResponse);
  rpc GetMission(GetMissionRequest) returns (GetMissionResponse);
  // Sans frais jusqu'au délai limite avant le premier passage ; au-delà, refus (support).
  rpc CancelMission(CancelMissionRequest) returns (CancelMissionResponse);
}

// ---------------------------------------------------------------------------
// Back-office (UC-CL-06 à 12). Rôles : cleaning_supervisor, cleaning_agent (ses passages
// uniquement), cleaning_admin ; super_admin a partout la portée de cleaning_admin.
// Double authentification exigée.
//
// Noms affichés (champs *_name) : lus dans identity au moment de la réponse (ADR-029), pour le
// back-office seulement ; vides dans l'espace client, pour un compte sans nom, ou si identity
// est indisponible (la réponse n'échoue jamais pour un nom manquant).
// ---------------------------------------------------------------------------
service CleaningAdminService {
  // Demandes, visites, devis (cleaning_supervisor, cleaning_admin, super_admin).
  rpc ListQuoteRequests(ListQuoteRequestsRequest) returns (ListQuoteRequestsResponse);
  rpc GetQuoteRequest(GetQuoteRequestRequest) returns (GetQuoteRequestResponse);
  rpc RejectQuoteRequest(RejectQuoteRequestRequest) returns (RejectQuoteRequestResponse);
  rpc ScheduleVisit(ScheduleVisitRequest) returns (ScheduleVisitResponse);
  rpc CompleteVisit(CompleteVisitRequest) returns (CompleteVisitResponse);
  rpc SendQuote(SendQuoteRequest) returns (SendQuoteResponse);

  // Missions et passages (cleaning_supervisor, cleaning_admin, super_admin ; cleaning_agent : ses passages).
  rpc ListMissions(ListMissionsRequest) returns (ListMissionsResponse);
  rpc GetMissionDetail(GetMissionDetailRequest) returns (GetMissionDetailResponse);
  // Planifie un passage avec ses agents ; un passage d'une mission récurrente peut avoir
  // d'autres agents que le précédent.
  rpc ScheduleIntervention(ScheduleInterventionRequest) returns (ScheduleInterventionResponse);
  rpc StartIntervention(StartInterventionRequest) returns (StartInterventionResponse);
  rpc UpdateChecklist(UpdateChecklistRequest) returns (UpdateChecklistResponse);
  rpc ReportIncident(ReportIncidentRequest) returns (ReportIncidentResponse);
  rpc ResumeIntervention(ResumeInterventionRequest) returns (ResumeInterventionResponse);
  rpc CompleteIntervention(CompleteInterventionRequest) returns (CompleteInterventionResponse);
  // Paiement manuel coché par le superviseur (espèces, Mobile Money hors ligne).
  // Idempotent par idempotency_key (facultative) : un second envoi avec la même clé renvoie la
  // mission sans enregistrer un second paiement.
  rpc RecordPayment(RecordPaymentRequest) returns (RecordPaymentResponse);
  rpc CancelMissionAsSupervisor(CancelMissionAsSupervisorRequest) returns (CancelMissionAsSupervisorResponse);

  // Catalogue, grille tarifaire et réglages (cleaning_admin, super_admin). Chaque modification de prix
  // crée une nouvelle version datée, avec son auteur ; un devis envoyé garde son prix.
  rpc GetCatalog(GetCatalogRequest) returns (GetCatalogResponse);
  // Crée ou remplace une prestation complète (champs, options, grille) : une nouvelle version (ADR-033).
  rpc SaveService(SaveServiceRequest) returns (SaveServiceResponse);
  // Calcule un prix avec une définition envoyée (ou la version en vigueur) et des réponses, pour
  // tester une grille avant de l'enregistrer. Rien n'est enregistré (ADR-033).
  rpc PreviewService(PreviewServiceRequest) returns (PreviewServiceResponse);
  rpc UpdateSettings(UpdateSettingsRequest) returns (UpdateSettingsResponse);

  // Zones desservies (cleaning_admin, super_admin) : une demande de devis hors zone est refusée.
  rpc ListZones(ListZonesRequest) returns (ListZonesResponse);
  // Ajoute la commune, ou la réactive si elle existe déjà.
  rpc SaveZone(SaveZoneRequest) returns (SaveZoneResponse);
  rpc DeactivateZone(DeactivateZoneRequest) returns (DeactivateZoneResponse);

  // Agents et équipes (cleaning_admin, super_admin ; listes : aussi cleaning_supervisor).
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse);
  rpc RegisterAgent(RegisterAgentRequest) returns (RegisterAgentResponse);
  rpc DeclareUnavailability(DeclareUnavailabilityRequest) returns (DeclareUnavailabilityResponse);
  rpc ListTeams(ListTeamsRequest) returns (ListTeamsResponse);
  rpc CreateTeam(CreateTeamRequest) returns (CreateTeamResponse);
  rpc UpdateTeam(UpdateTeamRequest) returns (UpdateTeamResponse);
}

// ---------------------------------------------------------------------------
// Montant dû d'une mission — réservé au service payment (ADR-031).
// ---------------------------------------------------------------------------
// payment ne recalcule rien : il lit ici l'acompte encore dû et le reste dû, puis vérifie
// lui-même que le payeur est le client de la mission. Appel d'un autre service :
// CLEANING_CALLER_FORBIDDEN. Mission inconnue : CLEANING_MISSION_NOT_FOUND.
service MissionPaymentDueService {
  rpc GetMissionAmountDue(GetMissionAmountDueRequest) returns (GetMissionAmountDueResponse);
}

// ===========================================================================
// Messages communs
// ===========================================================================

// Créneau horaire, début inclus et fin exclue.
message TimeSlot {
  string start = 1;
  string end = 2;
}

// Contrat récurrent (client entreprise, ou particulier qui le demande) : nombre de passages
// par période, pendant une durée en mois. La facture mensuelle viendra avec billing.
message Recurrence {
  // "week" ou "month".
  string period = 1;
  int32 visits_per_period = 2;
  int32 duration_months = 3;
}

message PriceLine {
  string label = 1;
  // Quantité entière dans l'unité de la prestation (m², pièces, fosses…), 1 pour un forfait.
  int32 quantity = 2;
  ksp.common.v1.Money unit_price = 3;
  ksp.common.v1.Money amount = 4;
}

message PriceRange {
  ksp.common.v1.Money low = 1;
  ksp.common.v1.Money high = 2;
}

// Option choisie par le client à l'acceptation du devis.
message PaymentPlan {
  // "deposit" (acompte) ou "full" (totalité).
  string option = 1;
  // "before" ou "after" la mission.
  string timing = 2;
  // "cash", "mobile_money_offline" (coché par le superviseur) ou "mobile_money_online"
  // (payé en ligne par le client depuis la fiche de la mission, service payment, ADR-031 ; le client
  // peut aussi payer en ligne avec un autre moyen prévu).
  string method = 3;
}

message PaymentRecord {
  string id = 1;
  ksp.common.v1.Money amount = 2;
  // "cash", "mobile_money_offline" ou "mobile_money_online".
  string method = 3;
  string reference = 4;
  string recorded_by = 5;
  string recorded_at = 6;
  // Back-office : nom affiché de la personne qui a enregistré le paiement (ADR-029).
  string recorded_by_name = 7;
}

message PaymentState {
  PaymentPlan plan = 1;
  // "due", "deposit_received" ou "paid".
  string status = 2;
  ksp.common.v1.Money total = 3;
  // Pourcentage d'acompte figé à l'acceptation (30 par défaut, réglable).
  int32 deposit_percent = 4;
  ksp.common.v1.Money deposit_amount = 5;
  ksp.common.v1.Money paid = 6;
  repeated PaymentRecord payments = 7;
  // Reste dû : total moins les paiements enregistrés, jamais négatif (calculé par cleaning).
  ksp.common.v1.Money remaining_due = 8;
  // Acompte encore attendu (plan « acompte », acompte pas encore reçu en entier) ; absent sinon.
  ksp.common.v1.Money deposit_due = 9;
}

message SiteVisit {
  string id = 1;
  // "scheduled", "completed" ou "cancelled".
  string status = 2;
  string scheduled_at = 3;
  string agent_id = 4;
  string report = 5;
  string completed_at = 6;
  // Back-office : nom affiché de l'agent de la visite (fiche agent du Nettoyage).
  string agent_name = 7;
}

message Quote {
  string id = 1;
  // Lignes d'un passage, préremplies depuis la grille et modifiables par le superviseur.
  repeated PriceLine lines = 2;
  // Prix d'un passage.
  ksp.common.v1.Money subtotal = 3;
  // 1 pour une prestation ponctuelle ; nombre de passages prévus pour un contrat récurrent.
  int32 intervention_count = 4;
  ksp.common.v1.Money total = 5;
  repeated TimeSlot proposed_slots = 6;
  string valid_until = 7;
  int32 deposit_percent = 8;
  ksp.common.v1.Money deposit_amount = 9;
  Recurrence recurrence = 10;
  string sent_at = 11;
  int32 team_size = 12;
  int32 duration_minutes = 13;
}

message QuoteRequest {
  string id = 1;
  // "received", "visit_scheduled", "quote_sent", "accepted", "declined", "rejected",
  // "expired" ou "cancelled".
  string status = 2;
  string customer_id = 3;
  // "individual" ou "business".
  string customer_kind = 4;
  // Organisation au nom de laquelle la demande est faite, vide pour un particulier.
  string organization_id = 5;
  string service_code = 6;
  // Déprécié (ADR-033) : valeur dérivée des réponses pour les anciens lecteurs, "other" si la
  // prestation n'a pas de champ "premises_type". "apartment", "house", "office", "shop",
  // "warehouse" ou "other".
  string premises_type = 7 [deprecated = true];
  // Déprécié (ADR-033) : réponse au champ de la taille d'équipe (TeamSizeRule.field_code), 1 sinon.
  int32 quantity = 8 [deprecated = true];
  // Codes des options choisies (le détail de leurs réponses est dans option_selections).
  repeated string options = 9;
  string commune = 10;
  // Adresse d'intervention : jamais dans les journaux ni dans les événements.
  string address = 11;
  repeated TimeSlot preferred_slots = 12;
  string comment = 13;
  Recurrence recurrence = 14;
  // Taille d'équipe demandée par le client, 0 si non précisée.
  int32 requested_team_size = 15;
  int32 recommended_team_size = 16;
  // Fourchette du simulateur au moment de la demande, absente si la prestation n'a pas de prix.
  PriceRange estimate = 17;
  SiteVisit visit = 18;
  Quote quote = 19;
  string mission_id = 20;
  string closing_reason = 21;
  string created_at = 22;
  string updated_at = 23;
  // Entreprise : jours d'intervention par semaine indiqués, 0 si non précisés.
  int32 days_per_week = 24;
  // Back-office : nom affiché du client (prénom et nom du compte, ADR-029).
  string customer_name = 25;
  // Back-office : raison sociale de l'organisation, vide pour un particulier (ADR-029).
  string organization_name = 26;
  // Réponses au formulaire de la prestation, telles qu'enregistrées (ancien format converti,
  // ADR-033). Absentes pour une demande antérieure à la grille paramétrable.
  AnswerSet answers = 27;
  // Options choisies, avec leurs réponses.
  repeated OptionSelection option_selections = 28;
  // Code de la fréquence choisie, vide si aucune.
  string frequency = 29;
  // Version de la grille utilisée pour le calcul, 0 si inconnue (demande antérieure).
  int32 pricing_version = 30;
  // Détail du calcul au moment de la demande, absent pour une demande antérieure ; le devis est
  // prérempli à partir de lui.
  PriceCalculation calculation = 31;
}

message ChecklistItem {
  string code = 1;
  string label = 2;
  bool done = 3;
}

message AgentRef {
  string agent_id = 1;
  string display_name = 2;
}

// Passage d'une mission : une prestation ponctuelle en a un, un contrat récurrent plusieurs,
// chacun avec ses agents.
message Intervention {
  string id = 1;
  // "planned", "in_progress", "on_hold", "completed" ou "cancelled".
  string status = 2;
  string scheduled_start = 3;
  int32 duration_minutes = 4;
  repeated AgentRef agents = 5;
  repeated ChecklistItem checklist = 6;
  string incident_note = 7;
  // Références de fichiers du service file (photos avant et après), sans stockage ici.
  repeated string before_photo_file_ids = 8;
  repeated string after_photo_file_ids = 9;
  string started_at = 10;
  string completed_at = 11;
  // Passage annulé : "suspension" (reprogrammable au déblocage) ou "manual" ; vide sinon.
  string cancellation_cause = 12;
}

message Mission {
  string id = 1;
  string request_id = 2;
  string quote_id = 3;
  string customer_id = 4;
  // "to_schedule", "scheduled", "in_progress", "on_hold", "completed" ou "cancelled".
  string status = 5;
  string service_code = 6;
  string commune = 7;
  // Adresse d'intervention : jamais dans les journaux ni dans les événements.
  string address = 8;
  TimeSlot chosen_slot = 9;
  Recurrence recurrence = 10;
  int32 planned_interventions = 11;
  int32 completed_interventions = 12;
  repeated Intervention interventions = 13;
  PaymentState payment = 14;
  string cancellation_reason = 15;
  string created_at = 16;
  string updated_at = 17;
  // Suspension en cours, absente sinon (CDC Nettoyage, partie 10 ; ADR-030).
  Suspension suspension = 18;
  // Jours d'intervention par semaine indiqués par l'entreprise, 0 si non précisés.
  int32 days_per_week = 19;
  // "individual" ou "business" (organisation au nom de laquelle le devis a été accepté) : une
  // mission d'entreprise se règle par sa facture, jamais par un paiement manuel.
  string customer_kind = 20;
  // Organisation de la mission, vide pour un particulier.
  string organization_id = 21;
  // Back-office : nom affiché du client (ADR-029).
  string customer_name = 22;
  // Back-office : raison sociale de l'organisation, vide pour un particulier (ADR-029).
  string organization_name = 23;
}

message Suspension {
  // Plus ancienne cause encore active : "unpaid_invoices" (entreprise), "unpaid_interventions"
  // (particulier) ou "organization_suspended" (organisation suspendue par KSP, ADR-030).
  string cause = 1;
  string since = 2;
  // Impayés connus à la dernière décision ; 0 possible pour une organisation suspendue.
  int32 unpaid_count = 3;
  // Toutes les causes actives, la plus ancienne d'abord : la mission reprend quand il n'en reste
  // aucune (ADR-030).
  repeated string causes = 4;
}

message CatalogOption {
  string code = 1;
  string label = 2;
  // Absent tant que l'option n'a pas de prix. Depuis l'ADR-033 : forfait de l'option (flat_price).
  ksp.common.v1.Money price = 3;
}

message ServiceOffer {
  string code = 1;
  string name = 2;
  string description = 3;
  // Déprécié (ADR-033) : unité de l'ancien formulaire, "square_meter", "room", "septic_tank" ou
  // "cubic_meter". Les unités sont désormais celles des champs (FormField.unit_label).
  string unit = 4 [deprecated = true];
  // Déprécié (ADR-033) : options actives avec leur forfait ; lire form.options.
  repeated CatalogOption options = 5 [deprecated = true];
  // Vrai si toute réponse au formulaire (hors options) peut être chiffrée : tous les prix
  // nécessaires des champs actifs sont fixés.
  bool priced = 6;
  // Déprécié (ADR-033) : le formulaire public ne montre plus de prix.
  ksp.common.v1.Money minimum_price = 7 [deprecated = true];
  // Formulaire de la prestation, sans aucun prix (ADR-033).
  ServiceForm form = 8;
}

// ---------------------------------------------------------------------------
// Formulaire paramétrable d'une prestation (ADR-033).
// ---------------------------------------------------------------------------

// Réponse à un champ : nombre entier (type "number"), code d'un choix ("choice") ou oui/non
// ("boolean").
message AnswerValue {
  oneof value {
    int32 number_value = 1;
    string choice_value = 2;
    bool boolean_value = 3;
  }
}

// Réponses à un formulaire, par code de champ. Le message présent (même vide) signale le nouveau
// format de demande ; absent, la demande est à l'ancien format (premises_type, quantity, options).
message AnswerSet {
  map<string, AnswerValue> values = 1;
}

// Option choisie par le client, avec les réponses à ses propres champs.
message OptionSelection {
  string code = 1;
  AnswerSet answers = 2;
}

// Valeur d'un champ "choice" (définition complète, back-office).
message FieldChoice {
  string code = 1;
  string label = 2;
  // Supplément ajouté au prix ; absent si non fixé.
  ksp.common.v1.Money supplement = 3;
  // Coefficient appliqué au prix, en points de base ; 0 si aucun.
  // Supplément absent et coefficient 0 : valeur sans prix (priced = false si elle est choisie).
  int32 coefficient_bp = 4;
  bool active = 5;
}

// Champ du formulaire (définition complète, back-office). Les champs sont dans l'ordre d'affichage.
message FieldDefinition {
  // Code unique dans la prestation (ou dans l'option), par exemple "surface".
  string code = 1;
  string label = 2;
  // "number", "choice" ou "boolean".
  string type = 3;
  bool required = 4;
  // Aide affichée sous le champ, vide si aucune.
  string help_text = 5;
  bool active = 6;
  // "number" : unité libre ("m²", "m³", "pièces", "mètres linéaires"…), bornes entières incluses
  // et prix par unité (absent tant que non fixé).
  string unit_label = 7;
  int32 min = 8;
  int32 max = 9;
  ksp.common.v1.Money price_per_unit = 10;
  // "choice" : valeurs proposées, dans l'ordre d'affichage.
  repeated FieldChoice choices = 11;
  // "boolean" : effet de la réponse « oui » (la réponse « non » n'a jamais d'effet). Supplément
  // absent et coefficient 0 : non fixé (priced = false si le client répond oui).
  ksp.common.v1.Money supplement_if_yes = 12;
  int32 coefficient_bp_if_yes = 13;
}

// Option (prestation complémentaire) : forfait facultatif et champs propres.
message OptionDefinition {
  string code = 1;
  string label = 2;
  string description = 3;
  bool active = 4;
  // Forfait de l'option, absent si aucun. Une option sans champ et sans forfait n'a pas de prix.
  ksp.common.v1.Money flat_price = 5;
  repeated FieldDefinition fields = 6;
}

// Fréquence propre à la prestation, avec son coefficient sur le prix d'un passage.
message ServiceFrequency {
  // Par exemple "once", "weekly", "monthly".
  string code = 1;
  string label = 2;
  int32 coefficient_bp = 3;
  bool active = 4;
}

// Valeur d'un champ "choice" vue du public : sans supplément ni coefficient.
message FormChoice {
  string code = 1;
  string label = 2;
}

// Champ actif du formulaire public : jamais de prix, de supplément ni de coefficient.
message FormField {
  string code = 1;
  string label = 2;
  // "number", "choice" ou "boolean".
  string type = 3;
  bool required = 4;
  string help_text = 5;
  // "number" seulement : unité et bornes entières incluses.
  string unit_label = 6;
  int32 min = 7;
  int32 max = 8;
  // "choice" seulement : valeurs actives.
  repeated FormChoice choices = 9;
}

message FormOption {
  string code = 1;
  string label = 2;
  string description = 3;
  repeated FormField fields = 4;
}

message FormFrequency {
  string code = 1;
  string label = 2;
}

// Formulaire public d'une prestation : éléments actifs seulement, dans l'ordre d'affichage.
message ServiceForm {
  repeated FormField fields = 1;
  repeated FormOption options = 2;
  // Fréquences actives ; si la liste n'est pas vide, la fréquence est obligatoire (nouveau format).
  repeated FormFrequency frequencies = 3;
}

// Ligne du détail d'un calcul.
message CalculationLine {
  // "unit_price" (nombre × prix par unité), "supplement" (choix ou réponse oui) ou "flat_price"
  // (forfait d'une option).
  string kind = 1;
  // Option concernée, vide pour la prestation elle-même.
  string option_code = 2;
  // Champ concerné, vide pour un forfait.
  string field_code = 3;
  // Valeur choisie ("choice"), vide sinon.
  string choice_code = 4;
  string label = 5;
  int32 quantity = 6;
  string unit_label = 7;
  ksp.common.v1.Money unit_price = 8;
  ksp.common.v1.Money amount = 9;
}

// Coefficient appliqué : au montant d'une option (option_code renseigné) ou au total.
message AppliedCoefficient {
  // "choice", "boolean", "commune" ou "frequency".
  string source = 1;
  // Option dont le champ porte ce coefficient : il ne s'applique qu'au montant de cette option.
  // Vide pour un coefficient de la prestation, de la commune ou de la fréquence.
  string option_code = 2;
  string field_code = 3;
  // Code du choix, clé de la commune ou code de la fréquence ; vide pour un booléen.
  string code = 4;
  string label = 5;
  int32 coefficient_bp = 6;
}

// Prix manquant dans la grille : forfait d'une option (field_code vide), prix par unité d'un champ
// (choice_code vide) ou effet d'une valeur choisie.
message MissingPrice {
  string option_code = 1;
  string field_code = 2;
  string choice_code = 3;
}

// Détail du calcul d'un passage (ADR-033) :
//   prix = max(minimum, (Σ lignes de la prestation + Σ options [Σ lignes de l'option × Π coefficients
//   de ses champs]) × Π coefficients des champs de la prestation × commune × fréquence),
//   arrondi une seule fois, au franc le plus proche.
message PriceCalculation {
  int32 pricing_version = 1;
  bool priced = 2;
  // Vide si priced ; sinon "price_not_set" (prix d'un champ de la prestation), "option_price_not_set"
  // (prix d'une option ou de ses champs) ou "answers_incomplete" (ancien format sans les réponses
  // obligatoires du nouveau formulaire).
  string reason = 3;
  repeated MissingPrice missing_prices = 4;
  // Lignes calculables ; complètes seulement si priced.
  repeated CalculationLine lines = 5;
  // Montants absents si priced = false.
  ksp.common.v1.Money base_amount = 6;
  repeated AppliedCoefficient coefficients = 7;
  ksp.common.v1.Money subtotal = 8;
  // Minimum de commande de la grille, absent s'il n'est pas fixé.
  ksp.common.v1.Money minimum_price = 9;
  bool minimum_applied = 10;
  ksp.common.v1.Money computed_price = 11;
  PriceRange estimate = 12;
  int32 recommended_team_size = 13;
}

// ===========================================================================
// CatalogService
// ===========================================================================

message ListServicesRequest {}

message ListServicesResponse {
  repeated ServiceOffer services = 1;
}

// Deux formats (ADR-033), distingués par la présence du message answers :
// - nouveau : answers (présent, même vide), option_selections, frequency (code d'une fréquence
//   active de la prestation, obligatoire si elle en a) ; premises_type, quantity et options vides ;
// - ancien (déprécié) : premises_type, quantity, options (codes) ; converti vers le nouveau.
message SimulateRequest {
  string service_code = 1;
  // Ancien format (déprécié).
  string premises_type = 2 [deprecated = true];
  // Ancien format (déprécié) : quantité dans l'unité de la prestation, entière et positive ;
  // devient la réponse au champ de la taille d'équipe (TeamSizeRule.field_code).
  int32 quantity = 3 [deprecated = true];
  // Ancien format (déprécié) : codes des options choisies.
  repeated string options = 4 [deprecated = true];
  string commune = 5;
  // Nouveau format : code d'une fréquence de la prestation (coefficient sur le prix d'un passage).
  // Ancien format : "once", "weekly" ou "monthly", appliqué si la prestation a une fréquence de
  // même code, sans effet sinon.
  string frequency = 6;
  // Nouveau format : réponses au formulaire de la prestation.
  AnswerSet answers = 7;
  // Nouveau format : options choisies, avec leurs réponses.
  repeated OptionSelection option_selections = 8;
}

message SimulateResponse {
  string service_code = 1;
  bool priced = 2;
  // Absents si priced = false.
  PriceRange estimate = 3;
  ksp.common.v1.Money computed_price = 4;
  repeated PriceLine breakdown = 5;
  bool minimum_applied = 6;
  int32 commune_coefficient_bp = 7;
  int32 recommended_team_size = 8;
  // Mention « estimation non contractuelle », ou raison de l'absence de prix.
  string notice = 9;
  // Vrai si la commune est dans une zone desservie ; l'estimation est donnée dans tous les cas.
  bool covered = 10;
  // Raison de l'absence de prix (voir PriceCalculation.reason), vide si priced.
  string reason = 11;
  // Détail complet du calcul (ADR-033) ; breakdown reprend ses lignes.
  PriceCalculation calculation = 12;
}

// Zone desservie vue du public.
message ServedZone {
  // Clé normalisée, par exemple "abomey-calavi" (voir Zone).
  string code = 1;
  // Nom affiché, par exemple "Abomey-Calavi".
  string commune = 2;
}

message ListServedZonesRequest {}

message ListServedZonesResponse {
  repeated ServedZone zones = 1;
}

