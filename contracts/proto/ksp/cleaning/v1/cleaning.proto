// ===========================================================================
// CleaningAdminService — demandes, visites, devis
// ===========================================================================

message ListQuoteRequestsRequest {
  Page page = 1;
  // Filtres facultatifs, cumulables, toujours paginés par curseur.
  // État de la demande.
  string status = 2;
  // Code de zone (commune normalisée, par exemple "abomey-calavi", voir Zone).
  string commune = 3;
  // "individual" ou "business".
  string customer_kind = 4;
  // Groupe de demandes (ADR-034).
  string group_id = 5;
  // Code du type de lieu.
  string place_type = 6;
  // Code de la prestation.
  string service_code = 7;
}

message ListQuoteRequestsResponse {
  repeated QuoteRequest requests = 1;
  string next_cursor = 2;
}

message GetQuoteRequestRequest {
  string request_id = 1;
}

message GetQuoteRequestResponse {
  QuoteRequest request = 1;
  // Autres demandes du même groupe (ADR-034), vide pour une demande seule.
  repeated GroupedRequestSummary group_requests = 2;
}

// Demande sœur d'un groupe, vue du back-office.
message GroupedRequestSummary {
  string id = 1;
  string service_code = 2;
  // Même valeurs que QuoteRequest.status.
  string status = 3;
  string service_name = 4;
  // Date de la visite des lieux planifiée ou réalisée, vide si aucune.
  string visit_scheduled_at = 5;
  // Total du devis en vigueur, absent sans devis.
  ksp.common.v1.Money quote_total = 6;
  // Mission créée à l'acceptation, vide sinon.
  string mission_id = 7;
}

message RejectQuoteRequestRequest {
  string request_id = 1;
  string reason = 2;
}

message RejectQuoteRequestResponse {
  QuoteRequest request = 1;
}

message ScheduleVisitRequest {
  string request_id = 1;
  string scheduled_at = 2;
  string agent_id = 3;
}

message ScheduleVisitResponse {
  QuoteRequest request = 1;
}

message CompleteVisitRequest {
  string visit_id = 1;
  string report = 2;
}

message CompleteVisitResponse {
  QuoteRequest request = 1;
}

message SendQuoteRequest {
  string request_id = 1;
  // Vide : lignes préremplies depuis le détail du calcul de la demande (ADR-033) : ses lignes, une
  // ligne d'ajustement pour les coefficients et, s'il s'applique, une ligne pour le minimum de
  // commande. Calcul sans prix : nouveau calcul avec la grille en vigueur et les réponses
  // enregistrées ; toujours sans prix : CLEANING_PRICE_NOT_SET.
  repeated PriceLine lines = 2;
  repeated TimeSlot proposed_slots = 3;
  // 0 : validité par défaut (réglages).
  int32 validity_days = 4;
  Recurrence recurrence = 5;
  // 0 : taille recommandée.
  int32 team_size = 6;
  int32 duration_minutes = 7;
}

message SendQuoteResponse {
  QuoteRequest request = 1;
}

// ===========================================================================
// CleaningAdminService — demandes groupées et visites (ADR-035)
// ===========================================================================

message ScheduleGroupVisitRequest {
  string group_id = 1;
  string scheduled_at = 2;
  string agent_id = 3;
  // Demandes laissées hors de la visite commune : détachées, elles gardent leur propre visite.
  repeated string exclude_request_ids = 4;
  string idempotency_key = 5;
}

message ScheduleGroupVisitResponse {
  RequestGroupOutcome outcome = 1;
  // Toutes les demandes du groupe, après l'opération.
