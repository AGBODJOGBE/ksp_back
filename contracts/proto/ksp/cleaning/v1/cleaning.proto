//                                                              resserrées, valeur retirée ou désactivation
//                                                              refusées (R-CA-11) ; details.offerIds,
//                                                              details.placeTypeIds
//   CLEANING_PLACE_LOCATION_MISSING        FAILED_PRECONDITION position du lieu effacée (conservation ou
