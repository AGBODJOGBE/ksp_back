syntax = "proto3";

package ksp.cleaning.v1;

import "ksp/common/v1/money.proto";

// Contrats du service cleaning, refonte v2 (cahier des charges Nettoyage v2, parties 14 et 15).
// La v2 remplace la v1 sans migration de données (environnement de développement).
//
// Services appelés par la gateway (une route REST = un appel, voir contracts/openapi) :
// - CatalogService : Catalogue, simulateur et aperçu des dates — public, sans compte (UC-NT-01, 02).
// - PlaceService : Lieux du client, « Mes lieux » (UC-NT-03).
// - RequestService : Demandes de devis, frais de visite, devis du client (UC-NT-04 à 10).
// - ProgramService : Programmes, séances, paiements, notes et réclamations du client (UC-NT-11 à 18).
// - AgentService : Application agent : inscription, disponibilités, planning, visites et séances (UC-NT-19 à 24).
// - CatalogAdminService : Back-office : catalogue, tarifs, compétences, jours fériés, zones (UC-NT-25 à 29).
// - RequestAdminService : Back-office : demandes, visites, constat retenu, devis (UC-NT-30 à 33).
// - AgentAdminService : Back-office : agents, disponibilités, équipes (UC-NT-34 à 36).
// - PlanningAdminService : Back-office : planning, affectations, planification automatique (UC-NT-37, 38).
// - ProgramAdminService : Back-office : programmes et séances (UC-NT-39).
// - ClaimAdminService : Back-office : réclamations (UC-NT-40).
// - SettingsAdminService : Back-office : réglages du module (UC-NT-43).
// Services appelés par les autres services :
// - WalletDebitCheckService : réservé à wallet (rapprochement des débits du wallet).
// - ksp.common.v1.ObligationService (obligation.proto) : également implémenté par cleaning ; une
//   demande ouverte, un programme non terminé ou une séance impayée bloque la suppression du compte.
//
// Événements écoutés (partie 15.5, déclarés dans libs/platform/src/messaging/consumed-events.ts) :
// - wallet.prepaid.credited : seul déclencheur du débit qui suit un paiement direct (R-WL-05,
//   R-PP-03) ; quand forObject désigne une demande (frais de visite) ou une séance de cleaning, le
//   service débite aussitôt le wallet crédité. Le débit suit donc toujours le crédit, sans course
//   possible ; tout crédit d'un titulaire, même sans forObject, relance ses débits en attente dans
//   l'ordre : frais de visite, séances en retard, séances à payer (R-PP-03) ;
// - payment.intent.succeeded : suivi du paiement direct seulement (lien de paiement réglé), jamais
//   de débit à sa réception ;
// - billing.invoice.overdue, billing.invoice.paid : suspension et reprise des programmes
//   d'entreprise (R-PE-06, partie 11.3) ;
// - identity.organization.suspended / reactivated, identity.user.deleted.
// billing écoute cleaning.session.completed et cleaning.session.missed (montant dû) pour la facture
// mensuelle des entreprises (R-PE-01).
//
// L'utilisateur connecté n'est jamais dans les messages : la gateway le transmet dans les
// métadonnées gRPC (x-user-id, x-active-context, x-user-roles, permissions, x-user-mfa…). Le
// service revérifie ses droits à chaque appel à partir des permissions du jeton (16.3) : client
// titulaire du contexte actif, agent affecté, permission cleaning.* du personnel (et portée par
// zone, R-RB-03). Un dossier hors du périmètre de l'appelant répond NOT_FOUND.
//
// Contexte organisation (R-CP-03) : org_admin ou org_member pour agir ; org_viewer : lecture seule.
// AcceptQuote, DeclineQuote, StopProgram et RenewProgram sont réservés à org_admin. Refus :
// AUTH_FORBIDDEN, details.organizationRole.
//
// Conventions :
// - dates : chaînes ISO 8601 en UTC ; jours "AAAA-MM-JJ" et heures "HH:MM" à l'heure de
//   Porto-Novo (programmes, disponibilités) ;
// - identifiants : UUID v7 ; montants : ksp.common.v1.Money, entiers en XOF ;
// - montants (R-EX-04, 16.3) : jamais renvoyés à un agent ni à un membre du personnel sans
//   cleaning.amounts.read (champ absent) ; toujours renvoyés au client titulaire et au simulateur ;
// - valeurs énumérées : chaînes en snake_case, identiques à celles de l'API REST (listées sur
//   chaque champ) ; coefficients en points de base (10000 = coefficient 1, plafond 100000) ;
// - champ "optional" absent : non renseigné (PATCH : inchangé) ;
// - listes : curseur opaque (cursor, next_cursor), total, tri écrit dans sort ;
// - créations, paiements, reports, annulations, arrêts de programme et validations :
//   idempotency_key obligatoire (en-tête Idempotency-Key) ;
// - actions de terrain de l'agent : idempotency_key obligatoire et occurred_at facultatif (heure
//   réelle), pour rejouer sans risque les actions gardées hors connexion (R-EX-05) ;
// - transitions rejouées : une transition vers l'état déjà atteint, rejouée par le même auteur,
//   répond avec l'état courant, sans nouvel événement ni nouvelle trace ; par un autre auteur :
//   CLEANING_INVALID_TRANSITION ;
// - occurred_at : refusé s'il est dans le futur (reason in_future) ou s'il date de plus de 72 h
//   (reason too_old) ; clés d'idempotence gardées 7 jours ;
// - position, repère, adresse et pièce d'identité : données personnelles, chiffrées en base,
//   jamais journalisées ni publiées dans un événement.
//
// Erreurs (code AppError → statut gRPC ; statut HTTP de la gateway entre parenthèses dans
// l'OpenAPI) :
//   CLEANING_VALIDATION_FAILED             INVALID_ARGUMENT    details.field ; details.reason : "required",
//                                                              "invalid_type", "out_of_range" (R-PX-03),
//                                                              "unknown_parameter", "unknown_choice",
//                                                              "in_future", "too_old" (occurredAt, D24),
//                                                              "not_applicable" (R-PG-09), "duplicate"
//                                                              (code ou clé en double), "team_rule_gap"
//                                                              (R-CA-13), "area_parameter_invalid"
//                                                              (R-CA-14), "unknown_commune" (R-ZN-03),
//                                                              "pack_item_also_selected" (R-PX-09),
//                                                              "photo_kind_conflict" (R-EX-10),
//                                                              "lines_total_mismatch" (R-DV-07)
//   CLEANING_REASON_REQUIRED               INVALID_ARGUMENT    motif obligatoire absent (écart avec le
//                                                              constat, contournement, décision de KSP) ;
//                                                              details.field
//   CLEANING_OFFER_NOT_AVAILABLE           INVALID_ARGUMENT    type de nettoyage non proposé (ou désactivé)
//                                                              pour ce lieu ; details.cleaningTypeId
//   CLEANING_SLOT_INVALID                  INVALID_ARGUMENT    créneau ou date invalide ; details.reason :
//                                                              "malformed", "in_past", "too_many" (plus de
//                                                              3 créneaux)
//   CLEANING_PLACE_CATEGORY_NOT_FOUND      NOT_FOUND
//   CLEANING_PLACE_TYPE_NOT_FOUND          NOT_FOUND           lieu inconnu ou inactif
//   CLEANING_TYPE_NOT_FOUND                NOT_FOUND           type de nettoyage inconnu
//   CLEANING_PARAMETER_NOT_FOUND           NOT_FOUND
//   CLEANING_OFFER_NOT_FOUND               NOT_FOUND
//   CLEANING_TARIFF_NOT_FOUND              NOT_FOUND           version de tarif inconnue
//   CLEANING_SKILL_NOT_FOUND               NOT_FOUND
//   CLEANING_HOLIDAY_NOT_FOUND             NOT_FOUND
//   CLEANING_ZONE_NOT_FOUND                NOT_FOUND
//   CLEANING_PLACE_NOT_FOUND               NOT_FOUND           lieu du client inconnu ou d’un autre compte
//   CLEANING_REQUEST_NOT_FOUND             NOT_FOUND
//   CLEANING_VISIT_NOT_FOUND               NOT_FOUND           visite inconnue, ou agent non affecté
//   CLEANING_QUOTE_NOT_FOUND               NOT_FOUND
//   CLEANING_PROGRAM_NOT_FOUND             NOT_FOUND
//   CLEANING_SESSION_NOT_FOUND             NOT_FOUND           séance inconnue, ou agent non affecté
//                                                              (R-EX-01)
//   CLEANING_AGENT_NOT_FOUND               NOT_FOUND           agent inconnu, ou compte sans profil d’agent
//   CLEANING_UNAVAILABILITY_NOT_FOUND      NOT_FOUND
//   CLEANING_TEAM_NOT_FOUND                NOT_FOUND
//   CLEANING_ASSIGNMENT_NOT_FOUND          NOT_FOUND
//   CLEANING_CLAIM_NOT_FOUND               NOT_FOUND
//   CLEANING_TEAM_LEAD_ONLY                PERMISSION_DENIED   action réservée au chef d’équipe : démarrer,
//                                                              clôturer, marquer l’arrivée (R-EQ-03)
//   CLEANING_SECOND_APPROVER_REQUIRED      PERMISSION_DENIED   validation par une deuxième personne :
//                                                              l’auteur ne valide pas sa propre décision
//                                                              (R-RC-03, R-DV-03)
//   CLEANING_CALLER_FORBIDDEN              PERMISSION_DENIED   méthode réservée à un autre service
//                                                              (GetWalletDebitStatus : wallet ; les
//                                                              autres : gateway)
//   CLEANING_CONCURRENT_UPDATE             ALREADY_EXISTS      dossier ou agenda modifié en même temps par
//                                                              un autre appel : relire et recommencer
//   CLEANING_IDEMPOTENCY_KEY_REUSED        ALREADY_EXISTS      clé d’idempotence déjà utilisée pour une
//                                                              autre opération ou un autre contenu
//   CLEANING_CODE_ALREADY_USED             ALREADY_EXISTS      code de catalogue déjà pris ; details.code
//   CLEANING_SCHEDULE_CONFLICT             ALREADY_EXISTS      agent déjà pris sur la période, temps de
//                                                              trajet compris (9.4, non contournable) ;
//                                                              details.checks
//   CLEANING_AGENT_ALREADY_REGISTERED      ALREADY_EXISTS      le compte a déjà un profil d’agent
//   CLEANING_AGENT_HAS_ASSIGNMENTS         ALREADY_EXISTS      désactivation refusée : affectations à venir
//                                                              (R-AG-03) ; details.assignments
//   CLEANING_UNAVAILABILITY_CONFLICT       ALREADY_EXISTS      indisponibilité qui chevauche des
//                                                              affectations (R-DS-04) ;
//                                                              details.assignments ; le superviseur peut
//                                                              forcer
//   CLEANING_AVAILABILITY_IN_USE           ALREADY_EXISTS      plage déjà occupée par une affectation
//                                                              (R-DS-05) ; details.assignments
//   CLEANING_ZONE_HAS_ACTIVITY             ALREADY_EXISTS      désactivation d’une zone avec des dossiers
//                                                              en cours sans confirmation ;
//                                                              details.openRequests, details.activePrograms
//   CLEANING_RESCHEDULE_OVERLAP            ALREADY_EXISTS      nouveau créneau qui chevauche une autre
//                                                              séance non annulée du même programme
//                                                              (R-RP-01) ; details.sessionId
//   CLEANING_RATING_ALREADY_GIVEN          ALREADY_EXISTS      séance déjà notée (à valider : une note par
//                                                              séance)
//   CLEANING_INVALID_TRANSITION            FAILED_PRECONDITION transition interdite (partie 15.2) ;
//                                                              details.from, details.to ; details.reason
//                                                              facultatif : "target_in_past" (R-PL-10),
//                                                              "commune_change_locked" (R-DM-07),
//                                                              "claim_open" (R-EX-10)
//   CLEANING_ZONE_NOT_COVERED              FAILED_PRECONDITION position hors de tout contour de commune, ou
//                                                              commune hors des zones actives (R-ZN-01,
//                                                              R-DM-01) ; details.reason :
//                                                              "outside_boundaries" ou
//                                                              "commune_not_served" ; details.communeKey et
//                                                              details.communeName (null hors contour)
//   CLEANING_TOO_MANY_OPEN_REQUESTS        FAILED_PRECONDITION details.maximum (R-DM-04)
//   CLEANING_LEAD_TIME_TOO_SHORT           FAILED_PRECONDITION visite (R-DM-05) ou première séance
//                                                              (R-PG-03) trop proche ; details.minimumHours
//   CLEANING_SCHEDULE_EMPTY                FAILED_PRECONDITION le programme ne donne aucune date
//   CLEANING_SCHEDULE_LIMIT_EXCEEDED       FAILED_PRECONDITION programme au-delà des bornes (R-PG-03) ;
//                                                              details.maxMonths, details.maxSessions
//   CLEANING_ORGANIZATION_SUSPENDED        FAILED_PRECONDITION organisation suspendue par KSP : ni demande,
//                                                              ni paiement des frais de visite, ni
//                                                              acceptation en son nom
//   CLEANING_ORGANIZATION_UNPAID_INVOICES  FAILED_PRECONDITION factures impayées de l’organisation au seuil
//                                                              de suspension : acceptation refusée
//                                                              (R-AC-02) ; details.unpaidCount,
//                                                              details.threshold
//   CLEANING_VISIT_FEE_UNPAID              FAILED_PRECONDITION frais de visite non payés (R-FV-02)
//   CLEANING_NOTHING_TO_PAY                FAILED_PRECONDITION aucun montant dû
//   CLEANING_INSUFFICIENT_BALANCE          FAILED_PRECONDITION paiement par le wallet demandé, solde
//                                                              insuffisant ; details.missing (Money) ;
//                                                              payer par Mobile Money (R-WL-05)
//   CLEANING_PAYMENT_VIA_INVOICE           FAILED_PRECONDITION séance d’entreprise : réglée par la facture
//                                                              mensuelle (billing)
//   CLEANING_QUOTE_EXPIRED                 FAILED_PRECONDITION devis au-delà de sa date de validité
//                                                              (R-DV-04)
//   CLEANING_QUOTE_APPROVAL_REQUIRED       FAILED_PRECONDITION remise au-delà du seuil non encore validée
//                                                              par un admin (R-DV-03)
//   CLEANING_PRICE_NOT_POSITIVE            FAILED_PRECONDITION le prix d’une séance doit rester strictement
//                                                              positif (R-DV-03)
//   CLEANING_PRICE_NOT_SET                 FAILED_PRECONDITION offre « sur devis » sans prix fixé ;
//                                                              details.offerIds
//   CLEANING_VISIT_TOO_EARLY               FAILED_PRECONDITION constat ou clôture avant l’heure de la
//                                                              visite (R-VI-04) ; details.scheduledAt,
//                                                              details.timeZone ("Africa/Porto-Novo")
//   CLEANING_SESSION_TOO_EARLY             FAILED_PRECONDITION arrivée plus de arrivalMaxAdvanceMinutes
//                                                              avant l’heure prévue (partie 10) ;
//                                                              details.scheduledStart,
//                                                              details.maximumMinutes
//   CLEANING_WAIT_TIME_NOT_ELAPSED         FAILED_PRECONDITION client absent signalé avant
//                                                              customerWaitMinutes d’attente (R-EX-02) ;
//                                                              details.minimumMinutes
//   CLEANING_PHOTOS_MISSING                FAILED_PRECONDITION au moins une photo « avant » (démarrage) ou
//                                                              « après » (clôture) ; details.kind ; aussi :
//                                                              retrait de la dernière photo « avant » ou
//                                                              « après » d’une séance réalisée sans photo
//                                                              de remplacement (R-EX-10)
//   CLEANING_PHOTO_LIMIT_REACHED           FAILED_PRECONDITION details.kind, details.maximum (10 par
//                                                              défaut) ; une photo peut être retirée pour
//                                                              en ajouter une autre (R-EX-10)
//   CLEANING_CHECKLIST_INCOMPLETE          FAILED_PRECONDITION clôture refusée tant que la liste n’est pas
//                                                              complète ; details.missing
//   CLEANING_CANCELLATION_TOO_LATE         FAILED_PRECONDITION moins de 24 h avant : passer par le support
//                                                              (partie 12) ; details.freeCancellationHours
//   CLEANING_RESCHEDULE_LIMIT_REACHED      FAILED_PRECONDITION reports du mois épuisés ; details.maximum
//   CLEANING_SESSION_OVERDUE_PAYMENT       FAILED_PRECONDITION une séance en retard de paiement bloque la
//                                                              suivante (R-PP-04)
//   CLEANING_BALANCE_GUARANTEE_NOT_MET     FAILED_PRECONDITION garantie de solde activée et solde
//                                                              insuffisant (R-PP-05) ; details.amountDue
//   CLEANING_CLAIM_WINDOW_CLOSED           FAILED_PRECONDITION réclamation au-delà de 48 h après la séance
