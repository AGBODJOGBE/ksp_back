//   CLEANING_RENEWAL_NOT_ALLOWED           FAILED_PRECONDITION renouvellement (R-PG-07) ou nouvelle
//                                                              commande (R-PG-08) impossible ;
//                                                              details.reason
//   CLEANING_AMENDMENT_REQUIRED            FAILED_PRECONDITION changement qui modifie le prix : passer par
//                                                              un avenant (R-PG-06)
//   CLEANING_TARIFF_INCOMPLETE             FAILED_PRECONDITION tarif incohérent (R-CA-08, R-CA-11) ;
//                                                              details.index ; details.reason :
//                                                              "brackets_overlap", "brackets_gap",
//                                                              "first_bracket_above_min",
//                                                              "base_not_number", "base_inactive",
//                                                              "base_not_asked",
//                                                              "supplement_parameter_not_asked",
//                                                              "unknown_choice", "mode_incompatible"
