//                                                              non contournable)
//   CLEANING_SKILL_MISSING                 FAILED_PRECONDITION compétences non couvertes par l’équipe
//                                                              (R-CA-09, non contournable) ; details.checks
//   CLEANING_AGENT_OUT_OF_ZONE             FAILED_PRECONDITION commune hors des zones de l’agent,
//                                                              contournable avec motif ; details.checks
//   CLEANING_AGENT_UNAVAILABLE             FAILED_PRECONDITION hors des plages de l’agent, contournable
//                                                              avec motif ; details.checks
//   CLEANING_AGENT_OVERLOADED              FAILED_PRECONDITION charge maximale dépassée, contournable avec
//                                                              motif ; details.checks
//   CLEANING_TEAM_SIZE_MISMATCH            FAILED_PRECONDITION nombre d’agents différent du devis,
//                                                              contournable ; details.expected
//   CLEANING_TEAM_INACTIVE                 FAILED_PRECONDITION équipe désactivée
//   CLEANING_AGENT_ON_LEAVE                FAILED_PRECONDITION indisponibilité déclarée de l’agent sur la
//                                                              période (R-DS-02), non contournable : la
//                                                              retirer ou la raccourcir d’abord ;
//                                                              details.checks
//   CLEANING_PROGRAM_SUSPENDED             FAILED_PRECONDITION programme suspendu (R-SU-01) ;
//                                                              details.causes
//   CLEANING_GEO_UNAVAILABLE               UNAVAILABLE         commune non déterminable : service geo
//                                                              indisponible, réessayer
//   IDENTITY_PROFILE_INCOMPLETE            FAILED_PRECONDITION profil incomplet (R-CP-02), vérifié par la
//                                                              gateway
//   FILE_*                                 (voir file.proto)   photos, pièces et signature : rattachées
//                                                              chez file (AttachFile au nom de l’appelant)
//                                                              avant l’enregistrement ; FILE_OWNER_MISMATCH
//                                                              et FILE_PURPOSE_FORBIDDEN sont relayés
//   AUTH_REQUIRED                          UNAUTHENTICATED
//   AUTH_FORBIDDEN                         PERMISSION_DENIED   permission ou rôle manquant ; contexte
//                                                              organisation : rôle insuffisant (R-CP-03),
//                                                              details.organizationRole ("org_viewer" ou
