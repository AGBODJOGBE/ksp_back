syntax = "proto3";

package ksp.identity.v1;

// Contrat entre services du service identity (cahier des charges Identité, partie 8).
// Les opérations publiques appelées par la gateway (inscription, connexion, sessions,
// organisations, administration) sont ajoutées à l'étape « Contrats de la phase 1 ».
service IdentityService {
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  rpc GetUsersByIds(GetUsersByIdsRequest) returns (GetUsersByIdsResponse);
  // Réservé aux actions sensibles : les permissions courantes voyagent dans le jeton.
  rpc CheckPermission(CheckPermissionRequest) returns (CheckPermissionResponse);
  rpc GrantRole(GrantRoleRequest) returns (GrantRoleResponse);
  rpc RevokeRole(RevokeRoleRequest) returns (RevokeRoleResponse);
  // Chaque service enregistre son catalogue de permissions et de rôles à chaque déploiement.
  rpc RegisterCatalog(RegisterCatalogRequest) returns (RegisterCatalogResponse);
  rpc GetCatalog(GetCatalogRequest) returns (GetCatalogResponse);
}

enum UserStatus {
  USER_STATUS_UNSPECIFIED = 0;
  USER_STATUS_PENDING_VERIFICATION = 1;
  USER_STATUS_ACTIVE = 2;
  USER_STATUS_LOCKED = 3;
  USER_STATUS_SUSPENDED = 4;
  USER_STATUS_DELETION_PENDING = 5;
  USER_STATUS_DELETED = 6;
}

enum ScopeType {
  SCOPE_TYPE_UNSPECIFIED = 0;
  // Interne à KSP, tout l'écosystème.
  SCOPE_TYPE_GLOBAL = 1;
  // Un métier (scope_id = nom du service, par exemple "recovery").
  SCOPE_TYPE_DOMAIN = 2;
  // Une organisation cliente (scope_id = identifiant de l'organisation).
  SCOPE_TYPE_ORG = 3;
  // Le compte de l'utilisateur lui-même.
  SCOPE_TYPE_PERSONAL = 4;
}

message User {
  string id = 1;
  UserStatus status = 2;
  string first_name = 3;
  string last_name = 4;
  // Renseigné uniquement si le service appelant en a besoin (par exemple delivery).
  string phone_e164 = 5;
  string email = 6;
  string preferred_language = 7;
  string created_at = 8;
}

message GetUserRequest {
  string user_id = 1;
}

message GetUserResponse {
  User user = 1;
}

message GetUsersByIdsRequest {
  repeated string user_ids = 1;
}

message GetUsersByIdsResponse {
  repeated User users = 1;
}

message CheckPermissionRequest {
  string user_id = 1;
  // Format <service>:<ressource>:<action>, par exemple "wallet:payout:approve".
  string permission = 2;
  ScopeType scope_type = 3;
  string scope_id = 4;
}

message CheckPermissionResponse {
  bool allowed = 1;
  string reason = 2;
}

message RoleAssignment {
  string id = 1;
  string user_id = 2;
  string role_code = 3;
  ScopeType scope_type = 4;
  string scope_id = 5;
  string granted_by = 6;
  string granted_at = 7;
}

message GrantRoleRequest {
  string user_id = 1;
  string role_code = 2;
  ScopeType scope_type = 3;
  string scope_id = 4;
}

message GrantRoleResponse {
  RoleAssignment assignment = 1;
}

message RevokeRoleRequest {
  string assignment_id = 1;
  string reason = 2;
}

message RevokeRoleResponse {}

message Permission {
  string code = 1;
  string description = 2;
}

message RoleDefinition {
  string code = 1;
  ScopeType scope_type = 2;
  bool requires_mfa = 3;
  string description = 4;
  repeated string permissions = 5;
}

message RegisterCatalogRequest {
  string service = 1;
  int32 catalog_version = 2;
  repeated Permission permissions = 3;
  repeated RoleDefinition roles = 4;
}

message RegisterCatalogResponse {
  bool accepted = 1;
}

message GetCatalogRequest {
  // Vide : catalogue de tous les services.
  string service = 1;
}

message GetCatalogResponse {
  repeated Permission permissions = 1;
  repeated RoleDefinition roles = 2;
}
