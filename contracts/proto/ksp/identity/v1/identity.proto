syntax = "proto3";

package ksp.identity.v1;

// Contrats du service identity (cahier des charges Identité, partie 8). Trois services :
// - IdentityService : appelé par tous les services (informations utilisateur, permissions, catalogues) ;
// - AuthService et AccountService : réservés à la gateway, qui les expose en REST aux fronts.
//
// L'utilisateur connecté n'est jamais dans les messages : la gateway le transmet dans les
// métadonnées gRPC (x-user-id, x-session-id, x-active-context, x-user-roles, x-user-mfa,
// x-auth-time), avec l'adresse IP et l'appareil du client (x-client-ip, x-user-agent).
// Les dates sont des chaînes ISO 8601 en UTC.

// Appelé par tous les services autorisés par la carte des services.
service IdentityService {
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  rpc GetUsersByIds(GetUsersByIdsRequest) returns (GetUsersByIdsResponse);
  // Réservé aux actions sensibles : les permissions courantes voyagent dans le jeton.
  rpc CheckPermission(CheckPermissionRequest) returns (CheckPermissionResponse);
  rpc GrantRole(GrantRoleRequest) returns (GrantRoleResponse);
  rpc RevokeRole(RevokeRoleRequest) returns (RevokeRoleResponse);
  // Chaque service enregistre son catalogue de permissions et de rôles à chaque déploiement.
  rpc RegisterCatalog(RegisterCatalogRequest) returns (RegisterCatalogResponse);
  rpc GetCatalog(GetCatalogRequest) returns (GetCatalogResponse);
}

enum UserStatus {
  USER_STATUS_UNSPECIFIED = 0;
  USER_STATUS_PENDING_VERIFICATION = 1;
  USER_STATUS_ACTIVE = 2;
  USER_STATUS_LOCKED = 3;
  USER_STATUS_SUSPENDED = 4;
  USER_STATUS_DELETION_PENDING = 5;
  USER_STATUS_DELETED = 6;
}

enum ScopeType {
  SCOPE_TYPE_UNSPECIFIED = 0;
  // Interne à KSP, tout l'écosystème.
  SCOPE_TYPE_GLOBAL = 1;
  // Un métier (scope_id = nom du service, par exemple "recovery").
  SCOPE_TYPE_DOMAIN = 2;
  // Une organisation cliente (scope_id = identifiant de l'organisation).
  SCOPE_TYPE_ORG = 3;
  // Le compte de l'utilisateur lui-même.
  SCOPE_TYPE_PERSONAL = 4;
}

message User {
  string id = 1;
  UserStatus status = 2;
  string first_name = 3;
  string last_name = 4;
  // Renseigné uniquement si le service appelant en a besoin (par exemple delivery).
  string phone_e164 = 5;
  string email = 6;
  string preferred_language = 7;
  string created_at = 8;
}

message GetUserRequest {
  string user_id = 1;
}

message GetUserResponse {
  User user = 1;
}

message GetUsersByIdsRequest {
  repeated string user_ids = 1;
}

message GetUsersByIdsResponse {
  repeated User users = 1;
}

message CheckPermissionRequest {
  string user_id = 1;
  // Format <service>:<ressource>:<action>, par exemple "wallet:payout:approve".
  string permission = 2;
  ScopeType scope_type = 3;
  string scope_id = 4;
}

message CheckPermissionResponse {
  bool allowed = 1;
  string reason = 2;
}

message RoleAssignment {
  string id = 1;
  string user_id = 2;
  string role_code = 3;
  ScopeType scope_type = 4;
  string scope_id = 5;
  string granted_by = 6;
  string granted_at = 7;
}

message GrantRoleRequest {
  string user_id = 1;
  string role_code = 2;
  ScopeType scope_type = 3;
  string scope_id = 4;
}

message GrantRoleResponse {
  RoleAssignment assignment = 1;
}

message RevokeRoleRequest {
  string assignment_id = 1;
  string reason = 2;
}

message RevokeRoleResponse {}

message Permission {
  string code = 1;
  string description = 2;
}

message RoleDefinition {
  string code = 1;
  ScopeType scope_type = 2;
  bool requires_mfa = 3;
  string description = 4;
  repeated string permissions = 5;
}

message RegisterCatalogRequest {
  string service = 1;
  int32 catalog_version = 2;
  repeated Permission permissions = 3;
  repeated RoleDefinition roles = 4;
}

message RegisterCatalogResponse {
  bool accepted = 1;
}

message GetCatalogRequest {
  // Vide : catalogue de tous les services.
  string service = 1;
}

message GetCatalogResponse {
  repeated Permission permissions = 1;
  repeated RoleDefinition roles = 2;
}

// ---------------------------------------------------------------------------
// Connexion et sessions — réservé à la gateway.
//
// Erreurs (code AppError → statut gRPC) :
//   IDENTITY_PHONE_INVALID          INVALID_ARGUMENT    numéro mal formé, ou refusé par notification
//   IDENTITY_OTP_PURPOSE_INVALID    INVALID_ARGUMENT    objet du code non pris en charge
//   IDENTITY_CLIENT_KIND_INVALID    INVALID_ARGUMENT    type de client non précisé
//   IDENTITY_OTP_INVALID            INVALID_ARGUMENT    details.attemptsRemaining
//   IDENTITY_OTP_EXPIRED            FAILED_PRECONDITION code expiré ou déjà utilisé
//   IDENTITY_OTP_TOO_MANY_ATTEMPTS  FAILED_PRECONDITION code annulé, en demander un nouveau
//   IDENTITY_OTP_RATE_LIMITED       RESOURCE_EXHAUSTED  details.retryAfterSeconds (→ Retry-After)
//   IDENTITY_OTP_SEND_FAILED        UNAVAILABLE         notification n'a pu envoyer le code par aucun canal
//   IDENTITY_REFRESH_TOKEN_INVALID  UNAUTHENTICATED     jeton inconnu ou expiré
//   IDENTITY_REFRESH_TOKEN_REUSED   UNAUTHENTICATED     ancien jeton réutilisé : session révoquée
//   IDENTITY_SESSION_REVOKED        UNAUTHENTICATED
//   IDENTITY_ACCOUNT_SUSPENDED      PERMISSION_DENIED
//   IDENTITY_BACKOFFICE_FORBIDDEN   PERMISSION_DENIED   compte sans rôle du back-office
//
// Double authentification (UC-ID-09, comptes internes sur le back-office) :
//   IDENTITY_MFA_TOKEN_INVALID          UNAUTHENTICATED     jeton inconnu, expiré, déjà utilisé
//                                                           ou obtenu par un autre type de client
//   IDENTITY_MFA_METHOD_INVALID         INVALID_ARGUMENT    méthode non prise en charge
//   IDENTITY_MFA_CODE_INVALID           INVALID_ARGUMENT    details.attemptsRemaining
//   IDENTITY_MFA_CODE_REUSED            INVALID_ARGUMENT    code de l'application déjà utilisé,
//                                                           attendre le suivant (details.attemptsRemaining)
//   IDENTITY_MFA_TOO_MANY_ATTEMPTS      FAILED_PRECONDITION jeton annulé, recommencer la connexion
//   IDENTITY_MFA_ENROLLMENT_REQUIRED    FAILED_PRECONDITION application d'authentification à configurer
//   IDENTITY_MFA_ALREADY_ENROLLED       FAILED_PRECONDITION application déjà configurée
//   IDENTITY_MFA_ENROLLMENT_NOT_STARTED FAILED_PRECONDITION EnrollTotp doit précéder ConfirmTotp
//
// Prochains lots (ajout sans rupture) : RegisterWithEmail et VerifyEmail (UC-ID-02),
// LoginWithPassword (UC-ID-03), ForgotPassword et ResetPassword (UC-ID-06),
// ListSessions et RevokeSession (UC-ID-10), SwitchContext (UC-ID-15).
// ---------------------------------------------------------------------------
service AuthService {
  // UC-ID-01. Envoie un code par appel gRPC à notification (ADR-014).
  // La réponse est la même que le numéro soit connu ou non (anti-énumération).
  rpc RequestOtp(RequestOtpRequest) returns (RequestOtpResponse);
  // UC-ID-01. Vérifie le code ; crée le compte si le numéro est nouveau, puis ouvre une
  // session, ou demande la double authentification (compte interne sur le back-office).
  rpc VerifyOtp(VerifyOtpRequest) returns (VerifyOtpResponse);
  // UC-ID-04. Remplace le jeton de renouvellement à chaque appel. Un ancien jeton
  // réutilisé révoque toute la session (signe de vol).
  rpc RefreshSession(RefreshSessionRequest) returns (RefreshSessionResponse);
  // UC-ID-05. La session est celle des métadonnées (x-session-id).
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  // UC-ID-22. Clés publiques de signature des jetons d'accès. La gateway les garde en cache
  // et les publie elle-même sur /.well-known/jwks.json.
  rpc GetSigningKeys(GetSigningKeysRequest) returns (GetSigningKeysResponse);
  // UC-ID-09. Première connexion d'un compte interne (MfaChallenge.enrollment_required) :
  // crée le secret de l'application d'authentification (TOTP, RFC 6238). Le secret reste
  // inactif jusqu'à ConfirmTotp ; un nouvel appel le remplace. Refusé si une application est
  // déjà configurée : la remplacer relèvera de l'administration des comptes internes.
  rpc EnrollTotp(EnrollTotpRequest) returns (EnrollTotpResponse);
  // UC-ID-09. Active l'application par un premier code, remet les 10 codes de récupération
  // (affichés une seule fois) et ouvre la session.
  rpc ConfirmTotp(ConfirmTotpRequest) returns (ConfirmTotpResponse);
  // UC-ID-09. Seconde étape de connexion : code de l'application d'authentification ou code
  // de récupération, puis ouverture de la session. Un même code de l'application ne sert qu'une fois.
  rpc VerifyMfa(VerifyMfaRequest) returns (VerifyMfaResponse);
}

enum OtpChannel {
  OTP_CHANNEL_UNSPECIFIED = 0;
  OTP_CHANNEL_SMS = 1;
  OTP_CHANNEL_WHATSAPP = 2;
}

enum OtpPurpose {
  OTP_PURPOSE_UNSPECIFIED = 0;
  // Inscription ou connexion : même parcours (UC-ID-01).
  OTP_PURPOSE_LOGIN = 1;
}

// Type de client, qui fixe les règles de la session (cahier des charges Identité, partie 4) :
// web et mobile 30 jours prolongés à chaque usage et 5 sessions ; back-office 12 heures
// sans prolongation, 2 sessions et double authentification obligatoire.
enum ClientKind {
  CLIENT_KIND_UNSPECIFIED = 0;
  CLIENT_KIND_WEB = 1;
  // Application client et application livreur.
  CLIENT_KIND_MOBILE = 2;
  CLIENT_KIND_BACKOFFICE = 3;
}

enum MfaMethod {
  MFA_METHOD_UNSPECIFIED = 0;
  // Application d'authentification : méthode principale.
  MFA_METHOD_TOTP = 1;
  // Codes de récupération remis à l'activation.
  MFA_METHOD_RECOVERY_CODE = 2;
  // Jamais proposé à un compte interne : sa première étape est déjà un code par téléphone.
  MFA_METHOD_SMS = 3;
}

enum LogoutScope {
  LOGOUT_SCOPE_UNSPECIFIED = 0;
  LOGOUT_SCOPE_THIS_DEVICE = 1;
  LOGOUT_SCOPE_ALL_DEVICES = 2;
}

message RequestOtpRequest {
  string phone_e164 = 1;
  // Canal souhaité ; non précisé : WhatsApp, seul canal au lancement (ADR-021).
  // Bascule automatique sur l'autre canal si l'envoi échoue.
  OtpChannel channel = 2;
  OtpPurpose purpose = 3;
}

message RequestOtpResponse {
  // À renvoyer avec le code dans VerifyOtp.
  string challenge_id = 1;
  // Destinataire masqué, par exemple "+229 01 •• •• •• 45".
  string masked_target = 2;
  // Canal réellement utilisé, après une éventuelle bascule.
  OtpChannel channel = 3;
  int32 expires_in_seconds = 4;
  // Délai avant de pouvoir demander un nouveau code.
  int32 resend_after_seconds = 5;
}

message VerifyOtpRequest {
  string challenge_id = 1;
  string code = 2;
  ClientKind client_kind = 3;
  // Nom de l'appareil affiché dans la liste des sessions (UC-ID-10), par exemple
  // "Téléphone Android". Vide : déduit de x-user-agent.
  string device_label = 4;
}

message VerifyOtpResponse {
  AuthResult result = 1;
  // Le compte vient d'être créé par ce code.
  bool is_new_user = 2;
}

// Issue d'une étape de connexion : une session ouverte, ou la double authentification à passer.
message AuthResult {
  oneof outcome {
    SessionTokens session = 1;
    MfaChallenge mfa_required = 2;
  }
}

message SessionTokens {
  string access_token = 1;
  string access_token_expires_at = 2;
  // Transmis en clair une seule fois, jamais journalisé. La gateway le place dans un cookie
  // HttpOnly sur le web, ou le renvoie dans le corps de la réponse sur mobile (UC-GW-13).
  string refresh_token = 3;
  string refresh_token_expires_at = 4;
  string session_id = 5;
  User user = 6;
  // Le nom n'est pas encore renseigné : le front invite à le compléter (UC-ID-01).
  bool profile_incomplete = 7;
}

message MfaChallenge {
  // Jeton court (5 minutes), à usage unique, lié au compte et au type de client, qui prouve
  // que la première étape est passée. À présenter à EnrollTotp, ConfirmTotp ou VerifyMfa.
  // Jamais journalisé.
  string mfa_token = 1;
  string expires_at = 2;
  repeated MfaMethod methods = 3;
  // Première connexion d'un compte interne : l'application d'authentification doit être
  // configurée avant tout accès (UC-ID-09, UC-ID-18).
  bool enrollment_required = 4;
}

message RefreshSessionRequest {
  // Lu par la gateway dans le cookie (web) ou dans le corps de la requête (mobile).
  string refresh_token = 1;
}

message RefreshSessionResponse {
  SessionTokens session = 1;
}

message LogoutRequest {
  LogoutScope scope = 1;
}

message LogoutResponse {
  int32 revoked_sessions = 1;
}

message EnrollTotpRequest {
  string mfa_token = 1;
  // Celui de la connexion qui a obtenu le jeton.
  ClientKind client_kind = 2;
}

message EnrollTotpResponse {
  // Secret en base32 (RFC 4648, sans remplissage), à saisir à la main si le QR code ne peut
  // pas être lu. Transmis une seule fois, jamais journalisé.
  string secret = 1;
  // URI otpauth://totp/… à afficher en QR code.
  string otpauth_uri = 2;
  // "KSP"
  string issuer = 3;
  // Nom du compte affiché par l'application : le numéro de téléphone.
  string account_name = 4;
  // 6
  int32 digits = 5;
  // 30
  int32 period_seconds = 6;
}

message ConfirmTotpRequest {
  string mfa_token = 1;
  // Premier code affiché par l'application.
  string code = 2;
  ClientKind client_kind = 3;
}

message ConfirmTotpResponse {
  SessionTokens session = 1;
  // Les 10 codes de récupération, chacun utilisable une fois. Transmis en clair une seule
  // fois, jamais journalisés : seule leur empreinte est conservée.
  repeated string recovery_codes = 2;
}

message VerifyMfaRequest {
  string mfa_token = 1;
  // MFA_METHOD_TOTP ou MFA_METHOD_RECOVERY_CODE.
  MfaMethod method = 2;
  // Code de l'application (6 chiffres) ou code de récupération (tirets et espaces ignorés).
  string code = 3;
  ClientKind client_kind = 4;
}

message VerifyMfaResponse {
  SessionTokens session = 1;
  // Codes de récupération encore utilisables : le back-office prévient quand il en reste peu.
  int32 recovery_codes_remaining = 2;
}

message GetSigningKeysRequest {}

message GetSigningKeysResponse {
  // Clés en cours et clé suivante, publiées ensemble pendant une rotation.
  repeated SigningKey keys = 1;
}

// Clé publique au format JWK (RFC 7517), courbe P-256 pour ES256.
message SigningKey {
  string kid = 1;
  // "EC"
  string kty = 2;
  // "P-256"
  string crv = 3;
  string x = 4;
  string y = 5;
  // "ES256"
  string alg = 6;
  // "sig"
  string use = 7;
}

// ---------------------------------------------------------------------------
// Compte de l'utilisateur connecté — réservé à la gateway. L'utilisateur est toujours celui
// des métadonnées (x-user-id) : on ne lit ni ne modifie que son propre compte.
//
// Erreurs (code AppError → statut gRPC) :
//   IDENTITY_NAME_INVALID           INVALID_ARGUMENT    lettres seulement, 100 caractères au plus (details.field)
//   IDENTITY_LANGUAGE_INVALID       INVALID_ARGUMENT    code de deux lettres attendu
//   IDENTITY_PROFILE_EMPTY_UPDATE   INVALID_ARGUMENT    aucun champ à modifier
//   IDENTITY_USER_NOT_FOUND         NOT_FOUND           compte inexistant ou supprimé
//
// Prochains lots (ajout sans rupture) : ChangePhone (UC-ID-07), AddCredentials (UC-ID-08),
// RequestDeletion et CancelDeletion (UC-ID-11). Les organisations (UC-ID-12 à 16) et
// l'administration (UC-ID-18 à 21) auront leurs propres services.
// ---------------------------------------------------------------------------
service AccountService {
  rpc GetMe(GetMeRequest) returns (GetMeResponse);
  // Seuls les champs renseignés sont modifiés.
  rpc UpdateMe(UpdateMeRequest) returns (UpdateMeResponse);
}

message GetMeRequest {}

message GetMeResponse {
  User user = 1;
  bool profile_incomplete = 2;
}

message UpdateMeRequest {
  optional string first_name = 1;
  optional string last_name = 2;
  // Code de langue, "fr" par défaut.
  optional string preferred_language = 3;
}

message UpdateMeResponse {
  User user = 1;
  bool profile_incomplete = 2;
}
