syntax = "proto3";

package ksp.notification.v1;

// Envoi direct d'une notification. Utilisé pour les envois prioritaires dont l'appelant
// doit connaître le résultat immédiatement : codes de vérification d'identity (ADR-014)
// et codes de signature de document. Les autres notifications passent par les événements.
//
// Appelants autorisés : identity et document uniquement (jeton de service, ADR-013).
//
// Modèles utilisés par ces appels :
//   identity.otp   variables : code, expires_in_minutes. Modèle secret : l'historique des envois
//                  ne garde ni le texte ni les variables, seulement le destinataire masqué.
//   identity.email_verification
//                  canal CHANNEL_EMAIL seul, recipient.email obligatoire ; variables : code,
//                  expires_in_minutes. Code de confirmation de l'e-mail du profil. Modèle secret.
//
// Erreurs (code AppError → statut gRPC) :
//   NOTIFICATION_TEMPLATE_UNKNOWN     NOT_FOUND         modèle inexistant pour ce canal
//   NOTIFICATION_RECIPIENT_INVALID    INVALID_ARGUMENT  destinataire absent ou mal formé pour le canal
//   NOTIFICATION_CHANNELS_EXHAUSTED   UNAVAILABLE       tous les canaux ont échoué (details.channelsTried)
//   NOTIFICATION_VARIABLES_INVALID    INVALID_ARGUMENT  variables du modèle absentes ou mal formées
//                                                       (details.invalidVariables : noms seuls, jamais les valeurs)
//   NOTIFICATION_CALLER_FORBIDDEN     PERMISSION_DENIED service appelant non autorisé
//   NOTIFICATION_ALREADY_IN_PROGRESS  ALREADY_EXISTS    envoi en cours avec la même idempotency_key
//
// Le reste du contrat (appareils push, édition des modèles, notification en direct) sera écrit
// après le cahier des charges du service notification.
service NotificationService {
  rpc SendNotification(SendNotificationRequest) returns (SendNotificationResponse);
}

// Centre de notifications de l'espace KSP (ADR-039), réservé à la gateway : l'utilisateur est lu
// dans le contexte de la requête, chacun ne voit que ses propres notifications.
//
// Erreurs :
//   AUTH_REQUIRED                       UNAUTHENTICATED   aucun utilisateur dans le contexte
//   NOTIFICATION_VALIDATION_FAILED      INVALID_ARGUMENT  page, curseur ou identifiant mal formé
//   NOTIFICATION_NOT_FOUND              NOT_FOUND         notification inconnue ou d'un autre compte
service InAppNotificationService {
  // Les plus récentes d'abord ; unread_only pour les seules non lues.
  rpc ListMyNotifications(ListMyNotificationsRequest) returns (ListMyNotificationsResponse);
  // Nombre de notifications non lues (pastille de l'en-tête).
  rpc CountMyUnreadNotifications(CountMyUnreadNotificationsRequest)
    returns (CountMyUnreadNotificationsResponse);
  // Idempotent : une notification déjà lue garde sa date de lecture.
  rpc MarkNotificationRead(MarkNotificationReadRequest) returns (MarkNotificationReadResponse);
  rpc MarkAllNotificationsRead(MarkAllNotificationsReadRequest) returns (MarkAllNotificationsReadResponse);
  // Canaux souhaités pour les messages facultatifs (ADR-039) ; WhatsApp et e-mail par défaut.
  rpc GetMyNotificationPreferences(GetMyNotificationPreferencesRequest)
    returns (GetMyNotificationPreferencesResponse);
  rpc UpdateMyNotificationPreferences(UpdateMyNotificationPreferencesRequest)
    returns (UpdateMyNotificationPreferencesResponse);
}

// Back-office des notifications (ADR-039), réservé à la gateway : rôles super_admin et
// support_agent, double authentification faite pendant la session (12 heures au plus). Aucune
// donnée personnelle en clair : destinataire masqué, jamais le texte ni les variables d'un envoi.
//
// Erreurs :
//   AUTH_FORBIDDEN, AUTH_MFA_REQUIRED   PERMISSION_DENIED rôle ou double authentification manquant
//   NOTIFICATION_VALIDATION_FAILED      INVALID_ARGUMENT  filtre mal formé (details.field)
//   NOTIFICATION_NOT_FOUND              NOT_FOUND         envoi inconnu
service NotificationAdminService {
  // Historique des envois, les plus récents d'abord.
  rpc ListDeliveries(ListDeliveriesRequest) returns (ListDeliveriesResponse);
  rpc GetDelivery(GetDeliveryRequest) returns (GetDeliveryResponse);
  // Modèles de messages et leur texte, en lecture seule.
  rpc ListMessageTemplates(ListMessageTemplatesRequest) returns (ListMessageTemplatesResponse);
}

enum Channel {
  CHANNEL_UNSPECIFIED = 0;
  CHANNEL_SMS = 1;
  CHANNEL_WHATSAPP = 2;
  CHANNEL_EMAIL = 3;
  CHANNEL_PUSH = 4;
  CHANNEL_IN_APP = 5;
}

enum Priority {
  PRIORITY_UNSPECIFIED = 0;
  PRIORITY_NORMAL = 1;
  PRIORITY_HIGH = 2;
}

enum DeliveryStatus {
  DELIVERY_STATUS_UNSPECIFIED = 0;
  // Pris en charge par le prestataire ; la remise au destinataire n'est pas encore confirmée.
  DELIVERY_STATUS_ACCEPTED = 1;
  DELIVERY_STATUS_SENT = 2;
  DELIVERY_STATUS_FAILED = 3;
}

message Recipient {
  string user_id = 1;
  string phone_e164 = 2;
  string email = 3;
}

message SendNotificationRequest {
  // Modèle de message, par exemple "identity.otp".
  string template_code = 1;
  Channel channel = 2;
  // Canaux essayés dans l'ordre si le premier échoue (par exemple WhatsApp après SMS).
  repeated Channel fallback_channels = 3;
  Recipient recipient = 4;
  // Variables du modèle. Peuvent contenir un secret (code) : jamais journalisées.
  map<string, string> variables = 5;
  Priority priority = 6;
  // Deux appels avec la même clé ne produisent qu'un seul envoi ; le second reçoit la réponse
  // du premier. identity utilise l'identifiant de la demande de code.
  string idempotency_key = 7;
  // Langue du modèle, "fr" par défaut.
  string locale = 8;
  // Au-delà de ce délai après l'appel, le message n'est plus envoyé ni renvoyé (un code expiré
  // est inutile). 0 : pas de limite.
  int32 ttl_seconds = 9;
}

message SendNotificationResponse {
  string notification_id = 1;
  Channel channel_used = 2;
  DeliveryStatus status = 3;
}

message Page {
  // 20 par défaut, 100 au plus.
  int32 limit = 1;
  // Identifiant du dernier élément de la page précédente ; vide pour la première page.
  string cursor = 2;
}

// Notification de l'espace KSP. Dates ISO 8601 en UTC ; chaînes vides pour les valeurs absentes.
message InAppNotification {
  string id = 1;
  string template_code = 2;
  string title = 3;
  string body = 4;
  // Adresse de la page concernée de l'espace KSP ; vide s'il n'y en a pas.
  string link = 5;
  string created_at = 6;
  // Vide : pas encore lue.
  string read_at = 7;
}

message ListMyNotificationsRequest {
  Page page = 1;
  bool unread_only = 2;
}

message ListMyNotificationsResponse {
  repeated InAppNotification notifications = 1;
  string next_cursor = 2;
  int32 unread_count = 3;
}

message CountMyUnreadNotificationsRequest {}

message CountMyUnreadNotificationsResponse {
  int32 unread_count = 1;
}

message MarkNotificationReadRequest {
  string notification_id = 1;
}

message MarkNotificationReadResponse {
  InAppNotification notification = 1;
  int32 unread_count = 2;
}

message MarkAllNotificationsReadRequest {}

message MarkAllNotificationsReadResponse {
  // Notifications marquées lues par cet appel.
  int32 marked = 1;
  int32 unread_count = 2;
}

// Canaux souhaités pour les messages facultatifs. Les codes de connexion, les messages importants
// (impayés, suspension), ceux de la suppression du compte et ceux adressés aux équipes KSP partent
// toujours ; l'espace KSP reçoit toujours la notification.
message NotificationPreferences {
  bool whatsapp = 1;
  bool email = 2;
  // Vide : jamais modifiées (valeurs par défaut).
  string updated_at = 3;
}

message GetMyNotificationPreferencesRequest {}

message GetMyNotificationPreferencesResponse {
  NotificationPreferences preferences = 1;
}

message UpdateMyNotificationPreferencesRequest {
  bool whatsapp = 1;
  bool email = 2;
}

message UpdateMyNotificationPreferencesResponse {
  NotificationPreferences preferences = 1;
}

// Un envoi de l'historique (table notifications). Canaux : sms, whatsapp, email, push, in_app.
message Delivery {
  string id = 1;
  string template_code = 2;
  string requested_channel = 3;
  // Vide tant qu'aucun canal n'a abouti.
  string channel_used = 4;
  // Canaux considérés, dans l'ordre (sautés compris).
  repeated string channels_tried = 5;
  // Destinataire masqué (+229********45) ; vide après l'effacement du compte.
  string target_masked = 6;
  // Vide pour un envoi sans compte, ou après l'effacement du compte (ADR-036).
  string recipient_user_id = 7;
  // pending, accepted ou failed.
  string status = 8;
  string error_code = 9;
  // Cause de l'échec (recipient_invalid, provider_unavailable, provider_rejected…).
  string failure_reason = 10;
  // Identifiant du message chez le prestataire (wamid… pour WhatsApp, messageId pour Brevo).
  string provider_message_id = 11;
  string created_at = 12;
  string expires_at = 13;
  string accepted_at = 14;
  string failed_at = 15;
  // Historique détaché d'un compte supprimé (ADR-036).
  bool erased = 16;
}

message ListDeliveriesRequest {
  Page page = 1;
  string template_code = 2;
  // Canal essayé (sms, whatsapp, email, push, in_app).
  string channel = 3;
  // pending, accepted ou failed.
  string status = 4;
  // Période d'envoi, dates AAAA-MM-JJ à l'heure du Bénin, bornes incluses.
  string from = 5;
  string to = 6;
  string recipient_user_id = 7;
}

message ListDeliveriesResponse {
  repeated Delivery deliveries = 1;
  string next_cursor = 2;
}

message GetDeliveryRequest {
  string delivery_id = 1;
}

message GetDeliveryResponse {
  Delivery delivery = 1;
}

message MessageTemplate {
  string code = 1;
  // direct (appel d'un service : codes), short, document ou important (règle de choix du canal).
  string kind = 2;
  repeated string channels = 3;
  // Modèle secret (codes) : ni le texte ni les variables d'un envoi ne sont conservés.
  bool secret = 4;
  // Message facultatif : soumis aux préférences du destinataire.
  bool optional = 5;
  repeated string variables = 6;
  repeated string optional_variables = 7;
  // Texte rendu avec le nom des variables entre accolades ; vides pour un texte rédigé chez le
  // prestataire (modèle WhatsApp approuvé par Meta).
  string subject = 8;
  string text = 9;
}

message ListMessageTemplatesRequest {}

message ListMessageTemplatesResponse {
  repeated MessageTemplate templates = 1;
}
