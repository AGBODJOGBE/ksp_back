  // Règle à essayer (brouillon compris) ; vide = règle publiée applicable à la cible.
  string rule_id = 1;
  string object = 2;
  PricingTarget target = 3;
  // Montant de base : montant dû (frais de dossier) ou encaissement (commission).
  ksp.common.v1.Money base_amount = 4;
  // Étape atteinte (commission par étape).
  string stage = 5;
}

message PricingLine {
  string label = 1;
