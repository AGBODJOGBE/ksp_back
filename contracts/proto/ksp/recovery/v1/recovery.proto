// ---------------------------------------------------------------------------------------------
// Tarification (ADR-062)
// ---------------------------------------------------------------------------------------------

message PricingTier {
  // Borne haute de la tranche, incluse ; absente = sans limite (dernière tranche seulement).
  ksp.common.v1.Money up_to = 1;
  int32 rate_bps = 2;
  ksp.common.v1.Money fixed_amount = 3;
}

message StageRate {
  // "amicable" (notification, échéancier, relance), "formal_notice", "litigation" (huissier et
  // judiciaire).
  string stage_group = 1;
  int32 rate_bps = 2;
}

message PricingTarget {
  // "b2b", "b2c", "rent" ou "any".
  string offer = 1;
  // Clé de commune, vide = toutes.
  string commune_key = 2;
  // Tarif négocié pour un client précis, vide sinon.
  Party creditor = 3;
}

message PricingRule {
  string id = 1;
  // "case_fee", "recovery_commission" ou "study_fee".
  string object = 2;
  // "fixed", "percentage", "tiered" ou "by_stage". "tiered" : pour la commission, calcul progressif
  // sur le cumul encaissé du dossier (chaque part au taux de sa tranche, la commission d'un
  // encaissement est celle du cumul après lui moins celle du cumul avant lui) ; pour les frais de
  // dossier, montant fixe de la tranche où tombe le montant dû (ADR-062). Une règle "tiered" porte soit des taux (rate_bps), soit des montants (fixed_amount), le même
  // choix pour toutes ses tranches. Modes admis par objet : case_fee "fixed" ou "tiered" en
  // montants ; study_fee "fixed" ; recovery_commission "fixed", "percentage", "tiered" en taux ou
  // "by_stage" (RECOVERY_PRICING_RULE_INVALID sinon).
  string mode = 3;
  ksp.common.v1.Money fixed_amount = 4;
  // Taux du mode "percentage" ; -1 = absent (autres modes).
  int32 rate_bps = 5;
  repeated PricingTier tiers = 6;
  repeated StageRate stage_rates = 7;
  // Bornes facultatives (absentes = sans borne). Commission : maximum par encaissement, minimum au
  // cumul du dossier (complété sur les encaissements suivants). Frais et forfait : montant calculé.
  ksp.common.v1.Money minimum = 8;
  ksp.common.v1.Money maximum = 9;
  PricingTarget target = 10;
  string valid_from = 11;
  string valid_until = 12;
  int32 version = 13;
  // "draft", "pending_approval", "published", "archived".
  string status = 14;
  string label = 15;
  Actor created_by = 16;
  Actor approved_by = 17;
  string published_at = 18;
  // Règle dont celle-ci est la nouvelle version, vide pour une première version.
  string previous_version_id = 19;
}

message PricingRuleInput {
  string object = 1;
  string mode = 2;
  ksp.common.v1.Money fixed_amount = 3;
  int32 rate_bps = 4;
  repeated PricingTier tiers = 5;
  repeated StageRate stage_rates = 6;
  // Bornes facultatives, comme PricingRule.minimum et maximum.
  ksp.common.v1.Money minimum = 7;
  ksp.common.v1.Money maximum = 8;
  PricingTarget target = 9;
  string valid_from = 10;
  string valid_until = 11;
  string label = 12;
  // Nouvelle version d'une règle publiée, vide pour une nouvelle règle.
  string previous_version_id = 13;
}

message ListPricingRulesRequest {
  string object = 1;
  repeated string statuses = 2;
  string offer = 3;
  string creditor_id = 4;
  Page page = 5;
}

message ListPricingRulesResponse {
  repeated PricingRule rules = 1;
  string next_cursor = 2;
}

