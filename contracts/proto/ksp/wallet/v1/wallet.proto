syntax = "proto3";

package ksp.wallet.v1;

import "ksp/common/v1/money.proto";

// Contrats du service wallet : grand livre en double entrée des fonds que KSP détient pour le
// compte de ses clients (créanciers du Recouvrement), ADR-042, et portefeuille prépayé de chaque
// client (ADR-046) : rechargé par Mobile Money, débité par les services (Nettoyage, factures).
//
// - WalletService : opérations des services métier (recovery au lancement, WALLET_LEDGER_CALLERS ;
//   jeton de service obligatoire) : encaissement crédité au titulaire avec prélèvement de la
//   commission, reversement demandé depuis le solde, annulation d'un encaissement par écriture
//   inverse, solde et relevé d'un titulaire.
//   Portefeuille prépayé (ADR-046, WALLET_DEBIT_CALLERS : cleaning et billing au lancement) : débit
//   pour le paiement d'un service, remboursement d'un débit, lecture du solde.
// - WalletAccountService : espace du titulaire connecté (son compte, ou son organisation active),
//   dont la recharge de son portefeuille prépayé.
// - WalletAdminService : back-office (finance_officer, super_admin, double authentification), dont
//   le crédit manuel d'un portefeuille prépayé (remboursement, recharge reçue non créditée).
//
// Règles :
// - écritures immuables : une transaction équilibrée (débits = crédits) ne se modifie jamais, une
//   erreur se corrige par une écriture inverse ; aucun solde n'est saisi, il découle des écritures ;
// - montants entiers en XOF ; commission = taux en points de base (1 250 = 12,5 %), arrondie à
//   l'entier inférieur (KSP ne prélève jamais plus que le taux) ;
// - idempotence par référence (encaissement, annulation) ou clé (reversement), propre à l'appelant ;
// - un reversement ne dépasse jamais le solde disponible ; il est exécuté par payment
//   (PayoutService) et soldé à la réception de payment.payout.completed ou payment.payout.failed.
//
// Comptes : un compte par titulaire ("user" ou "organization"), et les comptes internes de KSP :
// "ksp:collections" (fonds encaissés et détenus par KSP), "ksp:commission" (commissions acquises),
// "ksp:payouts_in_transit" (reversements demandés, pas encore confirmés).
//
// Portefeuille prépayé (ADR-046) : un second compte par titulaire, distinct du précédent, dépensable
// et jamais reversé ; son solde n'est jamais négatif (contrôlé sous verrou, puis par la base).
// Comptes internes : "ksp:prepaid_funds" (recharges reçues par Mobile Money) et
// "ksp:service_revenue" (services payés depuis un portefeuille). Un débit n'est jamais partiel.
//
// L'utilisateur connecté n'est jamais dans les messages : la gateway le transmet dans les
// métadonnées gRPC. Dates ISO 8601 en UTC (chaîne vide = absente).
//
// Erreurs (code AppError → statut gRPC) :
//   WALLET_VALIDATION_FAILED             INVALID_ARGUMENT    details.field
//   WALLET_TRANSACTION_NOT_FOUND         NOT_FOUND           transaction inconnue
//   WALLET_PAYOUT_NOT_FOUND              NOT_FOUND           reversement inconnu
//   WALLET_INSUFFICIENT_BALANCE          FAILED_PRECONDITION solde disponible inférieur au reversement demandé
//   WALLET_INSUFFICIENT_FUNDS            FAILED_PRECONDITION solde prépayé inférieur au débit demandé ;
//                                                            details.balance et details.missing (montant manquant)
//   WALLET_DEBIT_REFUNDED                FAILED_PRECONDITION débit rejoué (même clé) déjà remboursé : nouvelle clé
//   WALLET_TRANSACTION_NOT_REVERSIBLE    FAILED_PRECONDITION seul un encaissement s'annule par cette méthode
//   WALLET_IDEMPOTENCY_KEY_REUSED        ALREADY_EXISTS      référence ou clé déjà utilisée pour une autre opération
//   WALLET_TRANSACTION_ALREADY_REVERSED  ALREADY_EXISTS      encaissement déjà annulé (par une autre demande)
//   WALLET_TOP_UP_NOT_VERIFIED           FAILED_PRECONDITION crédit manuel d'une recharge non confirmé par payment
//                                                            (paiement inconnu, autre titulaire, pas reçu,
//                                                            montant au-delà du reçu) ; details.reason (ADR-048)
//   WALLET_CREDIT_LIMIT_EXCEEDED         FAILED_PRECONDITION remboursement manuel au-delà du plafond ; details.maximum
//   WALLET_CREDIT_REQUEST_NOT_FOUND      NOT_FOUND           demande de crédit manuel inconnue
//   WALLET_APPROVAL_BY_REQUESTER         PERMISSION_DENIED   validation d'un crédit par l'auteur de sa demande
//   WALLET_CALLER_FORBIDDEN              PERMISSION_DENIED   méthode réservée à un autre service (méthodes du
//                                                            titulaire et du back-office : gateway seulement)
//   AUTH_REQUIRED                        UNAUTHENTICATED
//   AUTH_FORBIDDEN                       PERMISSION_DENIED   rôle du back-office manquant ; membre lecteur (org_viewer)
//   AUTH_MFA_REQUIRED                    PERMISSION_DENIED   double authentification absente

// Opérations des services métier (recovery), jeton de service obligatoire.
service WalletService {
  // Encaissement reçu pour un titulaire : le net lui est crédité, la commission revient à KSP.
  rpc RecordCollection(RecordCollectionRequest) returns (RecordCollectionResponse);
  // Reversement du solde vers un compte Mobile Money : montant retenu, puis exécuté par payment.
  rpc RequestPayout(RequestPayoutRequest) returns (RequestPayoutResponse);
  // Annulation d'un encaissement par écriture inverse (encaissement enregistré à tort, remboursé…).
  rpc ReverseTransaction(ReverseTransactionRequest) returns (ReverseTransactionResponse);
  rpc GetBalance(GetBalanceRequest) returns (GetBalanceResponse);
  rpc ListStatement(ListStatementRequest) returns (ListStatementResponse);
  // Portefeuille prépayé (ADR-046), services de WALLET_DEBIT_CALLERS : paiement d'un service débité
  // du portefeuille (jamais partiel, jamais au-delà du solde), idempotent par (appelant, clé).
  rpc Debit(DebitRequest) returns (DebitResponse);
  // Remboursement d'un débit de l'appelant : écriture inverse, le montant est recrédité (une fois).
  rpc Refund(RefundRequest) returns (RefundResponse);
  rpc GetPrepaidBalance(GetPrepaidBalanceRequest) returns (GetPrepaidBalanceResponse);
}

// Espace du titulaire connecté : son compte (contexte personnel) ou son organisation active.
service WalletAccountService {
  rpc GetMyWallet(GetMyWalletRequest) returns (GetMyWalletResponse);
  rpc ListMyStatement(ListMyStatementRequest) returns (ListMyStatementResponse);
  rpc ListMyPayouts(ListMyPayoutsRequest) returns (ListMyPayoutsResponse);
  // Recharge du portefeuille prépayé par Mobile Money (ADR-046) : page de paiement créée par payment ;
  // le portefeuille est crédité à la confirmation du paiement (payment.intent.succeeded).
  rpc CreateTopUp(CreateTopUpRequest) returns (CreateTopUpResponse);
}

// Back-office : finance_officer, super_admin, avec double authentification.
service WalletAdminService {
  rpc GetHolderWallet(GetHolderWalletRequest) returns (GetHolderWalletResponse);
  rpc ListHolderStatement(ListHolderStatementRequest) returns (ListHolderStatementResponse);
  rpc ListWalletPayouts(ListWalletPayoutsRequest) returns (ListWalletPayoutsResponse);
  // Soldes des comptes internes de KSP et total dû aux titulaires.
  rpc GetLedgerOverview(GetLedgerOverviewRequest) returns (GetLedgerOverviewResponse);
  // Crédit manuel d'un portefeuille prépayé avec motif (ADR-046) : remboursement, ou recharge reçue
  // mais non créditée (écart de montant traité par la finance). Auteur gardé dans le grand livre.
  // Contrôles (ADR-048) : une recharge est vérifiée auprès de payment (paiement "wallet_top_up" du
  // même titulaire, réussi ou en écart de montant, montant au plus égal au montant reçu) ; un
  // remboursement est plafonné (WALLET_MANUAL_REFUND_MAX) et justifié (motif de 15 caractères au
  // moins). Au-delà de WALLET_CREDIT_APPROVAL_THRESHOLD, le crédit attend la validation d'un second
  // membre de la finance : rien n'est écrit, la demande est rendue dans pending_request.
  rpc CreditPrepaidWallet(CreditPrepaidWalletRequest) returns (CreditPrepaidWalletResponse);
  // Demandes de crédit manuel en attente de validation (ou validées), les plus récentes d'abord.
  rpc ListManualCreditRequests(ListManualCreditRequestsRequest) returns (ListManualCreditRequestsResponse);
  // Validation par un second membre de la finance (jamais l'auteur de la demande) : le crédit est
  // écrit. Rejouable : une demande déjà validée rend son crédit.
  rpc ApproveManualCredit(ApproveManualCreditRequest) returns (ApproveManualCreditResponse);
}

message Page {
  // 20 par défaut, 100 au plus.
  int32 limit = 1;
  string cursor = 2;
}

// Titulaire d'un compte : un compte KSP ("user") ou une organisation ("organization").
message Holder {
  string type = 1;
  // UUID du compte ou de l'organisation (identity).
  string id = 2;
}

message Wallet {
  Holder holder = 1;
  // Solde disponible (crédits - débits). Négatif seulement après l'annulation d'un encaissement
  // déjà reversé : KSP a alors trop reversé, aucun reversement n'est possible avant régularisation.
  ksp.common.v1.Money balance = 2;
  // Reversements demandés, pas encore terminés (déjà déduits du solde).
  ksp.common.v1.Money payouts_in_progress = 3;
  // Cumul des encaissements nets crédités (annulations déduites) et des reversements terminés.
  ksp.common.v1.Money total_collected = 4;
  ksp.common.v1.Money total_paid_out = 5;
  // Dernière écriture, vide si le compte n'en a aucune.
  string last_entry_at = 6;
  // Portefeuille prépayé du même titulaire (ADR-046), distinct du solde ci-dessus.
  PrepaidWallet prepaid = 7;
}

// Portefeuille prépayé d'un titulaire (ADR-046) : dépensable sur la plateforme, jamais négatif.
message PrepaidWallet {
  Holder holder = 1;
  ksp.common.v1.Money balance = 2;
  // Dernière écriture, vide si le portefeuille n'en a aucune.
  string last_entry_at = 3;
}

// Objet payé par un débit du portefeuille prépayé, chez le service appelant.
message ObjectReference {
  // Service appelant (jeton de service) ; renseigné par wallet, ignoré dans une demande.
  string service = 1;
  // Type d'objet du service ("cleaning_mission", "billing_invoice"…) : minuscules, chiffres et "_",
  // 3 à 50 caractères.
  string object_type = 2;
  // UUID de l'objet chez l'appelant.
  string object_id = 3;
  // Part payée (par exemple "deposit" ou "balance"), vide sinon.
  string part = 4;
}

// Une ligne du relevé d'un titulaire (une écriture sur son compte), les plus récentes d'abord.
message StatementLine {
  string transaction_id = 1;
  // "collection" (encaissement), "payout" (reversement retenu), "payout_release" (reversement en
  // échec : montant rendu) ou "reversal" (annulation d'un encaissement).
  string kind = 2;
  // "credit" (en faveur du titulaire) ou "debit".
  string direction = 3;
  ksp.common.v1.Money amount = 4;
  // Solde du titulaire après cette écriture.
  ksp.common.v1.Money balance_after = 5;
  // Référence de l'opération chez l'appelant (par exemple le paiement encaissé).
  string reference = 6;
  string description = 7;
  // Encaissement (et son annulation) : montant brut, commission prélevée, taux en points de base.
  ksp.common.v1.Money gross_amount = 8;
  ksp.common.v1.Money commission = 9;
  int32 commission_rate_bps = 10;
  // Reversement : son identifiant wallet et son statut.
  string payout_id = 11;
  string payout_status = 12;
  // Annulation : encaissement annulé ; remboursement : débit remboursé.
  string reverses_transaction_id = 13;
  string created_at = 14;
  // Compte de la ligne : "collections" (fonds dus au titulaire, ADR-042) ou "prepaid" (portefeuille
  // prépayé, ADR-046, kind "top_up" : recharge, "service_payment" : paiement d'un service, "refund" :
  // remboursement).
  string account = 15;
  // Paiement d'un service et son remboursement : objet payé.
  ObjectReference object = 16;
}

message StatementPage {
  repeated StatementLine lines = 1;
  string next_cursor = 2;
}

// Écriture d'une transaction : compte, sens, montant.
message LedgerEntry {
  // "holder:user:<id>", "holder:organization:<id>", "ksp:collections", "ksp:commission" ou
  // "ksp:payouts_in_transit" ; portefeuille prépayé (ADR-046) : "prepaid:user:<id>",
  // "prepaid:organization:<id>", "ksp:prepaid_funds" ou "ksp:service_revenue".
  string account = 1;
  // "debit" ou "credit".
  string direction = 2;
  ksp.common.v1.Money amount = 3;
}

message LedgerTransaction {
  string id = 1;
  // "collection", "payout_hold", "payout_settlement", "payout_release" ou "reversal" ;
  // portefeuille prépayé (ADR-046) : "top_up", "service_payment" ou "refund".
  string kind = 2;
  // Référence d'idempotence de l'appelant.
  string reference = 3;
  Holder holder = 4;
  // Montant pour le titulaire : net crédité (encaissement), montant retenu ou rendu, ou annulé.
  ksp.common.v1.Money amount = 5;
  ksp.common.v1.Money gross_amount = 6;
  ksp.common.v1.Money commission = 7;
  int32 commission_rate_bps = 8;
  string description = 9;
  string reverses_transaction_id = 10;
  string created_at = 11;
  // Écritures équilibrées (somme des débits = somme des crédits).
  repeated LedgerEntry entries = 12;
  // Paiement d'un service et son remboursement : objet payé.
  ObjectReference object = 13;
}

// Bénéficiaire d'un reversement par Mobile Money.
message PayoutBeneficiary {
  // Numéro E.164 (+229…).
  string phone = 1;
  // "mtn", "moov" ou "celtiis".
  string operator = 2;
  // Nom du titulaire du compte Mobile Money, 1 à 120 caractères.
  string name = 3;
}

message WalletPayout {
  string id = 1;
  Holder holder = 2;
  ksp.common.v1.Money amount = 3;
  // "pending_submission" (pas encore transmis à payment, nouvel essai automatique), "submitted",
  // "completed" ou "failed" (montant rendu au solde).
  string status = 4;
  // Reversement chez payment, vide tant qu'il n'est pas transmis.
  string payment_payout_id = 5;
  string beneficiary_operator = 6;
  // Numéro masqué (seuls les deux derniers chiffres) : wallet ne garde le numéro complet que
  // jusqu'à sa transmission à payment.
  string beneficiary_phone_masked = 7;
  string hold_transaction_id = 8;
  // Transaction qui l'a soldé (terminé ou rendu), vide en cours.
  string settlement_transaction_id = 9;
  string created_at = 10;
  string updated_at = 11;
  string completed_at = 12;
  string failed_at = 13;
}

message RecordCollectionRequest {
  Holder holder = 1;
  // Montant encaissé, entier en XOF (1 à 1 000 000 000).
  ksp.common.v1.Money gross_amount = 2;
  // Commission de KSP en points de base (0 à 10 000 : 1 250 = 12,5 %), fournie par l'appelant.
  int32 commission_rate_bps = 3;
  // Référence d'idempotence (1 à 100 caractères : lettres, chiffres, ":", "_", "-"), par exemple
  // "payment:<id du paiement>" : une seconde demande identique renvoie la même transaction.
  string reference = 4;
  // Libellé du relevé, 1 à 140 caractères (aucune donnée personnelle du débiteur).
  string description = 5;
}

message RecordCollectionResponse {
  LedgerTransaction transaction = 1;
  Wallet wallet = 2;
  // false : encaissement déjà enregistré avec cette référence.
  bool created = 3;
}

message RequestPayoutRequest {
  // Obligatoire (8 à 100 caractères : lettres, chiffres, "_" et "-"), propre à l'appelant.
  string idempotency_key = 1;
  Holder holder = 2;
  // Entier en XOF, 1 à 1 000 000 000, au plus le solde disponible.
  ksp.common.v1.Money amount = 3;
  PayoutBeneficiary beneficiary = 4;
}

message RequestPayoutResponse {
  WalletPayout payout = 1;
  Wallet wallet = 2;
  // false : reversement déjà demandé avec cette clé.
  bool created = 3;
}

message ReverseTransactionRequest {
  // Encaissement à annuler.
  string transaction_id = 1;
  // Raison, 1 à 200 caractères (aucune donnée personnelle).
  string reason = 2;
  // Référence d'idempotence de l'annulation (même format que pour un encaissement).
  string reference = 3;
}

message ReverseTransactionResponse {
  LedgerTransaction transaction = 1;
  Wallet wallet = 2;
  // false : annulation déjà enregistrée avec cette référence.
  bool created = 3;
}

message GetBalanceRequest {
  Holder holder = 1;
}

message GetBalanceResponse {
  Wallet wallet = 1;
}

message ListStatementRequest {
  Holder holder = 1;
  Page page = 2;
}

message ListStatementResponse {
  StatementPage statement = 1;
}

message GetMyWalletRequest {}

message GetMyWalletResponse {
  Wallet wallet = 1;
  // Montants de recharge acceptés (réglables), pour le formulaire du portail.
  TopUpLimits top_up_limits = 2;
}

message TopUpLimits {
  ksp.common.v1.Money min = 1;
  ksp.common.v1.Money max = 2;
}

message ListMyStatementRequest {
  Page page = 1;
  // Filtre facultatif : "collections" ou "prepaid" ; vide : les deux, les plus récentes d'abord.
  string account = 2;
}

message ListMyStatementResponse {
  StatementPage statement = 1;
}

message ListMyPayoutsRequest {
  Page page = 1;
  // Filtre facultatif : "pending_submission", "submitted", "completed" ou "failed".
  string status = 2;
}

message ListMyPayoutsResponse {
  repeated WalletPayout payouts = 1;
  string next_cursor = 2;
}

message GetHolderWalletRequest {
  Holder holder = 1;
}

message GetHolderWalletResponse {
  Wallet wallet = 1;
}

message ListHolderStatementRequest {
  Holder holder = 1;
  Page page = 2;
  // Filtre facultatif : "collections" ou "prepaid" ; vide : les deux.
  string account = 3;
}

message ListHolderStatementResponse {
  StatementPage statement = 1;
}

message ListWalletPayoutsRequest {
  Page page = 1;
  // Filtres facultatifs.
  string status = 2;
  Holder holder = 3;
}

message ListWalletPayoutsResponse {
  repeated WalletPayout payouts = 1;
  string next_cursor = 2;
}

message GetLedgerOverviewRequest {}

message AccountBalance {
  // "ksp:collections", "ksp:commission", "ksp:payouts_in_transit", "ksp:prepaid_funds" ou
  // "ksp:service_revenue".
  string account = 1;
  // Solde dans le sens naturel du compte (positif en temps normal).
  ksp.common.v1.Money balance = 2;
}

message GetLedgerOverviewResponse {
  repeated AccountBalance internal_accounts = 1;
  // Somme des soldes des titulaires (ce que KSP leur doit).
  ksp.common.v1.Money owed_to_holders = 2;
  int32 holders_count = 3;
  // Somme des portefeuilles prépayés (ce que KSP doit encore en services) et leur nombre (ADR-046).
  ksp.common.v1.Money owed_to_customers = 4;
  int32 customers_count = 5;
}

message DebitRequest {
  // Obligatoire (8 à 150 caractères : lettres, chiffres, ":", "_" et "-"), propre à l'appelant : une
  // seconde demande identique renvoie le même débit ; une demande différente est refusée.
  string idempotency_key = 1;
  // Titulaire débité : le client ("user") ou son organisation ("organization").
  Holder holder = 2;
  // Entier en XOF, 1 à 1 000 000 000 ; jamais de débit partiel.
  ksp.common.v1.Money amount = 3;
  // Objet payé chez l'appelant.
  ObjectReference object = 4;
  // Libellé du relevé, 1 à 140 caractères (par exemple « Nettoyage de maison — acompte »).
  string description = 5;
}

message DebitResponse {
  LedgerTransaction transaction = 1;
  PrepaidWallet wallet = 2;
  // false : débit déjà enregistré avec cette clé.
  bool created = 3;
}

message RefundRequest {
  // Débit (paiement d'un service) de l'appelant, remboursé en entier.
  string transaction_id = 1;
  // Raison, 1 à 200 caractères (aucune donnée personnelle), visible dans le relevé.
  string reason = 2;
}

message RefundResponse {
  LedgerTransaction transaction = 1;
  PrepaidWallet wallet = 2;
  // false : débit déjà remboursé (le même remboursement est renvoyé).
  bool created = 3;
}

message GetPrepaidBalanceRequest {
  Holder holder = 1;
}

message GetPrepaidBalanceResponse {
  PrepaidWallet wallet = 1;
}

message CreateTopUpRequest {
  // Clé d'idempotence (en-tête Idempotency-Key), 8 à 100 caractères.
  string idempotency_key = 1;
  // Entier en XOF, entre les limites de recharge (WALLET_TOP_UP_MIN et WALLET_TOP_UP_MAX).
  ksp.common.v1.Money amount = 2;
}

message CreateTopUpResponse {
  TopUp top_up = 1;
  // false : recharge déjà demandée avec cette clé, ou page encore ouverte réutilisée.
  bool created = 2;
}

// Recharge : paiement Mobile Money créé par payment (objet "wallet_top_up").
message TopUp {
  // Paiement chez payment, suivi par GET /api/v1/payment/payments/{id}.
  string payment_id = 1;
  Holder holder = 2;
  ksp.common.v1.Money amount = 3;
  // Statut du paiement : "pending", "succeeded", "failed", "cancelled", "expired" ou
  // "amount_mismatch".
  string status = 4;
  // Page de paiement du prestataire ; vide si elle n'a pas pu être créée (réessayer, même clé).
  string checkout_url = 5;
  string expires_at = 6;
}

message CreditPrepaidWalletRequest {
  // Obligatoire (en-tête Idempotency-Key), 8 à 100 caractères.
  string idempotency_key = 1;
  Holder holder = 2;
  // "refund" (remboursement d'un service, geste commercial) ou "top_up" (recharge reçue par Mobile
  // Money mais non créditée : écart de montant traité par la finance ; payment_id obligatoire, un
  // seul crédit par paiement, automatique ou manuel).
  string kind = 3;
  ksp.common.v1.Money amount = 4;
  // Motif, 1 à 200 caractères, visible dans le relevé du client.
  string reason = 5;
  string payment_id = 6;
}

message CreditPrepaidWalletResponse {
  // Absent tant que le crédit attend sa validation (pending_request).
  LedgerTransaction transaction = 1;
  PrepaidWallet wallet = 2;
  // false : crédit déjà enregistré avec cette clé (ou ce paiement), ou demande déjà enregistrée.
  bool created = 3;
  // Crédit au-delà du seuil de double validation (ADR-048) : demande en attente d'un second membre de
  // la finance ; absente sinon.
  ManualCreditRequest pending_request = 4;
}

// Demande de crédit manuel soumise à double validation (ADR-048).
message ManualCreditRequest {
  string id = 1;
  Holder holder = 2;
  // "refund" ou "top_up".
  string kind = 3;
  ksp.common.v1.Money amount = 4;
  string reason = 5;
  // Recharge : paiement crédité ; vide sinon.
  string payment_id = 6;
  // "pending_approval" ou "approved".
  string status = 7;
  string requested_by = 8;
  string requested_at = 9;
  // Vides tant qu'elle n'est pas validée.
  string approved_by = 10;
  string approved_at = 11;
  string transaction_id = 12;
}

message ListManualCreditRequestsRequest {
  Page page = 1;
  // "pending_approval" ou "approved" ; vide : toutes.
  string status = 2;
}

message ListManualCreditRequestsResponse {
  repeated ManualCreditRequest requests = 1;
  string next_cursor = 2;
}

message ApproveManualCreditRequest {
  string request_id = 1;
}

message ApproveManualCreditResponse {
  LedgerTransaction transaction = 1;
  PrepaidWallet wallet = 2;
  ManualCreditRequest request = 3;
  // false : demande déjà validée (le même crédit est rendu).
  bool created = 4;
}
