                  id: 0192f1c4-7a2b-7c3d-8e4f-5a6b7c8d7100
                sha256: 87b47ba21363c6f263abb57eaea8ad8204222a0c1da0ec1a5a37087adf5eb12e
                sizeBytes: 16188
                signedSha256: null
                createdAt: 2026-11-09T10:00:00Z
