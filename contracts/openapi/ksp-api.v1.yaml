        recurrence:
          oneOf:
            - $ref: '#/components/schemas/CleaningRecurrence'
            - type: 'null'
        teamSize:
          type: integer
          minimum: 1
        durationMinutes:
          type: integer
          minimum: 1
        sentAt:
          type: string
          format: date-time
    CleaningQuoteRequest:
      type: object
      additionalProperties: false
      required:
        - id
