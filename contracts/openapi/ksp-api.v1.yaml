          type: array
          maxItems: 100
          items:
            type: string
            pattern: ^[a-z][a-z0-9_]{1,49}$
    ReportCleaningIncidentRequest:
      type: object
      additionalProperties: false
      required:
        - note
      properties:
        note:
          type: string
          minLength: 1
          maxLength: 2000
    SaveCleaningServiceRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - unit
        - active
        - pricing
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          minLength: 0
          maxLength: 1000
        unit:
          $ref: '#/components/schemas/CleaningUnit'
        active:
          type: boolean
        pricing:
          type: object
          additionalProperties: false
          required:
            - unitPrice
            - minimumPrice
          properties:
            unitPrice:
              type:
                - integer
                - 'null'
              minimum: 0
            minimumPrice:
              type:
                - integer
                - 'null'
              minimum: 0
            options:
              type: array
              items:
                type: object
                additionalProperties: false
                required:
                  - code
                  - label
                  - price
                properties:
                  code:
                    type: string
                    pattern: ^[a-z][a-z0-9_]{1,49}$
                  label:
                    type: string
                    minLength: 1
                    maxLength: 100
                  price:
                    type:
                      - integer
                      - 'null'
                    minimum: 0
            communeCoefficients:
              type: array
              items:
                $ref: '#/components/schemas/CleaningCommuneCoefficient'
            defaultCoefficientBp:
              type: integer
              minimum: 1
              maximum: 100000
            teamSize:
              $ref: '#/components/schemas/CleaningTeamSizeRule'
            checklist:
              type: array
              items:
                $ref: '#/components/schemas/CleaningChecklistTemplateItem'
    UpdateCleaningSettingsRequest:
      type: object
      additionalProperties: false
      required:
        - quoteValidityDays
        - minimumLeadHours
        - freeCancellationHours
        - visitThresholdSquareMeters
        - maxOpenRequests
        - depositPercent
      properties:
        quoteValidityDays:
          type: integer
          minimum: 1
          maximum: 90
        minimumLeadHours:
          type: integer
          minimum: 0
          maximum: 720
        freeCancellationHours:
          type: integer
          minimum: 0
          maximum: 720
        visitThresholdSquareMeters:
          type: integer
          minimum: 1
          maximum: 100000
          description: Sans effet depuis la décision du 2026-10-23 (visite des lieux obligatoire pour toute demande).
        maxOpenRequests:
          type: integer
          minimum: 1
          maximum: 100
        depositPercent:
          type: integer
          minimum: 0
          maximum: 100
        businessWarningUnpaidInvoices:
          type: integer
          minimum: 1
          maximum: 24
          description: Entreprise — factures impayées à partir desquelles le client est averti Si absent, la valeur en vigueur est conservée.
        businessSuspensionUnpaidInvoices:
          type: integer
          minimum: 1
          maximum: 24
          description: Entreprise — factures impayées qui suspendent le contrat Si absent, la valeur en vigueur est conservée.
        individualSuspensionUnpaidInterventions:
          type: integer
          minimum: 1
          maximum: 50
          description: Particulier en récurrent — passages impayés qui suspendent le service Si absent, la valeur en vigueur est conservée.
        individualPaymentGraceHours:
          type: integer
          minimum: 1
          maximum: 720
          description: Heures laissées après un passage pour enregistrer son paiement Si absent, la valeur en vigueur est conservée.
    RegisterCleaningAgentRequest:
      type: object
      additionalProperties: false
      required:
        - agentId
        - displayName
      properties:
        agentId:
          type: string
          format: uuid
        displayName:
          type: string
          minLength: 1
          maxLength: 100
    DeclareCleaningUnavailabilityRequest:
      type: object
      additionalProperties: false
      required:
        - start
        - end
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        reason:
          type: string
          minLength: 0
          maxLength: 200
    CleaningTeamRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - memberIds
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        memberIds:
          type: array
          maxItems: 50
          items:
            type: string
            format: uuid
    InvoiceStatus:
      enum:
        - pending_payment
        - overdue
        - paid
        - cancelled
      description: |
        `pending_payment` jusqu'à l'échéance (émission + délai de règlement), puis `overdue` (impayée) ; `paid` quand
        les paiements atteignent le total ; `cancelled` réservé à une correction.
    InvoiceLine:
      type: object
      additionalProperties: false
      required:
        - label
        - quantity
        - unitPrice
        - amount
      properties:
        label:
          type: string
        quantity:
          type: integer
          minimum: 1
        unitPrice:
          $ref: '#/components/schemas/Money'
        amount:
          $ref: '#/components/schemas/Money'
    InvoicePayment:
      type: object
      additionalProperties: false
      required:
        - id
        - amount
        - method
        - reference
        - recordedBy
        - recordedAt
      properties:
        id:
          type: string
          format: uuid
        amount:
          $ref: '#/components/schemas/Money'
        method:
          $ref: '#/components/schemas/InvoicePaymentMethod'
        reference:
          type:
            - string
            - 'null'
        recordedBy:
          type: string
        recordedAt:
          type: string
          format: date-time
    InvoicePaymentMethod:
      enum:
        - cash
        - bank_transfer
        - mobile_money_offline
    Invoice:
      type: object
      additionalProperties: false
      required:
        - id
        - number
        - status
        - customerId
        - organizationId
        - source
        - contractId
        - periodIndex
        - periodStart
        - periodEnd
        - lines
        - total
        - paid
        - balance
        - issuedAt
        - dueAt
        - paidAt
        - payments
        - organization
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
          pattern: ^FAC-[0-9]{4}-[0-9]{6}$
          description: Numéro continu par année.
        status:
          $ref: '#/components/schemas/InvoiceStatus'
        customerId:
          type: string
          format: uuid
        organizationId:
          type:
            - string
            - 'null'
          format: uuid
        source:
          enum:
            - cleaning
        contractId:
          type: string
          format: uuid
          description: Contrat chez le service source (pour le Nettoyage, la mission).
        periodIndex:
          type: integer
          minimum: 1
          description: Rang du mois facturé dans le contrat.
        periodStart:
          type: string
          format: date-time
        periodEnd:
          type: string
          format: date-time
        lines:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceLine'
        total:
          $ref: '#/components/schemas/Money'
        paid:
          $ref: '#/components/schemas/Money'
        balance:
          $ref: '#/components/schemas/Money'
        issuedAt:
          type: string
          format: date-time
        dueAt:
          type: string
          format: date-time
        paidAt:
          type:
            - string
            - 'null'
          format: date-time
        payments:
          type: array
          items:
            $ref: '#/components/schemas/InvoicePayment'
        organization:
          description: |
            En-tête de la facture d'une organisation : fiche lue dans identity au moment de l'émission. La facture est un
            document comptable : une modification ultérieure de la fiche ne la change pas. `null` pour un particulier et
            pour une facture émise avant l'enregistrement de l'en-tête.
          oneOf:
            - $ref: '#/components/schemas/InvoiceOrganization'
            - type: 'null'
    InvoiceOrganization:
      type: object
      additionalProperties: false
      description: Raison sociale, adresse et identifiants légaux de l'organisation facturée (aucun champ de TVA).
      required:
        - legalName
        - address
        - ifu
        - rccm
      properties:
        legalName:
          type: string
          description: Raison sociale.
        address:
          type: string
        ifu:
          type: string
          pattern: ^[0-9]{13}$
          description: Identifiant fiscal unique (Bénin).
        rccm:
          type:
            - string
            - 'null'
          description: Registre du commerce et du crédit mobilier ; `null` s'il n'est pas renseigné.
    InvoiceList:
      type: object
      additionalProperties: false
      required:
        - data
        - nextCursor
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Invoice'
        nextCursor:
          type:
            - string
            - 'null'
    BillingSettings:
      type: object
      additionalProperties: false
      required:
        - paymentTermDays
        - updatedBy
        - updatedAt
      properties:
        paymentTermDays:
          type: integer
          minimum: 1
          maximum: 90
          description: Délai de règlement après l'émission, en jours (10 par défaut).
        updatedBy:
          type:
            - string
            - 'null'
        updatedAt:
          type:
            - string
            - 'null'
          format: date-time
    RecordInvoicePaymentRequest:
      type: object
      additionalProperties: false
      required:
        - amount
        - method
      properties:
        amount:
          type: integer
          minimum: 1
          description: Entier en FCFA, au plus le reste dû.
        method:
          $ref: '#/components/schemas/InvoicePaymentMethod'
        reference:
          type: string
          minLength: 0
          maxLength: 100
    UpdateBillingSettingsRequest:
      type: object
      additionalProperties: false
      required:
        - paymentTermDays
      properties:
        paymentTermDays:
          type: integer
          minimum: 1
          maximum: 90
    CleaningZone:
      type: object
      additionalProperties: false
      required:
        - code
        - commune
        - active
        - updatedBy
        - updatedAt
      properties:
        code:
          type: string
          description: Commune normalisée (minuscules, sans accents, tirets), clé des coefficients de commune.
        commune:
          type: string
        active:
          type: boolean
        updatedBy:
          type:
            - string
            - 'null'
        updatedAt:
          type:
            - string
            - 'null'
          format: date-time
    CleaningZoneList:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CleaningZone'
    CleaningServedZone:
      type: object
      additionalProperties: false
      required:
        - code
        - commune
      properties:
        code:
          type: string
          description: Commune normalisée (minuscules, sans accents, tirets), par exemple `abomey-calavi`.
        commune:
          type: string
          description: Nom affiché, par exemple `Abomey-Calavi`.
    CleaningServedZoneList:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CleaningServedZone'
    SaveCleaningZoneRequest:
