              amount:
                amount: 5000
                currency: XOF
              reason: Passage du 3 novembre non effectué
      responses:
        '200':
          description: |
            Portefeuille crédité (ou déjà crédité avec cette clé) ; au-delà du seuil de double validation
            (ADR-048), demande en attente d'un second membre de la finance (`pendingRequest`), rien n'est crédité.
          headers:
