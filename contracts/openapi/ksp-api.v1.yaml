    post:
      tags:
        - Nettoyage
      operationId: acceptCleaningQuote
      summary: Accepter le devis
      description: |
        UC-CL-04. Le client choisit un créneau proposé et son option de paiement (acompte ou totalité, avant ou après, espèces ou Mobile Money) ; la mission est créée. Idempotent par `Idempotency-Key`.

        `paymentPlan` est obligatoire pour un particulier (`CLEANING_VALIDATION_FAILED`, `details.field` = `paymentPlan`, s’il manque) et ignoré pour une entreprise, qui règle par sa facture mensuelle.

        Erreurs : `CLEANING_VALIDATION_FAILED`, `CLEANING_SLOT_INVALID` (400), `CLEANING_REQUEST_NOT_FOUND` (404), `CLEANING_CONCURRENT_UPDATE` (409), `CLEANING_QUOTE_EXPIRED`, `CLEANING_INVALID_TRANSITION`, `CLEANING_LEAD_TIME_TOO_SHORT` (422),
        `CLEANING_ORGANIZATION_SUSPENDED` (422, demande d’une organisation suspendue par KSP, ADR-030).
      x-ksp-grpc: ksp.cleaning.v1.QuoteService/AcceptQuote
      x-ksp-access: authenticated
      x-ksp-rate-limit: authenticated
