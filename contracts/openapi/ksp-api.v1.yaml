  /api/v1/identity/me/deletion:
    post:
      tags: [Compte]
      operationId: requestAccountDeletion
      summary: Demander la suppression de son compte
      description: |
        UC-ID-11 (ADR-036). identity interroge chaque service qui peut s'y opposer (Nettoyage :
        prestation ou demande de devis en cours ; facturation : facture à payer ; paiement : paiement
        en attente ou en vérification). Une seule obligation refuse la demande, avec la liste lisible
        des raisons (`details.obligations`) ; un service qui ne répond pas la refuse aussi (503,
        réessayer plus tard). Refusée aussi pour le seul administrateur d'un compte entreprise non
        refusé (`details.organizations`) et pour un compte interne.

        Acceptée : le compte est **gelé** jusqu'à `deletion.scheduledFor` (30 jours par défaut,
        réglage d'identity) et **toutes ses sessions sont fermées**, celle-ci comprise : sur le web,
        la gateway efface aussi le cookie de renouvellement. Pendant le délai, une nouvelle connexion
        par code ouvre une session restreinte qui ne permet que de lire le profil, d'annuler la
        suppression et de se déconnecter. À l'échéance, les mêmes contrôles sont refaits, puis le
        compte est anonymisé (nom, téléphone, e-mail, appareils) ; le numéro redevient libre.
        Rejouer la demande rend la même échéance. Pas de corps.

        Erreurs : `IDENTITY_DELETION_BLOCKED`, `IDENTITY_DELETION_LAST_ORG_ADMIN` et
        `IDENTITY_DELETION_INTERNAL_ACCOUNT` (422), `IDENTITY_ACCOUNT_SUSPENDED` (403),
        `IDENTITY_USER_NOT_FOUND` (404), `IDENTITY_DELETION_CHECK_UNAVAILABLE` (503).
      x-ksp-grpc: ksp.identity.v1.AccountService/RequestDeletion
      x-ksp-access: authenticated
      x-ksp-rate-limit: authenticated
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Suppression enregistrée, compte gelé, sessions fermées
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
            Set-Cookie:
              $ref: '#/components/headers/Set-Cookie-Clear'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestAccountDeletionResponse'
              example:
                deletion:
                  requestedAt: '2026-11-05T10:00:00Z'
                  scheduledFor: '2026-12-05T10:00:00Z'
                  postponedBy: []
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Suppression impossible pour l'instant (`IDENTITY_DELETION_BLOCKED`, `IDENTITY_DELETION_LAST_ORG_ADMIN`, `IDENTITY_DELETION_INTERNAL_ACCOUNT`)
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: IDENTITY_DELETION_BLOCKED
                  message: Votre compte ne peut pas être supprimé tant que des opérations sont en cours.
                  details:
                    obligations:
                      - service: billing
                        kind: unpaid_invoice
                        reference: FAC-2026-000042
                        description: La facture FAC-2026-000042 (150 000 FCFA) est en attente de paiement.
                  correlationId: 0192f1c4-7a2b-7c3d-8e4f-5a6b7c8d9e12
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
    delete:
      tags: [Compte]
      operationId: cancelAccountDeletion
      summary: Annuler la suppression de son compte
      description: |
        UC-ID-11 (ADR-036). Depuis la session restreinte ouverte par une **nouvelle connexion** pendant
        le délai (les sessions d'avant la demande sont fermées) : le compte redevient actif. La
        réponse porte un **nouveau jeton d'accès complet** à utiliser à la place du jeton restreint ;
        le jeton de renouvellement ne change pas, et les renouvellements suivants rendent des jetons
        complets. Sur un compte déjà actif, rend simplement un nouveau jeton.

        Erreurs : `IDENTITY_SESSION_REVOKED` (401), `IDENTITY_ACCOUNT_SUSPENDED` (403),
        `IDENTITY_USER_NOT_FOUND` (404, compte déjà anonymisé).
      x-ksp-grpc: ksp.identity.v1.AccountService/CancelDeletion
      x-ksp-access: authenticated
      x-ksp-rate-limit: authenticated
      x-ksp-pending-deletion: true
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Suppression annulée, compte de nouveau actif
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelAccountDeletionResponse'
              example:
                user:
                  id: 0192f1c4-7a2b-7c3d-8e4f-5a6b7c8d9e11
                  status: active
                  firstName: Koffi
                  lastName: Adjovi
                  phone: '+2290197000045'
                  email: null
                  emailVerified: false
                  preferredLanguage: fr
                  createdAt: '2026-10-17T10:00:00Z'
                profileIncomplete: false
                activeContext:
                  type: individual
                  organizationId: null
                accessToken: eyJhbGciOiJFUzI1NiIsInR5cCI6ImF0K2p3dCJ9.e30.c2ln
                accessTokenExpiresAt: '2026-11-20T10:15:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
