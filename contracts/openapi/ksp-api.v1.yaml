          enum:
            - cleaning
        contractId:
          type: string
          format: uuid
          description: Contrat chez le service source (pour le Nettoyage, la mission).
        periodIndex:
          type: integer
          minimum: 1
          description: Rang du mois facturé dans le contrat.
        periodStart:
          type: string
          format: date-time
          description: |
            Premier instant facturé : minuit, heure du Bénin (Africa/Porto-Novo, UTC+1), du premier jour facturé du
            mois (1er du mois, ou jour de début du contrat). Exemple : `2026-10-31T23:00:00Z` pour le 1er novembre.
        periodEnd:
          type: string
          format: date-time
          description: |
            Borne **exclusive** : minuit, heure du Bénin, du lendemain du dernier jour facturé. Une facture de
            novembre complet va de `2026-10-31T23:00:00Z` (1er novembre 00:00) à `2026-11-30T23:00:00Z`
            (1er décembre 00:00) : le dernier jour facturé est la veille de `periodEnd`, à afficher « au 30 novembre ».
        lines:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceLine'
        total:
          $ref: '#/components/schemas/Money'
        paid:
          $ref: '#/components/schemas/Money'
        balance:
          $ref: '#/components/schemas/Money'
        issuedAt:
          type: string
          format: date-time
        dueAt:
          type: string
          format: date-time
        paidAt:
          type:
            - string
            - 'null'
          format: date-time
        payments:
          type: array
          items:
            $ref: '#/components/schemas/InvoicePayment'
        organization:
          description: |
            En-tête de la facture d'une organisation : fiche lue dans identity au moment de l'émission. La facture est un
            document comptable : une modification ultérieure de la fiche ne la change pas. `null` pour un particulier et
            pour une facture émise avant l'enregistrement de l'en-tête.
          oneOf:
            - $ref: '#/components/schemas/InvoiceOrganization'
            - type: 'null'
