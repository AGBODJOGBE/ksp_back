    RequestCleaningQuoteRequest:
      type: object
      additionalProperties: false
      description: |
        Mêmes deux formats que `SimulateCleaningRequest` (ADR-033), distingués par la présence de `answers`. La demande
        enregistre les réponses (ancien format converti), la version de la grille et le détail du calcul.
      required:
        - serviceCode
        - commune
        - address
        - preferredSlots
      properties:
        serviceCode:
          type: string
          pattern: ^[a-z][a-z0-9_]{1,49}$
        answers:
          $ref: '#/components/schemas/CleaningAnswers'
        options:
          type: array
          maxItems: 20
          description: 'Nouveau format : objets `{ code, answers }`. Ancien format (déprécié) : codes.'
          items:
            oneOf:
              - $ref: '#/components/schemas/CleaningOptionSelection'
              - type: string
                pattern: ^[a-z][a-z0-9_]{1,49}$
        frequency:
          type: string
          pattern: ^[a-z][a-z0-9_]{1,49}$
          description: |
            Mêmes règles que dans une simulation. Indépendante de `recurrence`, qui décrit le contrat (passages par
            période, durée).
        premisesType:
          $ref: '#/components/schemas/CleaningPremisesType'
          deprecated: true
          description: Ancien format (déprécié).
        quantity:
          type: integer
          minimum: 1
          maximum: 1000000
          deprecated: true
          description: Ancien format (déprécié) — réponse au champ de la taille d’équipe de la prestation.
        commune:
          type: string
          minLength: 1
          maxLength: 100
        address:
          type: string
          minLength: 1
          maxLength: 500
        preferredSlots:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: '#/components/schemas/TimeSlot'
        comment:
          type: string
          minLength: 0
          maxLength: 2000
        recurrence:
          $ref: '#/components/schemas/CleaningRecurrence'
        requestedTeamSize:
          type: integer
          minimum: 1
          maximum: 50
        daysPerWeek:
          type: integer
          minimum: 1
          maximum: 7
          description: Entreprise — jours d'intervention par semaine, si connus.
      if:
        required:
          - answers
      then:
        properties:
          premisesType: false
          quantity: false
          options:
            items:
              $ref: '#/components/schemas/CleaningOptionSelection'
      else:
        required:
          - premisesType
          - quantity
        properties:
          options:
            items:
              type: string
          frequency:
            enum:
              - once
              - weekly
              - monthly
