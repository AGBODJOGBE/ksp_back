        - code
        - label
      properties:
        code:
          type: string
          pattern: ^[a-z][a-z0-9_]{1,49}$
        label:
          type: string
    CleaningFormField:
      type: object
      additionalProperties: false
      description: Champ actif du formulaire public (ADR-033) — jamais de prix, de supplément ni de coefficient.
      required:
        - code
        - label
        - type
        - required
        - helpText
        - unitLabel
        - min
        - max
        - choices
      properties:
        code:
          type: string
          pattern: ^[a-z][a-z0-9_]{1,49}$
        label:
          type: string
        type:
          $ref: '#/components/schemas/CleaningFieldType'
        required:
          type: boolean
        helpText:
          type:
            - string
            - 'null'
        unitLabel:
          type:
            - string
            - 'null'
          description: '`number` seulement (« m² », « m³ », « pièces », « mètres linéaires »…) ; null sinon.'
        min:
          type:
            - integer
            - 'null'
          description: '`number` seulement : borne entière incluse ; null sinon.'
        max:
          type:
            - integer
            - 'null'
          description: '`number` seulement : borne entière incluse ; null sinon.'
        choices:
          type: array
          description: '`choice` seulement : valeurs actives, dans l’ordre d’affichage ; vide sinon.'
          items:
            $ref: '#/components/schemas/CleaningFormChoice'
    CleaningFormOption:
      type: object
      additionalProperties: false
      required:
        - code
        - label
        - description
        - fields
      properties:
        code:
          type: string
          pattern: ^[a-z][a-z0-9_]{1,49}$
        label:
          type: string
        description:
          type:
            - string
            - 'null'
        fields:
          type: array
          items:
            $ref: '#/components/schemas/CleaningFormField'
    CleaningFormFrequency:
      type: object
      additionalProperties: false
      required:
        - code
        - label
      properties:
        code:
          type: string
          pattern: ^[a-z][a-z0-9_]{1,49}$
        label:
          type: string
    CleaningServiceForm:
      type: object
      additionalProperties: false
      description: |
        Formulaire public d’une prestation (ADR-033) : éléments actifs seulement, dans l’ordre d’affichage, sans aucun
        montant. Seule la simulation donne des montants.
      required:
        - fields
        - options
        - frequencies
      properties:
        fields:
          type: array
          items:
            $ref: '#/components/schemas/CleaningFormField'
        options:
          type: array
          items:
            $ref: '#/components/schemas/CleaningFormOption'
        frequencies:
          type: array
          description: Fréquences actives ; si la liste n’est pas vide, `frequency` est obligatoire dans une simulation ou une demande au nouveau format.
          items:
            $ref: '#/components/schemas/CleaningFormFrequency'
    CleaningFieldType:
      type: string
      enum:
        - number
        - choice
        - boolean
    CleaningAnswerValue:
      description: Réponse à un champ — nombre entier (`number`), code d’une valeur (`choice`) ou oui/non (`boolean`).
      oneOf:
        - type: integer
          minimum: 0
          maximum: 1000000
        - type: string
          pattern: ^[a-z][a-z0-9_]{1,49}$
        - type: boolean
    CleaningAnswers:
      type: object
      description: |
        Réponses au formulaire, par code de champ (ADR-033). Validées strictement contre la définition de la prestation :
        champ inconnu ou inactif, champ obligatoire sans réponse, type incorrect, nombre hors bornes, valeur inconnue ou
        inactive → `CLEANING_VALIDATION_FAILED` (400), `details.field` (par exemple `answers.surface` ou
        `options[0].answers.hedge_length`) et `details.reason`.
      maxProperties: 50
      propertyNames:
        pattern: ^[a-z][a-z0-9_]{1,49}$
      additionalProperties:
        $ref: '#/components/schemas/CleaningAnswerValue'
    CleaningOptionSelection:
      type: object
      additionalProperties: false
      description: Option choisie, avec les réponses à ses propres champs (`answers` absent = `{}` ; toujours présent dans les réponses).
      required:
        - code
      properties:
        code:
          type: string
          pattern: ^[a-z][a-z0-9_]{1,49}$
        answers:
          $ref: '#/components/schemas/CleaningAnswers'
    SimulateCleaningRequest:
      type: object
      additionalProperties: false
      description: |
        Deux formats (ADR-033), distingués par la présence de `answers` :
        - **nouveau** : `answers` (obligatoire, même `{}`), `options` en objets `{ code, answers }`, `frequency` (code d’une
          fréquence active de la prestation, obligatoire si elle en a) ;
        - **ancien, déprécié** (toléré jusqu’à la migration du portail) : `premisesType`, `quantity`, `options` en codes,
          `frequency` parmi `once`, `weekly`, `monthly`. Converti vers le nouveau : `quantity` devient la réponse au champ
          de la taille d’équipe, `premisesType` celle d’un champ `premises_type` s’il existe ; une réponse obligatoire
          manquante donne `priced: false` (`answers_incomplete`), jamais une erreur.

        Les deux formats ne se mélangent pas.
      required:
        - serviceCode
      properties:
        serviceCode:
          type: string
          pattern: ^[a-z][a-z0-9_]{1,49}$
        answers:
          $ref: '#/components/schemas/CleaningAnswers'
        options:
          type: array
          maxItems: 20
          description: 'Nouveau format : objets `{ code, answers }`. Ancien format (déprécié) : codes.'
          items:
            oneOf:
              - $ref: '#/components/schemas/CleaningOptionSelection'
              - type: string
                pattern: ^[a-z][a-z0-9_]{1,49}$
        commune:
          type: string
          minLength: 1
          maxLength: 100
          description: Facultative (ADR-034) ; sans elle, coefficient de commune neutre, `communeApplied` faux, prix indicatif.
        frequency:
          type: string
          pattern: ^[a-z][a-z0-9_]{1,49}$
          description: |
            Nouveau format : code d’une fréquence active de la prestation (coefficient sur le prix d’un passage).
            Ancien format : `once`, `weekly` ou `monthly`, appliqué si la prestation a une fréquence de même code, sans
            effet sinon.
        premisesType:
          $ref: '#/components/schemas/CleaningPremisesType'
          deprecated: true
          description: Ancien format (déprécié).
        quantity:
          type: integer
          minimum: 1
          maximum: 1000000
          deprecated: true
          description: Ancien format (déprécié) — réponse au champ de la taille d’équipe de la prestation.
      if:
        required:
          - answers
      then:
        properties:
          premisesType: false
          quantity: false
          options:
            items:
              $ref: '#/components/schemas/CleaningOptionSelection'
      else:
        required:
          - premisesType
          - quantity
        properties:
          options:
            items:
              type: string
          frequency:
            enum:
              - once
              - weekly
              - monthly
    CleaningPricingReason:
      type:
        - string
        - 'null'
      enum:
        - price_not_set
        - option_price_not_set
        - answers_incomplete
        - null
      description: |
        Raison de l’absence de prix, null si le calcul aboutit : `price_not_set` (prix d’un champ de la prestation non
        fixé), `option_price_not_set` (forfait d’une option ou prix de ses champs), `answers_incomplete` (ancien format
        sans les réponses obligatoires du nouveau formulaire).
    CleaningCalculationLine:
      type: object
      additionalProperties: false
      required:
        - kind
        - optionCode
        - fieldCode
        - choiceCode
        - label
        - quantity
        - unitLabel
        - unitPrice
        - amount
      properties:
        kind:
          enum:
            - unit_price
            - supplement
            - flat_price
          description: '`unit_price` : nombre × prix par unité ; `supplement` : valeur choisie ou réponse oui ; `flat_price` : forfait d’une option.'
        optionCode:
          type:
            - string
            - 'null'
          description: Option concernée, null pour la prestation elle-même.
        fieldCode:
          type:
            - string
            - 'null'
          description: Champ concerné, null pour un forfait.
        choiceCode:
          type:
            - string
            - 'null'
          description: Valeur choisie (`choice`), null sinon.
        label:
          type: string
        quantity:
          type: integer
          minimum: 1
        unitLabel:
          type:
            - string
            - 'null'
        unitPrice:
          $ref: '#/components/schemas/Money'
        amount:
          $ref: '#/components/schemas/Money'
    CleaningAppliedCoefficient:
      type: object
      additionalProperties: false
      required:
        - source
        - optionCode
        - fieldCode
        - code
        - label
        - coefficientBp
      properties:
        source:
          enum:
            - choice
            - boolean
            - commune
            - frequency
        optionCode:
          type:
            - string
            - 'null'
          description: Option dont le champ porte ce coefficient ; il ne s’applique alors qu’au montant de cette option. Null pour un coefficient de la prestation, de la commune ou de la fréquence.
        fieldCode:
          type:
            - string
            - 'null'
        code:
          type:
            - string
            - 'null'
          description: Code de la valeur choisie, clé de la commune ou code de la fréquence ; null pour un booléen.
        label:
          type: string
        coefficientBp:
          type: integer
          minimum: 1
          maximum: 100000
    CleaningMissingPrice:
      type: object
      additionalProperties: false
      description: Prix manquant — forfait d’une option (`fieldCode` null), prix par unité d’un champ (`choiceCode` null) ou effet d’une valeur choisie.
      required:
        - optionCode
        - fieldCode
        - choiceCode
      properties:
        optionCode:
          type:
            - string
            - 'null'
        fieldCode:
          type:
            - string
            - 'null'
        choiceCode:
          type:
            - string
            - 'null'
    CleaningPriceCalculation:
      type: object
      additionalProperties: false
      description: |
        Détail du calcul d’un passage (ADR-033) :
        prix = max(minimum, (Σ lignes de la prestation + Σ options [Σ lignes de l’option × Π coefficients de ses champs])
        × Π coefficients des champs de la prestation × coefficient de la commune × coefficient de la fréquence), arrondi
        une seule fois, au franc le plus proche ; fourchette −10 % / +15 % arrondie à 500 FCFA. Un coefficient dont
        `optionCode` est renseigné ne s’applique qu’au montant de cette option. Montants null si `priced` est faux.
      required:
        - pricingVersion
        - priced
        - reason
        - missingPrices
        - lines
        - baseAmount
        - coefficients
        - subtotal
        - minimumPrice
        - minimumApplied
        - computedPrice
        - estimate
        - recommendedTeamSize
      properties:
        pricingVersion:
          type:
            - integer
            - 'null'
          minimum: 1
          description: Version de la grille utilisée ; null pour une définition essayée sans être enregistrée.
        priced:
          type: boolean
        reason:
          $ref: '#/components/schemas/CleaningPricingReason'
        missingPrices:
          type: array
          items:
            $ref: '#/components/schemas/CleaningMissingPrice'
        lines:
          type: array
          description: Lignes calculables (montant non nul), complètes seulement si `priced`.
          items:
            $ref: '#/components/schemas/CleaningCalculationLine'
        baseAmount:
          description: Somme des lignes, avant tout coefficient.
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        coefficients:
          type: array
          items:
            $ref: '#/components/schemas/CleaningAppliedCoefficient'
        subtotal:
          description: Montant après tous les coefficients (ceux d’une option limités à l’option), arrondi une seule fois au franc.
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        minimumPrice:
          description: Minimum de commande de la grille, null s’il n’est pas fixé.
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        minimumApplied:
          type: boolean
        computedPrice:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        estimate:
          oneOf:
            - $ref: '#/components/schemas/CleaningPriceRange'
            - type: 'null'
        recommendedTeamSize:
          type: integer
          minimum: 1
    CleaningSimulation:
      type: object
      additionalProperties: false
      required:
        - serviceCode
        - priced
        - estimate
        - computedPrice
        - breakdown
        - minimumApplied
        - communeCoefficientBp
        - recommendedTeamSize
        - notice
        - covered
        - reason
        - calculation
        - communeApplied
      properties:
        communeApplied:
          type: boolean
          description: Faux si la simulation est faite sans commune (ADR-034) ; coefficient neutre, prix indicatif.
        reason:
          $ref: '#/components/schemas/CleaningPricingReason'
        calculation:
          $ref: '#/components/schemas/CleaningPriceCalculation'
        serviceCode:
          type: string
          pattern: ^[a-z][a-z0-9_]{1,49}$
        priced:
          type: boolean
        estimate:
          oneOf:
            - $ref: '#/components/schemas/CleaningPriceRange'
            - type: 'null'
        computedPrice:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        breakdown:
          type: array
          items:
            $ref: '#/components/schemas/CleaningPriceLine'
        minimumApplied:
          type: boolean
        communeCoefficientBp:
          type: integer
          description: Coefficient de la commune en points de base (10000 = 1), 0 sans prix.
        recommendedTeamSize:
          type: integer
          minimum: 1
        notice:
          type: string
          description: Mention « estimation non contractuelle », ou raison de l’absence de prix.
        covered:
          type: boolean
          description: |
            Vrai si la commune est dans une zone desservie. L’estimation est donnée dans tous les cas ; une demande
            de devis hors zone est refusée (`CLEANING_ZONE_NOT_COVERED`).
    CleaningSiteVisit:
