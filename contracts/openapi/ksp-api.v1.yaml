        options:
          type: array
          deprecated: true
          description: Déprécié (ADR-033) — options actives avec leur forfait ; lire `form.options`.
          items:
            $ref: '#/components/schemas/CleaningOption'
        priced:
          type: boolean
          description: Vrai si toute réponse au formulaire (hors options) peut être chiffrée ; faux tant qu’un prix nécessaire n’est pas fixé par l’équipe Nettoyage.
        minimumPrice:
          deprecated: true
          description: Déprécié (ADR-033) — le formulaire public ne montre plus de prix.
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        form:
          $ref: '#/components/schemas/CleaningServiceForm'
    CleaningServiceList:
      type: object
      additionalProperties: false
      required:
        - data
