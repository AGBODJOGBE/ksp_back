        checklist:
          type: array
          items:
            $ref: '#/components/schemas/CleaningChecklistTemplateItem'
    PreviewCleaningServiceRequest:
      type: object
      additionalProperties: false
      required:
        - answers
        - commune
      properties:
        definition:
          $ref: '#/components/schemas/SaveCleaningServiceRequest'
          description: Définition à essayer, non enregistrée ; absente, version en vigueur de la prestation.
        answers:
          $ref: '#/components/schemas/CleaningAnswers'
        options:
          type: array
