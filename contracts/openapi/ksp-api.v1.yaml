      x-ksp-access: public
      x-ksp-rate-limit: public
      responses:
        '200':
          description: Jeu de clés JWK (RFC 7517)
          headers:
            Cache-Control:
              description: '`public, max-age=600`'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Jwks'
              example:
                keys:
                  - kid: k1
                    kty: EC
                    crv: P-256
                    x: f83OJ3D2xF1Bg8vub9tLe1gHMzV76e8Tus9uPHvRVEU
                    y: x_FEzRu9m36HLN_tue659LNpXW6pCyStikYjKIWI5a0
                    alg: ES256
                    use: sig
