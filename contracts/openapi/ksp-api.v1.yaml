  /api/v1/file/uploads:
    post:
      tags:
        - Fichiers
      operationId: createFileUpload
      summary: Préparer l’envoi d’un fichier
      description: |
        Déclare un fichier (finalité, nom, type, taille) et renvoie une **adresse d'envoi présignée** de courte
        durée (15 minutes) : le contenu est envoyé **directement au stockage**, jamais à la gateway (ADR-038).

        1. Envoyer le contenu : `PUT upload.url` avec exactement les en-têtes `upload.headers` (`Content-Type`) et
           la taille déclarée. Type et taille sont signés : le stockage refuse un autre contenu (403).
        2. Confirmer : `POST /api/v1/file/files/{id}/complete`.
        3. Transmettre l'identifiant au service métier concerné, qui rattache le fichier à son objet (mission,
           dossier…). Un fichier jamais rattaché est purgé après 24 heures ; un envoi jamais confirmé aussi.

        Le propriétaire est le compte connecté. Finalités, types et tailles maximales :

        | Finalité | Types | Taille max |
        | --- | --- | --- |
        | `recovery_evidence` | PDF, JPEG, PNG, WebP | 10 Mo |
        | `cleaning_intervention_photo` | JPEG, PNG, WebP | 8 Mo |
        | `avatar` | JPEG, PNG, WebP | 2 Mo |

        `generated_document` est réservé aux services (`FILE_PURPOSE_FORBIDDEN`). Quota par compte : 20 envois
        en attente et 500 Mo déclarés sur 24 heures (`FILE_QUOTA_EXCEEDED`).

        Erreurs : `GATEWAY_VALIDATION_FAILED`, `FILE_VALIDATION_FAILED`, `FILE_TYPE_NOT_ALLOWED` (`details.allowed`),
        `FILE_TOO_LARGE` (`details.maxBytes`) (400), `FILE_PURPOSE_FORBIDDEN` (403), `FILE_QUOTA_EXCEEDED` (422,
        `details.limit` : `pending_uploads` ou `daily_bytes`), `FILE_STORAGE_UNAVAILABLE` (503).
      x-ksp-grpc: ksp.file.v1.FileService/CreateUpload
      x-ksp-access: authenticated
      x-ksp-rate-limit: file_upload
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFileUploadRequest'
            example:
              purpose: cleaning_intervention_photo
              fileName: salon-avant.jpg
              contentType: image/jpeg
              sizeBytes: 1843200
      responses:
        '200':
          description: Fichier déclaré, en attente de son contenu
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileUpload'
              example:
                file:
                  id: 0192f1c4-7a2b-7c3d-8e4f-5a6b7c8d6001
                  purpose: cleaning_intervention_photo
                  fileName: salon-avant.jpg
                  contentType: image/jpeg
                  sizeBytes: 1843200
                  status: pending
                  rejectionReason: null
                  subject: null
                  createdAt: 2026-11-07T09:00:00Z
                  completedAt: null
                upload:
                  url: https://files.ksp.bj/ksp-files/cleaning_intervention_photo/0192f1c4-7a2b-7c3d-8e4f-5a6b7c8d6001?X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Expires=900&X-Amz-SignedHeaders=content-length%3Bcontent-type%3Bhost&X-Amz-Signature=3f1c
                  method: PUT
                  headers:
                    Content-Type: image/jpeg
                  expiresAt: 2026-11-07T09:15:00Z
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
