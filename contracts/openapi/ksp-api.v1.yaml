      x-ksp-access: authenticated
      x-ksp-rate-limit: authenticated
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwitchContextRequest'
            example:
              organizationId: 0192f1c4-7a2b-7c3d-8e4f-5a6b7c8d0a01
