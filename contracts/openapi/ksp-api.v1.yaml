          type: [string, 'null']
        billingEmail:
          type: [string, 'null']
          format: email
        status:
          $ref: '#/components/schemas/OrganizationStatus'
        rejectionReason:
          type: [string, 'null']
        suspensionReason:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
        reviewedAt:
          type: [string, 'null']
          format: date-time
        createdBy:
          type: string
          format: uuid
          description: Compte qui a demandé la création.
        reviewedBy:
          type: [string, 'null']
          format: uuid
          description: Admin KSP qui a validé ou refusé la demande.
        suspendedAt:
          type: [string, 'null']
          format: date-time

    AdminOrganizationList:
      type: object
      additionalProperties: false
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdminOrganization'
        nextCursor:
          type: [string, 'null']
          format: uuid

    OrganizationMember:
      type: object
      additionalProperties: false
      required: [userId, role, firstName, lastName, phone, joinedAt]
      properties:
        userId:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/OrgRole'
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        phone:
          type: [string, 'null']
        joinedAt:
          type: string
          format: date-time

    AdminOrganizationDetail:
      type: object
      additionalProperties: false
      required: [organization, members]
      properties:
        organization:
          $ref: '#/components/schemas/AdminOrganization'
        members:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationMember'

    ChangeEmailRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 254
          description: Adresse à confirmer ; espaces autour retirés et mise en minuscules par identity.

    ChangeEmailResponse:
      type: object
      additionalProperties: false
      required: [pendingEmail, expiresInSeconds, resendAfterSeconds]
      properties:
        pendingEmail:
          type: string
          format: email
          description: Adresse à confirmer, normalisée.
        expiresInSeconds:
          type: integer
          minimum: 1
        resendAfterSeconds:
          type: integer
          minimum: 0
          description: Délai avant de pouvoir demander un nouveau code.

    ConfirmEmailRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          pattern: '^[0-9]{4,8}$'
          description: Code reçu par e-mail.

    UpdateMeRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        preferredLanguage:
          type: string
          pattern: '^[a-z]{2}$'
          description: Code de langue, "fr" par défaut.

    FindAccountByPhoneRequest:
      type: object
      additionalProperties: false
      required: [phone]
      properties:
        phone:
          $ref: '#/components/schemas/PhoneE164'

    AdminAccountMatch:
      type: object
      additionalProperties: false
      required: [userId, status, firstName, lastName, phoneMasked]
      description: Compte trouvé par son numéro (ADR-029) — le minimum pour le reconnaître et le rattacher.
      properties:
        userId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/UserStatus'
        firstName:
          type: [string, 'null']
          description: Null tant que le profil n'est pas complété.
        lastName:
          type: [string, 'null']
        phoneMasked:
          type: string
          description: Indicatif et deux derniers chiffres, par exemple `+229********45`.

    SearchAccountsRequest:
      type: object
      additionalProperties: false
      description: Recherche de comptes (ADR-043). Tout champ absent prend sa valeur par défaut.
      properties:
        query:
          type: string
          maxLength: 100
          description: Vide (comptes qui ont un rôle), numéro E.164 complet, ou nom (2 lettres au moins).
        limit:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
        cursor:
          type: string
          format: uuid
          description: Valeur `nextCursor` de la page précédente.

    GrantAccountRoleRequest:
      type: object
      additionalProperties: false
      required: [roleCode, reason]
      properties:
        roleCode:
          type: string
          pattern: ^[a-z][a-z0-9_]{1,63}$
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Motif tracé dans le journal d'audit d'identity (une ligne).

    RevokeAccountRoleRequest:
      type: object
      additionalProperties: false
      required: [assignmentId, reason]
      properties:
        assignmentId:
          type: string
          format: uuid
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Motif tracé et publié dans `identity.role.revoked` (une ligne).

    AccountAdminReasonRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Motif tracé dans le journal d'audit d'identity (une ligne).

    RoleScopeType:
      type: string
      enum: [global, domain, org, personal]

    AdminAccount:
      type: object
      additionalProperties: false
      required:
        [
          userId,
          status,
          firstName,
          lastName,
          phone,
          phoneMasked,
          createdAt,
          suspendedAt,
          suspensionReason,
          roles,
        ]
      description: Compte vu par l'administration des comptes (ADR-043).
      properties:
        userId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/UserStatus'
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        phone:
          type: [string, 'null']
          description: Numéro complet pour `super_admin` ; null pour un administrateur de métier.
        phoneMasked:
          type: [string, 'null']
          description: Indicatif et deux derniers chiffres ; null si le compte n'a pas de numéro.
        createdAt:
          type: string
          format: date-time
        suspendedAt:
          type: [string, 'null']
          format: date-time
        suspensionReason:
          type: [string, 'null']
        roles:
          type: array
          description: Codes des rôles actifs, dans l'ordre d'attribution.
          items:
            type: string

    AdminAccountList:
      type: object
      additionalProperties: false
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdminAccount'
        nextCursor:
          type: [string, 'null']
          format: uuid

    AdminRoleAssignment:
      type: object
      additionalProperties: false
      required:
        [
          id,
          roleCode,
          roleDescription,
          service,
          scopeType,
          scopeId,
          grantedAt,
          grantedBy,
          grantedByName,
          grantReason,
          revokedAt,
          revokedBy,
          revokedByName,
          revokeReason,
          revocable,
        ]
      description: Une attribution de rôle, active (revokedAt null) ou retirée.
      properties:
        id:
          type: string
          format: uuid
        roleCode:
          type: string
        roleDescription:
          type: string
        service:
          type: string
          description: Service qui déclare le rôle.
        scopeType:
          $ref: '#/components/schemas/RoleScopeType'
        scopeId:
          type: [string, 'null']
          description: Métier pour une portée `domain` ; null pour une portée globale.
        grantedAt:
          type: string
          format: date-time
        grantedBy:
          type: [string, 'null']
          description: Null pour une attribution d'amorçage (script `roles:grant`).
        grantedByName:
          type: [string, 'null']
        grantReason:
          type: [string, 'null']
        revokedAt:
          type: [string, 'null']
          format: date-time
        revokedBy:
          type: [string, 'null']
        revokedByName:
          type: [string, 'null']
        revokeReason:
          type: [string, 'null']
        revocable:
          type: boolean
          description: L'appelant peut retirer ce rôle.

    AdminAccountAuditEntry:
      type: object
      additionalProperties: false
      required: [id, action, at, actorId, actorName, roleCode, reason]
      properties:
        id:
          type: string
          format: uuid
        action:
          type: string
          description: '`user.role_granted`, `user.role_revoked`, `user.suspended`, `user.reactivated`, `user.mfa_reset`.'
        at:
          type: string
          format: date-time
        actorId:
          type: string
        actorName:
          type: [string, 'null']
        roleCode:
          type: [string, 'null']
        reason:
          type: [string, 'null']

    AdminAccountDetail:
      type: object
      additionalProperties: false
      required: [account, mfa, roles, history, actions]
      description: Fiche d'un compte, renvoyée par la lecture et par chaque écriture (ADR-043).
      properties:
        account:
          $ref: '#/components/schemas/AdminAccount'
        mfa:
          type: object
          additionalProperties: false
          required: [configured, configuredAt, recoveryCodesRemaining]
          properties:
            configured:
              type: boolean
              description: Application d'authentification configurée et confirmée.
            configuredAt:
              type: [string, 'null']
              format: date-time
            recoveryCodesRemaining:
              type: integer
              minimum: 0
        roles:
          type: array
          description: Rôles actifs d'abord, puis retirés, les plus récents d'abord.
          items:
            $ref: '#/components/schemas/AdminRoleAssignment'
        history:
          type: array
          description: Actions du back-office sur ce compte, les plus récentes d'abord (50 au plus).
          items:
            $ref: '#/components/schemas/AdminAccountAuditEntry'
        actions:
          type: object
          additionalProperties: false
          required: [grantRole, suspend, reactivate, resetMfa]
          description: Actions permises à l'appelant dans l'état actuel du compte.
          properties:
            grantRole:
              type: boolean
            suspend:
              type: boolean
            reactivate:
              type: boolean
            resetMfa:
              type: boolean

    AssignableRoleList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [code, service, scopeType, description, backofficeAccess, grantable]
            properties:
              code:
                type: string
              service:
                type: string
              scopeType:
                $ref: '#/components/schemas/RoleScopeType'
              description:
                type: string
              backofficeAccess:
                type: boolean
              grantable:
                type: boolean
