        - method
      properties:
        option:
          enum:
            - deposit
            - full
          description: Acompte (30 % par défaut) ou totalité.
        timing:
          enum:
            - before
            - after
        method:
          enum:
            - cash
            - mobile_money_offline
            - mobile_money_online
          description: |
            Moyen prévu, choisi à l'acceptation du devis. `mobile_money_online` : le client paie en ligne depuis la
            fiche de la mission (`POST /api/v1/payment/payments`, ADR-031) ; il peut aussi payer en ligne quel que
            soit le moyen prévu.
    CleaningPaymentRecord:
      type: object
      additionalProperties: false
      required:
        - id
        - amount
        - method
        - reference
        - recordedBy
        - recordedAt
      properties:
        id:
          type: string
          format: uuid
        amount:
          $ref: '#/components/schemas/Money'
        method:
          enum:
            - cash
            - mobile_money_offline
            - mobile_money_online
        reference:
          type:
            - string
            - 'null'
        recordedBy:
          type: string
        recordedByName:
          type:
            - string
            - 'null'
          description: Back-office — nom affiché de la personne qui a enregistré le paiement ; null s'il est inconnu (ADR-029).
        recordedAt:
          type: string
          format: date-time
    CleaningPaymentState:
      type: object
      additionalProperties: false
      required:
        - plan
        - status
        - total
        - depositPercent
        - depositAmount
        - paid
        - payments
        - remainingDue
        - depositDue
      properties:
        plan:
          $ref: '#/components/schemas/CleaningPaymentPlan'
        status:
          enum:
            - due
            - deposit_received
            - paid
        total:
          $ref: '#/components/schemas/Money'
        depositPercent:
          type: integer
          minimum: 0
          maximum: 100
        depositAmount:
          $ref: '#/components/schemas/Money'
        paid:
          $ref: '#/components/schemas/Money'
        payments:
          type: array
          items:
            $ref: '#/components/schemas/CleaningPaymentRecord'
        remainingDue:
          $ref: '#/components/schemas/Money'
          description: |
            Reste dû, calculé par cleaning : total moins les paiements enregistrés, jamais négatif (entier XOF).
            C'est le montant que `POST /api/v1/payment/payments` demande pour `part` = `balance`.
        depositDue:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: |
            Acompte encore attendu, calculé par cleaning (entier XOF) : acompte du plan moins les paiements
            enregistrés. `null` quand aucun acompte n'est attendu (plan « totalité », ou acompte déjà reçu en
            entier). C'est le montant que `POST /api/v1/payment/payments` demande pour `part` = `deposit`.
    CleaningMission:
