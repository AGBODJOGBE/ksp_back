        Route publique appelée par FedaPay, sans jeton : la confiance vient de la **signature** de l'en-tête
        `X-FEDAPAY-SIGNATURE` (`t=<horodatage>,s=<HMAC-SHA256 hexadécimal de "<horodatage>.<corps>">`, clé :
        secret du webhook), vérifiée par payment sur le corps reçu octet pour octet, avec une tolérance de
        5 minutes sur l'horodatage. Le contenu de la notification n'est pas cru tel quel : payment relit la
        transaction chez FedaPay avant de changer le statut du paiement (ADR-031).

        Le corps (événement FedaPay, par exemple `transaction.approved`) est transmis sans être interprété par la
        gateway ; il n'est ni journalisé ni conservé (il contient des données personnelles du payeur).
        Transaction inconnue : 200, sans effet (FedaPay ne réessaie pas). Limite d'appels par adresse IP.

        Erreurs : `PAYMENT_WEBHOOK_SIGNATURE_INVALID` (400), `GATEWAY_RATE_LIMITED` (429).
      x-ksp-grpc: ksp.payment.v1.PaymentWebhookService/ReceiveProviderNotification
      x-ksp-access: public
      x-ksp-rate-limit: payment_webhook
      x-ksp-raw-body: true
      parameters:
        - name: X-FEDAPAY-SIGNATURE
          in: header
          required: true
          description: Signature de FedaPay, `t=<horodatage>,s=<signature>`.
          schema:
            type: string
            maxLength: 1000
      requestBody:
        required: true
        description: Événement FedaPay, transmis tel quel (64 Ko au plus).
        content:
          application/json:
            schema:
              type: object
            example:
              name: transaction.approved
              entity:
                id: 104571
                status: approved
      responses:
        '200':
          description: Notification reçue
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentWebhookAck'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /api/v1/admin/payment/payments:
    get:
      tags:
        - Paiement (back-office)
      operationId: listPayments
      summary: Paiements en ligne (back-office)
      description: |
        Tous les paiements en ligne, les plus récents d'abord, filtrables par statut, type d'objet, objet (mission
        ou facture), payeur ou organisation, et par écart de montant à traiter (`underReview`, ADR-032).

        Rôles : `finance_officer`, `cleaning_admin`, `super_admin` ; double authentification faite pendant la session (12 heures au plus).
      x-ksp-grpc: ksp.payment.v1.PaymentAdminService/ListPayments
      x-ksp-access: authenticated
      x-ksp-rate-limit: authenticated
      x-ksp-roles:
        - finance_officer
        - cleaning_admin
        - super_admin
      x-ksp-mfa-max-age: 43200
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PaymentStatus'
        - name: subjectType
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/PaymentSubjectType'
        - name: subjectId
          in: query
          required: false
          description: Mission ou facture payée.
          schema:
            type: string
            format: uuid
        - name: customerId
          in: query
          required: false
          description: Payeur.
          schema:
            type: string
            format: uuid
        - name: organizationId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: underReview
          in: query
          required: false
          description: |
            `true` : écarts de montant (`amount_mismatch`) pas encore traités par la finance, qui bloquent les
            nouveaux paiements de leur objet ; `false` : tous les autres paiements. Absent : pas de filtre.
          schema:
            enum:
              - 'true'
              - 'false'
      responses:
        '200':
          description: Succès
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /api/v1/admin/payment/payments/{id}/resolve-mismatch:
    post:
      tags:
        - Paiement (back-office)
      operationId: resolvePaymentMismatch
      summary: Traiter un écart de montant
      description: |
        La finance a traité un paiement `amount_mismatch` (argent reçu pour un autre montant ou une autre devise) :
        remboursement, encaissement manuel enregistré sur la mission ou la facture… La note dit ce qui a été fait.
        Le statut reste `amount_mismatch` (historique) ; le paiement n'est plus `underReview`, et les nouveaux
        paiements de son objet ne sont plus bloqués par lui (ADR-032). Aucun montant n'est enregistré chez
        cleaning ni billing par cette route.

        Rôles : `finance_officer`, `cleaning_admin`, `super_admin` ; double authentification faite pendant la session (12 heures au plus).

        Rejouable sans effet : un second envoi avec la même clé `Idempotency-Key` (facultative), ou du même compte
        avec la même note, renvoie le paiement tel quel. Un autre traitement d'un écart déjà traité est refusé.

        Erreurs : `PAYMENT_VALIDATION_FAILED` (400, `details.field` = `note` ou `idempotencyKey`),
        `PAYMENT_NOT_FOUND` (404), `PAYMENT_MISMATCH_ALREADY_RESOLVED` (409, écart déjà traité),
        `PAYMENT_CONCURRENT_UPDATE` (409), `PAYMENT_NOT_AMOUNT_MISMATCH` (422, le paiement n'est pas en écart de
        montant).
      x-ksp-grpc: ksp.payment.v1.PaymentAdminService/ResolveAmountMismatch
      x-ksp-access: authenticated
      x-ksp-rate-limit: authenticated
      x-ksp-roles:
        - finance_officer
        - cleaning_admin
        - super_admin
      x-ksp-mfa-max-age: 43200
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PaymentId'
        - $ref: '#/components/parameters/OptionalIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolvePaymentMismatchRequest'
            example:
              note: Remboursé au client par FedaPay le 05/11 (approuvé 100 FCFA au lieu de 15 000).
      responses:
        '200':
          description: Écart traité (ou déjà traité par la même demande)
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
              example:
                id: 0192f1c4-7a2b-7c3d-8e4f-5a6b7c8d5001
                status: amount_mismatch
                subject:
                  type: cleaning_mission
                  id: 0192f1c4-7a2b-7c3d-8e4f-5a6b7c8d1000
                  part: deposit
                  reference: null
                amount:
                  amount: 15000
                  currency: XOF
                customerId: 0192f1c4-7a2b-7c3d-8e4f-5a6b7c8d9e11
                organizationId: null
                method: mobile_money_online
                provider: fedapay
                providerReference: null
                checkoutUrl: null
                failureReason: null
                createdAt: 2026-11-02T09:00:00Z
                updatedAt: 2026-11-05T10:00:00Z
                expiresAt: 2026-11-02T09:30:00Z
                completedAt: 2026-11-02T09:05:00Z
                underReview: false
                customerName: Koffi Adjovi
                organizationName: null
                mismatchResolvedAt: 2026-11-05T10:00:00Z
                mismatchResolvedBy: 0192f1c4-7a2b-7c3d-8e4f-5a6b7c8d9e99
                mismatchResolutionNote: Remboursé au client par FedaPay le 05/11 (approuvé 100 FCFA au lieu de 15 000).
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Jeton d'accès ES256 délivré par identity, valable 15 minutes.
    refreshCookieWeb:
      type: apiKey
      in: cookie
      name: __Secure-ksp_rt
      description: Jeton de renouvellement des sites web (portail, shop, print).
    refreshCookieBackoffice:
      type: apiKey
      in: cookie
      name: __Secure-ksp_admin_rt
      description: Jeton de renouvellement du back-office.

  headers:
    X-Correlation-Id:
      description: Identifiant de la requête, à citer au support.
      schema:
        type: string
        format: uuid
    Set-Cookie-Refresh:
      description: |
        Web et back-office uniquement : nouveau jeton de renouvellement, par exemple
        `__Secure-ksp_rt=…; Path=/api/v1/identity/token; HttpOnly; Secure; SameSite=Strict; Max-Age=2592000`.
      schema:
        type: string
    Set-Cookie-Clear:
      description: 'Web et back-office uniquement : effacement du cookie de renouvellement (`Max-Age=0`).'
      schema:
        type: string
    Retry-After:
      description: Nombre de secondes à attendre avant de réessayer.
      schema:
        type: integer
        minimum: 1

  parameters:
    InvoiceId:
      name: id
      in: path
      required: true
      description: Identifiant de la facture (UUID).
      schema:
        type: string
        format: uuid
    PaymentId:
      name: id
      in: path
      required: true
      description: Identifiant du paiement (UUID).
      schema:
        type: string
        format: uuid
    PaymentStatus:
      name: status
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/PaymentStatus'
    InvoiceStatus:
      name: status
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/InvoiceStatus'
    OrganizationId:
      name: id
      in: path
      required: true
      description: Identifiant de l'organisation (UUID).
      schema:
        type: string
        format: uuid
    AccountId:
      name: id
      in: path
      required: true
      description: Identifiant du compte KSP (UUID).
      schema:
        type: string
        format: uuid
    OrganizationStatus:
      name: status
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/OrganizationStatus'
    CleaningId:
      name: id
      in: path
      required: true
      description: Identifiant (UUID).
      schema:
        type: string
        format: uuid
    CleaningZoneCode:
      name: code
      in: path
      required: true
      description: Clé de la zone (commune normalisée, par exemple `abomey-calavi`).
      schema:
        type: string
        pattern: ^[a-z][a-z0-9_-]{1,99}$
    CleaningServiceCode:
      name: code
      in: path
      required: true
      description: Code de la prestation.
      schema:
        type: string
        pattern: ^[a-z][a-z0-9_]{1,49}$
    Limit:
      name: limit
      in: query
      required: false
      description: 20 par défaut, 100 au plus.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      description: Valeur `nextCursor` de la page précédente.
      schema:
        type: string
        format: uuid
    CleaningRequestStatus:
      name: status
      in: query
      required: false
      schema:
        enum:
          - received
          - visit_scheduled
          - quote_sent
          - accepted
          - declined
          - rejected
          - expired
          - cancelled
    CleaningCommuneFilter:
      name: commune
      in: query
      required: false
      description: Code de zone (commune normalisée, par exemple `abomey-calavi`, comme `code` des zones desservies).
      schema:
        type: string
        pattern: ^[a-z][a-z0-9-]{1,99}$
    CleaningCustomerKind:
      name: customerKind
      in: query
      required: false
      description: Type de client de la demande.
      schema:
        enum:
          - individual
          - business
    CleaningMissionStatus:
      name: status
      in: query
      required: false
      schema:
        enum:
          - to_schedule
          - scheduled
          - in_progress
          - on_hold
          - completed
          - cancelled
    CleaningPlaceTypeCode:
      name: code
      in: path
      required: true
      description: Code du type de lieu (ADR-034), par exemple `house`.
      schema:
        type: string
        pattern: ^[a-z][a-z0-9_]{1,49}$
    CleaningGroupIdFilter:
      name: groupId
      in: query
      required: false
      description: Groupe de demandes (ADR-034).
      schema:
        type: string
        format: uuid
    CleaningPlaceTypeFilter:
      name: placeType
      in: query
      required: false
      description: Code du type de lieu (ADR-034).
      schema:
        type: string
        pattern: ^[a-z][a-z0-9_]{1,49}$
    CleaningServiceCodeFilter:
      name: serviceCode
      in: query
      required: false
      description: Code de la prestation.
      schema:
        type: string
        pattern: ^[a-z][a-z0-9_]{1,49}$
    CleaningAgentIdFilter:
      name: agentId
      in: query
      required: false
      description: Agent de la visite (supervision seulement ; ignoré pour un agent).
      schema:
        type: string
        format: uuid
    CleaningFromFilter:
      name: from
      in: query
      required: false
      description: Visites prévues à partir de cette date (incluse).
      schema:
        type: string
        format: date-time
    CleaningToFilter:
      name: to
      in: query
      required: false
      description: Visites prévues avant cette date (exclue).
      schema:
        type: string
        format: date-time
    CleaningVisitStatus:
      name: status
      in: query
      required: false
      schema:
        enum:
          - scheduled
          - completed
          - cancelled
    OptionalIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 'Clé facultative (8 à 100 caractères), ajoutée sans rupture à une route déjà branchée : un second envoi avec la même clé ne crée rien de plus. Sans clé, aucun contrôle de rejeu.'
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{8,100}$
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 'Clé unique par opération (8 à 100 caractères) : un second envoi avec la même clé ne crée rien de plus.'
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{8,100}$

  responses:
    BadRequest:
      description: Requête invalide (`GATEWAY_VALIDATION_FAILED`, `GATEWAY_CLIENT_UNKNOWN`, `IDENTITY_OTP_INVALID`, `IDENTITY_MFA_CODE_INVALID`, `IDENTITY_MFA_CODE_REUSED`, `IDENTITY_EMAIL_INVALID`)
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/X-Correlation-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: IDENTITY_OTP_INVALID
              message: Le code est incorrect.
              details:
                attemptsRemaining: 3
              correlationId: 0192f1c4-7a2b-7c3d-8e4f-5a6b7c8d9e12
    Unauthorized:
      description: Jeton absent, invalide, expiré ou session révoquée (`GATEWAY_TOKEN_MISSING`, `GATEWAY_TOKEN_INVALID`, `GATEWAY_TOKEN_EXPIRED`, `IDENTITY_REFRESH_TOKEN_*`, `IDENTITY_SESSION_REVOKED`, `IDENTITY_MFA_TOKEN_INVALID`)
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/X-Correlation-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: GATEWAY_TOKEN_EXPIRED
              message: Votre session a expiré, reconnectez-vous.
              details: {}
              correlationId: 0192f1c4-7a2b-7c3d-8e4f-5a6b7c8d9e12
    NotFound:
      description: Introuvable (`IDENTITY_USER_NOT_FOUND`, `IDENTITY_ORGANIZATION_NOT_FOUND`)
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/X-Correlation-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: IDENTITY_USER_NOT_FOUND
              message: Compte introuvable.
              details: {}
              correlationId: 0192f1c4-7a2b-7c3d-8e4f-5a6b7c8d9e12
    Forbidden:
      description: Accès refusé (`IDENTITY_ACCOUNT_SUSPENDED`, `IDENTITY_BACKOFFICE_FORBIDDEN`, `IDENTITY_CONTEXT_FORBIDDEN`, `IDENTITY_ORGANIZATION_FORBIDDEN`, `IDENTITY_ACCOUNT_DELETION_PENDING`, `GATEWAY_ACCOUNT_DELETION_PENDING`, session restreinte d'un compte en cours de suppression)
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/X-Correlation-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: IDENTITY_ACCOUNT_SUSPENDED
              message: Ce compte est suspendu.
              details: {}
              correlationId: 0192f1c4-7a2b-7c3d-8e4f-5a6b7c8d9e12
    UnprocessableEntity:
      description: Code expiré ou annulé, étape de double authentification impossible, adresse déjà vérifiée, état de l'organisation incompatible (`IDENTITY_OTP_EXPIRED`, `IDENTITY_OTP_TOO_MANY_ATTEMPTS`, `IDENTITY_MFA_*`, `IDENTITY_EMAIL_ALREADY_VERIFIED`, `IDENTITY_ORGANIZATION_NOT_ACTIVE`, `IDENTITY_ORGANIZATION_TOO_MANY_PENDING`, `IDENTITY_ORGANIZATION_INVALID_TRANSITION`)
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/X-Correlation-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: IDENTITY_OTP_EXPIRED
              message: Le code a expiré, demandez-en un nouveau.
              details: {}
              correlationId: 0192f1c4-7a2b-7c3d-8e4f-5a6b7c8d9e12
    TooManyRequests:
      description: Trop de requêtes (`GATEWAY_RATE_LIMITED`, `IDENTITY_OTP_RATE_LIMITED`)
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/X-Correlation-Id'
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: IDENTITY_OTP_RATE_LIMITED
              message: Trop de codes demandés, réessayez plus tard.
              details:
                retryAfterSeconds: 45
              correlationId: 0192f1c4-7a2b-7c3d-8e4f-5a6b7c8d9e12
    ServiceUnavailable:
      description: Service momentanément indisponible, coupe-circuit ouvert (`IDENTITY_UNAVAILABLE`, `IDENTITY_DELETION_CHECK_UNAVAILABLE`, un service n'a pas pu confirmer l'absence d'obligation, réessayer plus tard)
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/X-Correlation-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: IDENTITY_UNAVAILABLE
              message: Le service est momentanément indisponible, réessayez dans quelques instants.
              details: {}
              correlationId: 0192f1c4-7a2b-7c3d-8e4f-5a6b7c8d9e12

    Conflict:
      description: Conflit (`CLEANING_TEAM_UNAVAILABLE`, `CLEANING_CONCURRENT_UPDATE`, `CLEANING_AGENT_ALREADY_REGISTERED`, `IDENTITY_EMAIL_ALREADY_USED`, `IDENTITY_ORGANIZATION_ALREADY_EXISTS`)
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/X-Correlation-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: CLEANING_TEAM_UNAVAILABLE
              message: Un ou plusieurs agents sont déjà pris sur ce créneau.
              details:
                agentIds:
                  - 0192f1c4-7a2b-7c3d-8e4f-5a6b7c8d0002
              correlationId: 0192f1c4-7a2b-7c3d-8e4f-5a6b7c8d9e12

    PayloadTooLarge:
      description: Corps de requête au-delà de 1 Mo (`GATEWAY_PAYLOAD_TOO_LARGE`)
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/X-Correlation-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: GATEWAY_PAYLOAD_TOO_LARGE
              message: La requête est trop volumineuse.
              details: {}
              correlationId: 0192f1c4-7a2b-7c3d-8e4f-5a6b7c8d9e12
    InternalError:
      description: |
        Erreur interne (`GATEWAY_INTERNAL_ERROR`, `GATEWAY_UPSTREAM_ERROR`). Le message ne donne
        jamais de détail technique.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/X-Correlation-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: GATEWAY_INTERNAL_ERROR
              message: Une erreur inattendue est survenue. Réessayez dans quelques instants.
              details: {}
              correlationId: 0192f1c4-7a2b-7c3d-8e4f-5a6b7c8d9e12
    GatewayTimeout:
      description: Le service appelé n'a pas répondu à temps (`IDENTITY_TIMEOUT`)
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/X-Correlation-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: IDENTITY_TIMEOUT
              message: Le service met trop de temps à répondre, réessayez dans quelques instants.
              details: {}
              correlationId: 0192f1c4-7a2b-7c3d-8e4f-5a6b7c8d9e12

  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, details, correlationId]
          properties:
            code:
              type: string
              pattern: '^[A-Z]+(_[A-Z0-9]+)+$'
              description: Forme SERVICE_RAISON.
            message:
              type: string
              description: Message lisible par l'utilisateur, en français.
            details:
              type: object
            correlationId:
              type: string
              format: uuid

    PhoneE164:
      type: string
      pattern: '^\+[1-9][0-9]{6,14}$'
      description: Numéro au format international E.164.

    OtpChannel:
      type: string
      enum: [sms, whatsapp]

    UserStatus:
      type: string
      enum: [pending_verification, active, locked, suspended, deletion_pending, deleted]

    User:
      type: object
      additionalProperties: false
      required: [id, status, firstName, lastName, phone, email, emailVerified, preferredLanguage, createdAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/UserStatus'
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        phone:
          oneOf:
            - $ref: '#/components/schemas/PhoneE164'
            - type: 'null'
        email:
          type: [string, 'null']
          format: email
          description: Adresse du compte, en minuscules ; enregistrée seulement après confirmation par code.
        emailVerified:
          type: boolean
          description: L'e-mail a été confirmé par un code. Seule une adresse vérifiée reçoit des e-mails.
        preferredLanguage:
          type: string
        createdAt:
          type: string
          format: date-time

    RequestOtpRequest:
      type: object
      additionalProperties: false
      required: [phone]
      properties:
        phone:
          $ref: '#/components/schemas/PhoneE164'
        channel:
          $ref: '#/components/schemas/OtpChannel'
          default: whatsapp

    RequestOtpResponse:
      type: object
      additionalProperties: false
      required: [challengeId, maskedTarget, channel, expiresInSeconds, resendAfterSeconds]
      properties:
        challengeId:
          type: string
          format: uuid
          description: À renvoyer avec le code.
        maskedTarget:
          type: string
        channel:
          $ref: '#/components/schemas/OtpChannel'
          description: Canal réellement utilisé, après une éventuelle bascule.
        expiresInSeconds:
          type: integer
          minimum: 1
        resendAfterSeconds:
          type: integer
          minimum: 0

    VerifyOtpRequest:
      type: object
      additionalProperties: false
      required: [challengeId, code]
      properties:
        challengeId:
          type: string
          format: uuid
        code:
          type: string
          pattern: '^[0-9]{4,8}$'
          description: Longueur fixée par configuration (6 chiffres proposés).
        deviceLabel:
          type: string
          maxLength: 100
          description: Nom de l'appareil affiché dans la liste des sessions ; déduit du User-Agent s'il est absent.

    SessionResponse:
      type: object
      additionalProperties: false
      required:
        [
          status,
          accessToken,
          accessTokenExpiresAt,
          refreshTokenExpiresAt,
          sessionId,
          user,
          profileIncomplete,
          activeContext,
        ]
      properties:
        status:
          const: authenticated
        accessToken:
          type: string
        accessTokenExpiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
          description: Mobile uniquement. Web et back-office le reçoivent dans le cookie.
        refreshTokenExpiresAt:
          type: string
          format: date-time
        sessionId:
          type: string
          format: uuid
        user:
          $ref: '#/components/schemas/User'
        profileIncomplete:
          type: boolean
          description: Le nom n'est pas encore renseigné ; il est obligatoire avant tout paiement.
        activeContext:
          $ref: '#/components/schemas/ActiveContext'

    VerifyOtpSessionResponse:
      type: object
      additionalProperties: false
      required:
        [
          status,
          accessToken,
          accessTokenExpiresAt,
          refreshTokenExpiresAt,
          sessionId,
          user,
          profileIncomplete,
          activeContext,
          isNewUser,
        ]
      properties:
        status:
          const: authenticated
        accessToken:
          type: string
        accessTokenExpiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
          description: Mobile uniquement. Web et back-office le reçoivent dans le cookie.
        refreshTokenExpiresAt:
          type: string
          format: date-time
        sessionId:
          type: string
          format: uuid
        user:
          $ref: '#/components/schemas/User'
        profileIncomplete:
          type: boolean
        activeContext:
          $ref: '#/components/schemas/ActiveContext'
        isNewUser:
          type: boolean
          description: Le compte vient d'être créé par ce code.

    MfaRequiredResponse:
      type: object
      additionalProperties: false
      required: [status, mfaToken, expiresAt, methods, enrollmentRequired]
      properties:
        status:
          const: mfa_required
        mfaToken:
          type: string
          description: Jeton court (5 minutes), à usage unique, à présenter aux routes /api/v1/identity/mfa/….
        expiresAt:
          type: string
          format: date-time
        methods:
          type: array
          items:
            type: string
            enum: [totp, recovery_code, sms]
        enrollmentRequired:
          type: boolean
          description: L'application d'authentification doit être configurée avant tout accès.

    MfaToken:
      type: string
      minLength: 1
      maxLength: 128
      description: Jeton reçu dans la réponse mfa_required de /api/v1/identity/otp/verify.

    EnrollTotpRequest:
      type: object
      additionalProperties: false
      required: [mfaToken]
      properties:
        mfaToken:
          $ref: '#/components/schemas/MfaToken'

    TotpEnrollmentResponse:
      type: object
      additionalProperties: false
      required: [secret, otpauthUri, issuer, accountName, digits, periodSeconds]
      properties:
        secret:
          type: string
          pattern: '^[A-Z2-7]+$'
          description: Secret en base32, pour une saisie à la main. Affiché une seule fois.
        otpauthUri:
          type: string
          pattern: '^otpauth://totp/'
          description: À afficher en QR code.
        issuer:
          type: string
        accountName:
          type: string
        digits:
          const: 6
        periodSeconds:
          const: 30

    ConfirmTotpRequest:
      type: object
      additionalProperties: false
      required: [mfaToken, code]
      properties:
        mfaToken:
          $ref: '#/components/schemas/MfaToken'
        code:
          type: string
          pattern: '^[0-9]{6}$'
          description: Premier code affiché par l'application d'authentification.

    TotpConfirmedResponse:
      type: object
      additionalProperties: false
      required:
        [
          status,
          accessToken,
          accessTokenExpiresAt,
          refreshTokenExpiresAt,
          sessionId,
          user,
          profileIncomplete,
          activeContext,
          recoveryCodes,
        ]
      properties:
        status:
          const: authenticated
        accessToken:
          type: string
        accessTokenExpiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
          description: Mobile uniquement. Web et back-office le reçoivent dans le cookie.
        refreshTokenExpiresAt:
          type: string
          format: date-time
        sessionId:
          type: string
          format: uuid
        user:
          $ref: '#/components/schemas/User'
        profileIncomplete:
          type: boolean
        activeContext:
          $ref: '#/components/schemas/ActiveContext'
        recoveryCodes:
          type: array
          minItems: 10
          maxItems: 10
          description: Codes de récupération, chacun utilisable une fois, affichés une seule fois.
          items:
            type: string
            pattern: '^[0-9A-Z]{5}-[0-9A-Z]{5}$'

    VerifyMfaRequest:
      type: object
      additionalProperties: false
      required: [mfaToken, method, code]
      properties:
        mfaToken:
          $ref: '#/components/schemas/MfaToken'
        method:
          type: string
          enum: [totp, recovery_code]
        code:
          type: string
          pattern: '^[0-9A-Za-z -]{6,20}$'
          description: 6 chiffres pour totp ; code de récupération (tirets et espaces ignorés).

    MfaSessionResponse:
      type: object
      additionalProperties: false
      required:
        [
          status,
          accessToken,
          accessTokenExpiresAt,
          refreshTokenExpiresAt,
          sessionId,
          user,
          profileIncomplete,
          activeContext,
          recoveryCodesRemaining,
        ]
      properties:
        status:
          const: authenticated
        accessToken:
          type: string
        accessTokenExpiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
          description: Mobile uniquement. Web et back-office le reçoivent dans le cookie.
        refreshTokenExpiresAt:
          type: string
          format: date-time
        sessionId:
          type: string
          format: uuid
        user:
          $ref: '#/components/schemas/User'
        profileIncomplete:
          type: boolean
        activeContext:
          $ref: '#/components/schemas/ActiveContext'
        recoveryCodesRemaining:
          type: integer
          minimum: 0
          description: Codes de récupération encore utilisables ; le back-office prévient quand il en reste peu.

    RefreshSessionRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      description: Mobile uniquement ; web et back-office n'envoient pas de corps.
      properties:
        refreshToken:
          type: string

    LogoutRequest:
      type: object
      additionalProperties: false
      properties:
        scope:
          type: string
          enum: [this_device, all_devices]
          default: this_device

    LogoutResponse:
      type: object
      additionalProperties: false
      required: [revokedSessions]
      properties:
        revokedSessions:
          type: integer
          minimum: 0

    ActiveContext:
      type: object
      additionalProperties: false
      required: [type, organizationId]
      description: |
        Contexte actif de la session, celui du jeton d'accès (claim `ctx`) : il fixe le type de compte
        réel que lisent les services métier. `individual` (particulier, contexte personnel) : choix du
        paiement, tout réglé à la fin. `business` (entreprise, organisation active) : facture mensuelle,
        pas de choix du moyen de paiement, jours d'intervention par semaine (Nettoyage). Une session
        s'ouvre dans le contexte personnel ; `POST /api/v1/identity/context` active une organisation
        validée (ADR-027).
      properties:
        type:
          type: string
          enum: [individual, business]
        organizationId:
          type: [string, 'null']
          format: uuid
          description: Organisation active d'une entreprise ; null pour un particulier.
        organizationName:
          type: [string, 'null']
          description: Raison sociale de l'organisation active ; null pour un particulier.

    MeResponse:
      type: object
      additionalProperties: false
      required: [user, profileIncomplete, pendingEmail, activeContext, deletion]
      properties:
        user:
          $ref: '#/components/schemas/User'
        profileIncomplete:
          type: boolean
        activeContext:
          $ref: '#/components/schemas/ActiveContext'
        pendingEmail:
          type: [string, 'null']
          format: email
          description: Adresse en attente de confirmation par code (code envoyé, encore valable) ; null sinon.
        deletion:
          oneOf:
            - $ref: '#/components/schemas/AccountDeletion'
            - type: 'null'
          description: Suppression demandée (compte `deletion_pending`, ADR-036) ; null sinon.

    DeletionObstacle:
      type: object
      additionalProperties: false
      required: [service, kind, reference, description]
      description: Raison lisible qui empêche la suppression d'un compte (ADR-036).
      properties:
        service:
          type: string
          description: Service qui l'a signalée (`cleaning`, `billing`, `payment`…) ou `identity` (compte entreprise).
        kind:
          type: string
          description: Nature, par exemple `open_cleaning_mission`, `open_cleaning_request`, `unpaid_invoice`, `pending_payment`, `payment_under_review`, `last_org_admin`.
        reference:
          type: string
          description: Référence lisible de l'objet concerné (numéro de facture, identifiant, raison sociale).
        description:
          type: string
          description: Explication à afficher.

    AccountDeletion:
      type: object
      additionalProperties: false
      required: [requestedAt, scheduledFor, postponedBy]
      properties:
        requestedAt:
          type: string
          format: date-time
        scheduledFor:
          type: string
          format: date-time
          description: Date prévue de l'anonymisation, fixée à la demande.
        postponedBy:
          type: array
          description: Obligations trouvées à l'échéance ; tant qu'il en reste, la suppression est reportée.
          items:
            $ref: '#/components/schemas/DeletionObstacle'

    RequestAccountDeletionResponse:
      type: object
      additionalProperties: false
      required: [deletion]
      properties:
        deletion:
          $ref: '#/components/schemas/AccountDeletion'

    CancelAccountDeletionResponse:
      type: object
      additionalProperties: false
      required: [user, profileIncomplete, activeContext, accessToken, accessTokenExpiresAt]
      properties:
        user:
          $ref: '#/components/schemas/User'
        profileIncomplete:
          type: boolean
        activeContext:
          $ref: '#/components/schemas/ActiveContext'
        accessToken:
          type: string
          description: Nouveau jeton d'accès complet, à utiliser à la place du jeton restreint.
        accessTokenExpiresAt:
          type: string
          format: date-time

    SwitchContextRequest:
      type: object
      additionalProperties: false
      required: [organizationId]
      properties:
        organizationId:
          type: [string, 'null']
          format: uuid
          description: Organisation à activer ; null pour revenir au contexte personnel.

    SwitchContextResponse:
      type: object
      additionalProperties: false
      required: [accessToken, accessTokenExpiresAt, activeContext]
      properties:
        accessToken:
          type: string
          description: Nouveau jeton d'accès, à utiliser à la place du précédent.
        accessTokenExpiresAt:
          type: string
          format: date-time
        activeContext:
          $ref: '#/components/schemas/ActiveContext'

    OrganizationStatus:
      type: string
      enum: [pending_review, active, rejected, suspended]
      description: |
        `pending_review` : en attente de validation par KSP ; `active` : validée, peut devenir le
        contexte actif ; `rejected` : refusée (définitif) ; `suspended` : suspendue par KSP.

    OrgRole:
      type: string
      enum: [org_admin, org_member, org_viewer]
      description: Rôle dans l'organisation ; seul `org_admin` (le créateur) est attribué aujourd'hui.

    Organization:
      type: object
      additionalProperties: false
      required:
        [
          id,
          legalName,
          address,
          ifu,
          rccm,
          billingEmail,
          status,
          rejectionReason,
          suspensionReason,
          createdAt,
          reviewedAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        legalName:
          type: string
          description: Raison sociale.
        address:
          type: string
        ifu:
          type: string
          pattern: '^[0-9]{13}$'
          description: Identifiant fiscal unique (13 chiffres).
        rccm:
          type: [string, 'null']
          description: Registre du commerce et du crédit mobilier ; null s'il n'est pas renseigné.
        billingEmail:
          type: [string, 'null']
          format: email
          description: E-mail de facturation, toujours confirmé par code ; null si aucun ne l'est.
        status:
          $ref: '#/components/schemas/OrganizationStatus'
        rejectionReason:
          type: [string, 'null']
          description: Motif du refus (`rejected`).
        suspensionReason:
          type: [string, 'null']
          description: Motif de la suspension en cours (`suspended`).
        createdAt:
          type: string
          format: date-time
        reviewedAt:
          type: [string, 'null']
          format: date-time
          description: Date de la validation ou du refus.

    OrganizationMembership:
      type: object
      additionalProperties: false
      required: [organization, role, pendingBillingEmail]
      properties:
        organization:
          $ref: '#/components/schemas/Organization'
        role:
          $ref: '#/components/schemas/OrgRole'
        pendingBillingEmail:
          type: [string, 'null']
          format: email
          description: E-mail de facturation en attente de confirmation (code envoyé, encore valable) ; null sinon.

    OrganizationMembershipList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationMembership'

    CreateOrganizationRequest:
      type: object
      additionalProperties: false
      required: [legalName, address, ifu]
      properties:
        legalName:
          type: string
          minLength: 1
          maxLength: 200
          description: Raison sociale.
        address:
          type: string
          minLength: 1
          maxLength: 300
        ifu:
          type: string
          minLength: 1
          maxLength: 30
          description: Identifiant fiscal unique, 13 chiffres (espaces ignorés) ; format contrôlé par identity.
        rccm:
          type: string
          minLength: 1
          maxLength: 50
          description: Facultatif, par exemple `RB/COT/19 B 12345`.

    OrganizationDecisionRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Motif communiqué au client.

    AdminOrganization:
      type: object
      additionalProperties: false
      required:
        [
          id,
          legalName,
          address,
          ifu,
          rccm,
          billingEmail,
          status,
          rejectionReason,
          suspensionReason,
          createdAt,
          reviewedAt,
          createdBy,
          reviewedBy,
          suspendedAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        legalName:
          type: string
        address:
          type: string
        ifu:
          type: string
          pattern: '^[0-9]{13}$'
        rccm:
          type: [string, 'null']
        billingEmail:
          type: [string, 'null']
          format: email
        status:
          $ref: '#/components/schemas/OrganizationStatus'
        rejectionReason:
          type: [string, 'null']
        suspensionReason:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
        reviewedAt:
          type: [string, 'null']
          format: date-time
        createdBy:
          type: string
          format: uuid
          description: Compte qui a demandé la création.
        reviewedBy:
          type: [string, 'null']
          format: uuid
          description: Admin KSP qui a validé ou refusé la demande.
        suspendedAt:
          type: [string, 'null']
          format: date-time

    AdminOrganizationList:
      type: object
      additionalProperties: false
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdminOrganization'
        nextCursor:
          type: [string, 'null']
          format: uuid

    OrganizationMember:
      type: object
      additionalProperties: false
      required: [userId, role, firstName, lastName, phone, joinedAt]
      properties:
        userId:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/OrgRole'
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        phone:
          type: [string, 'null']
        joinedAt:
          type: string
          format: date-time

    AdminOrganizationDetail:
      type: object
      additionalProperties: false
      required: [organization, members]
      properties:
        organization:
          $ref: '#/components/schemas/AdminOrganization'
        members:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationMember'

    ChangeEmailRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 254
          description: Adresse à confirmer ; espaces autour retirés et mise en minuscules par identity.

    ChangeEmailResponse:
      type: object
      additionalProperties: false
      required: [pendingEmail, expiresInSeconds, resendAfterSeconds]
      properties:
        pendingEmail:
          type: string
          format: email
          description: Adresse à confirmer, normalisée.
        expiresInSeconds:
          type: integer
          minimum: 1
        resendAfterSeconds:
          type: integer
          minimum: 0
          description: Délai avant de pouvoir demander un nouveau code.

    ConfirmEmailRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          pattern: '^[0-9]{4,8}$'
          description: Code reçu par e-mail.

    UpdateMeRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        preferredLanguage:
          type: string
          pattern: '^[a-z]{2}$'
          description: Code de langue, "fr" par défaut.

    FindAccountByPhoneRequest:
      type: object
      additionalProperties: false
      required: [phone]
      properties:
        phone:
          $ref: '#/components/schemas/PhoneE164'

    AdminAccountMatch:
      type: object
      additionalProperties: false
      required: [userId, status, firstName, lastName, phoneMasked]
      description: Compte trouvé par son numéro (ADR-029) — le minimum pour le reconnaître et le rattacher.
      properties:
        userId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/UserStatus'
        firstName:
          type: [string, 'null']
          description: Null tant que le profil n'est pas complété.
        lastName:
          type: [string, 'null']
        phoneMasked:
          type: string
          description: Indicatif et deux derniers chiffres, par exemple `+229********45`.

    SearchAccountsRequest:
      type: object
      additionalProperties: false
      description: Recherche de comptes (ADR-043). Tout champ absent prend sa valeur par défaut.
      properties:
        query:
          type: string
          maxLength: 100
          description: Vide (comptes qui ont un rôle), numéro E.164 complet, ou nom (2 lettres au moins).
        limit:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
        cursor:
          type: string
          format: uuid
          description: Valeur `nextCursor` de la page précédente.

    GrantAccountRoleRequest:
      type: object
      additionalProperties: false
      required: [roleCode, reason]
      properties:
        roleCode:
          type: string
          pattern: ^[a-z][a-z0-9_]{1,63}$
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Motif tracé dans le journal d'audit d'identity (une ligne).

    RevokeAccountRoleRequest:
      type: object
      additionalProperties: false
      required: [assignmentId, reason]
      properties:
        assignmentId:
          type: string
          format: uuid
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Motif tracé et publié dans `identity.role.revoked` (une ligne).

    AccountAdminReasonRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Motif tracé dans le journal d'audit d'identity (une ligne).

    RoleScopeType:
      type: string
      enum: [global, domain, org, personal]

    AdminAccount:
      type: object
      additionalProperties: false
      required:
        [
          userId,
          status,
          firstName,
          lastName,
          phone,
          phoneMasked,
          createdAt,
          suspendedAt,
          suspensionReason,
          roles,
        ]
      description: Compte vu par l'administration des comptes (ADR-043).
      properties:
        userId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/UserStatus'
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        phone:
          type: [string, 'null']
          description: Numéro complet pour `super_admin` ; null pour un administrateur de métier.
        phoneMasked:
          type: [string, 'null']
          description: Indicatif et deux derniers chiffres ; null si le compte n'a pas de numéro.
        createdAt:
          type: string
          format: date-time
        suspendedAt:
          type: [string, 'null']
          format: date-time
        suspensionReason:
          type: [string, 'null']
        roles:
          type: array
          description: Codes des rôles actifs, dans l'ordre d'attribution.
          items:
            type: string

    AdminAccountList:
      type: object
      additionalProperties: false
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdminAccount'
        nextCursor:
          type: [string, 'null']
          format: uuid

    AdminRoleAssignment:
      type: object
      additionalProperties: false
      required:
        [
          id,
          roleCode,
          roleDescription,
          service,
          scopeType,
          scopeId,
          grantedAt,
          grantedBy,
          grantedByName,
          grantReason,
          revokedAt,
          revokedBy,
          revokedByName,
          revokeReason,
          revocable,
        ]
      description: Une attribution de rôle, active (revokedAt null) ou retirée.
      properties:
        id:
          type: string
