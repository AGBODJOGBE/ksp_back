      description: |
        Géocodage inverse (ADR-034) : Nominatim auto-hébergé d’abord, Google Maps en secours ; la commune trouvée est
        rapprochée des zones desservies (même normalisation que `code`, noms alternatifs compris). Client connecté
        seulement (un fournisseur est payant), limite dédiée `cleaning_geocoding`. Les coordonnées voyagent dans le
        corps (jamais dans l’adresse) et ne sont jamais journalisées.

        Aucun fournisseur ne trouve : `commune`, `zoneCode` et `provider` à `null` ; le client choisit alors sa commune
        dans `GET /api/v1/cleaning/zones`. Commune trouvée mais non desservie : `served: false`.

        Erreurs : `GATEWAY_VALIDATION_FAILED` (400, coordonnées hors bornes), `AUTH_REQUIRED` (401).
