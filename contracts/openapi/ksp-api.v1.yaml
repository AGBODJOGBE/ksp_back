      operationId: cleaningCorrectRequestLocation
      summary: Corriger la position d’un dossier
      description: |
        UC-NT-30 — R-DM-07, R-DM-08, R-ZN-01.

        Tant que le dossier n’est pas clos ou que son programme n’est pas terminé ; motif obligatoire. La commune est recalculée par son contour : hors contour ou commune non desservie, refus. Si la commune change alors qu’un devis est envoyé ou qu’un programme est en cours, refus (`CLEANING_INVALID_TRANSITION`, reason commune_change_locked) : le prix en dépend. La correction s’applique, en une transaction, à la copie de la position dans la demande (R-DM-08), donc à la visite et aux séances à venir, et au lieu de « Mes lieux » (position corrigée par KSP) s’il n’a pas été modifié depuis l’envoi. Tracée sans coordonnées ni repère. L’agent sur place (« utiliser ma position ») passe par `PUT /api/v1/cleaning/agent/requests/{id}/location`.

        Idempotent par `Idempotency-Key` : un rejeu avec la même clé renvoie le même résultat, sans nouvel effet.

