        d'abord ; un compte supprimé n'apparaît jamais. La recherche voyage dans le corps, jamais dans
        l'adresse (journalisée). Numéro complet pour `super_admin` seulement ; masqué pour les autres.

        Erreurs : `GATEWAY_VALIDATION_FAILED`, `IDENTITY_ACCOUNT_ADMIN_INVALID` (400, `details.field = query`).

        Rôles : `cleaning_admin`, `recovery_admin` (rôles de leur métier seulement, revérifié par identity), `super_admin` ; double authentification faite pendant la session (12 heures au plus).
