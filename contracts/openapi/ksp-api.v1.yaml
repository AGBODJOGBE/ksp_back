  /api/v1/document/documents/{id}/download-url:
    get:
      tags:
        - Documents
      operationId: getMyDocumentDownloadUrl
      summary: Adresse de lecture du PDF d’un document
      description: |
        Adresse présignée de **courte durée** (5 minutes) pour lire le PDF directement dans le stockage : le PDF
        signé (pages d'origine et page de certificat) s'il est signé, sinon le PDF produit (`version`). Mêmes
        droits que la lecture du document. À demander juste avant l'affichage ; ne jamais l'enregistrer.

        Erreurs : `GATEWAY_VALIDATION_FAILED` (400), `DOCUMENT_NOT_FOUND` (404), `DOCUMENT_DEPENDENCY_UNAVAILABLE` (503).
