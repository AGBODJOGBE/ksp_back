          type: array
          items:
            $ref: '#/components/schemas/CleaningTariffSupplement'
        minimum:
          $ref: '#/components/schemas/Money'
          description: Prix minimum d’une séance pour cette offre Absent pour qui n’a pas le droit de voir les montants (agent ; personnel sans `cleaning.amounts.read`).
        frequencyCoefficients:
          type: array
          items:
