      description: |
        Champ du formulaire, définition complète (back-office, ADR-033). Propriétés propres à un autre type : null ou
        liste vide. Prix null : non fixé (`priced: false` si le calcul en a besoin) ; 0 : sans effet.
      required:
        - code
        - label
        - type
        - required
        - helpText
        - active
        - unitLabel
        - min
        - max
        - pricePerUnit
        - choices
        - supplementIfYes
        - coefficientBpIfYes
      properties:
        code:
          type: string
          pattern: ^[a-z][a-z0-9_]{1,49}$
        label:
          type: string
        type:
          $ref: '#/components/schemas/CleaningFieldType'
        required:
          type: boolean
        helpText:
          type:
            - string
            - 'null'
        active:
          type: boolean
        unitLabel:
          type:
            - string
            - 'null'
          description: '`number` : unité libre (« m² », « m³ », « pièces », « mètres linéaires »…).'
        min:
          type:
            - integer
            - 'null'
        max:
          type:
            - integer
            - 'null'
        pricePerUnit:
          description: '`number` : prix par unité.'
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        choices:
          type: array
          description: '`choice` : valeurs, dans l’ordre d’affichage.'
          items:
            $ref: '#/components/schemas/CleaningFieldChoice'
        supplementIfYes:
          description: '`boolean` : supplément si la réponse est oui (« non » n’a jamais d’effet).'
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        coefficientBpIfYes:
          type:
            - integer
            - 'null'
          minimum: 1
          maximum: 100000
          description: '`boolean` : coefficient si la réponse est oui. Supplément et coefficient null — réponse oui sans prix.'
    CleaningOptionDefinition:
      type: object
      additionalProperties: false
      required:
        - code
        - label
        - description
        - active
        - flatPrice
        - fields
      properties:
        code:
          type: string
          pattern: ^[a-z][a-z0-9_]{1,49}$
        label:
          type: string
        description:
          type:
            - string
            - 'null'
        active:
          type: boolean
        flatPrice:
          description: Forfait de l’option, null si aucun. Une option sans champ et sans forfait n’a pas de prix.
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        fields:
          type: array
          items:
            $ref: '#/components/schemas/CleaningFieldDefinition'
    CleaningFrequency:
