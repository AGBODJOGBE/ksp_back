      summary: Recharger mon portefeuille
      description: |
        Recharge du portefeuille prépayé du titulaire connecté (son organisation active, membre `org_admin` ou
        `org_member` ; sinon son compte) par Mobile Money (ADR-046). Le montant est choisi par le client, entre
        les limites rendues par `GET /api/v1/wallet/me` (`topUpLimits`, réglables). payment crée la page de
        paiement du prestataire (`checkoutUrl`) : rediriger le client, puis suivre le paiement par
        `GET /api/v1/payment/payments/{paymentId}`. Le portefeuille est crédité **à la confirmation par le
        prestataire** (jamais au retour du navigateur), une seule fois ; relire alors `GET /api/v1/wallet/me`.

