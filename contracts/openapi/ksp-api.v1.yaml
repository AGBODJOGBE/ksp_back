components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Jeton d'accès ES256 délivré par identity, valable 15 minutes.
    refreshCookieWeb:
      type: apiKey
      in: cookie
      name: __Secure-ksp_rt
      description: Jeton de renouvellement des sites web (portail, shop, print).
    refreshCookieBackoffice:
      type: apiKey
      in: cookie
      name: __Secure-ksp_admin_rt
      description: Jeton de renouvellement du back-office.

  headers:
    X-Correlation-Id:
      description: Identifiant de la requête, à citer au support.
      schema:
        type: string
        format: uuid
    Set-Cookie-Refresh:
      description: |
        Web et back-office uniquement : nouveau jeton de renouvellement, par exemple
        `__Secure-ksp_rt=…; Path=/api/v1/identity/token; HttpOnly; Secure; SameSite=Strict; Max-Age=2592000`.
      schema:
        type: string
    Set-Cookie-Clear:
      description: 'Web et back-office uniquement : effacement du cookie de renouvellement (`Max-Age=0`).'
      schema:
        type: string
    Retry-After:
      description: Nombre de secondes à attendre avant de réessayer.
      schema:
        type: integer
        minimum: 1

  parameters:
    NotificationId:
      name: id
      in: path
      required: true
      description: Identifiant de la notification (UUID).
      schema:
        type: string
        format: uuid
    DeliveryId:
      name: id
      in: path
      required: true
      description: Identifiant de l'envoi (UUID).
      schema:
        type: string
        format: uuid
    InvoiceId:
      name: id
      in: path
      required: true
      description: Identifiant de la facture (UUID).
      schema:
        type: string
        format: uuid
    PaymentId:
      name: id
      in: path
      required: true
      description: Identifiant du paiement (UUID).
      schema:
        type: string
        format: uuid
    LinkToken:
      name: token
      in: path
      required: true
      description: Jeton du lien de paiement (43 caractères base64url), reçu par SMS ou WhatsApp.
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{43}$
    PayoutId:
      name: id
      in: path
      required: true
      description: Identifiant du reversement (UUID).
      schema:
        type: string
        format: uuid
    HolderType:
      name: type
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/WalletHolderType'
    WalletStatementAccount:
      name: account
      in: query
      required: false
      description: '`collections` (fonds dus au titulaire, ADR-042) ou `prepaid` (portefeuille prépayé, ADR-046) ; absent : les deux.'
      schema:
        enum:
          - collections
          - prepaid
    HolderId:
      name: id
      in: path
      required: true
      description: Compte ou organisation (UUID d'identity).
      schema:
        type: string
        format: uuid
    WalletPayoutStatus:
      name: status
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/WalletPayoutStatus'
    FileId:
      name: id
      in: path
      required: true
      description: Identifiant du fichier (UUID).
      schema:
        type: string
        format: uuid
    DocumentId:
      name: id
      in: path
      required: true
      description: Identifiant du document (UUID).
      schema:
        type: string
        format: uuid
    SignatureRequestId:
      name: id
      in: path
      required: true
      description: Identifiant de la demande de signature (UUID), donné par `signature.id` d'un document.
      schema:
        type: string
        format: uuid
    SigningToken:
      name: token
      in: path
      required: true
      description: Jeton du lien personnel de signature (secret, jamais journalisé), reçu par WhatsApp ou e-mail.
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{20,100}$'
    PaymentStatus:
      name: status
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/PaymentStatus'
    InvoiceStatus:
      name: status
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/InvoiceStatus'
    OrganizationId:
      name: id
      in: path
      required: true
      description: Identifiant de l'organisation (UUID).
      schema:
        type: string
        format: uuid
    AccountId:
      name: id
      in: path
      required: true
      description: Identifiant du compte KSP (UUID).
      schema:
        type: string
        format: uuid
    OrganizationStatus:
      name: status
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/OrganizationStatus'
    CleaningCursor:
      name: cursor
      in: query
      required: false
      description: 'Curseur opaque : valeur `nextCursor` de la page précédente.'
      schema:
        type: string
        maxLength: 500
    Limit:
      name: limit
      in: query
      required: false
      description: 20 par défaut, 100 au plus.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      description: Valeur `nextCursor` de la page précédente.
      schema:
        type: string
        format: uuid
    OptionalIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 'Clé facultative (8 à 100 caractères), ajoutée sans rupture à une route déjà branchée : un second envoi avec la même clé ne crée rien de plus. Sans clé, aucun contrôle de rejeu.'
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{8,100}$
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 'Clé unique par opération (8 à 100 caractères) : un second envoi avec la même clé ne crée rien de plus.'
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{8,100}$

  responses:
    BadRequest:
      description: Requête invalide (`GATEWAY_VALIDATION_FAILED`, `GATEWAY_CLIENT_UNKNOWN`, `IDENTITY_OTP_INVALID`, `IDENTITY_MFA_CODE_INVALID`, `IDENTITY_MFA_CODE_REUSED`, `IDENTITY_EMAIL_INVALID`)
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/X-Correlation-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: IDENTITY_OTP_INVALID
              message: Le code est incorrect.
              details:
                attemptsRemaining: 3
              correlationId: 0192f1c4-7a2b-7c3d-8e4f-5a6b7c8d9e12
    Unauthorized:
      description: Jeton absent, invalide, expiré ou session révoquée (`GATEWAY_TOKEN_MISSING`, `GATEWAY_TOKEN_INVALID`, `GATEWAY_TOKEN_EXPIRED`, `IDENTITY_REFRESH_TOKEN_*`, `IDENTITY_SESSION_REVOKED`, `IDENTITY_MFA_TOKEN_INVALID`)
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/X-Correlation-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: GATEWAY_TOKEN_EXPIRED
              message: Votre session a expiré, reconnectez-vous.
              details: {}
              correlationId: 0192f1c4-7a2b-7c3d-8e4f-5a6b7c8d9e12
    NotFound:
      description: Introuvable (`IDENTITY_USER_NOT_FOUND`, `IDENTITY_ORGANIZATION_NOT_FOUND`)
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/X-Correlation-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: IDENTITY_USER_NOT_FOUND
              message: Compte introuvable.
              details: {}
              correlationId: 0192f1c4-7a2b-7c3d-8e4f-5a6b7c8d9e12
    Forbidden:
      description: Accès refusé (`IDENTITY_ACCOUNT_SUSPENDED`, `IDENTITY_BACKOFFICE_FORBIDDEN`, `IDENTITY_CONTEXT_FORBIDDEN`, `IDENTITY_ORGANIZATION_FORBIDDEN`, `IDENTITY_ACCOUNT_DELETION_PENDING`, `GATEWAY_ACCOUNT_DELETION_PENDING`, session restreinte d'un compte en cours de suppression)
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/X-Correlation-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: IDENTITY_ACCOUNT_SUSPENDED
              message: Ce compte est suspendu.
              details: {}
              correlationId: 0192f1c4-7a2b-7c3d-8e4f-5a6b7c8d9e12
    UnprocessableEntity:
      description: Code expiré ou annulé, étape de double authentification impossible, adresse déjà vérifiée, état de l'organisation incompatible (`IDENTITY_OTP_EXPIRED`, `IDENTITY_OTP_TOO_MANY_ATTEMPTS`, `IDENTITY_MFA_*`, `IDENTITY_EMAIL_ALREADY_VERIFIED`, `IDENTITY_ORGANIZATION_NOT_ACTIVE`, `IDENTITY_ORGANIZATION_TOO_MANY_PENDING`, `IDENTITY_ORGANIZATION_INVALID_TRANSITION`)
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/X-Correlation-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: IDENTITY_OTP_EXPIRED
              message: Le code a expiré, demandez-en un nouveau.
              details: {}
              correlationId: 0192f1c4-7a2b-7c3d-8e4f-5a6b7c8d9e12
    TooManyRequests:
      description: Trop de requêtes (`GATEWAY_RATE_LIMITED`, `IDENTITY_OTP_RATE_LIMITED`)
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/X-Correlation-Id'
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: IDENTITY_OTP_RATE_LIMITED
              message: Trop de codes demandés, réessayez plus tard.
              details:
                retryAfterSeconds: 45
              correlationId: 0192f1c4-7a2b-7c3d-8e4f-5a6b7c8d9e12
    ServiceUnavailable:
      description: Service momentanément indisponible, coupe-circuit ouvert (`IDENTITY_UNAVAILABLE`, `IDENTITY_DELETION_CHECK_UNAVAILABLE`, un service n'a pas pu confirmer l'absence d'obligation, réessayer plus tard)
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/X-Correlation-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: IDENTITY_UNAVAILABLE
              message: Le service est momentanément indisponible, réessayez dans quelques instants.
              details: {}
              correlationId: 0192f1c4-7a2b-7c3d-8e4f-5a6b7c8d9e12

    Conflict:
      description: Conflit (`CLEANING_SCHEDULE_CONFLICT`, `CLEANING_CONCURRENT_UPDATE`, `CLEANING_AGENT_ALREADY_REGISTERED`, `IDENTITY_EMAIL_ALREADY_USED`, `IDENTITY_ORGANIZATION_ALREADY_EXISTS`)
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/X-Correlation-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: CLEANING_SCHEDULE_CONFLICT
              message: Un ou plusieurs agents sont déjà pris sur ce créneau.
              details:
                agentIds:
                  - 0192f1c4-7a2b-7c3d-8e4f-5a6b7c8d0002
              correlationId: 0192f1c4-7a2b-7c3d-8e4f-5a6b7c8d9e12

    PayloadTooLarge:
      description: Corps de requête au-delà de 1 Mo (`GATEWAY_PAYLOAD_TOO_LARGE`)
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/X-Correlation-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: GATEWAY_PAYLOAD_TOO_LARGE
              message: La requête est trop volumineuse.
              details: {}
              correlationId: 0192f1c4-7a2b-7c3d-8e4f-5a6b7c8d9e12
    InternalError:
      description: |
        Erreur interne (`GATEWAY_INTERNAL_ERROR`, `GATEWAY_UPSTREAM_ERROR`). Le message ne donne
        jamais de détail technique.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/X-Correlation-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: GATEWAY_INTERNAL_ERROR
              message: Une erreur inattendue est survenue. Réessayez dans quelques instants.
              details: {}
              correlationId: 0192f1c4-7a2b-7c3d-8e4f-5a6b7c8d9e12
    GatewayTimeout:
      description: Le service appelé n'a pas répondu à temps (`IDENTITY_TIMEOUT`)
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/X-Correlation-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: IDENTITY_TIMEOUT
              message: Le service met trop de temps à répondre, réessayez dans quelques instants.
              details: {}
              correlationId: 0192f1c4-7a2b-7c3d-8e4f-5a6b7c8d9e12

  schemas:
    NotificationChannel:
      type: string
      enum:
        - sms
        - whatsapp
        - email
        - push
        - in_app
    NotificationDeliveryStatus:
      type: string
      description: "`pending` : envoi en cours ; `accepted` : pris en charge par un prestataire ; `failed` : aucun canal n'a abouti."
      enum:
        - pending
        - accepted
        - failed
    InAppNotification:
      type: object
      additionalProperties: false
      required:
        - id
        - templateCode
        - title
        - body
        - link
        - createdAt
        - readAt
      properties:
        id:
          type: string
          format: uuid
        templateCode:
          type: string
        title:
          type: string
        body:
          type: string
          description: Texte brut, lignes séparées par des retours à la ligne.
        link:
          type:
            - string
            - 'null'
          description: Page concernée de l'espace KSP.
        createdAt:
          type: string
          format: date-time
        readAt:
          type:
            - string
            - 'null'
          format: date-time
    InAppNotificationList:
      type: object
      additionalProperties: false
      required:
        - data
        - nextCursor
        - unreadCount
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/InAppNotification'
        nextCursor:
          type:
            - string
            - 'null'
        unreadCount:
          type: integer
          minimum: 0
    UnreadNotificationCount:
      type: object
      additionalProperties: false
      required:
        - unreadCount
      properties:
        unreadCount:
          type: integer
          minimum: 0
    MarkNotificationReadResponse:
      type: object
      additionalProperties: false
      required:
        - notification
        - unreadCount
      properties:
        notification:
          $ref: '#/components/schemas/InAppNotification'
        unreadCount:
          type: integer
          minimum: 0
    MarkAllNotificationsReadResponse:
      type: object
      additionalProperties: false
      required:
        - marked
        - unreadCount
      properties:
        marked:
          type: integer
          minimum: 0
        unreadCount:
          type: integer
          minimum: 0
    NotificationPreferences:
      type: object
      additionalProperties: false
      required:
        - whatsapp
        - email
        - updatedAt
      properties:
        whatsapp:
          type: boolean
        email:
          type: boolean
        updatedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: null tant que les préférences n'ont jamais été modifiées.
    UpdateNotificationPreferencesRequest:
      type: object
      additionalProperties: false
      required:
        - whatsapp
        - email
      properties:
        whatsapp:
          type: boolean
        email:
          type: boolean
    NotificationDelivery:
      type: object
      additionalProperties: false
      required:
        - id
        - templateCode
        - requestedChannel
        - channelUsed
        - channelsTried
        - targetMasked
        - recipientUserId
        - status
        - errorCode
        - failureReason
        - providerMessageId
        - createdAt
        - expiresAt
        - acceptedAt
        - failedAt
        - erased
      properties:
        id:
          type: string
          format: uuid
        templateCode:
          type: string
        requestedChannel:
          $ref: '#/components/schemas/NotificationChannel'
        channelUsed:
          oneOf:
            - $ref: '#/components/schemas/NotificationChannel'
            - type: 'null'
        channelsTried:
          type: array
          description: Canaux considérés, dans l'ordre (sautés compris).
          items:
            $ref: '#/components/schemas/NotificationChannel'
        targetMasked:
          type:
            - string
            - 'null'
          description: Destinataire masqué (+229********45) ; null après l'effacement du compte.
        recipientUserId:
          type:
            - string
            - 'null'
          format: uuid
        status:
          $ref: '#/components/schemas/NotificationDeliveryStatus'
        errorCode:
          type:
            - string
            - 'null'
        failureReason:
          type:
            - string
            - 'null'
          description: recipient_invalid, provider_unavailable, provider_rejected, ttl_expired.
        providerMessageId:
          type:
            - string
            - 'null'
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type:
            - string
            - 'null'
          format: date-time
        acceptedAt:
          type:
            - string
            - 'null'
          format: date-time
        failedAt:
          type:
            - string
            - 'null'
          format: date-time
        erased:
          type: boolean
          description: Envoi détaché d'un compte supprimé (ADR-036).
    NotificationDeliveryList:
      type: object
      additionalProperties: false
      required:
        - data
        - nextCursor
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/NotificationDelivery'
        nextCursor:
          type:
            - string
            - 'null'
    NotificationTemplate:
      type: object
      additionalProperties: false
      required:
        - code
        - kind
        - channels
        - secret
        - optional
        - variables
        - optionalVariables
        - subject
        - text
      properties:
        code:
          type: string
        kind:
          type: string
          description: "`direct` : envoyé à la demande d'un service (codes) ; sinon nature du message d'un événement."
          enum:
            - direct
            - short
            - document
            - important
        channels:
          type: array
          items:
            $ref: '#/components/schemas/NotificationChannel'
        secret:
          type: boolean
        optional:
          type: boolean
          description: Soumis aux préférences du destinataire (ADR-039).
        variables:
          type: array
          items:
            type: string
        optionalVariables:
          type: array
          items:
            type: string
        subject:
          type:
            - string
            - 'null'
        text:
          type:
            - string
            - 'null'
    NotificationTemplateList:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/NotificationTemplate'
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, details, correlationId]
          properties:
            code:
              type: string
              pattern: '^[A-Z]+(_[A-Z0-9]+)+$'
              description: Forme SERVICE_RAISON.
            message:
              type: string
              description: Message lisible par l'utilisateur, en français.
            details:
              type: object
            correlationId:
              type: string
              format: uuid

    PhoneE164:
      type: string
      pattern: '^\+[1-9][0-9]{6,14}$'
      description: Numéro au format international E.164.

    OtpChannel:
      type: string
      enum: [sms, whatsapp]

    UserStatus:
      type: string
      enum: [pending_verification, active, locked, suspended, deletion_pending, deleted]

    User:
      type: object
      additionalProperties: false
      required: [id, status, firstName, lastName, phone, email, emailVerified, preferredLanguage, createdAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/UserStatus'
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        phone:
          oneOf:
            - $ref: '#/components/schemas/PhoneE164'
            - type: 'null'
        email:
          type: [string, 'null']
          format: email
          description: Adresse du compte, en minuscules ; enregistrée seulement après confirmation par code.
        emailVerified:
          type: boolean
          description: L'e-mail a été confirmé par un code. Seule une adresse vérifiée reçoit des e-mails.
        preferredLanguage:
          type: string
        createdAt:
          type: string
          format: date-time

    RequestOtpRequest:
      type: object
      additionalProperties: false
      required: [phone]
      properties:
        phone:
          $ref: '#/components/schemas/PhoneE164'
        channel:
          $ref: '#/components/schemas/OtpChannel'
          default: whatsapp

    RequestOtpResponse:
      type: object
      additionalProperties: false
      required: [challengeId, maskedTarget, channel, expiresInSeconds, resendAfterSeconds]
      properties:
        challengeId:
          type: string
          format: uuid
          description: À renvoyer avec le code.
        maskedTarget:
          type: string
        channel:
          $ref: '#/components/schemas/OtpChannel'
          description: Canal réellement utilisé, après une éventuelle bascule.
        expiresInSeconds:
          type: integer
          minimum: 1
        resendAfterSeconds:
          type: integer
          minimum: 0

    VerifyOtpRequest:
      type: object
      additionalProperties: false
      required: [challengeId, code]
      properties:
        challengeId:
          type: string
          format: uuid
        code:
          type: string
          pattern: '^[0-9]{4,8}$'
          description: Longueur fixée par configuration (6 chiffres proposés).
        deviceLabel:
          type: string
          maxLength: 100
          description: Nom de l'appareil affiché dans la liste des sessions ; déduit du User-Agent s'il est absent.

    SessionResponse:
      type: object
      additionalProperties: false
      required:
        [
          status,
          accessToken,
          accessTokenExpiresAt,
          refreshTokenExpiresAt,
          sessionId,
          user,
          profileIncomplete,
          activeContext,
        ]
      properties:
        status:
          const: authenticated
        accessToken:
          type: string
        accessTokenExpiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
          description: Mobile uniquement. Web et back-office le reçoivent dans le cookie.
        refreshTokenExpiresAt:
          type: string
          format: date-time
        sessionId:
          type: string
          format: uuid
        user:
          $ref: '#/components/schemas/User'
        profileIncomplete:
          type: boolean
          description: Le nom n'est pas encore renseigné ; il est obligatoire avant tout paiement.
        activeContext:
          $ref: '#/components/schemas/ActiveContext'

    VerifyOtpSessionResponse:
      type: object
      additionalProperties: false
      required:
        [
          status,
          accessToken,
          accessTokenExpiresAt,
          refreshTokenExpiresAt,
          sessionId,
          user,
          profileIncomplete,
          activeContext,
          isNewUser,
        ]
      properties:
        status:
          const: authenticated
        accessToken:
          type: string
        accessTokenExpiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
          description: Mobile uniquement. Web et back-office le reçoivent dans le cookie.
        refreshTokenExpiresAt:
          type: string
          format: date-time
        sessionId:
          type: string
          format: uuid
        user:
          $ref: '#/components/schemas/User'
        profileIncomplete:
          type: boolean
        activeContext:
          $ref: '#/components/schemas/ActiveContext'
        isNewUser:
          type: boolean
          description: Le compte vient d'être créé par ce code.

    MfaRequiredResponse:
      type: object
      additionalProperties: false
      required: [status, mfaToken, expiresAt, methods, enrollmentRequired]
      properties:
        status:
          const: mfa_required
        mfaToken:
          type: string
          description: Jeton court (5 minutes), à usage unique, à présenter aux routes /api/v1/identity/mfa/….
        expiresAt:
          type: string
          format: date-time
        methods:
          type: array
          items:
            type: string
            enum: [totp, recovery_code, sms]
        enrollmentRequired:
          type: boolean
          description: L'application d'authentification doit être configurée avant tout accès.

    MfaToken:
      type: string
      minLength: 1
      maxLength: 128
      description: Jeton reçu dans la réponse mfa_required de /api/v1/identity/otp/verify.

    EnrollTotpRequest:
      type: object
      additionalProperties: false
      required: [mfaToken]
      properties:
        mfaToken:
          $ref: '#/components/schemas/MfaToken'

    TotpEnrollmentResponse:
      type: object
      additionalProperties: false
      required: [secret, otpauthUri, issuer, accountName, digits, periodSeconds]
      properties:
        secret:
          type: string
          pattern: '^[A-Z2-7]+$'
          description: Secret en base32, pour une saisie à la main. Affiché une seule fois.
        otpauthUri:
          type: string
          pattern: '^otpauth://totp/'
          description: À afficher en QR code.
        issuer:
          type: string
        accountName:
          type: string
        digits:
          const: 6
        periodSeconds:
          const: 30

    ConfirmTotpRequest:
      type: object
      additionalProperties: false
      required: [mfaToken, code]
      properties:
        mfaToken:
          $ref: '#/components/schemas/MfaToken'
        code:
          type: string
          pattern: '^[0-9]{6}$'
          description: Premier code affiché par l'application d'authentification.

    TotpConfirmedResponse:
      type: object
      additionalProperties: false
      required:
        [
          status,
          accessToken,
          accessTokenExpiresAt,
          refreshTokenExpiresAt,
          sessionId,
          user,
          profileIncomplete,
          activeContext,
          recoveryCodes,
        ]
      properties:
        status:
          const: authenticated
        accessToken:
          type: string
        accessTokenExpiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
          description: Mobile uniquement. Web et back-office le reçoivent dans le cookie.
        refreshTokenExpiresAt:
          type: string
          format: date-time
        sessionId:
          type: string
          format: uuid
        user:
          $ref: '#/components/schemas/User'
        profileIncomplete:
          type: boolean
        activeContext:
          $ref: '#/components/schemas/ActiveContext'
        recoveryCodes:
          type: array
          minItems: 10
          maxItems: 10
          description: Codes de récupération, chacun utilisable une fois, affichés une seule fois.
          items:
            type: string
            pattern: '^[0-9A-Z]{5}-[0-9A-Z]{5}$'

    VerifyMfaRequest:
      type: object
      additionalProperties: false
      required: [mfaToken, method, code]
      properties:
        mfaToken:
          $ref: '#/components/schemas/MfaToken'
        method:
          type: string
          enum: [totp, recovery_code]
        code:
          type: string
          pattern: '^[0-9A-Za-z -]{6,20}$'
          description: 6 chiffres pour totp ; code de récupération (tirets et espaces ignorés).

    MfaSessionResponse:
      type: object
      additionalProperties: false
      required:
        [
          status,
          accessToken,
          accessTokenExpiresAt,
          refreshTokenExpiresAt,
          sessionId,
          user,
          profileIncomplete,
          activeContext,
          recoveryCodesRemaining,
        ]
      properties:
        status:
          const: authenticated
        accessToken:
          type: string
        accessTokenExpiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
          description: Mobile uniquement. Web et back-office le reçoivent dans le cookie.
        refreshTokenExpiresAt:
          type: string
          format: date-time
        sessionId:
          type: string
          format: uuid
        user:
          $ref: '#/components/schemas/User'
        profileIncomplete:
          type: boolean
        activeContext:
          $ref: '#/components/schemas/ActiveContext'
        recoveryCodesRemaining:
          type: integer
          minimum: 0
          description: Codes de récupération encore utilisables ; le back-office prévient quand il en reste peu.

    RefreshSessionRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      description: Mobile uniquement ; web et back-office n'envoient pas de corps.
      properties:
        refreshToken:
          type: string

    LogoutRequest:
      type: object
      additionalProperties: false
      properties:
        scope:
          type: string
          enum: [this_device, all_devices]
          default: this_device

    LogoutResponse:
      type: object
      additionalProperties: false
      required: [revokedSessions]
      properties:
        revokedSessions:
          type: integer
          minimum: 0

    ActiveContext:
      type: object
      additionalProperties: false
      required: [type, organizationId]
      description: |
        Contexte actif de la session, celui du jeton d'accès (claim `ctx`) : il fixe le type de compte
        réel que lisent les services métier. `individual` (particulier, contexte personnel) : choix du
        paiement, tout réglé à la fin. `business` (entreprise, organisation active) : facture mensuelle,
        pas de choix du moyen de paiement, jours d'intervention par semaine (Nettoyage). Une session
        s'ouvre dans le contexte personnel ; `POST /api/v1/identity/context` active une organisation
        validée (ADR-027).
      properties:
        type:
          type: string
          enum: [individual, business]
        organizationId:
          type: [string, 'null']
          format: uuid
          description: Organisation active d'une entreprise ; null pour un particulier.
        organizationName:
          type: [string, 'null']
          description: Raison sociale de l'organisation active ; null pour un particulier.

    MeResponse:
      type: object
      additionalProperties: false
      required: [user, profileIncomplete, pendingEmail, activeContext, deletion]
      properties:
        user:
          $ref: '#/components/schemas/User'
        profileIncomplete:
          type: boolean
        activeContext:
          $ref: '#/components/schemas/ActiveContext'
        pendingEmail:
          type: [string, 'null']
          format: email
          description: Adresse en attente de confirmation par code (code envoyé, encore valable) ; null sinon.
        deletion:
          oneOf:
            - $ref: '#/components/schemas/AccountDeletion'
            - type: 'null'
          description: Suppression demandée (compte `deletion_pending`, ADR-036) ; null sinon.

    DeletionObstacle:
      type: object
      additionalProperties: false
      required: [service, kind, reference, description]
      description: Raison lisible qui empêche la suppression d'un compte (ADR-036).
      properties:
        service:
          type: string
          description: Service qui l'a signalée (`cleaning`, `billing`, `payment`…) ou `identity` (compte entreprise).
        kind:
          type: string
          description: Nature, par exemple `open_cleaning_mission`, `open_cleaning_request`, `unpaid_invoice`, `pending_payment`, `payment_under_review`, `last_org_admin`.
        reference:
          type: string
          description: Référence lisible de l'objet concerné (numéro de facture, identifiant, raison sociale).
        description:
          type: string
          description: Explication à afficher.

    AccountDeletion:
      type: object
      additionalProperties: false
      required: [requestedAt, scheduledFor, postponedBy]
      properties:
        requestedAt:
          type: string
          format: date-time
        scheduledFor:
          type: string
          format: date-time
          description: Date prévue de l'anonymisation, fixée à la demande.
        postponedBy:
          type: array
          description: Obligations trouvées à l'échéance ; tant qu'il en reste, la suppression est reportée.
          items:
            $ref: '#/components/schemas/DeletionObstacle'

    RequestAccountDeletionResponse:
      type: object
      additionalProperties: false
      required: [deletion]
      properties:
        deletion:
          $ref: '#/components/schemas/AccountDeletion'

    CancelAccountDeletionResponse:
      type: object
      additionalProperties: false
      required: [user, profileIncomplete, activeContext, accessToken, accessTokenExpiresAt]
      properties:
        user:
          $ref: '#/components/schemas/User'
        profileIncomplete:
          type: boolean
        activeContext:
          $ref: '#/components/schemas/ActiveContext'
        accessToken:
          type: string
          description: Nouveau jeton d'accès complet, à utiliser à la place du jeton restreint.
        accessTokenExpiresAt:
          type: string
          format: date-time

    SwitchContextRequest:
      type: object
      additionalProperties: false
      required: [organizationId]
      properties:
        organizationId:
          type: [string, 'null']
          format: uuid
          description: Organisation à activer ; null pour revenir au contexte personnel.

    SwitchContextResponse:
      type: object
      additionalProperties: false
      required: [accessToken, accessTokenExpiresAt, activeContext]
      properties:
        accessToken:
          type: string
          description: Nouveau jeton d'accès, à utiliser à la place du précédent.
        accessTokenExpiresAt:
          type: string
          format: date-time
        activeContext:
          $ref: '#/components/schemas/ActiveContext'

    OrganizationStatus:
      type: string
      enum: [pending_review, active, rejected, suspended]
      description: |
        `pending_review` : en attente de validation par KSP ; `active` : validée, peut devenir le
        contexte actif ; `rejected` : refusée (définitif) ; `suspended` : suspendue par KSP.

    OrgRole:
      type: string
      enum: [org_admin, org_member, org_viewer]
      description: Rôle dans l'organisation ; seul `org_admin` (le créateur) est attribué aujourd'hui.

    Organization:
      type: object
      additionalProperties: false
      required:
        [
          id,
          legalName,
          address,
          ifu,
          rccm,
          billingEmail,
          status,
          rejectionReason,
          suspensionReason,
          createdAt,
          reviewedAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        legalName:
          type: string
          description: Raison sociale.
        address:
          type: string
        ifu:
          type: string
          pattern: '^[0-9]{13}$'
          description: Identifiant fiscal unique (13 chiffres).
        rccm:
          type: [string, 'null']
          description: Registre du commerce et du crédit mobilier ; null s'il n'est pas renseigné.
        billingEmail:
          type: [string, 'null']
          format: email
          description: E-mail de facturation, toujours confirmé par code ; null si aucun ne l'est.
        status:
          $ref: '#/components/schemas/OrganizationStatus'
        rejectionReason:
          type: [string, 'null']
          description: Motif du refus (`rejected`).
        suspensionReason:
          type: [string, 'null']
          description: Motif de la suspension en cours (`suspended`).
        createdAt:
          type: string
          format: date-time
        reviewedAt:
          type: [string, 'null']
          format: date-time
          description: Date de la validation ou du refus.

    OrganizationMembership:
      type: object
      additionalProperties: false
      required: [organization, role, pendingBillingEmail]
      properties:
        organization:
          $ref: '#/components/schemas/Organization'
        role:
          $ref: '#/components/schemas/OrgRole'
        pendingBillingEmail:
          type: [string, 'null']
          format: email
          description: E-mail de facturation en attente de confirmation (code envoyé, encore valable) ; null sinon.

    OrganizationMembershipList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationMembership'

    CreateOrganizationRequest:
      type: object
      additionalProperties: false
      required: [legalName, address, ifu]
      properties:
        legalName:
          type: string
          minLength: 1
          maxLength: 200
          description: Raison sociale.
        address:
          type: string
          minLength: 1
          maxLength: 300
        ifu:
          type: string
          minLength: 1
          maxLength: 30
          description: Identifiant fiscal unique, 13 chiffres (espaces ignorés) ; format contrôlé par identity.
        rccm:
          type: string
          minLength: 1
          maxLength: 50
          description: Facultatif, par exemple `RB/COT/19 B 12345`.

    OrganizationDecisionRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Motif communiqué au client.

    AdminOrganization:
      type: object
      additionalProperties: false
      required:
        [
          id,
          legalName,
          address,
          ifu,
          rccm,
          billingEmail,
          status,
          rejectionReason,
          suspensionReason,
          createdAt,
          reviewedAt,
