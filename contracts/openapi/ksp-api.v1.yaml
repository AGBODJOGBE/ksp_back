        unit:
          type:
            - string
            - 'null'
          description: Unité affichée (`m²`, `m³`), null sans unité
        min:
          type:
            - integer
            - 'null'
          minimum: 0
          maximum: 1000000
          description: Borne basse (nombre seulement)
        max:
          type:
            - integer
            - 'null'
          minimum: 0
          maximum: 1000000
          description: Borne haute (nombre seulement)
        choices:
          type: array
          items:
            $ref: '#/components/schemas/CleaningParameterChoice'
          description: Valeurs possibles (choix seulement), dans l’ordre d’affichage ; vide sinon
        required:
          type: boolean
          description: Valeur obligatoire
        help:
          type:
            - string
            - 'null'
          description: Aide à la saisie
        active:
          type: boolean
          description: 'Désactivé : n’apparaît plus sur le portail (R-CA-06)'
    CleaningPlaceCategory:
