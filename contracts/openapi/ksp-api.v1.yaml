            - string
            - 'null'
          format: date-time
        measuredBy:
          type:
            - string
            - 'null'
          format: uuid
          description: Back-office — agent ou superviseur qui a saisi les mesures.
        measuredByName:
          type:
            - string
            - 'null'
          description: Back-office — nom affiché de l’auteur des mesures (ADR-029), null s’il est inconnu.
        measuredSummary:
          description: Back-office — mesures constatées, lisibles (ADR-037) ; null sans mesure et dans l’espace client.
          oneOf:
            - $ref: '#/components/schemas/CleaningAnswerSummary'
            - type: 'null'
        groupRequests:
          type: array
          description: Back-office, détail d’une demande seulement — autres demandes du même groupe (vide pour une demande seule).
          items:
            $ref: '#/components/schemas/CleaningGroupedRequest'
    CleaningQuoteRequestList:
