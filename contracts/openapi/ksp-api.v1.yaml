          minimum: 1
          maximum: 24
          description: Charge maximale par défaut d’un agent (8 h / jour, R-DS-03)
        defaultMaxHoursPerWeek:
          type: integer
          minimum: 1
          maximum: 168
          description: Charge maximale par défaut d’un agent (48 h / semaine)
        maxPhotosPerKind:
          type: integer
          minimum: 1
          maximum: 50
          description: Photos par type et par séance (défaut 10)
        claimWindowHours:
          type: integer
          minimum: 12
          maximum: 168
          description: Fenêtre de réclamation (défaut 48 h, R-RC-01)
        retentionMonths:
