        renouvellements suivants gardent ce contexte, et reviennent au contexte personnel si
        l'organisation est suspendue ou si l'utilisateur n'en est plus membre.

        Erreurs : `GATEWAY_VALIDATION_FAILED` (400), `IDENTITY_SESSION_REVOKED` (401),
        `IDENTITY_CONTEXT_FORBIDDEN` (403, session du back-office), `IDENTITY_ORGANIZATION_NOT_FOUND`
        (404, organisation inconnue ou utilisateur non membre), `IDENTITY_ORGANIZATION_NOT_ACTIVE`
        (422, organisation en attente de validation, refusée ou suspendue : `details.status`).
