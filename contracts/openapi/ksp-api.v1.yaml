      summary: Déclarer ou changer son e-mail
      description: |
        Envoie un code **par e-mail** à l'adresse saisie (valable 15 minutes). L'adresse n'est
        enregistrée qu'après sa confirmation (`POST /api/v1/identity/me/email/verify`) : jusque-là,
