      description: |
        Prestation complète au nouveau format (ADR-033) : une nouvelle version à chaque enregistrement. `fields` est
        obligatoire (au moins un champ actif) ; l’ancien corps (`unit`, `pricing.unitPrice`, `pricing.options`) est
        refusé. L’unité de l’ancien formulaire public (`unit`, dépréciée) est déduite de l’unité du champ de la taille
        d’équipe. Montants en entiers de FCFA ; `null` : non fixé.
      required:
        - name
        - active
        - fields
        - pricing
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          minLength: 0
          maxLength: 1000
        active:
          type: boolean
        fields:
          type: array
          minItems: 1
          maxItems: 30
          description: Champs du formulaire, dans l’ordre d’affichage ; codes uniques dans la prestation.
          items:
            $ref: '#/components/schemas/CleaningFieldInput'
        options:
          type: array
          maxItems: 20
          description: Options, dans l’ordre d’affichage ; codes uniques dans la prestation.
          items:
            $ref: '#/components/schemas/CleaningOptionInput'
        pricing:
          $ref: '#/components/schemas/CleaningPricingInput'
    CleaningFieldChoiceInput:
      type: object
      additionalProperties: false
      required:
        - code
        - label
        - supplement
        - active
      properties:
        code:
          type: string
          pattern: ^[a-z][a-z0-9_]{1,49}$
        label:
          type: string
          minLength: 1
          maxLength: 100
        supplement:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Supplément en FCFA ; null si non fixé (sans coefficient non plus, la valeur est sans prix).
        coefficientBp:
          type:
            - integer
            - 'null'
          minimum: 1
          maximum: 100000
          description: Coefficient en points de base (10000 = 1) ; absent ou null si aucun.
        active:
          type: boolean
    CleaningFieldInput:
      type: object
      additionalProperties: false
      description: |
        Champ du formulaire (ADR-033). `number` : `unitLabel`, `min`, `max` (entiers, 0 ≤ min ≤ max ≤ 1 000 000) et
        `pricePerUnit` obligatoires. `choice` : `choices` obligatoire (codes uniques). `boolean` : `supplementIfYes` et
        `coefficientBpIfYes` facultatifs. Les propriétés d’un autre type sont refusées.
      required:
        - code
        - label
        - type
        - required
        - active
      properties:
        code:
          type: string
          pattern: ^[a-z][a-z0-9_]{1,49}$
        label:
          type: string
          minLength: 1
          maxLength: 100
        type:
          $ref: '#/components/schemas/CleaningFieldType'
        required:
          type: boolean
        helpText:
          type:
            - string
            - 'null'
          maxLength: 300
        active:
          type: boolean
        unitLabel:
          type: string
          minLength: 1
          maxLength: 30
        min:
          type: integer
          minimum: 0
          maximum: 1000000
        max:
          type: integer
          minimum: 0
          maximum: 1000000
        pricePerUnit:
          type:
            - integer
            - 'null'
          minimum: 0
        choices:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/CleaningFieldChoiceInput'
        supplementIfYes:
          type:
            - integer
            - 'null'
          minimum: 0
        coefficientBpIfYes:
          type:
            - integer
            - 'null'
          minimum: 1
          maximum: 100000
      allOf:
        - if:
            properties:
              type:
                const: number
          then:
            required:
              - unitLabel
              - min
              - max
              - pricePerUnit
            properties:
              choices: false
              supplementIfYes: false
              coefficientBpIfYes: false
        - if:
            properties:
              type:
                const: choice
          then:
            required:
              - choices
            properties:
              unitLabel: false
              min: false
              max: false
              pricePerUnit: false
              supplementIfYes: false
              coefficientBpIfYes: false
        - if:
            properties:
              type:
                const: boolean
          then:
            properties:
              unitLabel: false
              min: false
              max: false
              pricePerUnit: false
              choices: false
    CleaningOptionInput:
      type: object
      additionalProperties: false
      required:
        - code
        - label
        - active
        - flatPrice
      properties:
        code:
          type: string
          pattern: ^[a-z][a-z0-9_]{1,49}$
        label:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type:
            - string
            - 'null'
          maxLength: 500
        active:
          type: boolean
        flatPrice:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Forfait en FCFA ; null si aucun (une option sans champ et sans forfait n’a pas de prix).
        fields:
          type: array
          maxItems: 10
          description: Champs propres à l’option ; codes uniques dans l’option.
          items:
            $ref: '#/components/schemas/CleaningFieldInput'
    CleaningFrequencyInput:
