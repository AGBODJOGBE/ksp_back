          pattern: ^[a-z][a-z0-9_]{1,49}$
        label:
          type: string
          minLength: 1
          maxLength: 100
        coefficientBp:
          type: integer
          minimum: 1
          maximum: 100000
        active:
          type: boolean
    CleaningPricingInput:
