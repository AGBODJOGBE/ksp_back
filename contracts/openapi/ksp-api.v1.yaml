          format: date-time
        createdBy:
          type: string
          format: uuid
        publishedAt:
          type:
            - string
            - 'null'
          format: date-time
        publishedBy:
          type:
            - string
            - 'null'
          format: uuid
        packDiscountBps:
          type:
            - integer
            - 'null'
          minimum: 0
          maximum: 9000
          description: 'Pack : remise en points de base sur la somme de ses types (1000 = 10 %), plafond 9000 ; null : prix par tranches'
