      description: |
        Document PDF produit par un service métier (mandat de recouvrement, protocole d'accord…) : titre, numéro,
        statut, empreinte SHA-256 du PDF et, après signature, celle du PDF signé (ADR-044). Lisible par le compte
        titulaire du document et par le compte appelé à le signer ; pour tout autre compte, introuvable (404).

        `signature` décrit la demande de signature en cours ou la plus récente (signataire désigné par son nom et
        son téléphone masqué) ; `canSign` vaut `true` quand le compte connecté est le signataire attendu.

        Statuts : `draft`, `pending_signature`, `signed`, `expired` (demande expirée), `cancelled`.

        Erreurs : `GATEWAY_VALIDATION_FAILED` (400), `DOCUMENT_NOT_FOUND` (404), `DOCUMENT_DEPENDENCY_UNAVAILABLE` (503).
