  /api/v1/cleaning/quote-request-groups:
    post:
      tags:
        - Nettoyage
      operationId: requestCleaningQuoteGroup
      summary: Demander un devis pour plusieurs prestations d’un lieu
      description: |
        Parcours par lieu (ADR-034). Une demande de devis par prestation, liées par un groupe (même lieu, même position,
        même repère, mêmes créneaux, même commentaire), créées dans une seule transaction ; chaque demande suit ensuite
        son circuit habituel (visite, devis, mission, paiement). Profil complet exigé (comme `requestCleaningQuote`).
        Idempotent par `Idempotency-Key` : le rejeu rend le même groupe.

        La commune est retrouvée depuis `location` (géocodage inverse) ; la `commune` envoyée n’est utilisée qu’en repli,
        si aucun fournisseur ne trouve. Le prix de chaque demande est recalculé avec cette commune. `landmark` (point de
        repère) tient aussi lieu d’adresse d’intervention (`address`).

        Erreurs : `CLEANING_VALIDATION_FAILED` (400, `details.field`, par exemple `items[1].answers.surface`),
        `CLEANING_SERVICE_NOT_OFFERED` (400), `CLEANING_SLOT_INVALID` (400), `CLEANING_PLACE_TYPE_NOT_FOUND` (404),
        `IDENTITY_PROFILE_INCOMPLETE`, `CLEANING_LOCATION_UNRESOLVED` (422, position non rattachée à une commune et
        aucune commune envoyée : la demander au client), `CLEANING_ZONE_NOT_COVERED` (422, `details.commune`),
        `CLEANING_LEAD_TIME_TOO_SHORT`, `CLEANING_TOO_MANY_OPEN_REQUESTS` (422, chaque prestation compte),
        `CLEANING_ORGANIZATION_SUSPENDED` (422).
      x-ksp-grpc: ksp.cleaning.v1.QuoteService/RequestQuoteGroup
      x-ksp-access: authenticated
      x-ksp-rate-limit: authenticated
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestCleaningQuoteGroupRequest'
            example:
              placeType: house
              location:
                latitude: 6.3654
                longitude: 2.4183
                accuracyMeters: 12
              landmark: Près de la place de l’Étoile rouge, portail vert
              items:
                - serviceCode: house_cleaning
                  answers:
                    surface: 180
                    bedrooms: 4
                    bathrooms: 2
                    front_yard: true
                    back_yard: false
                    condition: normal
                  options:
                    - code: windows
                      answers:
                        window_count: 6
                  frequency: once
                - serviceCode: garden_maintenance
                  answers:
                    surface: 250
                    condition: overgrown
                  frequency: monthly
                - serviceCode: septic_emptying
                  answers:
                    tank_volume: 6
                    tank_type: septic_tank
                    truck_access: easy
                  frequency: once
              preferredSlots:
                - start: 2026-11-20T08:00:00Z
                  end: 2026-11-20T11:00:00Z
              comment: Chien gentil dans la cour.
      responses:
        '200':
          description: Succès
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CleaningQuoteRequestGroup'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
