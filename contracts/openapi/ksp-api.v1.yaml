          type: array
          items:
            $ref: '#/components/schemas/CleaningChecklistTemplateItem'
          maxItems: 50
          description: 'Points communs de toutes les séances (R-EX-09) Absente : inchangée ; vide : la liste est vidée.'
        arrivalAlertMeters:
          type: integer
          minimum: 50
          maximum: 5000
          description: Distance d’alerte à l’arrivée (défaut 300 m)
        arrivalMaxAdvanceMinutes:
          type: integer
          minimum: 0
          maximum: 240
          description: Avance maximale à l’arrivée (défaut 30 min ; 0 = pas de contrôle)
        customerWaitMinutes:
          type: integer
          minimum: 10
          maximum: 120
          description: Attente avant de déclarer le client absent (défaut 30 min, R-EX-02)
    InvoiceStatus:
      enum:
        - pending_payment
        - overdue
        - paid
        - cancelled
      description: |
        `pending_payment` jusqu'à l'échéance (émission + délai de règlement), puis `overdue` (impayée) ; `paid` quand
        les paiements atteignent le total ; `cancelled` réservé à une correction.
    InvoiceLine:
      type: object
      additionalProperties: false
      required:
        - label
        - quantity
        - unitPrice
        - amount
      properties:
        label:
          type: string
        quantity:
          type: integer
          minimum: 1
        unitPrice:
          $ref: '#/components/schemas/Money'
        amount:
          $ref: '#/components/schemas/Money'
    InvoicePayment:
      type: object
      additionalProperties: false
      required:
        - id
        - amount
        - method
        - reference
        - recordedBy
        - recordedAt
      properties:
        id:
          type: string
          format: uuid
        amount:
          $ref: '#/components/schemas/Money'
        method:
          $ref: '#/components/schemas/InvoiceRecordedPaymentMethod'
        reference:
          type:
            - string
            - 'null'
        recordedBy:
          type: string
        recordedAt:
          type: string
          format: date-time
    InvoiceRecordedPaymentMethod:
      description: |
        Moyen d'un paiement enregistré sur une facture : ceux du back-office (`InvoicePaymentMethod`),
        `mobile_money_online` (paiement en ligne confirmé par le prestataire, `recordedBy` = `system`, ADR-031) ou
        `wallet` (portefeuille prépayé, `recordedBy` = le membre qui a payé, `reference` = débit, ADR-046).
      enum:
        - cash
        - bank_transfer
        - mobile_money_offline
        - mobile_money_online
        - wallet
    PaymentStatus:
      description: |
        `pending` : en attente de la confirmation du prestataire ; `succeeded` : réglé ; `failed` : refusé ;
        `cancelled` : abandonné sur la page de paiement, ou remplacé par un nouveau paiement du même objet ;
        `expired` : resté en attente au-delà de son délai ; `amount_mismatch` : le prestataire a approuvé un
        autre montant ou une autre devise — rien n'est enregistré sur la mission ou la facture, la finance tranche
        (ADR-031) ; tant qu'elle ne l'a pas traité (`underReview`), tout nouveau paiement de l'objet est refusé
        (ADR-032), et le statut reste `amount_mismatch` une fois l'écart traité. Une réussite confirmée plus tard (24 heures au plus) fait passer un paiement `failed`,
        `cancelled` ou `expired` à `succeeded`.
      enum:
        - pending
        - succeeded
        - failed
        - expired
        - cancelled
        - amount_mismatch
    PaymentSubjectType:
      enum:
        - cleaning_mission
        - billing_invoice
    PaymentSubject:
      type: object
      additionalProperties: false
      required:
        - type
        - id
        - part
        - reference
      properties:
        type:
          type: string
          pattern: ^[a-z][a-z0-9_]{2,49}$
          description: |
            `cleaning_mission`, `billing_invoice` ou `wallet_top_up` (recharge du portefeuille, ADR-046 ; paiement par
            compte) ; pour un paiement par lien, type choisi par l'émetteur du lien, par exemple
            `recovery_installment` (ADR-040).
        id:
          type: string
          format: uuid
          description: Mission (Nettoyage), facture, titulaire du portefeuille rechargé, ou objet de l'émetteur d'un lien.
        part:
          description: Mission seulement — `deposit` (acompte) ou `balance` (reste dû) ; null pour une facture.
          enum:
            - deposit
            - balance
            - null
        reference:
          type:
            - string
            - 'null'
          description: Numéro de la facture, ou référence de l'émetteur d'un lien ; null pour une mission.
    Payment:
      type: object
      additionalProperties: false
      required:
        - id
        - status
        - subject
        - amount
        - customerId
        - organizationId
        - method
        - provider
        - providerReference
        - checkoutUrl
        - failureReason
        - createdAt
        - updatedAt
        - expiresAt
        - completedAt
        - underReview
        - paymentLinkId
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/PaymentStatus'
        subject:
          $ref: '#/components/schemas/PaymentSubject'
        amount:
          $ref: '#/components/schemas/Money'
        customerId:
          type:
            - string
            - 'null'
          format: uuid
          description: Payeur (compte qui a créé le paiement) ; null pour un paiement par lien (payeur sans compte).
        paymentLinkId:
          type:
            - string
            - 'null'
          format: uuid
          description: Lien de paiement payé (ADR-040) ; null pour un paiement par compte.
        organizationId:
          type:
            - string
            - 'null'
          format: uuid
          description: Organisation payeuse (facture d'entreprise), null sinon.
        method:
          const: mobile_money_online
        provider:
          enum:
            - fedapay
            - simulated
          description: '`simulated` : prestataire simulé du développement local.'
        providerReference:
          type:
            - string
            - 'null'
          description: Référence de la transaction chez le prestataire, à citer au support.
        checkoutUrl:
          type:
            - string
            - 'null'
          format: uri
          description: |
            Page de paiement du prestataire, où envoyer le client tant que le paiement est `pending` ; null si elle
            n'a pas encore pu être obtenue (renvoyer la création avec la même clé).
        failureReason:
          description: Raison d'un paiement non abouti, null sinon.
          enum:
            - declined
            - cancelled
            - expired
            - null
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: Au-delà, un paiement encore en attente devient `expired`.
        completedAt:
          type:
            - string
            - 'null'
          format: date-time
        customerName:
          type:
            - string
            - 'null'
          description: |
            Back-office seulement (`GET /api/v1/admin/payment/payments`) : nom affiché du payeur, lu dans identity à
            l'affichage (ADR-029) ; null s'il est inconnu ou si identity ne répond pas. Absent des routes client.
        organizationName:
          type:
            - string
            - 'null'
          description: |
            Back-office seulement : raison sociale de l'organisation payeuse, lue dans identity à l'affichage
            (ADR-029) ; null pour un particulier, si elle est inconnue ou si identity ne répond pas.
        underReview:
          type: boolean
          description: |
            Écart de montant (`amount_mismatch`) pas encore traité par la finance : tout nouveau paiement de l'objet
            est refusé (`PAYMENT_UNDER_REVIEW`, ADR-032). Le portail affiche « paiement en cours de vérification,
            contactez le support KSP ». false pour tout autre paiement, et une fois l'écart traité.
        mismatchResolvedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: |
            Back-office seulement (absent des routes client) : date du traitement de l'écart de montant par la
            finance ; null tant qu'il n'est pas traité, et pour tout autre statut.
        mismatchResolvedBy:
          type:
            - string
            - 'null'
          format: uuid
          description: "Back-office seulement : compte du back-office qui a traité l'écart ; null sinon."
        mismatchResolutionNote:
          type:
            - string
            - 'null'
          maxLength: 500
          description: "Back-office seulement : ce que la finance a fait de l'écart ; null sinon."
    PaymentList:
      type: object
      additionalProperties: false
      required:
        - data
        - nextCursor
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Payment'
        nextCursor:
          type:
            - string
            - 'null'
    CreatePaymentRequest:
      type: object
      additionalProperties: false
      required:
        - subjectType
        - subjectId
      properties:
        subjectType:
          $ref: '#/components/schemas/PaymentSubjectType'
        subjectId:
          type: string
          format: uuid
          description: Mission (`cleaning_mission`) ou facture (`billing_invoice`).
        part:
          description: Obligatoire pour une mission (`deposit` ou `balance`) ; absent pour une facture.
          enum:
            - deposit
            - balance
    SimulatePaymentRequest:
      type: object
      additionalProperties: false
      required:
        - outcome
      properties:
        outcome:
          enum:
            - succeeded
            - failed
    ResolvePaymentMismatchRequest:
      type: object
      additionalProperties: false
      required:
        - note
      properties:
        note:
          type: string
          minLength: 1
          maxLength: 500
          description: |
            Ce que la finance a fait (remboursement, encaissement manuel enregistré…), espaces de début et de fin
            retirés ; une note vide est refusée.
    PublicPaymentLink:
      type: object
      additionalProperties: false
      description: Lien de paiement vu par le payeur (ADR-040) — aucune donnée personnelle, aucun identifiant interne.
      required:
        - status
        - beneficiaryName
        - description
        - reference
        - amount
        - dueDate
        - expiresAt
        - paidAt
        - payment
      properties:
        status:
          description: |
            `active` (payable), `paid`, `under_review` (paiement en vérification par la finance : contacter le
            support), `revoked` (annulé par l'émetteur) ou `expired`.
          enum:
            - active
            - paid
            - under_review
            - revoked
            - expired
        beneficiaryName:
          type: string
          maxLength: 120
          description: Bénéficiaire affiché (créancier).
        description:
          type: string
          maxLength: 140
          description: Libellé, par exemple « Échéance 2 sur 6 ».
        reference:
          type: string
          maxLength: 60
          description: Référence de l'émetteur, à citer au support.
        amount:
          $ref: '#/components/schemas/Money'
        dueDate:
          type:
            - string
            - 'null'
          format: date
        expiresAt:
          type: string
          format: date-time
        paidAt:
          type:
            - string
            - 'null'
          format: date-time
        payment:
          description: Dernière tentative de paiement, null si aucune.
          oneOf:
            - $ref: '#/components/schemas/PaymentLinkPayment'
            - type: 'null'
    PaymentLinkPayment:
      type: object
      additionalProperties: false
      description: Tentative de paiement d'un lien.
      required:
        - id
        - status
        - checkoutUrl
        - expiresAt
        - failureReason
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/PaymentStatus'
        checkoutUrl:
          type:
            - string
            - 'null'
          format: uri
          description: Page de paiement du prestataire, tant que la tentative est `pending` ; null sinon.
        expiresAt:
          type: string
          format: date-time
        failureReason:
          enum:
            - declined
            - cancelled
            - expired
            - null
    PayoutStatus:
      description: |
        `requested` (enregistré ; en mode manuel, attend la finance), `processing` (lancé chez le prestataire),
        `completed` ou `failed`.
      enum:
        - requested
        - processing
        - completed
        - failed
    Payout:
      type: object
      additionalProperties: false
      description: Reversement par Mobile Money (ADR-041), vu par la finance.
      required:
        - id
        - status
        - issuer
        - reference
        - amount
        - beneficiary
        - provider
        - providerReference
        - failureReason
        - createdAt
        - updatedAt
        - completedAt
        - failedAt
        - settledBy
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/PayoutStatus'
        issuer:
          type: string
          description: Service qui l'a demandé (`wallet`).
        reference:
          type: string
          maxLength: 100
          description: "Référence de l'émetteur (wallet : identifiant de son reversement)."
        amount:
          $ref: '#/components/schemas/Money'
        beneficiary:
          type: object
          additionalProperties: false
          required:
            - phone
            - operator
            - name
          properties:
            phone:
              type: string
              pattern: ^\+229([0-9]{8}|[0-9]{10})$
            operator:
              enum:
                - mtn
                - moov
                - celtiis
            name:
              type: string
              maxLength: 120
        provider:
          enum:
            - fedapay
            - manual
          description: '`manual` : virement fait par la finance, confirmé au back-office.'
        providerReference:
          type:
            - string
            - 'null'
          description: Référence du virement (prestataire, ou saisie par la finance).
        failureReason:
          type:
            - string
            - 'null'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        completedAt:
          type:
            - string
            - 'null'
          format: date-time
        failedAt:
          type:
            - string
            - 'null'
          format: date-time
        settledBy:
          type:
            - string
            - 'null'
          format: uuid
          description: Mode manuel — compte du back-office qui l'a confirmé ou déclaré en échec.
    PayoutList:
      type: object
      additionalProperties: false
      required:
        - data
        - nextCursor
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Payout'
        nextCursor:
          type:
            - string
            - 'null'
    ConfirmPayoutRequest:
      type: object
      additionalProperties: false
      required:
        - transferReference
      properties:
        transferReference:
          type: string
          minLength: 1
          maxLength: 100
          description: Référence du virement Mobile Money fait par la finance.
    FailPayoutRequest:
      type: object
      additionalProperties: false
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Raison de l'échec ; gardée dans payment, jamais transmise dans les événements.
    WalletHolderType:
      enum:
        - user
        - organization
    WalletHolder:
      type: object
      additionalProperties: false
      required:
        - type
        - id
      properties:
        type:
          $ref: '#/components/schemas/WalletHolderType'
        id:
          type: string
          format: uuid
    Wallet:
      type: object
      additionalProperties: false
      description: Portefeuille d'un titulaire (ADR-042), calculé depuis les écritures du grand livre.
      required:
        - holder
        - balance
        - payoutsInProgress
        - totalCollected
        - totalPaidOut
        - lastEntryAt
      properties:
        holder:
          $ref: '#/components/schemas/WalletHolder'
        balance:
          $ref: '#/components/schemas/Money'
          description: |
            Solde disponible. Négatif seulement après l'annulation d'un encaissement déjà reversé (KSP a trop
            reversé) : aucun reversement n'est alors possible.
        payoutsInProgress:
          $ref: '#/components/schemas/Money'
        totalCollected:
          $ref: '#/components/schemas/Money'
        totalPaidOut:
          $ref: '#/components/schemas/Money'
        lastEntryAt:
          type:
            - string
            - 'null'
          format: date-time
        prepaid:
          $ref: '#/components/schemas/PrepaidWallet'
        topUpLimits:
          description: '`GET /api/v1/wallet/me` seulement : montants de recharge acceptés (réglables).'
          type: object
          additionalProperties: false
          required:
            - min
            - max
          properties:
            min:
              $ref: '#/components/schemas/Money'
            max:
              $ref: '#/components/schemas/Money'
    PrepaidWallet:
      type: object
      additionalProperties: false
      description: |
        Portefeuille prépayé d'un titulaire (ADR-046) : rechargé par Mobile Money, débité par les services
        (Nettoyage, factures), crédité des remboursements. Jamais négatif ; jamais reversé.
      required:
        - holder
        - balance
        - lastEntryAt
      properties:
        holder:
          $ref: '#/components/schemas/WalletHolder'
        balance:
          $ref: '#/components/schemas/Money'
        lastEntryAt:
          type:
            - string
            - 'null'
          format: date-time
    WalletObjectReference:
      type: object
      additionalProperties: false
      description: Objet payé par le portefeuille, chez le service qui l'a débité.
      required:
        - service
        - objectType
        - objectId
        - part
      properties:
        service:
          type: string
          description: Service qui a débité (`cleaning`, `billing`).
        objectType:
          type: string
          description: '`cleaning_mission` (lien : `/mon-espace/nettoyage/missions/{objectId}`) ou `billing_invoice` (`/mon-espace/factures/{objectId}`).'
        objectId:
          type: string
          format: uuid
        part:
          type:
            - string
            - 'null'
          description: Mission — `deposit` (acompte) ou `balance` (solde) ; null sinon.
    WalletStatementLine:
      type: object
      additionalProperties: false
      required:
        - transactionId
        - kind
        - direction
        - amount
        - balanceAfter
        - reference
        - description
        - grossAmount
        - commission
        - commissionRateBps
        - payoutId
        - payoutStatus
        - reversesTransactionId
        - createdAt
        - account
        - object
      properties:
        account:
          description: '`collections` (fonds dus au titulaire) ou `prepaid` (portefeuille prépayé, ADR-046).'
          enum:
            - collections
            - prepaid
        object:
          description: Paiement d'un service et son remboursement — objet payé ; null sinon.
          oneOf:
            - $ref: '#/components/schemas/WalletObjectReference'
            - type: 'null'
        transactionId:
          type: string
          format: uuid
        kind:
          description: |
            `collection` (encaissement), `payout` (reversement retenu), `payout_release` (reversement en échec :
            montant rendu) ou `reversal` (annulation d'un encaissement) ; portefeuille prépayé (ADR-046) : `top_up`
            (recharge), `service_payment` (paiement d'un service) ou `refund` (remboursement).
          enum:
            - collection
            - payout
            - payout_release
            - reversal
            - top_up
            - service_payment
            - refund
        direction:
          description: '`credit` : en faveur du titulaire.'
          enum:
            - credit
            - debit
        amount:
          $ref: '#/components/schemas/Money'
        balanceAfter:
          $ref: '#/components/schemas/Money'
        reference:
          type: string
        description:
          type: string
        grossAmount:
          description: Encaissement et annulation — montant brut ; null sinon.
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        commission:
          description: Encaissement et annulation — commission de KSP (arrondie à l'entier inférieur) ; null sinon.
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        commissionRateBps:
          type:
            - integer
            - 'null'
          minimum: 0
          maximum: 10000
          description: Taux en points de base (1 250 = 12,5 %).
        payoutId:
          type:
            - string
            - 'null'
          format: uuid
        payoutStatus:
          oneOf:
            - $ref: '#/components/schemas/WalletPayoutStatus'
            - type: 'null'
        reversesTransactionId:
          type:
            - string
            - 'null'
          format: uuid
        createdAt:
          type: string
          format: date-time
    WalletStatement:
      type: object
      additionalProperties: false
      required:
        - data
        - nextCursor
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WalletStatementLine'
        nextCursor:
          type:
            - string
            - 'null'
    WalletPayoutStatus:
      description: |
        `pending_submission` (pas encore transmis à payment, nouvel essai automatique), `submitted`, `completed`
        ou `failed` (montant rendu au solde).
      enum:
        - pending_submission
        - submitted
        - completed
        - failed
    WalletPayout:
      type: object
      additionalProperties: false
      required:
        - id
        - holder
        - amount
        - status
        - paymentPayoutId
        - beneficiaryOperator
        - beneficiaryPhoneMasked
        - createdAt
        - updatedAt
        - completedAt
        - failedAt
      properties:
        id:
          type: string
          format: uuid
        holder:
          $ref: '#/components/schemas/WalletHolder'
        amount:
          $ref: '#/components/schemas/Money'
        status:
          $ref: '#/components/schemas/WalletPayoutStatus'
        paymentPayoutId:
          type:
            - string
            - 'null'
          description: Reversement chez payment (`GET /api/v1/admin/payment/payouts`).
        beneficiaryOperator:
          enum:
            - mtn
            - moov
            - celtiis
        beneficiaryPhoneMasked:
          type: string
          description: Numéro masqué, par exemple `+229 •• •• 45`.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        completedAt:
          type:
            - string
            - 'null'
          format: date-time
        failedAt:
          type:
            - string
            - 'null'
          format: date-time
    WalletPayoutList:
      type: object
      additionalProperties: false
      required:
        - data
        - nextCursor
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WalletPayout'
        nextCursor:
          type:
            - string
            - 'null'
    WalletLedgerOverview:
      type: object
      additionalProperties: false
      required:
        - internalAccounts
        - owedToHolders
        - holdersCount
      properties:
        internalAccounts:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - account
              - balance
            properties:
              account:
                enum:
                  - ksp:collections
                  - ksp:commission
                  - ksp:payouts_in_transit
                  - ksp:prepaid_funds
                  - ksp:service_revenue
              balance:
                $ref: '#/components/schemas/Money'
        owedToHolders:
          $ref: '#/components/schemas/Money'
        holdersCount:
          type: integer
          minimum: 0
        owedToCustomers:
          $ref: '#/components/schemas/Money'
          description: Somme des portefeuilles prépayés (ADR-046).
        customersCount:
          type: integer
          minimum: 0
    WalletTopUpRequest:
      type: object
      additionalProperties: false
      required:
        - amount
      properties:
        amount:
          $ref: '#/components/schemas/Money'
    WalletTopUp:
      type: object
      additionalProperties: false
      description: Recharge en cours (paiement Mobile Money de l'objet `wallet_top_up`, ADR-046).
      required:
        - paymentId
        - holder
        - amount
        - status
        - checkoutUrl
        - expiresAt
      properties:
        paymentId:
          type: string
          format: uuid
          description: Suivi par `GET /api/v1/payment/payments/{id}`.
        holder:
          $ref: '#/components/schemas/WalletHolder'
        amount:
          $ref: '#/components/schemas/Money'
        status:
          $ref: '#/components/schemas/PaymentStatus'
        checkoutUrl:
          type:
            - string
            - 'null'
          description: Page de paiement du prestataire ; null si elle n'a pas pu être créée (réessayer, même clé).
        expiresAt:
          type:
            - string
            - 'null'
          format: date-time
    WalletCreditRequest:
      type: object
      additionalProperties: false
      required:
        - kind
        - amount
        - reason
      properties:
        kind:
          description: '`refund` (remboursement) ou `top_up` (recharge reçue mais non créditée, `paymentId` obligatoire).'
          enum:
            - refund
            - top_up
        amount:
          $ref: '#/components/schemas/Money'
        reason:
          type: string
          minLength: 1
          maxLength: 200
          description: Motif, visible dans le relevé du client.
        paymentId:
          type: string
          format: uuid
          description: '`top_up` seulement : paiement Mobile Money reçu (écart de montant traité).'
    WalletCredit:
      type: object
      additionalProperties: false
      required:
        - transactionId
        - kind
        - amount
        - description
        - createdAt
        - wallet
        - created
      properties:
        transactionId:
          type: string
          format: uuid
        kind:
          enum:
            - refund
            - top_up
        amount:
          $ref: '#/components/schemas/Money'
        description:
          type: string
        createdAt:
          type: string
          format: date-time
        wallet:
          $ref: '#/components/schemas/PrepaidWallet'
        created:
          type: boolean
          description: false si le crédit existait déjà (même clé, ou même paiement).
    WalletCreditPending:
      type: object
      additionalProperties: false
      description: Crédit au-delà du seuil de double validation, rien n'est encore crédité (ADR-048).
      required:
        - pendingRequest
        - wallet
        - created
      properties:
        pendingRequest:
          $ref: '#/components/schemas/ManualCreditRequest'
        wallet:
          $ref: '#/components/schemas/PrepaidWallet'
        created:
          type: boolean
          description: false si la demande existait déjà (même clé).
    ManualCreditRequestStatus:
      enum:
        - pending_approval
        - approved
    ManualCreditRequest:
      type: object
      additionalProperties: false
      required:
        - id
        - holder
        - kind
        - amount
        - reason
        - paymentId
        - status
        - requestedBy
        - requestedAt
        - approvedBy
        - approvedAt
        - transactionId
      properties:
        id:
          type: string
          format: uuid
        holder:
          type: object
          additionalProperties: false
          required:
            - type
            - id
          properties:
            type:
              $ref: '#/components/schemas/WalletHolderType'
            id:
              type: string
              format: uuid
        kind:
          enum:
            - refund
            - top_up
        amount:
          $ref: '#/components/schemas/Money'
        reason:
          type: string
        paymentId:
          type:
            - string
            - 'null'
          format: uuid
        status:
          $ref: '#/components/schemas/ManualCreditRequestStatus'
        requestedBy:
          type: string
          format: uuid
        requestedAt:
          type: string
          format: date-time
        approvedBy:
          type:
            - string
            - 'null'
          format: uuid
        approvedAt:
          type:
            - string
            - 'null'
          format: date-time
        transactionId:
          type:
            - string
            - 'null'
          format: uuid
    ManualCreditRequestList:
      type: object
      additionalProperties: false
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ManualCreditRequest'
        nextCursor:
          type:
            - string
            - 'null'
    ManualCreditApproval:
      type: object
      additionalProperties: false
      required:
        - transactionId
        - kind
        - amount
        - description
        - createdAt
        - wallet
        - request
        - created
      properties:
        transactionId:
          type: string
          format: uuid
        kind:
          enum:
            - refund
            - top_up
        amount:
          $ref: '#/components/schemas/Money'
        description:
          type: string
        createdAt:
          type: string
          format: date-time
        wallet:
          $ref: '#/components/schemas/PrepaidWallet'
        request:
          $ref: '#/components/schemas/ManualCreditRequest'
        created:
          type: boolean
          description: false si la demande était déjà validée.
    PaymentWebhookAck:
      type: object
      additionalProperties: false
      required:
        - received
      properties:
        received:
          const: true
    InvoicePaymentMethod:
      enum:
        - cash
        - bank_transfer
        - mobile_money_offline
    Invoice:
      type: object
      additionalProperties: false
      required:
        - id
        - number
        - status
        - customerId
        - organizationId
        - source
        - contractId
        - periodIndex
        - periodStart
        - periodEnd
        - lines
        - total
        - paid
        - balance
        - issuedAt
        - dueAt
        - paidAt
        - payments
        - organization
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
          pattern: ^FAC-[0-9]{4}-[0-9]{6}$
          description: Numéro continu par année.
        status:
          $ref: '#/components/schemas/InvoiceStatus'
        customerId:
          type: string
          format: uuid
        organizationId:
          type:
            - string
            - 'null'
          format: uuid
        source:
          enum:
            - cleaning
        contractId:
          type: string
          format: uuid
          description: Contrat chez le service source (pour le Nettoyage, la mission).
        periodIndex:
          type: integer
          minimum: 1
          description: Rang du mois facturé dans le contrat.
        periodStart:
          type: string
          format: date-time
          description: |
            Premier instant facturé : minuit, heure du Bénin (Africa/Porto-Novo, UTC+1), du premier jour facturé du
            mois (1er du mois, ou jour de début du contrat). Exemple : `2026-10-31T23:00:00Z` pour le 1er novembre.
        periodEnd:
          type: string
          format: date-time
          description: |
            Borne **exclusive** : minuit, heure du Bénin, du lendemain du dernier jour facturé. Une facture de
            novembre complet va de `2026-10-31T23:00:00Z` (1er novembre 00:00) à `2026-11-30T23:00:00Z`
            (1er décembre 00:00) : le dernier jour facturé est la veille de `periodEnd`, à afficher « au 30 novembre ».
        lines:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceLine'
        total:
          $ref: '#/components/schemas/Money'
        paid:
          $ref: '#/components/schemas/Money'
        balance:
          $ref: '#/components/schemas/Money'
        issuedAt:
          type: string
          format: date-time
        dueAt:
          type: string
          format: date-time
        paidAt:
          type:
            - string
            - 'null'
          format: date-time
        payments:
          type: array
          items:
            $ref: '#/components/schemas/InvoicePayment'
        organization:
          description: |
            En-tête de la facture d'une organisation : fiche lue dans identity au moment de l'émission. La facture est un
            document comptable : une modification ultérieure de la fiche ne la change pas. `null` pour un particulier et
            pour une facture émise avant l'enregistrement de l'en-tête.
          oneOf:
            - $ref: '#/components/schemas/InvoiceOrganization'
            - type: 'null'
    InvoiceOrganization:
      type: object
      additionalProperties: false
      description: Raison sociale, adresse et identifiants légaux de l'organisation facturée (aucun champ de TVA).
      required:
        - legalName
        - address
        - ifu
        - rccm
      properties:
        legalName:
          type: string
          description: Raison sociale.
        address:
          type: string
        ifu:
          type: string
          pattern: ^[0-9]{13}$
          description: Identifiant fiscal unique (Bénin).
        rccm:
          type:
            - string
            - 'null'
          description: Registre du commerce et du crédit mobilier ; `null` s'il n'est pas renseigné.
    InvoiceList:
      type: object
      additionalProperties: false
      required:
        - data
        - nextCursor
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Invoice'
        nextCursor:
          type:
            - string
            - 'null'
    BillingSettings:
      type: object
      additionalProperties: false
      required:
        - paymentTermDays
        - updatedBy
        - updatedAt
      properties:
        paymentTermDays:
          type: integer
          minimum: 1
          maximum: 90
          description: Délai de règlement après l'émission, en jours (10 par défaut).
        updatedBy:
          type:
            - string
            - 'null'
        updatedAt:
          type:
            - string
            - 'null'
          format: date-time
    RecordInvoicePaymentRequest:
      type: object
      additionalProperties: false
      required:
        - amount
        - method
      properties:
        amount:
          type: integer
          minimum: 1
          description: Entier en FCFA, au plus le reste dû.
        method:
          $ref: '#/components/schemas/InvoicePaymentMethod'
        reference:
          type: string
          minLength: 0
          maxLength: 100
    UpdateBillingSettingsRequest:
      type: object
      additionalProperties: false
      required:
        - paymentTermDays
      properties:
        paymentTermDays:
          type: integer
          minimum: 1
          maximum: 90
    FilePurpose:
      description: |
        Finalité du fichier (ADR-038), liste fermée et extensible : `recovery_evidence` (pièce justificative du
        Recouvrement), `cleaning_intervention_photo` (photo d'un passage du Nettoyage), `generated_document`
        (PDF produit par KSP, réservé aux services), `avatar` (photo de profil).
      enum:
        - recovery_evidence
        - cleaning_intervention_photo
        - generated_document
        - avatar
    CreateFileUploadRequest:
      type: object
      additionalProperties: false
      required:
        - purpose
        - fileName
        - contentType
        - sizeBytes
      properties:
        purpose:
          $ref: '#/components/schemas/FilePurpose'
        fileName:
          type: string
          minLength: 1
          maxLength: 255
          description: Nom d'origine ; nettoyé par file (sans chemin ni caractère de contrôle, 200 caractères au plus).
        contentType:
          type: string
          minLength: 3
          maxLength: 100
          description: Type MIME, accepté selon la finalité (`application/pdf`, `image/jpeg`, `image/png`, `image/webp`).
        sizeBytes:
          type: integer
          minimum: 1
          maximum: 104857600
          description: Taille exacte du contenu, en octets ; plafonnée par la finalité.
    StoredFile:
      type: object
      additionalProperties: false
      required:
        - id
        - purpose
        - fileName
        - contentType
        - sizeBytes
        - status
        - rejectionReason
        - subject
        - createdAt
        - completedAt
      properties:
        id:
          type: string
          format: uuid
        purpose:
          $ref: '#/components/schemas/FilePurpose'
        fileName:
          type: string
        contentType:
          type: string
        sizeBytes:
          type: integer
          minimum: 1
        status:
          description: '`pending` (contenu attendu), `available` (vérifié) ou `rejected` (refusé, contenu effacé).'
          enum:
            - pending
            - available
            - rejected
        rejectionReason:
          description: Motif d'un rejet ; null sinon.
          oneOf:
            - enum:
                - size_mismatch
                - type_mismatch
                - malware
            - type: 'null'
        subject:
          description: Objet métier auquel le service responsable a rattaché le fichier ; null avant le rattachement.
          oneOf:
            - type: object
              additionalProperties: false
              required:
                - type
                - id
              properties:
                type:
                  type: string
                  description: Type d'objet, par exemple `cleaning_intervention` ou `recovery_case`.
                id:
                  type: string
            - type: 'null'
        createdAt:
          type: string
          format: date-time
        completedAt:
          description: Confirmation du contenu ; null tant que le fichier est en attente.
          type:
            - string
            - 'null'
          format: date-time
    FileUpload:
      type: object
      additionalProperties: false
      required:
        - file
        - upload
      properties:
        file:
          $ref: '#/components/schemas/StoredFile'
        upload:
          type: object
          additionalProperties: false
          required:
            - url
            - method
            - headers
            - expiresAt
          description: Envoi du contenu, directement au stockage, avant `expiresAt`.
          properties:
            url:
              type: string
              format: uri
              description: Adresse présignée (secret de courte durée, à ne jamais journaliser).
            method:
              enum:
                - PUT
            headers:
              type: object
              additionalProperties:
                type: string
              description: En-têtes à envoyer tels quels (signés).
            expiresAt:
              type: string
              format: date-time
    FileDownloadUrl:
      type: object
      additionalProperties: false
      required:
        - url
        - expiresAt
      properties:
        url:
          type: string
          format: uri
          description: Adresse présignée de lecture (secret de courte durée, à ne jamais enregistrer).
        expiresAt:
          type: string
          format: date-time
    Document:
      type: object
      additionalProperties: false
      description: Document PDF produit à partir d'un modèle versionné (ADR-044).
      required:
        - id
        - template
        - templateVersion
        - title
        - number
        - status
        - subject
        - sha256
        - sizeBytes
        - signedSha256
        - createdAt
        - signedAt
        - cancelledAt
        - signature
      properties:
        id:
          type: string
          format: uuid
        template:
          type: string
          description: Modèle du document (recovery_mandate, recovery_formal_notice, recovery_settlement_agreement…)
        templateVersion:
          type: integer
          minimum: 1
        title:
          type: string
        number:
          type: string
          description: Numéro lisible unique (MAN-2026-000042).
        status:
          type: string
          enum: [draft, pending_signature, signed, expired, cancelled]
        subject:
          description: Objet métier du document (dossier de recouvrement…).
          oneOf:
            - $ref: '#/components/schemas/DocumentSubject'
            - type: 'null'
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Empreinte SHA-256 du PDF produit (celui présenté au signataire).
        sizeBytes:
          type: integer
          minimum: 1
        signedSha256:
          type: [string, 'null']
          pattern: '^[0-9a-f]{64}$'
          description: Empreinte SHA-256 du PDF signé (pages d'origine et page de certificat).
        createdAt:
          type: string
          format: date-time
        signedAt:
          type: [string, 'null']
          format: date-time
        cancelledAt:
          type: [string, 'null']
          format: date-time
        signature:
          description: Demande de signature en cours ou la plus récente ; null si aucune.
          oneOf:
            - $ref: '#/components/schemas/DocumentSignature'
            - type: 'null'
    DocumentSubject:
      type: object
      additionalProperties: false
      required:
        - type
        - id
      properties:
        type:
          type: string
        id:
          type: string
    DocumentSignature:
      type: object
      additionalProperties: false
      required:
        - id
        - status
        - signer
        - canSign
        - createdAt
        - expiresAt
        - signedAt
        - codeExpiresAt
      properties:
        id:
          type: string
          format: uuid
          description: Identifiant de la demande de signature (routes /api/v1/document/signatures/{id}).
        status:
          type: string
          enum: [pending, signed, expired, cancelled]
        signer:
          type: object
          additionalProperties: false
          required:
            - displayName
            - phoneMasked
            - hasAccount
          properties:
            displayName:
              type: string
            phoneMasked:
              type: [string, 'null']
              description: Téléphone masqué (+229********45) ; jamais le numéro en clair.
            hasAccount:
              type: boolean
              description: Le signataire signe depuis son compte KSP (sinon par un lien personnel).
        canSign:
          type: boolean
          description: Le compte connecté est le signataire attendu d'une demande en attente.
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        signedAt:
          type: [string, 'null']
          format: date-time
        codeExpiresAt:
          type: [string, 'null']
          format: date-time
          description: Expiration du code en cours ; null si aucun code valable.
    DocumentDownloadUrl:
      type: object
      additionalProperties: false
      required:
        - url
        - expiresAt
        - version
      properties:
        url:
          type: string
          format: uri
          description: Adresse présignée de lecture du PDF (secret de courte durée, à ne jamais enregistrer).
        expiresAt:
          type: string
          format: date-time
        version:
          type: string
          enum: [original, signed]
          description: PDF produit, ou PDF signé (pages d'origine et page de certificat).
    SignatureCodeDelivery:
      type: object
      additionalProperties: false
      required:
        - channel
        - expiresAt
        - resendAfterSeconds
      properties:
        channel:
          type: string
          enum: [whatsapp, email, sms]
          description: Canal qui a acheminé le code (jamais le code lui-même).
        expiresAt:
          type: string
          format: date-time
        resendAfterSeconds:
          type: integer
          minimum: 0
          description: Délai avant de pouvoir demander un nouveau code.
    SignDocumentRequest:
      type: object
      additionalProperties: false
      required:
        - code
        - consent
      properties:
        code:
          type: string
          pattern: '^[0-9]{6}$'
          description: Code de 6 chiffres reçu par WhatsApp ou e-mail.
        consent:
          type: boolean
          description: Le signataire déclare avoir lu le document et en accepter le contenu ; doit valoir true.
    SigningSession:
      type: object
      additionalProperties: false
      description: Ce que voit un signataire sans compte par son lien personnel.
      required:
        - documentTitle
        - documentNumber
        - status
        - signer
        - expiresAt
        - signedAt
        - codeExpiresAt
        - download
      properties:
        documentTitle:
          type: string
        documentNumber:
          type: string
        status:
          type: string
          enum: [pending, signed, expired, cancelled]
        signer:
          type: object
          additionalProperties: false
          required:
            - displayName
            - phoneMasked
          properties:
            displayName:
              type: string
            phoneMasked:
              type: [string, 'null']
        expiresAt:
          type: string
          format: date-time
        signedAt:
          type: [string, 'null']
          format: date-time
        codeExpiresAt:
          type: [string, 'null']
          format: date-time
        download:
          description: Lecture du PDF (signé s'il l'est) ; null pour une demande expirée ou annulée.
          oneOf:
            - $ref: '#/components/schemas/DocumentDownloadUrl'
            - type: 'null'
