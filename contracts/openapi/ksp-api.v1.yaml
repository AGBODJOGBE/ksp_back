    CleaningVisit:
      type: object
      additionalProperties: false
      description: Visite technique (ADR-035) ; une visite commune est une seule entrée.
      required:
        - id
        - groupVisitId
        - groupId
        - status
        - scheduledAt
        - completedAt
        - report
        - agentId
        - agentName
        - customerId
        - customerName
        - organizationName
        - commune
        - address
        - location
        - landmark
        - geocodedAddress
        - placeType
        - placeTypeLabel
        - requests
      properties:
        id:
          type: string
          format: uuid
        groupVisitId:
          type:
            - string
            - 'null'
          format: uuid
        groupId:
          type:
            - string
            - 'null'
          format: uuid
        status:
          enum:
            - scheduled
            - completed
            - cancelled
        scheduledAt:
          type: string
          format: date-time
        completedAt:
          type:
            - string
            - 'null'
          format: date-time
        report:
          type:
            - string
            - 'null'
        agentId:
          type: string
          format: uuid
        agentName:
          type:
            - string
            - 'null'
        customerId:
          type: string
          format: uuid
        customerName:
          type:
            - string
            - 'null'
          description: Nom du client lu dans identity (ADR-029) ; le téléphone n’est pas transmis à cleaning.
        organizationName:
          type:
            - string
            - 'null'
        commune:
          type: string
        address:
          type:
            - string
            - 'null'
        location:
          description: Position GPS ; null sans position, ou pour un agent quand la visite est terminée ou annulée.
          oneOf:
            - $ref: '#/components/schemas/CleaningGeoLocation'
            - type: 'null'
        landmark:
          type:
            - string
            - 'null'
        geocodedAddress:
          type:
            - string
            - 'null'
        placeType:
          type:
            - string
            - 'null'
        placeTypeLabel:
          type:
            - string
            - 'null'
        requests:
          type: array
          items:
            type: object
            additionalProperties: false
            description: |
              Demande de la visite, avec les réponses du client et les mesures constatées pour préremplir la saisie après
              la visite (ADR-037). Pour un agent (`cleaning_agent` seul), aucun montant : `calculation` et
              `measuredCalculation` sont `null` ; le recalcul `estimateCleaningQuoteRequest` reste ouvert.
            required:
              - requestId
              - visitId
              - serviceCode
              - serviceName
              - status
              - placeType
              - placeTypeLabel
              - answers
              - selectedOptions
              - frequency
              - pricingVersion
              - calculation
              - answerSummary
              - measuredAnswers
              - measuredOptions
              - measuredFrequency
              - measuredCalculation
              - measuredPricingVersion
              - measuredAt
              - measuredBy
              - measuredByName
              - measuredSummary
            properties:
              requestId:
                type: string
                format: uuid
              visitId:
                type: string
                format: uuid
                description: Visite de cette demande (compte rendu par demande).
              serviceCode:
                type: string
              serviceName:
                type:
                  - string
                  - 'null'
              status:
                type: string
              placeType:
                type:
                  - string
                  - 'null'
                description: Type de lieu de la demande (ADR-034), null sans lieu.
              placeTypeLabel:
                type:
                  - string
                  - 'null'
              answers:
                description: Réponses du client (ADR-033), même forme que `CleaningQuoteRequest.answers` ; null pour une demande antérieure.
                oneOf:
                  - $ref: '#/components/schemas/CleaningAnswers'
                  - type: 'null'
              selectedOptions:
                type: array
                description: Options choisies par le client avec leurs réponses ; vide pour une demande antérieure.
                items:
                  $ref: '#/components/schemas/CleaningOptionSelection'
              frequency:
                type:
                  - string
                  - 'null'
                description: Code de la fréquence choisie par le client, null si aucune.
              pricingVersion:
                type:
                  - integer
                  - 'null'
                minimum: 1
                description: Version de la grille du calcul de la demande ; null pour une demande antérieure.
              calculation:
                description: Détail du calcul de la demande ; null pour un agent et pour une demande antérieure.
                oneOf:
                  - $ref: '#/components/schemas/CleaningPriceCalculation'
                  - type: 'null'
              answerSummary:
                description: Réponses du client, lisibles (version de grille de la demande) ; null si la demande n’a pas pu être décrite.
                oneOf:
                  - $ref: '#/components/schemas/CleaningAnswerSummary'
                  - type: 'null'
              measuredAnswers:
                description: Mesures constatées (ADR-037), même forme que `answers` ; null sans mesure.
                oneOf:
                  - $ref: '#/components/schemas/CleaningAnswers'
                  - type: 'null'
              measuredOptions:
                description: Options des mesures constatées ; null sans mesure.
                oneOf:
                  - type: array
                    items:
                      $ref: '#/components/schemas/CleaningOptionSelection'
                  - type: 'null'
              measuredFrequency:
                type:
                  - string
                  - 'null'
              measuredCalculation:
                description: Calcul des mesures ; null sans mesure et pour un agent.
                oneOf:
                  - $ref: '#/components/schemas/CleaningPriceCalculation'
                  - type: 'null'
              measuredPricingVersion:
                type:
                  - integer
                  - 'null'
              measuredAt:
                type:
                  - string
                  - 'null'
                format: date-time
              measuredBy:
                type:
                  - string
                  - 'null'
                format: uuid
              measuredByName:
                type:
                  - string
                  - 'null'
              measuredSummary:
                description: Mesures constatées, lisibles ; null sans mesure.
                oneOf:
                  - $ref: '#/components/schemas/CleaningAnswerSummary'
                  - type: 'null'
