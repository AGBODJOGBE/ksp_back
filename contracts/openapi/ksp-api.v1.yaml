      description: |
        UC-ID-15 (ADR-027). Active une organisation **validée** dont l'utilisateur est membre
        (`organizationId`), ou revient au contexte personnel (`organizationId: null`). La réponse porte
        un **nouveau jeton d'accès** (claim `ctx` = identifiant de l'organisation, ou `personal`) à
