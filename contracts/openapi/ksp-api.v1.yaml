  /api/v1/file/files/{id}/complete:
    post:
      tags:
        - Fichiers
      operationId: completeFileUpload
      summary: Confirmer l’envoi d’un fichier
      description: |
        Sans corps. file relit le contenu reçu par le stockage : présence, taille réelle égale à la taille
        déclarée, type enregistré, **signature binaire** du type déclaré (une page HTML renommée en `.jpg` est
        refusée), puis antivirus (point d'extension, ADR-038). Conforme : `status` = `available`. Idempotente.

        - Contenu pas encore reçu : `FILE_NOT_UPLOADED` (422), le fichier reste en attente : terminer l'envoi
          puis confirmer de nouveau.
        - Contenu refusé : `FILE_UPLOAD_REJECTED` (422, `details.reason` : `size_mismatch`, `type_mismatch`,
          `malware`) ; le fichier passe en `rejected` et son contenu est effacé. Recommencer par une nouvelle
          déclaration.

        Fichier d'un autre compte : 404, sans révéler son existence.

        Erreurs : `GATEWAY_VALIDATION_FAILED` (400), `FILE_NOT_FOUND` (404), `FILE_NOT_UPLOADED`,
        `FILE_UPLOAD_REJECTED` (422), `FILE_STORAGE_UNAVAILABLE` (503).
