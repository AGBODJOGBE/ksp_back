        placeType:
          type:
            - string
            - 'null'
          description: Type de lieu de la demande d’origine.
        id:
          type: string
          format: uuid
        requestId:
          type: string
          format: uuid
        quoteId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        customerKind:
          enum:
            - individual
            - business
          description: Particulier ou entreprise. Une mission d'entreprise se règle par sa facture mensuelle, jamais par un paiement manuel (`CLEANING_PAYMENT_VIA_INVOICE`).
        organizationId:
          type:
            - string
            - 'null'
          format: uuid
          description: Organisation de la mission ; null pour un particulier.
        customerName:
          type:
            - string
            - 'null'
          description: Back-office — nom affiché du client ; null dans l'espace client, pour un compte sans nom ou si identity est indisponible (ADR-029).
        organizationName:
          type:
            - string
            - 'null'
          description: Back-office — raison sociale de l'organisation ; null pour un particulier ou si identity est indisponible (ADR-029).
        status:
          enum:
            - to_schedule
            - scheduled
            - in_progress
            - on_hold
            - completed
            - cancelled
        serviceCode:
          type: string
          pattern: ^[a-z][a-z0-9_]{1,49}$
        commune:
          type: string
        address:
          type: string
        chosenSlot:
          $ref: '#/components/schemas/TimeSlot'
        recurrence:
          oneOf:
            - $ref: '#/components/schemas/CleaningRecurrence'
            - type: 'null'
        plannedInterventions:
          type: integer
          minimum: 1
        completedInterventions:
          type: integer
          minimum: 0
        interventions:
          type: array
          items:
            $ref: '#/components/schemas/CleaningIntervention'
        payment:
