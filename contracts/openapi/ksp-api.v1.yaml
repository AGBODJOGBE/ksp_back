  /api/v1/cleaning/simulations:
    post:
      tags:
        - Nettoyage
      operationId: simulateCleaning
      summary: Simuler un prix
      description: |
        UC-CL-01. Fourchette indicative (−10 % / +15 % arrondie à 500 FCFA) et détail du calcul, sans compte ni donnée personnelle ; rien n’est enregistré. Une prestation sans prix répond `priced: false`, sans erreur, avec sa raison.

        Calcul d’un passage (ADR-033) : prix = max(minimum, (Σ nombre × prix par unité + Σ suppléments des valeurs choisies et des réponses oui + Σ options [(forfait + leurs champs) × coefficients de leurs champs]) × Π coefficients des valeurs choisies et des réponses oui de la prestation × coefficient de la commune × coefficient de la fréquence). Les coefficients des champs d’une option ne s’appliquent qu’à cette option.

        Corps au nouveau format (`answers`, `options` en objets, `frequency`) ou à l’ancien format déprécié (`premisesType`, `quantity`, `options` en codes) : voir `SimulateCleaningRequest`.

        Erreurs : `GATEWAY_VALIDATION_FAILED` et `CLEANING_VALIDATION_FAILED` (400, `details.field` et `details.reason` pour une réponse refusée), `CLEANING_SERVICE_NOT_FOUND` (404).
      x-ksp-grpc: ksp.cleaning.v1.CatalogService/Simulate
      x-ksp-access: public
      x-ksp-rate-limit: cleaning_simulation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulateCleaningRequest'
            example:
              serviceCode: home_cleaning
              answers:
                housing_type: villa
                rooms: 6
                bathrooms: 1
                condition: normal
