            - 'null'
        daysPerWeek:
          type:
            - integer
            - 'null'
          minimum: 1
          maximum: 7
        suspension:
          description: |
            Suspension en cours (CDC Nettoyage, partie 10 ; ADR-030) : passages à venir annulés, agents libérés,
            aucune planification possible (`CLEANING_CONTRACT_SUSPENDED`) jusqu'au déblocage ; null sinon.
          oneOf:
            - $ref: '#/components/schemas/CleaningSuspension'
