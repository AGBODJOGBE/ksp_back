          type: integer
          minimum: 1
          maximum: 10
          description: Séances en retard avant suspension (défaut 1, R-PP-04)
        balanceGuarantee:
          type: boolean
          description: Garantie de solde avant une séance (défaut non, R-PP-05)
        unpaidInvoicesWarning:
          type: integer
          minimum: 1
          maximum: 12
          description: Factures impayées avant avertissement (défaut 1, R-PE-06)
        unpaidInvoicesSuspension:
          type: integer
          minimum: 1
          maximum: 12
          description: Factures impayées avant suspension (défaut 2) ; plus grand que l’avertissement
