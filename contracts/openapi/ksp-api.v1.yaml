            - type: 'null'
        measuredFrequency:
          type:
            - string
            - 'null'
          description: Back-office — fréquence des mesures constatées, null sans mesure ou sans fréquence.
        measuredCalculation:
          description: |
            Back-office — calcul des mesures (grille en vigueur et commune de la demande au moment de la saisie) ; le
            devis sans lignes est prérempli depuis lui. Null sans mesure, et pour un agent seul (ADR-037).
          oneOf:
            - $ref: '#/components/schemas/CleaningPriceCalculation'
            - type: 'null'
        measuredPricingVersion:
          type:
