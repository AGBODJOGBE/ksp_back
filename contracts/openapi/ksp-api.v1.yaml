    InvoiceStatus:
      enum:
        - pending_payment
        - overdue
        - paid
        - cancelled
      description: |
        `pending_payment` jusqu'à l'échéance (émission + délai de règlement), puis `overdue` (impayée) ; `paid` quand
        les paiements atteignent le total ; `cancelled` réservé à une correction.
    InvoiceLine:
      type: object
      additionalProperties: false
      required:
        - label
        - quantity
        - unitPrice
        - amount
      properties:
        label:
          type: string
        quantity:
          type: integer
          minimum: 1
        unitPrice:
          $ref: '#/components/schemas/Money'
        amount:
          $ref: '#/components/schemas/Money'
    InvoicePayment:
      type: object
      additionalProperties: false
      required:
        - id
        - amount
        - method
        - reference
        - recordedBy
        - recordedAt
      properties:
        id:
          type: string
          format: uuid
        amount:
          $ref: '#/components/schemas/Money'
        method:
          $ref: '#/components/schemas/InvoiceRecordedPaymentMethod'
        reference:
          type:
            - string
            - 'null'
        recordedBy:
          type: string
        recordedAt:
          type: string
          format: date-time
    InvoiceRecordedPaymentMethod:
      description: |
        Moyen d'un paiement enregistré sur une facture : ceux du back-office (`InvoicePaymentMethod`), ou
        `mobile_money_online` (paiement en ligne confirmé par le prestataire, `recordedBy` = `system`, ADR-031).
      enum:
        - cash
        - bank_transfer
        - mobile_money_offline
        - mobile_money_online
    PaymentStatus:
      description: |
        `pending` : en attente de la confirmation du prestataire ; `succeeded` : réglé ; `failed` : refusé ;
        `cancelled` : abandonné sur la page de paiement, ou remplacé par un nouveau paiement du même objet ;
        `expired` : resté en attente au-delà de son délai ; `amount_mismatch` : le prestataire a approuvé un
        autre montant ou une autre devise — rien n'est enregistré sur la mission ou la facture, la finance tranche
        (ADR-031) ; tant qu'elle ne l'a pas traité (`underReview`), tout nouveau paiement de l'objet est refusé
        (ADR-032), et le statut reste `amount_mismatch` une fois l'écart traité. Une réussite confirmée plus tard (24 heures au plus) fait passer un paiement `failed`,
        `cancelled` ou `expired` à `succeeded`.
      enum:
        - pending
        - succeeded
        - failed
        - expired
        - cancelled
        - amount_mismatch
    PaymentSubjectType:
      enum:
        - cleaning_mission
        - billing_invoice
    PaymentSubject:
      type: object
      additionalProperties: false
      required:
        - type
        - id
        - part
        - reference
      properties:
        type:
          $ref: '#/components/schemas/PaymentSubjectType'
        id:
          type: string
          format: uuid
          description: Mission (Nettoyage) ou facture.
        part:
          description: Mission seulement — `deposit` (acompte) ou `balance` (reste dû) ; null pour une facture.
          enum:
            - deposit
            - balance
            - null
        reference:
          type:
            - string
            - 'null'
          description: Numéro de la facture ; null pour une mission.
    Payment:
      type: object
      additionalProperties: false
      required:
        - id
        - status
        - subject
        - amount
        - customerId
        - organizationId
        - method
        - provider
        - providerReference
        - checkoutUrl
        - failureReason
        - createdAt
        - updatedAt
        - expiresAt
        - completedAt
        - underReview
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/PaymentStatus'
        subject:
          $ref: '#/components/schemas/PaymentSubject'
        amount:
          $ref: '#/components/schemas/Money'
        customerId:
          type: string
          format: uuid
          description: Payeur (compte qui a créé le paiement).
        organizationId:
          type:
            - string
            - 'null'
          format: uuid
          description: Organisation payeuse (facture d'entreprise), null sinon.
        method:
          const: mobile_money_online
        provider:
          enum:
            - fedapay
            - simulated
          description: '`simulated` : prestataire simulé du développement local.'
        providerReference:
          type:
            - string
            - 'null'
          description: Référence de la transaction chez le prestataire, à citer au support.
        checkoutUrl:
          type:
            - string
            - 'null'
          format: uri
          description: |
            Page de paiement du prestataire, où envoyer le client tant que le paiement est `pending` ; null si elle
            n'a pas encore pu être obtenue (renvoyer la création avec la même clé).
        failureReason:
          description: Raison d'un paiement non abouti, null sinon.
          enum:
            - declined
            - cancelled
            - expired
            - null
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: Au-delà, un paiement encore en attente devient `expired`.
        completedAt:
          type:
            - string
            - 'null'
          format: date-time
        customerName:
          type:
            - string
            - 'null'
          description: |
            Back-office seulement (`GET /api/v1/admin/payment/payments`) : nom affiché du payeur, lu dans identity à
            l'affichage (ADR-029) ; null s'il est inconnu ou si identity ne répond pas. Absent des routes client.
        organizationName:
          type:
            - string
            - 'null'
          description: |
            Back-office seulement : raison sociale de l'organisation payeuse, lue dans identity à l'affichage
            (ADR-029) ; null pour un particulier, si elle est inconnue ou si identity ne répond pas.
        underReview:
          type: boolean
          description: |
            Écart de montant (`amount_mismatch`) pas encore traité par la finance : tout nouveau paiement de l'objet
            est refusé (`PAYMENT_UNDER_REVIEW`, ADR-032). Le portail affiche « paiement en cours de vérification,
            contactez le support KSP ». false pour tout autre paiement, et une fois l'écart traité.
        mismatchResolvedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: |
            Back-office seulement (absent des routes client) : date du traitement de l'écart de montant par la
            finance ; null tant qu'il n'est pas traité, et pour tout autre statut.
        mismatchResolvedBy:
          type:
            - string
            - 'null'
          format: uuid
          description: "Back-office seulement : compte du back-office qui a traité l'écart ; null sinon."
        mismatchResolutionNote:
          type:
            - string
            - 'null'
          maxLength: 500
          description: "Back-office seulement : ce que la finance a fait de l'écart ; null sinon."
    PaymentList:
      type: object
