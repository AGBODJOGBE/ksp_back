        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CleaningSuspension:
      type: object
      additionalProperties: false
      required:
        - cause
        - causes
        - since
        - unpaidCount
      properties:
        cause:
          enum:
            - unpaid_invoices
            - unpaid_interventions
            - organization_suspended
          description: |
            Plus ancienne cause encore active : factures d'entreprise impayées, passages impayés d'un particulier en
            récurrent, ou organisation suspendue par KSP (ADR-030).
        causes:
          type: array
          minItems: 1
          items:
            enum:
              - unpaid_invoices
              - unpaid_interventions
              - organization_suspended
          description: |
            Toutes les causes actives, la plus ancienne d'abord (ajout, ADR-030). Les causes se cumulent : la mission
            reprend quand il n'en reste aucune (un règlement ne lève pas la suspension de l'organisation, et
            inversement).
        since:
          type: string
          format: date-time
        unpaidCount:
          type: integer
          minimum: 0
          description: Impayés connus à la dernière décision ; 0 possible pour une organisation suspendue.
