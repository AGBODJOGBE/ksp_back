  /api/v1/payment/payments:
    post:
      tags:
        - Paiement
      operationId: createPayment
      summary: Payer en ligne par Mobile Money
      description: |
        Crée un paiement par Mobile Money (MTN, Moov) via FedaPay et renvoie la page de paiement du prestataire
        (`checkoutUrl`), où le client saisit son numéro et valide sur son téléphone (ADR-031).

        - **Acompte ou solde d'une mission** du Nettoyage (`subjectType` = `cleaning_mission`, `part` = `deposit`
          ou `balance`) : mission du client connecté, d'un particulier ; une mission d'entreprise se règle par sa
          facture (`PAYMENT_VIA_INVOICE`).
        - **Facture mensuelle** (`subjectType` = `billing_invoice`, sans `part`) : facture de l'organisation
          active (contexte entreprise) ou du client lui-même (contexte personnel).

        Le montant n'est jamais envoyé par le client : payment le lit dans cleaning (acompte encore dû, reste
        dû) ou dans billing (reste dû de la facture). Le paiement n'est confirmé que par le prestataire
        (notification signée), jamais par le retour du navigateur : au retour sur le portail, suivre
        `GET /api/v1/payment/payments/{id}`.

        Idempotent : un second envoi avec la même clé renvoie le même paiement ; un paiement encore en attente
        pour le même objet et le même montant est réutilisé. Prestataire injoignable : 503, réessayer avec la
        même clé.

        Un paiement réussi que cleaning ou billing n'a pas encore enregistré (quelques secondes en temps normal)
        n'est pas encore déduit du montant dû : tant qu'il en existe un pour l'objet (mission, toutes parts
        confondues, ou facture), la création est refusée (`PAYMENT_ALREADY_RECEIVED`, 409) pour ne pas faire payer
        deux fois. Le portail affiche « paiement reçu, en cours d'enregistrement » et relit la mission ou la
        facture un peu plus tard (ADR-032). Si l'enregistrement tarde au-delà de 15 minutes (réglable) après la
        réussite du paiement, le refus devient `PAYMENT_RECONCILIATION_PENDING` (409) : ne pas proposer de payer
        à nouveau, inviter le client à contacter le support ; l'équipe KSP est alertée.

        Un paiement de l'objet en écart de montant (`amount_mismatch` : argent reçu pour un autre montant ou une
        autre devise) que la finance n'a pas encore traité bloque aussi toute nouvelle création, quel que soit le
        payeur ou la part : `PAYMENT_UNDER_REVIEW` (409, « Un paiement est en cours de vérification ; contactez le
        support KSP. »), sans limite de temps, avec une alerte à l'équipe à chaque refus. Le blocage est levé
        quand la finance a traité l'écart (`POST /api/v1/admin/payment/payments/{id}/resolve-mismatch`, ADR-032).
        Le rejeu d'une même clé passe avant ces contrôles et renvoie toujours le même paiement.

        Erreurs : `PAYMENT_VALIDATION_FAILED` (400), `PAYMENT_SUBJECT_NOT_FOUND` (404),
        `PAYMENT_IDEMPOTENCY_KEY_REUSED` (409, clé déjà utilisée pour un autre objet), `PAYMENT_ALREADY_RECEIVED`
        (409, paiement réussi pas encore enregistré : réessayer plus tard), `PAYMENT_RECONCILIATION_PENDING`
        (409, toujours pas enregistré après 15 minutes : contacter le support), `PAYMENT_UNDER_REVIEW` (409,
        écart de montant pas encore traité par la finance : contacter le support), `PAYMENT_NOTHING_DUE`,
        `PAYMENT_SUBJECT_NOT_PAYABLE`, `PAYMENT_VIA_INVOICE` (422), `PAYMENT_PROVIDER_UNAVAILABLE` (503).
      x-ksp-grpc: ksp.payment.v1.PaymentService/CreatePayment
      x-ksp-access: authenticated
      x-ksp-rate-limit: payment_create
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'
            example:
              subjectType: cleaning_mission
              subjectId: 0192f1c4-7a2b-7c3d-8e4f-5a6b7c8d1000
              part: deposit
      responses:
        '200':
          description: Paiement créé (ou déjà créé avec cette clé)
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
              example:
