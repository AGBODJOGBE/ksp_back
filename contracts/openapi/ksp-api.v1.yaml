    post:
      tags:
        - Portefeuille (back-office)
      operationId: creditPrepaidWallet
      summary: Créditer le portefeuille prépayé d’un client
      description: |
        Crédit manuel du portefeuille prépayé d'un titulaire, avec motif (ADR-046) ; l'auteur est gardé dans le
        grand livre (écriture immuable) et le client est prévenu (notification « crédit sur votre portefeuille »
        pour un compte ; aucune pour une organisation).

        - `refund` : remboursement (service non rendu, passage manqué, geste commercial).
        - `top_up` : recharge Mobile Money reçue mais non créditée — écart de montant (`amount_mismatch`) traité
          par la finance : `paymentId` obligatoire, montant réellement reçu. Une recharge n'est créditée qu'une
          fois, automatiquement ou ici (`WALLET_IDEMPOTENCY_KEY_REUSED`, 409, si elle l'est déjà).

        Idempotent : la même clé (ou, pour `top_up`, le même paiement) renvoie le même crédit (`created: false`).

        Contrôles (ADR-048) : une recharge est vérifiée auprès de payment (recharge du même titulaire, argent
        reçu, montant au plus égal au montant reçu : sinon `WALLET_TOP_UP_NOT_VERIFIED`) ; un remboursement est
        plafonné (`WALLET_MANUAL_REFUND_MAX` : sinon `WALLET_CREDIT_LIMIT_EXCEEDED`) et justifié (motif de 15
        caractères au moins). Au-delà de `WALLET_CREDIT_APPROVAL_THRESHOLD`, rien n'est crédité : la demande
        (`pendingRequest`) attend la validation d'un second membre de la finance
        (`POST /api/v1/admin/wallet/credit-requests/{id}/approve`).

        Rôles : `finance_officer`, `super_admin` ; double authentification de moins de 10 minutes.

        Erreurs : `WALLET_VALIDATION_FAILED` (400), `WALLET_IDEMPOTENCY_KEY_REUSED` (409),
        `WALLET_TOP_UP_NOT_VERIFIED` et `WALLET_CREDIT_LIMIT_EXCEEDED` (422).
