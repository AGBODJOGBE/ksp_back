      additionalProperties: false
      description: Tranche du paramètre de base (bornes entières, contiguës, sans chevauchement).
      required:
        - from
        - to
        - mode
      properties:
        from:
          type: integer
          minimum: 0
          description: De (inclus)
        to:
          type: integer
          minimum: 0
          description: 'À (inclus) ; au-delà de la dernière tranche : « sur devis »'
        mode:
          enum:
            - flat
            - per_unit
          description: Forfait de la tranche, ou prix par unité × valeur (R-PX-01)
        amount:
          $ref: '#/components/schemas/Money'
          description: Forfait ou prix unitaire Absent pour qui n’a pas le droit de voir les montants (agent ; personnel sans `cleaning.amounts.read`).
    CleaningTariffSupplement:
      type: object
      additionalProperties: false
      description: Supplément lié à un autre paramètre (partie 4, « Tarif d’une offre »).
      required:
        - parameterCode
        - choiceCode
        - mode
        - coefficientBps
        - includedUnits
      properties:
        parameterCode:
          type: string
          pattern: ^[a-z][a-z0-9_]{1,49}$
        choiceCode:
          type:
            - string
            - 'null'
          pattern: ^[a-z][a-z0-9_]{1,49}$
          description: 'Paramètre « choix » : valeur concernée (`apres_travaux`) ; null sinon'
        mode:
          enum:
            - fixed
            - per_unit
            - coefficient
          description: Montant fixe, montant par unité, ou coefficient
        amount:
          anyOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Montant (fixe ou par unité) ; null pour un coefficient Absent pour qui n’a pas le droit de voir les montants (agent ; personnel sans `cleaning.amounts.read`).
        coefficientBps:
          type:
            - integer
            - 'null'
          minimum: 1
          maximum: 100000
          description: Coefficient en points de base (13000 = × 1,3), plafond × 10 (R-PX-02)
        includedUnits:
          type: integer
          minimum: 0
          maximum: 1000000
          description: 'Par unité : unités incluses avant le supplément (« chaque chambre au-delà de 3 » : 3) ; 0 : toutes comptent (D16)'
    CleaningFrequencyCoefficient:
      type: object
      additionalProperties: false
      description: Remise récurrente selon la fréquence (R-PX-06) ; seul endroit où la fréquence agit sur le prix.
      required:
        - key
        - coefficientBps
      properties:
        key:
          type: string
          pattern: ^(weekly|monthly|every_([2-9]|1[0-2])_weeks)$
          description: Clé de fréquence (R-PX-06)
        coefficientBps:
          type: integer
          minimum: 1
          maximum: 100000
          description: Coefficient en points de base (9000 = × 0,9)
    CleaningTariff:
      type: object
      additionalProperties: false
      description: Version de tarif d’une offre (R-CA-07, R-CA-08).
      required:
