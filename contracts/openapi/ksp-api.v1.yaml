  /api/v1/cleaning/estimates:
    post:
      tags:
        - Nettoyage
      operationId: estimateCleaning
      summary: Estimer plusieurs prestations d’un lieu
      description: |
        Parcours par lieu (ADR-034) : le client a choisi un type de lieu et coché une ou plusieurs prestations (1 à 10,
        distinctes, toutes proposées par ce lieu). Chaque prestation est calculée par le simulateur de l’ADR-033 ; rien
        n’est enregistré. `total` (entier XOF) est la somme des prix si toutes les prestations en ont un, sinon `null`
        avec `status` = `partially_priced` ou `unpriced`.

        `commune` est facultative : sans elle, le coefficient de commune est neutre (`communeApplied: false`) et le prix
        est indicatif ; il est recalculé avec la vraie commune à la demande de devis.

        Erreurs : `GATEWAY_VALIDATION_FAILED`, `CLEANING_VALIDATION_FAILED` (400, `details.field` préfixé par
        `items[i].`, par exemple `items[1].answers.surface`), `CLEANING_SERVICE_NOT_OFFERED` (400, `details.field`,
        `details.placeType`, `details.serviceCode`), `CLEANING_PLACE_TYPE_NOT_FOUND` (404).
      x-ksp-grpc: ksp.cleaning.v1.CatalogService/Estimate
      x-ksp-access: public
      x-ksp-rate-limit: cleaning_simulation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstimateCleaningRequest'
            example:
              placeType: house
              items:
                - serviceCode: house_cleaning
                  answers:
                    surface: 180
                    bedrooms: 4
                    bathrooms: 2
                    front_yard: true
                    back_yard: false
                    condition: normal
                  options:
                    - code: windows
                      answers:
                        window_count: 6
                  frequency: once
                - serviceCode: garden_maintenance
                  answers:
                    surface: 250
                    condition: overgrown
                  options: []
                  frequency: monthly
                - serviceCode: septic_emptying
                  answers:
                    tank_volume: 6
                    tank_type: septic_tank
                    truck_access: easy
                  frequency: once
      responses:
        '200':
          description: Succès
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
