            - string
            - 'null'
        completedAt:
          type:
            - string
            - 'null'
          format: date-time
        agentName:
          type:
            - string
            - 'null'
          description: Back-office — nom affiché de l'agent de la visite (fiche agent) ; null s'il est inconnu (ADR-029).
        groupVisitId:
          type:
            - string
            - 'null'
          format: uuid
          description: Visite commune à plusieurs demandes du groupe (ADR-035) ; null pour une visite propre à la demande.
    CleaningQuote:
