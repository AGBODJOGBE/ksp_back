        '504':
          $ref: '#/components/responses/GatewayTimeout'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Jeton d'accès ES256 délivré par identity, valable 15 minutes.
    refreshCookieWeb:
      type: apiKey
      in: cookie
      name: __Secure-ksp_rt
      description: Jeton de renouvellement des sites web (portail, shop, print).
    refreshCookieBackoffice:
      type: apiKey
      in: cookie
      name: __Secure-ksp_admin_rt
      description: Jeton de renouvellement du back-office.

  headers:
    X-Correlation-Id:
      description: Identifiant de la requête, à citer au support.
      schema:
        type: string
        format: uuid
    Set-Cookie-Refresh:
      description: |
        Web et back-office uniquement : nouveau jeton de renouvellement, par exemple
        `__Secure-ksp_rt=…; Path=/api/v1/identity/token; HttpOnly; Secure; SameSite=Strict; Max-Age=2592000`.
      schema:
        type: string
    Set-Cookie-Clear:
      description: 'Web et back-office uniquement : effacement du cookie de renouvellement (`Max-Age=0`).'
      schema:
        type: string
    Retry-After:
      description: Nombre de secondes à attendre avant de réessayer.
      schema:
        type: integer
        minimum: 1

  parameters:
    InvoiceId:
      name: id
      in: path
      required: true
      description: Identifiant de la facture (UUID).
      schema:
        type: string
        format: uuid
    InvoiceStatus:
      name: status
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/InvoiceStatus'
    OrganizationId:
      name: id
      in: path
      required: true
      description: Identifiant de l'organisation (UUID).
      schema:
        type: string
        format: uuid
    OrganizationStatus:
      name: status
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/OrganizationStatus'
    CleaningId:
      name: id
      in: path
      required: true
      description: Identifiant (UUID).
      schema:
        type: string
        format: uuid
    CleaningZoneCode:
      name: code
      in: path
      required: true
      description: Clé de la zone (commune normalisée, par exemple `abomey-calavi`).
      schema:
        type: string
        pattern: ^[a-z][a-z0-9_-]{1,99}$
    CleaningServiceCode:
      name: code
      in: path
      required: true
      description: Code de la prestation.
      schema:
        type: string
        pattern: ^[a-z][a-z0-9_]{1,49}$
    Limit:
      name: limit
      in: query
      required: false
      description: 20 par défaut, 100 au plus.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      description: Valeur `nextCursor` de la page précédente.
      schema:
        type: string
        format: uuid
    CleaningRequestStatus:
      name: status
      in: query
      required: false
      schema:
        enum:
          - received
          - visit_scheduled
          - quote_sent
          - accepted
          - declined
          - rejected
          - expired
          - cancelled
    CleaningMissionStatus:
      name: status
      in: query
      required: false
      schema:
        enum:
          - to_schedule
          - scheduled
          - in_progress
          - on_hold
          - completed
          - cancelled
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 'Clé unique par opération (8 à 100 caractères) : un second envoi avec la même clé ne crée rien de plus.'
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{8,100}$

  responses:
    BadRequest:
      description: Requête invalide (`GATEWAY_VALIDATION_FAILED`, `GATEWAY_CLIENT_UNKNOWN`, `IDENTITY_OTP_INVALID`, `IDENTITY_MFA_CODE_INVALID`, `IDENTITY_MFA_CODE_REUSED`, `IDENTITY_EMAIL_INVALID`)
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/X-Correlation-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: IDENTITY_OTP_INVALID
              message: Le code est incorrect.
              details:
                attemptsRemaining: 3
              correlationId: 0192f1c4-7a2b-7c3d-8e4f-5a6b7c8d9e12
    Unauthorized:
      description: Jeton absent, invalide, expiré ou session révoquée (`GATEWAY_TOKEN_MISSING`, `GATEWAY_TOKEN_INVALID`, `GATEWAY_TOKEN_EXPIRED`, `IDENTITY_REFRESH_TOKEN_*`, `IDENTITY_SESSION_REVOKED`, `IDENTITY_MFA_TOKEN_INVALID`)
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/X-Correlation-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: GATEWAY_TOKEN_EXPIRED
              message: Votre session a expiré, reconnectez-vous.
              details: {}
              correlationId: 0192f1c4-7a2b-7c3d-8e4f-5a6b7c8d9e12
    NotFound:
      description: Introuvable (`IDENTITY_USER_NOT_FOUND`, `IDENTITY_ORGANIZATION_NOT_FOUND`)
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/X-Correlation-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: IDENTITY_USER_NOT_FOUND
              message: Compte introuvable.
              details: {}
              correlationId: 0192f1c4-7a2b-7c3d-8e4f-5a6b7c8d9e12
    Forbidden:
      description: Accès refusé (`IDENTITY_ACCOUNT_SUSPENDED`, `IDENTITY_BACKOFFICE_FORBIDDEN`, `IDENTITY_CONTEXT_FORBIDDEN`, `IDENTITY_ORGANIZATION_FORBIDDEN`)
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/X-Correlation-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: IDENTITY_ACCOUNT_SUSPENDED
              message: Ce compte est suspendu.
              details: {}
              correlationId: 0192f1c4-7a2b-7c3d-8e4f-5a6b7c8d9e12
    UnprocessableEntity:
      description: Code expiré ou annulé, étape de double authentification impossible, adresse déjà vérifiée, état de l'organisation incompatible (`IDENTITY_OTP_EXPIRED`, `IDENTITY_OTP_TOO_MANY_ATTEMPTS`, `IDENTITY_MFA_*`, `IDENTITY_EMAIL_ALREADY_VERIFIED`, `IDENTITY_ORGANIZATION_NOT_ACTIVE`, `IDENTITY_ORGANIZATION_TOO_MANY_PENDING`, `IDENTITY_ORGANIZATION_INVALID_TRANSITION`)
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/X-Correlation-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: IDENTITY_OTP_EXPIRED
              message: Le code a expiré, demandez-en un nouveau.
              details: {}
              correlationId: 0192f1c4-7a2b-7c3d-8e4f-5a6b7c8d9e12
    TooManyRequests:
      description: Trop de requêtes (`GATEWAY_RATE_LIMITED`, `IDENTITY_OTP_RATE_LIMITED`)
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/X-Correlation-Id'
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: IDENTITY_OTP_RATE_LIMITED
              message: Trop de codes demandés, réessayez plus tard.
              details:
                retryAfterSeconds: 45
              correlationId: 0192f1c4-7a2b-7c3d-8e4f-5a6b7c8d9e12
    ServiceUnavailable:
      description: Service momentanément indisponible, coupe-circuit ouvert (`IDENTITY_UNAVAILABLE`)
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/X-Correlation-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: IDENTITY_UNAVAILABLE
              message: Le service est momentanément indisponible, réessayez dans quelques instants.
              details: {}
              correlationId: 0192f1c4-7a2b-7c3d-8e4f-5a6b7c8d9e12

    Conflict:
      description: Conflit (`CLEANING_TEAM_UNAVAILABLE`, `CLEANING_CONCURRENT_UPDATE`, `CLEANING_AGENT_ALREADY_REGISTERED`, `IDENTITY_EMAIL_ALREADY_USED`, `IDENTITY_ORGANIZATION_ALREADY_EXISTS`)
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/X-Correlation-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: CLEANING_TEAM_UNAVAILABLE
              message: Un ou plusieurs agents sont déjà pris sur ce créneau.
              details:
                agentIds:
                  - 0192f1c4-7a2b-7c3d-8e4f-5a6b7c8d0002
              correlationId: 0192f1c4-7a2b-7c3d-8e4f-5a6b7c8d9e12

    PayloadTooLarge:
      description: Corps de requête au-delà de 1 Mo (`GATEWAY_PAYLOAD_TOO_LARGE`)
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/X-Correlation-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: GATEWAY_PAYLOAD_TOO_LARGE
              message: La requête est trop volumineuse.
              details: {}
              correlationId: 0192f1c4-7a2b-7c3d-8e4f-5a6b7c8d9e12
    InternalError:
      description: |
        Erreur interne (`GATEWAY_INTERNAL_ERROR`, `GATEWAY_UPSTREAM_ERROR`). Le message ne donne
        jamais de détail technique.
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/X-Correlation-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: GATEWAY_INTERNAL_ERROR
              message: Une erreur inattendue est survenue. Réessayez dans quelques instants.
              details: {}
              correlationId: 0192f1c4-7a2b-7c3d-8e4f-5a6b7c8d9e12
    GatewayTimeout:
      description: Le service appelé n'a pas répondu à temps (`IDENTITY_TIMEOUT`)
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/X-Correlation-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: IDENTITY_TIMEOUT
              message: Le service met trop de temps à répondre, réessayez dans quelques instants.
              details: {}
              correlationId: 0192f1c4-7a2b-7c3d-8e4f-5a6b7c8d9e12

  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, details, correlationId]
          properties:
            code:
              type: string
              pattern: '^[A-Z]+(_[A-Z0-9]+)+$'
              description: Forme SERVICE_RAISON.
            message:
              type: string
              description: Message lisible par l'utilisateur, en français.
            details:
              type: object
            correlationId:
              type: string
              format: uuid

    PhoneE164:
      type: string
      pattern: '^\+[1-9][0-9]{6,14}$'
      description: Numéro au format international E.164.

    OtpChannel:
      type: string
      enum: [sms, whatsapp]

    UserStatus:
      type: string
      enum: [pending_verification, active, locked, suspended, deletion_pending, deleted]

    User:
      type: object
      additionalProperties: false
      required: [id, status, firstName, lastName, phone, email, emailVerified, preferredLanguage, createdAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/UserStatus'
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        phone:
          oneOf:
            - $ref: '#/components/schemas/PhoneE164'
            - type: 'null'
        email:
          type: [string, 'null']
          format: email
          description: Adresse du compte, en minuscules ; enregistrée seulement après confirmation par code.
        emailVerified:
          type: boolean
          description: L'e-mail a été confirmé par un code. Seule une adresse vérifiée reçoit des e-mails.
        preferredLanguage:
          type: string
        createdAt:
          type: string
          format: date-time

    RequestOtpRequest:
      type: object
      additionalProperties: false
      required: [phone]
      properties:
        phone:
          $ref: '#/components/schemas/PhoneE164'
        channel:
          $ref: '#/components/schemas/OtpChannel'
          default: whatsapp

    RequestOtpResponse:
      type: object
      additionalProperties: false
      required: [challengeId, maskedTarget, channel, expiresInSeconds, resendAfterSeconds]
      properties:
        challengeId:
          type: string
          format: uuid
          description: À renvoyer avec le code.
        maskedTarget:
          type: string
        channel:
          $ref: '#/components/schemas/OtpChannel'
          description: Canal réellement utilisé, après une éventuelle bascule.
        expiresInSeconds:
          type: integer
          minimum: 1
        resendAfterSeconds:
          type: integer
          minimum: 0

    VerifyOtpRequest:
      type: object
      additionalProperties: false
      required: [challengeId, code]
      properties:
        challengeId:
          type: string
          format: uuid
        code:
          type: string
          pattern: '^[0-9]{4,8}$'
          description: Longueur fixée par configuration (6 chiffres proposés).
        deviceLabel:
          type: string
          maxLength: 100
          description: Nom de l'appareil affiché dans la liste des sessions ; déduit du User-Agent s'il est absent.

    SessionResponse:
      type: object
      additionalProperties: false
      required:
        [
          status,
          accessToken,
          accessTokenExpiresAt,
          refreshTokenExpiresAt,
          sessionId,
          user,
          profileIncomplete,
          activeContext,
        ]
      properties:
        status:
          const: authenticated
        accessToken:
          type: string
        accessTokenExpiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
          description: Mobile uniquement. Web et back-office le reçoivent dans le cookie.
        refreshTokenExpiresAt:
          type: string
          format: date-time
        sessionId:
          type: string
          format: uuid
        user:
          $ref: '#/components/schemas/User'
        profileIncomplete:
          type: boolean
          description: Le nom n'est pas encore renseigné ; il est obligatoire avant tout paiement.
        activeContext:
          $ref: '#/components/schemas/ActiveContext'

    VerifyOtpSessionResponse:
      type: object
      additionalProperties: false
      required:
        [
          status,
          accessToken,
          accessTokenExpiresAt,
          refreshTokenExpiresAt,
          sessionId,
          user,
          profileIncomplete,
          activeContext,
          isNewUser,
        ]
      properties:
        status:
          const: authenticated
        accessToken:
          type: string
        accessTokenExpiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
          description: Mobile uniquement. Web et back-office le reçoivent dans le cookie.
        refreshTokenExpiresAt:
          type: string
          format: date-time
        sessionId:
          type: string
          format: uuid
        user:
          $ref: '#/components/schemas/User'
        profileIncomplete:
          type: boolean
        activeContext:
          $ref: '#/components/schemas/ActiveContext'
        isNewUser:
          type: boolean
          description: Le compte vient d'être créé par ce code.

    MfaRequiredResponse:
      type: object
      additionalProperties: false
      required: [status, mfaToken, expiresAt, methods, enrollmentRequired]
      properties:
        status:
          const: mfa_required
        mfaToken:
          type: string
          description: Jeton court (5 minutes), à usage unique, à présenter aux routes /api/v1/identity/mfa/….
        expiresAt:
          type: string
          format: date-time
        methods:
          type: array
          items:
            type: string
            enum: [totp, recovery_code, sms]
        enrollmentRequired:
          type: boolean
          description: L'application d'authentification doit être configurée avant tout accès.

    MfaToken:
      type: string
      minLength: 1
      maxLength: 128
      description: Jeton reçu dans la réponse mfa_required de /api/v1/identity/otp/verify.

    EnrollTotpRequest:
      type: object
      additionalProperties: false
      required: [mfaToken]
      properties:
        mfaToken:
          $ref: '#/components/schemas/MfaToken'

    TotpEnrollmentResponse:
      type: object
      additionalProperties: false
      required: [secret, otpauthUri, issuer, accountName, digits, periodSeconds]
      properties:
        secret:
          type: string
          pattern: '^[A-Z2-7]+$'
          description: Secret en base32, pour une saisie à la main. Affiché une seule fois.
        otpauthUri:
          type: string
          pattern: '^otpauth://totp/'
          description: À afficher en QR code.
        issuer:
          type: string
        accountName:
          type: string
        digits:
          const: 6
        periodSeconds:
          const: 30

    ConfirmTotpRequest:
      type: object
      additionalProperties: false
      required: [mfaToken, code]
      properties:
        mfaToken:
          $ref: '#/components/schemas/MfaToken'
        code:
          type: string
          pattern: '^[0-9]{6}$'
          description: Premier code affiché par l'application d'authentification.

    TotpConfirmedResponse:
      type: object
      additionalProperties: false
      required:
        [
          status,
          accessToken,
          accessTokenExpiresAt,
          refreshTokenExpiresAt,
          sessionId,
          user,
          profileIncomplete,
          activeContext,
          recoveryCodes,
        ]
      properties:
        status:
          const: authenticated
        accessToken:
          type: string
        accessTokenExpiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
          description: Mobile uniquement. Web et back-office le reçoivent dans le cookie.
        refreshTokenExpiresAt:
          type: string
          format: date-time
        sessionId:
          type: string
          format: uuid
        user:
          $ref: '#/components/schemas/User'
        profileIncomplete:
          type: boolean
        activeContext:
          $ref: '#/components/schemas/ActiveContext'
        recoveryCodes:
          type: array
          minItems: 10
          maxItems: 10
          description: Codes de récupération, chacun utilisable une fois, affichés une seule fois.
          items:
            type: string
            pattern: '^[0-9A-Z]{5}-[0-9A-Z]{5}$'

    VerifyMfaRequest:
      type: object
      additionalProperties: false
      required: [mfaToken, method, code]
      properties:
        mfaToken:
          $ref: '#/components/schemas/MfaToken'
        method:
          type: string
          enum: [totp, recovery_code]
        code:
          type: string
          pattern: '^[0-9A-Za-z -]{6,20}$'
          description: 6 chiffres pour totp ; code de récupération (tirets et espaces ignorés).

    MfaSessionResponse:
      type: object
      additionalProperties: false
      required:
        [
          status,
          accessToken,
          accessTokenExpiresAt,
          refreshTokenExpiresAt,
          sessionId,
          user,
          profileIncomplete,
          activeContext,
          recoveryCodesRemaining,
        ]
      properties:
        status:
          const: authenticated
        accessToken:
          type: string
        accessTokenExpiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
          description: Mobile uniquement. Web et back-office le reçoivent dans le cookie.
        refreshTokenExpiresAt:
          type: string
          format: date-time
        sessionId:
          type: string
          format: uuid
        user:
          $ref: '#/components/schemas/User'
        profileIncomplete:
          type: boolean
        activeContext:
          $ref: '#/components/schemas/ActiveContext'
        recoveryCodesRemaining:
          type: integer
          minimum: 0
          description: Codes de récupération encore utilisables ; le back-office prévient quand il en reste peu.

    RefreshSessionRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      description: Mobile uniquement ; web et back-office n'envoient pas de corps.
      properties:
        refreshToken:
          type: string

    LogoutRequest:
      type: object
      additionalProperties: false
      properties:
        scope:
          type: string
          enum: [this_device, all_devices]
          default: this_device

    LogoutResponse:
      type: object
      additionalProperties: false
      required: [revokedSessions]
      properties:
        revokedSessions:
          type: integer
          minimum: 0

    ActiveContext:
      type: object
      additionalProperties: false
      required: [type, organizationId]
      description: |
        Contexte actif de la session, celui du jeton d'accès (claim `ctx`) : il fixe le type de compte
        réel que lisent les services métier. `individual` (particulier, contexte personnel) : choix du
        paiement, tout réglé à la fin. `business` (entreprise, organisation active) : facture mensuelle,
        pas de choix du moyen de paiement, jours d'intervention par semaine (Nettoyage). Une session
        s'ouvre dans le contexte personnel ; `POST /api/v1/identity/context` active une organisation
        validée (ADR-027).
      properties:
        type:
          type: string
          enum: [individual, business]
        organizationId:
          type: [string, 'null']
          format: uuid
          description: Organisation active d'une entreprise ; null pour un particulier.
        organizationName:
          type: [string, 'null']
          description: Raison sociale de l'organisation active ; null pour un particulier.

    MeResponse:
      type: object
      additionalProperties: false
      required: [user, profileIncomplete, pendingEmail, activeContext]
      properties:
        user:
          $ref: '#/components/schemas/User'
        profileIncomplete:
          type: boolean
        activeContext:
          $ref: '#/components/schemas/ActiveContext'
        pendingEmail:
          type: [string, 'null']
          format: email
          description: Adresse en attente de confirmation par code (code envoyé, encore valable) ; null sinon.

    SwitchContextRequest:
      type: object
      additionalProperties: false
      required: [organizationId]
      properties:
        organizationId:
          type: [string, 'null']
          format: uuid
          description: Organisation à activer ; null pour revenir au contexte personnel.

    SwitchContextResponse:
      type: object
      additionalProperties: false
      required: [accessToken, accessTokenExpiresAt, activeContext]
      properties:
        accessToken:
          type: string
          description: Nouveau jeton d'accès, à utiliser à la place du précédent.
        accessTokenExpiresAt:
          type: string
          format: date-time
        activeContext:
          $ref: '#/components/schemas/ActiveContext'

    OrganizationStatus:
      type: string
      enum: [pending_review, active, rejected, suspended]
      description: |
        `pending_review` : en attente de validation par KSP ; `active` : validée, peut devenir le
        contexte actif ; `rejected` : refusée (définitif) ; `suspended` : suspendue par KSP.

    OrgRole:
      type: string
      enum: [org_admin, org_member, org_viewer]
      description: Rôle dans l'organisation ; seul `org_admin` (le créateur) est attribué aujourd'hui.

    Organization:
      type: object
      additionalProperties: false
      required:
        [
          id,
          legalName,
          address,
          ifu,
          rccm,
          billingEmail,
          status,
          rejectionReason,
          suspensionReason,
          createdAt,
          reviewedAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        legalName:
          type: string
          description: Raison sociale.
        address:
          type: string
        ifu:
          type: string
          pattern: '^[0-9]{13}$'
          description: Identifiant fiscal unique (13 chiffres).
        rccm:
          type: [string, 'null']
          description: Registre du commerce et du crédit mobilier ; null s'il n'est pas renseigné.
        billingEmail:
          type: [string, 'null']
          format: email
          description: E-mail de facturation, toujours confirmé par code ; null si aucun ne l'est.
        status:
          $ref: '#/components/schemas/OrganizationStatus'
        rejectionReason:
          type: [string, 'null']
          description: Motif du refus (`rejected`).
        suspensionReason:
          type: [string, 'null']
          description: Motif de la suspension en cours (`suspended`).
        createdAt:
          type: string
          format: date-time
        reviewedAt:
          type: [string, 'null']
          format: date-time
          description: Date de la validation ou du refus.

    OrganizationMembership:
      type: object
      additionalProperties: false
      required: [organization, role, pendingBillingEmail]
      properties:
        organization:
          $ref: '#/components/schemas/Organization'
        role:
          $ref: '#/components/schemas/OrgRole'
        pendingBillingEmail:
          type: [string, 'null']
          format: email
          description: E-mail de facturation en attente de confirmation (code envoyé, encore valable) ; null sinon.

    OrganizationMembershipList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationMembership'

    CreateOrganizationRequest:
      type: object
      additionalProperties: false
      required: [legalName, address, ifu]
      properties:
        legalName:
          type: string
          minLength: 1
          maxLength: 200
          description: Raison sociale.
        address:
          type: string
          minLength: 1
          maxLength: 300
        ifu:
          type: string
          minLength: 1
          maxLength: 30
          description: Identifiant fiscal unique, 13 chiffres (espaces ignorés) ; format contrôlé par identity.
        rccm:
          type: string
          minLength: 1
          maxLength: 50
          description: Facultatif, par exemple `RB/COT/19 B 12345`.

    OrganizationDecisionRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Motif communiqué au client.

    AdminOrganization:
      type: object
      additionalProperties: false
      required:
        [
          id,
          legalName,
          address,
          ifu,
          rccm,
          billingEmail,
          status,
          rejectionReason,
          suspensionReason,
          createdAt,
          reviewedAt,
          createdBy,
          reviewedBy,
          suspendedAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        legalName:
          type: string
        address:
          type: string
        ifu:
          type: string
          pattern: '^[0-9]{13}$'
        rccm:
          type: [string, 'null']
        billingEmail:
          type: [string, 'null']
          format: email
        status:
          $ref: '#/components/schemas/OrganizationStatus'
        rejectionReason:
          type: [string, 'null']
        suspensionReason:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
        reviewedAt:
          type: [string, 'null']
          format: date-time
        createdBy:
          type: string
          format: uuid
          description: Compte qui a demandé la création.
        reviewedBy:
          type: [string, 'null']
          format: uuid
          description: Admin KSP qui a validé ou refusé la demande.
        suspendedAt:
          type: [string, 'null']
          format: date-time

    AdminOrganizationList:
      type: object
      additionalProperties: false
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdminOrganization'
        nextCursor:
          type: [string, 'null']
          format: uuid

    OrganizationMember:
      type: object
      additionalProperties: false
      required: [userId, role, firstName, lastName, phone, joinedAt]
      properties:
        userId:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/OrgRole'
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        phone:
          type: [string, 'null']
        joinedAt:
          type: string
          format: date-time

    AdminOrganizationDetail:
      type: object
      additionalProperties: false
      required: [organization, members]
      properties:
        organization:
          $ref: '#/components/schemas/AdminOrganization'
        members:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationMember'

    ChangeEmailRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 254
          description: Adresse à confirmer ; espaces autour retirés et mise en minuscules par identity.

    ChangeEmailResponse:
      type: object
      additionalProperties: false
      required: [pendingEmail, expiresInSeconds, resendAfterSeconds]
      properties:
        pendingEmail:
          type: string
          format: email
          description: Adresse à confirmer, normalisée.
        expiresInSeconds:
          type: integer
          minimum: 1
        resendAfterSeconds:
          type: integer
          minimum: 0
          description: Délai avant de pouvoir demander un nouveau code.

    ConfirmEmailRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          pattern: '^[0-9]{4,8}$'
          description: Code reçu par e-mail.

    UpdateMeRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        preferredLanguage:
          type: string
          pattern: '^[a-z]{2}$'
          description: Code de langue, "fr" par défaut.

    Jwks:
      type: object
      additionalProperties: false
      required: [keys]
      properties:
        keys:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [kid, kty, crv, x, y, alg, use]
            properties:
              kid:
                type: string
              kty:
                const: EC
              crv:
                const: P-256
              x:
                type: string
              y:
                type: string
              alg:
                const: ES256
              use:
                const: sig

    Money:
      type: object
      additionalProperties: false
      required:
        - amount
        - currency
      properties:
        amount:
          type: integer
          description: Entier en FCFA, jamais de décimales.
        currency:
          const: XOF
      description: Montant en entiers XOF.
    TimeSlot:
      type: object
      additionalProperties: false
      required:
        - start
        - end
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
      description: Créneau horaire, début inclus, fin exclue.
    CleaningRecurrence:
      type: object
      additionalProperties: false
      required:
        - period
        - visitsPerPeriod
        - durationMonths
      properties:
        period:
          enum:
            - week
            - month
        visitsPerPeriod:
          type: integer
          minimum: 1
          maximum: 31
        durationMonths:
          type: integer
          minimum: 1
          maximum: 36
      description: 'Contrat récurrent : passages par période, pendant une durée en mois (facture mensuelle avec billing).'
    CleaningPremisesType:
      type: string
      enum:
        - apartment
        - house
        - office
        - shop
        - warehouse
        - other
    CleaningUnit:
      type: string
      enum:
        - square_meter
        - room
        - septic_tank
        - cubic_meter
    CleaningPriceLine:
      type: object
      additionalProperties: false
      required:
        - label
        - quantity
        - unitPrice
        - amount
      properties:
        label:
          type: string
        quantity:
          type: integer
          minimum: 1
        unitPrice:
          $ref: '#/components/schemas/Money'
        amount:
          $ref: '#/components/schemas/Money'
    CleaningPriceRange:
      type: object
      additionalProperties: false
      required:
        - low
        - high
      properties:
        low:
          $ref: '#/components/schemas/Money'
        high:
          $ref: '#/components/schemas/Money'
    CleaningOption:
      type: object
      additionalProperties: false
      required:
        - code
        - label
        - price
      properties:
        code:
          type: string
          pattern: ^[a-z][a-z0-9_]{1,49}$
        label:
          type: string
        price:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
    CleaningServiceOffer:
      type: object
      additionalProperties: false
      required:
        - code
        - name
        - description
        - unit
        - options
        - priced
        - minimumPrice
      properties:
        code:
          type: string
          pattern: ^[a-z][a-z0-9_]{1,49}$
        name:
          type: string
        description:
          type: string
        unit:
          $ref: '#/components/schemas/CleaningUnit'
        options:
          type: array
          items:
            $ref: '#/components/schemas/CleaningOption'
        priced:
          type: boolean
          description: Faux tant que le prix n’est pas fixé par l’équipe Nettoyage.
        minimumPrice:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
    CleaningServiceList:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CleaningServiceOffer'
    SimulateCleaningRequest:
      type: object
      additionalProperties: false
      required:
        - serviceCode
        - premisesType
        - quantity
        - commune
      properties:
        serviceCode:
