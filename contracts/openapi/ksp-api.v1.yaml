        que l'adresse soit déjà utilisée par un autre compte ou non.

        Erreurs : `GATEWAY_VALIDATION_FAILED` et `IDENTITY_EMAIL_INVALID` (400),
        `IDENTITY_EMAIL_ALREADY_VERIFIED` (422, adresse déjà vérifiée sur ce compte),
        `IDENTITY_OTP_RATE_LIMITED` et `GATEWAY_RATE_LIMITED` (429), `IDENTITY_OTP_SEND_FAILED` (503),
