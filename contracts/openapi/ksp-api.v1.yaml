openapi: 3.1.0
info:
  title: API publique KSP
  version: 1.0.0
  description: |
    API REST exposée par la gateway aux fronts KSP (cahier des charges Gateway, partie 6).
    Ce fichier est la référence écrite avant le code : quand la gateway existera, la CI
    vérifiera que la documentation qu'elle génère lui correspond.

    **Conventions**
    - JSON, champs en camelCase ; dates ISO 8601 en UTC ; montants en entiers XOF.
    - Tout champ inconnu dans une requête est refusé (400).
    - Chaque réponse porte l'en-tête `X-Correlation-Id`.
    - Erreurs au format unique `{ "error": { code, message, details, correlationId } }`.

    **Type de client** : déduit par la gateway, jamais déclaré par le client.
    - Origine `admin.ksp.bj` : back-office.
    - Origines `ksp.bj`, `shop.ksp.bj`, `print.ksp.bj` : web.
    - Aucune origine et en-tête `X-App-Version` présent : mobile (application client, application livreur).
    - Toute autre requête vers une route d'authentification est refusée (`GATEWAY_CLIENT_UNKNOWN`).

    **Jeton de renouvellement**
    - Web et back-office : cookie `HttpOnly`, `Secure`, `SameSite=Strict`, limité au chemin
      `/api/v1/identity/token`, nommé `__Secure-ksp_rt` (web) ou `__Secure-ksp_admin_rt` (back-office).
      Il n'apparaît jamais dans le corps des réponses.
    - Mobile : dans le corps des réponses ; l'application le range dans le stockage sécurisé du téléphone.

    **Extensions `x-ksp-*`** (base du manifeste de routage de la gateway)
    - `x-ksp-grpc` : appel gRPC exécuté, `<paquet>.<Service>/<Méthode>`.
    - `x-ksp-access` : `public`, `refresh_token`, `mfa_token` (jeton de double authentification
      dans le corps, vérifié par identity) ou `authenticated`.
    - `x-ksp-rate-limit` : catégorie de limite d'appels, définie dans `x-ksp-rate-limits`.
    - `x-ksp-roles` : au moins un de ces rôles est exigé (route connectée uniquement).
    - `x-ksp-mfa-max-age` : double authentification faite depuis au plus ce nombre de secondes ;
      obligatoire sur toute route `/api/v1/admin/`.
    - En-tête `Idempotency-Key` obligatoire sur les écritures sensibles (paramètre `IdempotencyKey`).
    - `x-ksp-raw-body` : corps transmis au service octet pour octet, sans validation par la gateway
      (notification signée d'un prestataire : la signature porte sur le corps exact, ADR-031).
    - `x-ksp-pending-deletion` : la route accepte la session restreinte d'un compte en cours de
      suppression (jeton au seul rôle `account_deletion_pending`, ADR-036). Toute autre route
      connectée la refuse avec `GATEWAY_ACCOUNT_DELETION_PENDING` (403).

servers:
  - url: https://api.ksp.bj
    description: Production (adresse à valider avec le choix de l'hébergeur, ADR-018)
  - url: http://localhost:3000
    description: Développement local
tags:
  - name: Authentification
    description: Connexion par téléphone, sessions (UC-ID-01, 04, 05)
  - name: Compte
    description: Profil de l'utilisateur connecté
  - name: Comptes entreprise
    description: Organisations du client, changement de contexte, e-mail de facturation (UC-ID-12 à 16, ADR-027)
  - name: Comptes entreprise (back-office)
    description: Validation, refus, suspension des comptes entreprise (ADR-027)
  - name: Comptes (back-office)
    description: Recherche d'un compte KSP par numéro (ADR-029) ; administration des comptes et des rôles (ADR-043)
  - name: Clés publiques
    description: Vérification des jetons d'accès (UC-ID-22)
  - name: Nettoyage
    description: Simulateur public, demandes de devis et missions du client (UC-CL-01 à 05)
  - name: Nettoyage (back-office)
    description: Demandes, visites, devis, missions, catalogue, agents et équipes (UC-CL-06 à 12)
  - name: Facturation
    description: Factures mensuelles des contrats d'entreprise, dans l'espace du client (CDC Nettoyage, partie 10)
  - name: Facturation (back-office)
    description: Factures, paiements manuels et réglages de la facturation
  - name: Paiement
    description: Paiement en ligne par Mobile Money (FedaPay) d'un acompte, d'un solde de mission ou d'une facture (ADR-031)
  - name: Paiement (back-office)
    description: Suivi des paiements en ligne

# Valeurs proposées par le cahier des charges Gateway (partie 4), réglables par configuration.
x-ksp-rate-limits:
  public:
    limit: 60
    per: minute
    key: ip
  authenticated:
    limit: 300
    per: minute
    key: user
  otp_request:
    limit: 5
    per: minute
    key: ip
    description: identity ajoute sa propre limite par numéro (5 par heure, 10 par jour).
  otp_verify:
    limit: 10
    per: minute
    key: ip
  refresh:
    limit: 60
    per: minute
    key: ip
  mfa_verify:
    limit: 10
    per: minute
    key: ip
    description: identity limite aussi les essais par jeton de double authentification (5).
  cleaning_simulation:
    limit: 20
    per: minute
    key: ip
    description: Simulateur public du Nettoyage (cahier des charges Nettoyage, partie 5).
  cleaning_geocoding:
    limit: 10
    per: minute
    key: user
    description: Position du lieu d'intervention (ADR-034) ; chaque appel peut interroger un géocodeur payant (Google).
  email_code_request:
    limit: 3
    per: minute
    key: user
    description: |
      Envoi du code de confirmation de l'e-mail du profil. identity ajoute ses propres limites,
      par adresse et par compte (un envoi par minute, 5 par heure, 10 par jour).
  email_code_verify:
    limit: 10
    per: minute
    key: user
    description: identity annule aussi le code après 5 essais faux.
  account_lookup:
    limit: 20
    per: minute
    key: user
    description: Recherche de compte par téléphone au back-office (ADR-029) ; freine l'énumération des numéros.
  payment_create:
    limit: 10
    per: minute
    key: user
    description: Création d'un paiement en ligne (ADR-031) ; chaque création peut appeler le prestataire.
  payment_webhook:
    limit: 120
    per: minute
    key: ip
    description: Notifications du prestataire de paiement (route publique, signature vérifiée par payment).

# Préfixes réservés, sans route pour l'instant.
x-ksp-reserved-prefixes:
  - prefix: /api/v1/bff/web
    description: Façade web (portail, shop, print), une route par écran.
  - prefix: /api/v1/bff/mobile
    description: Façade mobile (application client, application livreur).
  - prefix: /api/v1/bff/admin
    description: Façade back-office, double authentification obligatoire.
  - prefix: /partner/v1
    description: API Partenaires (ADR-019), contrat écrit en phase 3 avec le service delivery.

paths:
  /api/v1/identity/otp/request:
    post:
      tags: [Authentification]
      operationId: requestOtp
      summary: Demander un code de connexion
      description: |
        UC-ID-01. Envoie un code par WhatsApp (canal par défaut, seul canal au lancement, ADR-021)
        ou par SMS, avec bascule automatique sur l'autre canal
        si l'envoi échoue. Inscription et connexion suivent le même parcours. La réponse est la
        même que le numéro soit connu ou non.

        Erreurs : `GATEWAY_VALIDATION_FAILED` et `IDENTITY_PHONE_INVALID` (400),
        `IDENTITY_OTP_RATE_LIMITED` et `GATEWAY_RATE_LIMITED` (429), `IDENTITY_OTP_SEND_FAILED` (503).
      x-ksp-grpc: ksp.identity.v1.AuthService/RequestOtp
      x-ksp-access: public
      x-ksp-rate-limit: otp_request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestOtpRequest'
            example:
              phone: '+2290197000045'
              channel: whatsapp
      responses:
        '200':
          description: Code envoyé
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestOtpResponse'
              example:
                challengeId: 0192f1c4-7a2b-7c3d-8e4f-5a6b7c8d9e0f
                maskedTarget: '+229********45'
                channel: whatsapp
                expiresInSeconds: 300
                resendAfterSeconds: 60
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

  /api/v1/identity/otp/verify:
    post:
      tags: [Authentification]
      operationId: verifyOtp
      summary: Valider le code et ouvrir une session
      description: |
        UC-ID-01. Crée le compte si le numéro est nouveau, puis ouvre une session. Un compte
        interne qui se connecte au back-office reçoit à la place une étape de double
        authentification (`mfa_required`), avec configuration obligatoire à la première connexion
        (`enrollmentRequired`). Un compte sans rôle du back-office y est refusé
        (`IDENTITY_BACKOFFICE_FORBIDDEN`).

        Erreurs : `IDENTITY_OTP_INVALID` (400, `details.attemptsRemaining`),
        `IDENTITY_OTP_EXPIRED` et `IDENTITY_OTP_TOO_MANY_ATTEMPTS` (422),
        `IDENTITY_ACCOUNT_SUSPENDED` et `IDENTITY_BACKOFFICE_FORBIDDEN` (403), `GATEWAY_RATE_LIMITED` (429).
      x-ksp-grpc: ksp.identity.v1.AuthService/VerifyOtp
      x-ksp-access: public
      x-ksp-rate-limit: otp_verify
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOtpRequest'
            example:
              challengeId: 0192f1c4-7a2b-7c3d-8e4f-5a6b7c8d9e0f
              code: '482913'
              deviceLabel: Téléphone Android
      responses:
        '200':
          description: Session ouverte, ou double authentification à passer
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
            Set-Cookie:
              $ref: '#/components/headers/Set-Cookie-Refresh'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/VerifyOtpSessionResponse'
                  - $ref: '#/components/schemas/MfaRequiredResponse'
                discriminator:
                  propertyName: status
                  mapping:
                    authenticated: '#/components/schemas/VerifyOtpSessionResponse'
                    mfa_required: '#/components/schemas/MfaRequiredResponse'
              examples:
                nouveauCompteMobile:
                  summary: Nouveau compte, application mobile
                  value:
                    status: authenticated
                    accessToken: eyJhbGciOiJFUzI1NiIsImtpZCI6ImsxIn0.e30.c2ln
                    accessTokenExpiresAt: '2026-10-17T10:15:00Z'
                    refreshToken: rt_9f8e7d6c5b4a
                    refreshTokenExpiresAt: '2026-11-16T10:00:00Z'
                    sessionId: 0192f1c4-7a2b-7c3d-8e4f-5a6b7c8d9e10
                    user:
                      id: 0192f1c4-7a2b-7c3d-8e4f-5a6b7c8d9e11
                      status: active
                      firstName: null
                      lastName: null
                      phone: '+2290197000045'
                      email: null
                      emailVerified: false
                      preferredLanguage: fr
                      createdAt: '2026-10-17T10:00:00Z'
                    profileIncomplete: true
                    activeContext:
                      type: individual
                      organizationId: null
                    isNewUser: true
                agentBackOffice:
                  summary: Compte interne, première connexion au back-office
                  value:
                    status: mfa_required
                    mfaToken: mfa_2b3c4d5e6f
                    expiresAt: '2026-10-17T10:05:00Z'
                    methods: [totp, recovery_code]
                    enrollmentRequired: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

  /api/v1/identity/mfa/totp/enroll:
    post:
      tags: [Authentification]
      operationId: enrollTotp
      summary: Configurer l'application d'authentification
      description: |
        UC-ID-09. Première connexion d'un compte interne (`enrollmentRequired`) : crée le secret
        de l'application d'authentification (TOTP, RFC 6238 : 6 chiffres, 30 secondes). Le
        back-office affiche `otpauthUri` en QR code et `secret` pour une saisie à la main. Le
        secret reste inactif jusqu'à la confirmation ; un nouvel appel le remplace.

        Erreurs : `IDENTITY_MFA_TOKEN_INVALID` (401), `IDENTITY_MFA_ALREADY_ENROLLED` et
        `IDENTITY_MFA_TOO_MANY_ATTEMPTS` (422), `IDENTITY_BACKOFFICE_FORBIDDEN` et
        `IDENTITY_ACCOUNT_SUSPENDED` (403), `GATEWAY_RATE_LIMITED` (429).
      x-ksp-grpc: ksp.identity.v1.AuthService/EnrollTotp
      x-ksp-access: mfa_token
      x-ksp-rate-limit: mfa_verify
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollTotpRequest'
            example:
              mfaToken: mfa_2b3c4d5e6f
      responses:
        '200':
          description: Secret créé, en attente de confirmation
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpEnrollmentResponse'
              example:
                secret: JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP
                otpauthUri: otpauth://totp/KSP:%2B2290197000045?secret=JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP&issuer=KSP&algorithm=SHA1&digits=6&period=30
                issuer: KSP
                accountName: '+2290197000045'
                digits: 6
                periodSeconds: 30
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

  /api/v1/identity/mfa/totp/confirm:
    post:
      tags: [Authentification]
      operationId: confirmTotp
      summary: Confirmer l'application d'authentification et ouvrir la session
      description: |
        UC-ID-09. Le premier code affiché par l'application active la double authentification.
        La réponse remet les 10 codes de récupération, à usage unique, affichés une seule fois :
        ils sont le seul secours si le téléphone est perdu (jamais de code par SMS pour un compte
        interne, ADR-023). La session back-office est ouverte : jeton de renouvellement dans le
        cookie `__Secure-ksp_admin_rt`.

        Erreurs : `IDENTITY_MFA_CODE_INVALID` (400, `details.attemptsRemaining`),
        `IDENTITY_MFA_TOKEN_INVALID` (401), `IDENTITY_BACKOFFICE_FORBIDDEN` et
        `IDENTITY_ACCOUNT_SUSPENDED` (403), `IDENTITY_MFA_ENROLLMENT_NOT_STARTED`,
        `IDENTITY_MFA_ALREADY_ENROLLED` et `IDENTITY_MFA_TOO_MANY_ATTEMPTS` (422),
        `GATEWAY_RATE_LIMITED` (429).
      x-ksp-grpc: ksp.identity.v1.AuthService/ConfirmTotp
      x-ksp-access: mfa_token
      x-ksp-rate-limit: mfa_verify
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmTotpRequest'
            example:
              mfaToken: mfa_2b3c4d5e6f
              code: '287082'
      responses:
        '200':
          description: Double authentification activée, session ouverte
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
            Set-Cookie:
              $ref: '#/components/headers/Set-Cookie-Refresh'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpConfirmedResponse'
              example:
                status: authenticated
                accessToken: eyJhbGciOiJFUzI1NiIsImtpZCI6ImsxIn0.e30.c2ln
                accessTokenExpiresAt: '2026-10-17T10:15:00Z'
                refreshTokenExpiresAt: '2026-10-17T22:00:00Z'
                sessionId: 0192f1c4-7a2b-7c3d-8e4f-5a6b7c8d9e10
                user:
                  id: 0192f1c4-7a2b-7c3d-8e4f-5a6b7c8d9e11
                  status: active
                  firstName: Koffi
                  lastName: Adjovi
                  phone: '+2290197000045'
                  email: null
                  emailVerified: false
                  preferredLanguage: fr
                  createdAt: '2026-10-17T10:00:00Z'
                profileIncomplete: false
                activeContext:
                  type: individual
                  organizationId: null
                recoveryCodes:
                  - 7KQ2M-X9PDA
                  - H4TZ8-0RWNC
                  - B6VJE-3MYQ1
                  - 2NDKS-QF7HX
                  - WP5CA-8ZT0G
                  - E9MRY-K2HVB
                  - 1XGQT-6NWJD
                  - SZ3FP-YB8KM
                  - 0CHVN-4ERT7
                  - Q8JWD-5AXPZ
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

  /api/v1/identity/mfa/verify:
    post:
      tags: [Authentification]
      operationId: verifyMfa
      summary: Passer la double authentification et ouvrir la session
      description: |
        UC-ID-09. Seconde étape de connexion d'un compte interne : code de l'application
        d'authentification (`totp`) ou code de récupération (`recovery_code`, tirets et espaces
        ignorés). Un même code de l'application ne sert qu'une fois ; un code de récupération est
        consommé. La session back-office est ouverte : jeton de renouvellement dans le cookie
        `__Secure-ksp_admin_rt`.

        Erreurs : `IDENTITY_MFA_CODE_INVALID` et `IDENTITY_MFA_CODE_REUSED` (400,
        `details.attemptsRemaining`), `IDENTITY_MFA_TOKEN_INVALID` (401),
        `IDENTITY_BACKOFFICE_FORBIDDEN` et `IDENTITY_ACCOUNT_SUSPENDED` (403),
        `IDENTITY_MFA_ENROLLMENT_REQUIRED` et `IDENTITY_MFA_TOO_MANY_ATTEMPTS` (422),
        `GATEWAY_RATE_LIMITED` (429).
      x-ksp-grpc: ksp.identity.v1.AuthService/VerifyMfa
      x-ksp-access: mfa_token
      x-ksp-rate-limit: mfa_verify
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyMfaRequest'
            example:
              mfaToken: mfa_2b3c4d5e6f
              method: totp
              code: '081804'
      responses:
        '200':
          description: Session ouverte
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
            Set-Cookie:
              $ref: '#/components/headers/Set-Cookie-Refresh'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaSessionResponse'
              example:
                status: authenticated
                accessToken: eyJhbGciOiJFUzI1NiIsImtpZCI6ImsxIn0.e30.c2ln
                accessTokenExpiresAt: '2026-10-17T10:15:00Z'
                refreshTokenExpiresAt: '2026-10-17T22:00:00Z'
                sessionId: 0192f1c4-7a2b-7c3d-8e4f-5a6b7c8d9e10
                user:
                  id: 0192f1c4-7a2b-7c3d-8e4f-5a6b7c8d9e11
                  status: active
                  firstName: Koffi
                  lastName: Adjovi
                  phone: '+2290197000045'
                  email: null
                  emailVerified: false
                  preferredLanguage: fr
                  createdAt: '2026-10-17T10:00:00Z'
                profileIncomplete: false
                activeContext:
                  type: individual
                  organizationId: null
                recoveryCodesRemaining: 10
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

  /api/v1/identity/token/refresh:
    post:
      tags: [Authentification]
      operationId: refreshSession
      summary: Renouveler la session
      description: |
        UC-ID-04. Web et back-office : le jeton est lu dans le cookie, sans corps de requête.
        Mobile : le jeton est envoyé dans le corps. Chaque renouvellement remplace le jeton de
        renouvellement ; la réutilisation d'un ancien jeton révoque toute la session.

        Erreurs : `IDENTITY_REFRESH_TOKEN_INVALID`, `IDENTITY_REFRESH_TOKEN_REUSED` et
        `IDENTITY_SESSION_REVOKED` (401), `IDENTITY_ACCOUNT_SUSPENDED` (403),
        `GATEWAY_RATE_LIMITED` (429).
      x-ksp-grpc: ksp.identity.v1.AuthService/RefreshSession
      x-ksp-access: refresh_token
      x-ksp-rate-limit: refresh
      security:
        - refreshCookieWeb: []
        - refreshCookieBackoffice: []
        - {}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshSessionRequest'
            example:
              refreshToken: rt_9f8e7d6c5b4a
      responses:
        '200':
          description: Nouveaux jetons
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
            Set-Cookie:
              $ref: '#/components/headers/Set-Cookie-Refresh'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
              example:
                status: authenticated
                accessToken: eyJhbGciOiJFUzI1NiIsImtpZCI6ImsxIn0.e30.c2ln
                accessTokenExpiresAt: '2026-10-17T10:30:00Z'
                refreshTokenExpiresAt: '2026-11-16T10:15:00Z'
                sessionId: 0192f1c4-7a2b-7c3d-8e4f-5a6b7c8d9e10
                user:
