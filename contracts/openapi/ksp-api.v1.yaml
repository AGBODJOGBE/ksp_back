  /api/v1/document/signatures/{id}/otp:
    post:
      tags:
        - Documents
      operationId: sendDocumentSignatureCode
      summary: Recevoir un code pour signer
      description: |
        Sans corps. Envoie un code de 6 chiffres au signataire connecté de cette demande : par WhatsApp à son
        téléphone, sinon (ou en repli) à son e-mail vérifié. Le code est valable 10 minutes et accepte 5 essais ;
        un nouveau code remplace le précédent. Un nouveau code au plus toutes les 60 secondes et 5 par heure
        (`DOCUMENT_CODE_TOO_SOON`, `DOCUMENT_CODE_LIMIT_REACHED`, 429 avec `details.retryAfterSeconds`).

        Demande adressée à un autre compte : introuvable (404).

        Erreurs : `GATEWAY_VALIDATION_FAILED` (400), `DOCUMENT_SIGNATURE_NOT_FOUND` (404),
        `DOCUMENT_SIGNATURE_CLOSED` (422, `details.status`), `DOCUMENT_SIGNER_UNREACHABLE` (422),
        `DOCUMENT_CODE_TOO_SOON`, `DOCUMENT_CODE_LIMIT_REACHED` (429), `DOCUMENT_DEPENDENCY_UNAVAILABLE` (503).
      x-ksp-grpc: ksp.document.v1.DocumentService/SendSignatureCode
      x-ksp-access: authenticated
      x-ksp-rate-limit: document_code_request
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SignatureRequestId'
      responses:
        '200':
          description: Code envoyé
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignatureCodeDelivery'
              example:
                channel: whatsapp
                expiresAt: 2026-11-09T10:10:00Z
                resendAfterSeconds: 60
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /api/v1/document/signatures/{id}/sign:
    post:
      tags:
        - Documents
      operationId: signDocument
      summary: Signer un document avec le code reçu
      description: |
        Signature électronique simple par code (ADR-044). `consent` doit valoir `true` : le signataire déclare
        avoir lu le document et en accepter le contenu (`DOCUMENT_CONSENT_REQUIRED` sinon).

        document relit le PDF stocké et compare son empreinte SHA-256 à celle enregistrée à sa production : un
        document modifié n'est jamais signé (`DOCUMENT_CONTENT_CHANGED`). La signature ajoute aux pages d'origine,
        inchangées, une page de certificat (signataire, moyen, horodatage, empreinte, adresse IP et navigateur) ;
        la preuve est conservée et le service à l'origine du document est prévenu.

        Erreurs : `GATEWAY_VALIDATION_FAILED` (400), `DOCUMENT_CODE_INVALID` (400, `details.attemptsLeft`),
        `DOCUMENT_CONSENT_REQUIRED` (400), `DOCUMENT_SIGNATURE_NOT_FOUND` (404), `DOCUMENT_CODE_EXPIRED`,
        `DOCUMENT_SIGNATURE_CLOSED`, `DOCUMENT_CONTENT_CHANGED` (422), `DOCUMENT_DEPENDENCY_UNAVAILABLE` (503).
      x-ksp-grpc: ksp.document.v1.DocumentService/SignDocument
      x-ksp-access: authenticated
      x-ksp-rate-limit: document_code_verify
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SignatureRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignDocumentRequest'
            example:
              code: '482913'
              consent: true
      responses:
        '200':
          description: Document signé
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /api/v1/document/sign/{token}:
    get:
      tags:
        - Documents
      operationId: getSigningSession
      summary: Ouvrir un lien de signature
      description: |
        Route **publique** : signataire sans compte KSP (débiteur…), identifié par le jeton du lien personnel reçu
        par WhatsApp ou e-mail. Rend le titre et le numéro du document, le nom et le téléphone masqué du
        signataire, l'échéance de la demande et une adresse de lecture du PDF de courte durée (le PDF signé une
        fois signé ; aucune adresse pour une demande expirée ou annulée). Jeton inconnu, mal formé ou d'une autre
        personne : introuvable (404). Limitée par adresse IP ; le jeton n'est jamais journalisé.

        Erreurs : `DOCUMENT_SIGNATURE_NOT_FOUND` (404), `DOCUMENT_DEPENDENCY_UNAVAILABLE` (503).
      x-ksp-grpc: ksp.document.v1.DocumentSigningService/GetSigningSession
      x-ksp-access: public
      x-ksp-rate-limit: document_link
      parameters:
        - $ref: '#/components/parameters/SigningToken'
      responses:
        '200':
          description: Succès
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SigningSession'
              example:
                documentTitle: Protocole d’accord et échéancier de paiement
                documentNumber: PAC-2026-000007
                status: pending
                signer:
                  displayName: Koffi Mensah
                  phoneMasked: +229********45
                expiresAt: 2026-11-16T10:00:00Z
                signedAt: null
                codeExpiresAt: null
                download:
                  url: https://files.ksp.bj/ksp-files/generated_document/0192f1c4-7a2b-7c3d-8e4f-5a6b7c8d6102?X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Expires=300&X-Amz-Signature=1d4e
                  expiresAt: 2026-11-09T10:05:00Z
                  version: original
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /api/v1/document/sign/{token}/otp:
    post:
      tags:
        - Documents
      operationId: sendSigningCode
      summary: Recevoir un code par le lien de signature
      description: |
        Route **publique**, sans corps : envoie un code de 6 chiffres au téléphone du signataire désigné par le
        service à l'origine du document (WhatsApp ; e-mail en repli s'il a été fourni). Mêmes règles que pour un
        signataire connecté : 10 minutes, 5 essais, un code par minute et 5 par heure.

        Erreurs : `DOCUMENT_SIGNATURE_NOT_FOUND` (404), `DOCUMENT_SIGNATURE_CLOSED`, `DOCUMENT_SIGNER_UNREACHABLE`
        (422), `DOCUMENT_CODE_TOO_SOON`, `DOCUMENT_CODE_LIMIT_REACHED` (429), `DOCUMENT_DEPENDENCY_UNAVAILABLE` (503).
      x-ksp-grpc: ksp.document.v1.DocumentSigningService/SendSigningCode
      x-ksp-access: public
      x-ksp-rate-limit: document_link_code_request
      parameters:
        - $ref: '#/components/parameters/SigningToken'
      responses:
        '200':
          description: Code envoyé
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignatureCodeDelivery'
              example:
                channel: whatsapp
                expiresAt: 2026-11-09T10:10:00Z
                resendAfterSeconds: 60
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /api/v1/document/sign/{token}/sign:
    post:
      tags:
        - Documents
      operationId: signWithLink
      summary: Signer par le lien de signature
      description: |
        Route **publique** : signature avec le code reçu et l'accord explicite du signataire (`consent: true`).
        Mêmes contrôles que pour un signataire connecté (code, essais, empreinte du PDF stocké), même page de
        certificat et même preuve ; rend la demande signée et l'adresse de lecture du PDF signé.

        Erreurs : `GATEWAY_VALIDATION_FAILED`, `DOCUMENT_CODE_INVALID` (`details.attemptsLeft`),
        `DOCUMENT_CONSENT_REQUIRED` (400), `DOCUMENT_SIGNATURE_NOT_FOUND` (404), `DOCUMENT_CODE_EXPIRED`,
        `DOCUMENT_SIGNATURE_CLOSED`, `DOCUMENT_CONTENT_CHANGED` (422), `DOCUMENT_DEPENDENCY_UNAVAILABLE` (503).
      x-ksp-grpc: ksp.document.v1.DocumentSigningService/SignWithLink
