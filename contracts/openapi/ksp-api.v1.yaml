    post:
      tags:
        - Paiement par lien
      operationId: payPaymentLink
      summary: Payer un lien par Mobile Money
      description: |
        Lance le paiement du lien chez le prestataire (FedaPay, comme `POST /api/v1/payment/payments`) et renvoie
        sa page de paiement (`checkoutUrl`), où le payeur saisit son numéro. Le montant est celui du lien, jamais
        envoyé par le navigateur. Retour du payeur : la page publique du lien.

        Idempotent : la même clé renvoie la même tentative ; une tentative encore en attente est réutilisée (une
        seule page payable par lien). Confirmation par le prestataire seulement (notification signée), jamais par
        le retour du navigateur ; la réussite publie `payment.link.paid`.

        Refus : objet déjà payé, par ce lien ou un autre (`PAYMENT_LINK_ALREADY_PAID`, 409) ; paiement en écart
        de montant pas encore traité par la finance (`PAYMENT_UNDER_REVIEW`, 409, ADR-032) ; lien révoqué
        (`PAYMENT_LINK_REVOKED`) ou expiré (`PAYMENT_LINK_EXPIRED`, 422) ; plus de 10 tentatives par heure sur
        le lien (`PAYMENT_LINK_TOO_MANY_ATTEMPTS`, 429, réglable) ; 5 appels par minute et par adresse IP.

        Erreurs : `PAYMENT_VALIDATION_FAILED` (400), `PAYMENT_LINK_NOT_FOUND` (404), `PAYMENT_LINK_ALREADY_PAID`,
        `PAYMENT_UNDER_REVIEW` (409), `PAYMENT_LINK_REVOKED`, `PAYMENT_LINK_EXPIRED` (422),
        `PAYMENT_LINK_TOO_MANY_ATTEMPTS` (429), `PAYMENT_PROVIDER_UNAVAILABLE` (503, réessayer avec la même clé).
      x-ksp-grpc: ksp.payment.v1.PaymentLinkPublicService/PayPaymentLink
      x-ksp-access: public
