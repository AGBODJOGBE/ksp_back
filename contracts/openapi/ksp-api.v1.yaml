  /.well-known/jwks.json:
    get:
      tags: [Clés publiques]
      operationId: getJwks
      summary: Clés publiques de vérification des jetons
      description: |
        UC-ID-22. Servies depuis le cache de la gateway (10 minutes), rechargé immédiatement si un
        jeton porte une clé inconnue. Pendant une rotation, l'ancienne et la nouvelle clé sont publiées.

        `x-ksp-grpc` désigne la source logique des clés. La gateway les lit sur le point JWKS HTTP
        interne d'identity (`/.well-known/jwks.json`, ADR-020), sans passer par gRPC.
      x-ksp-grpc: ksp.identity.v1.AuthService/GetSigningKeys
      x-ksp-access: public
      x-ksp-rate-limit: public
      responses:
        '200':
          description: Jeu de clés JWK (RFC 7517)
          headers:
            Cache-Control:
              description: '`public, max-age=600`'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Jwks'
              example:
                keys:
                  - kid: k1
                    kty: EC
                    crv: P-256
                    x: f83OJ3D2xF1Bg8vub9tLe1gHMzV76e8Tus9uPHvRVEU
                    y: x_FEzRu9m36HLN_tue659LNpXW6pCyStikYjKIWI5a0
                    alg: ES256
                    use: sig
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

