# Ruptures de contrat acceptées pendant la refonte du Nettoyage (ADR-054, décision 7).
#
# Lu par tools/ci/accepted-breaks.ts (CI et « pnpm contracts:breaking »). Les contrôles buf, oasdiff
# et événements tournent sans changement ; toute rupture absente de ce fichier fait échouer la CI.
#
# Chaque entrée nomme une rupture, jamais par motif (pas de « * ») :
#   - buf     : fichier du module contracts/proto et règle buf exacte ;
#   - oasdiff : préfixe de chemin REST (au moins /api/v1/<domaine>) et identifiant oasdiff exact ;
#   - events  : type d'événement et version publiés sur main.
# Champs communs : motif (reason), ADR qui l'autorise (adr) et date limite incluse (expires).
#
# Entrées refusées hors de la branche refonte/nettoyage-v2, d'une demande de fusion qui la vise et de
# sa fusion vers main, ou après leur date limite. Le fichier est vidé (« breaks: [] ») juste après la
# fusion vers main. Toute modification passe par la relecture du responsable du dépôt.
#
# Écart constaté le 19/11/2026 : buf 515 ruptures (cleaning.proto), oasdiff 169 (routes du
# Nettoyage), événements 43 (22 événements cleaning v1).
# Socle (copie des contrats du socle) : 20 ruptures oasdiff, valeurs ajoutées à des énumérations de
# réponse des routes admin identity et wallet, acceptées le 19/11/2026 (entrées en fin de fichier).

breaks:
  # gRPC : ksp.cleaning.v1 réécrit sur place (pas de paquet ksp.cleaning.v2).
  - tool: buf
    file: ksp/cleaning/v1/cleaning.proto
    rule: SERVICE_NO_DELETE
    reason: 'QuoteService, MissionService, CleaningAdminService et MissionPaymentDueService supprimés : devis, programme et séances v2 dans le proto réécrit sur place.'
    adr: ADR-054
    expires: '2027-02-28'
  - tool: buf
    file: ksp/cleaning/v1/cleaning.proto
    rule: RPC_NO_DELETE
    reason: 'Estimate, GetPlaceCatalog et ListServices du catalogue v1 remplacés par le simulateur et le catalogue v2.'
    adr: ADR-054
    expires: '2027-02-28'
  - tool: buf
    file: ksp/cleaning/v1/cleaning.proto
    rule: MESSAGE_NO_DELETE
    reason: 'Messages v1 (groupes de demandes, missions, interventions, estimation) supprimés avec leurs appels.'
    adr: ADR-054
    expires: '2027-02-28'
  - tool: buf
    file: ksp/cleaning/v1/cleaning.proto
    rule: FIELD_NO_DELETE
    reason: 'Messages gardés réécrits selon le modèle v2 (un dossier = un lieu, programme et séances).'
    adr: ADR-054
    expires: '2027-02-28'
  - tool: buf
    file: ksp/cleaning/v1/cleaning.proto
