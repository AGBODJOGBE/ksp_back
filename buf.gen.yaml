version: v2
inputs:
  - directory: contracts/proto
plugins:
  # Lancé par node : fonctionne sous Windows, Linux et macOS
  # (node_modules/.bin/protoc-gen-ts_proto est un script shell, inutilisable sous Windows).
  - local: ['node', './node_modules/ts-proto/protoc-gen-ts_proto']
    out: libs/contracts/src/generated
    opt:
      - nestJs=true
      - addGrpcMetadata=true
      - stringEnums=true
      - useOptionals=messages
      - esModuleInterop=true
      - useDate=string
      - exportCommonSymbols=false
