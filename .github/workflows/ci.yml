# Intégration continue du backend KSP.
# Toute demande de fusion vers main doit passer ces contrôles (protection de branche).

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Qualité, contrats et tests
    runs-on: ubuntu-latest
    services:
      # Base réelle pour les tests d'intégration (outbox, inbox, migrations).
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ksp
          POSTGRES_PASSWORD: ksp
          POSTGRES_DB: ksp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ksp"
          --health-interval 5s
          --health-retries 10
      # Compteurs des limites d'appels partagés par les répliques de la gateway (ADR-051).
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://ksp:ksp@localhost:5432/ksp_test
      TEST_REDIS_URL: redis://localhost:6379
      # Outil de comparaison des contrats OpenAPI, version et empreinte figées.
      OASDIFF_VERSION: 1.34.1
      OASDIFF_SHA256: 75775f65b0adebd26a8e013af51a799342dfdc6262d89efa9e3b7bdf89657d90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Installation
        run: pnpm install --frozen-lockfile

      - name: Génération des clients Prisma
        run: pnpm prisma:generate

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Contrats — lint
        run: pnpm contracts:lint

      - name: Contrats — aucune rupture de compatibilité
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin main:main
          pnpm contracts:breaking

      # Les fronts branchés sur l'API ne doivent jamais casser : toute rupture passe par /api/v2.
      - name: Contrats — API REST (OpenAPI) sans rupture
        if: github.event_name == 'pull_request'
        run: |
          archive="oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive"             "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/$archive"
          echo "$OASDIFF_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" oasdiff
          git show main:contracts/openapi/ksp-api.v1.yaml > "$RUNNER_TEMP/ksp-api.main.yaml"
          "$RUNNER_TEMP/oasdiff" breaking "$RUNNER_TEMP/ksp-api.main.yaml"             contracts/openapi/ksp-api.v1.yaml --fail-on ERR

      # Une version d'événement publiée ne change que par ajout ; sinon un fichier v2 à côté.
      - name: Contrats — événements sans rupture
        if: github.event_name == 'pull_request'
        run: pnpm exec tsx tools/ci/event-schemas-compat.ts main

      - name: Outils de la CI — tests
        run: pnpm exec tsx --test tools/ci/*.test.ts

      - name: Contrats — code généré à jour
        run: |
          pnpm contracts:generate
          git diff --exit-code -- libs/contracts/src/generated || {
            echo "::error::Le code généré ne correspond pas aux .proto : lancer « pnpm contracts:generate » et committer."
            exit 1
          }

      - name: Migrations — appliquées sur une base vide
        run: |
          for migrations in services/*/prisma/migrations; do
            service=$(basename "$(dirname "$(dirname "$migrations")")")
            echo "→ $service"
            PGPASSWORD=ksp psql -h localhost -U ksp -d ksp_test -v ON_ERROR_STOP=1 \
              -c "DROP SCHEMA IF EXISTS \"m_$service\" CASCADE; CREATE SCHEMA \"m_$service\";"
            for file in "$migrations"/*/migration.sql; do
              PGPASSWORD=ksp PGOPTIONS="-c search_path=m_$service" \
                psql -h localhost -U ksp -d ksp_test -v ON_ERROR_STOP=1 -q -f "$file"
            done
          done

      - name: Typage
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # Bloquant pour une faille critique. Les failles hautes et moyennes, présentes à
      # l'introduction du contrôle (ADR-051), sont signalées sans bloquer, le temps des montées de version.
      - name: Dépendances de production — failles critiques
        run: pnpm audit --prod --audit-level critical

      - name: Dépendances de production — rapport complet (non bloquant)
        continue-on-error: true
        run: pnpm audit --prod --audit-level moderate

  changes:
    name: Services modifiés
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.detect.outputs.services }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - id: detect
        name: Détection
        run: |
          base=${{ github.event_name == 'pull_request' && 'origin/main' || github.event.before }}
          echo "services=$(pnpm --silent ci:changed-services "$base")" >> "$GITHUB_OUTPUT"

  images:
    name: Image ${{ matrix.service }}
    needs: [quality, changes]
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Connexion au registre
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Les noms d'images Docker doivent être en minuscules ; le propriétaire GitHub ne l'est pas forcément.
      - name: Propriétaire du registre en minuscules
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      # Construite à chaque demande de fusion, publiée seulement depuis main.
      # Le déploiement est piloté par le dépôt ksp-infra, qui référence ces images par leur tag.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ env.IMAGE_OWNER }}/ksp-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
