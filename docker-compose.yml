# Infrastructure de développement local : uniquement les dépendances, jamais les services KSP
# (ils tournent avec « pnpm --filter @ksp/<service>-service dev »).
#   pnpm infra:up      démarre l'ensemble
#   pnpm infra:down    l'arrête (les données sont conservées dans les volumes)
# Mots de passe de développement uniquement : chaque port n'écoute que sur 127.0.0.1, jamais sur le
# réseau local (ADR-051).

name: ksp

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ksp
      POSTGRES_PASSWORD: ksp
      POSTGRES_DB: ksp
    ports: ['127.0.0.1:5432:5432']
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Une base et un utilisateur par service, créés au premier démarrage.
      - ./infra/local/postgres-init.sql:/docker-entrypoint-initdb.d/01-services.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ksp']
      interval: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ksp
      RABBITMQ_DEFAULT_PASS: ksp
    ports:
      - '127.0.0.1:5672:5672'
      - '127.0.0.1:15672:15672' # console d'administration : http://localhost:15672
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports: ['127.0.0.1:6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

  # Stockage objet compatible S3 (service file, ADR-038). Version figée : à revoir lors du choix de l'hébergeur (ADR-018).
  # Le bucket ksp-files est créé par le service file au démarrage (FILE_STORAGE_CREATE_BUCKET=true, développement).
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ksp
      MINIO_ROOT_PASSWORD: ksp-local-secret
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001' # console : http://localhost:9001
    volumes:
      - minio-data:/data

  # Traces distribuées : les services envoient en OTLP sur 4317, interface sur http://localhost:16686
  jaeger:
    image: jaegertracing/jaeger:2.5.0
    ports:
      - '127.0.0.1:4317:4317'
      - '127.0.0.1:16686:16686'

  # Moteur d'itinéraires du service geo (ADR-045), algorithme MLD, sur http://localhost:5000.
  # Données à préparer une fois (tools/geo/prepare-osrm) ; démarré seulement avec
  # « docker compose --profile routing up -d osrm ». geo démarre aussi sans lui. Image officielle
  # du projet, version figée : osrm/osrm-backend sur Docker Hub n'est plus publiée depuis 2021.
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v6.0.0
    profiles: ['routing']
    command: osrm-routed --algorithm mld /data/region.osrm
    ports: ['127.0.0.1:5000:5000']
    volumes:
      - osrm-data:/data

  # Recherche du catalogue (phase 3) : démarré seulement avec « docker compose --profile search up -d ».
  meilisearch:
    image: getmeili/meilisearch:v1.15
    profiles: ['search']
    environment:
      MEILI_MASTER_KEY: ksp-local-master-key
      MEILI_ENV: development
    ports: ['127.0.0.1:7700:7700']
    volumes:
      - meilisearch-data:/meili_data

volumes:
  postgres-data:
  rabbitmq-data:
  minio-data:
  meilisearch-data:
  osrm-data:
